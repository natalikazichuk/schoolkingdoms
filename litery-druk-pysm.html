<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Друковані і письмові літери</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --chalk:#E8F1FF; --dim:#8FA9C7; --grid:#1E3A5C; --line:#4C7FB8;
  --paper:#FFFFFF; --cell:#CFE0F2; --penink:#16305C; --penedge:#9BBEE8;
  --rule:
    repeating-linear-gradient(0deg, transparent 0, transparent 27px, #BFD5EF 27px, #BFD5EF 28px),
    repeating-linear-gradient(65deg, transparent 0, transparent 22px, #E1EBF7 22px, #E1EBF7 23px),
    var(--paper);
  --pengreen:#1F9E63; --penred:#E0492E; --amber:#FFC145; --gold:#F2B705;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  color:var(--chalk);font-family:"Manrope",system-ui,sans-serif;min-height:100vh;
  padding:16px 16px calc(86px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 80% at 50% 0%,#9ad6f5 0%,#5aa3e6 45%,#2f74c8 100%) fixed;
}
.wrap{max-width:520px;margin:0 auto}

.backbar{display:flex;margin-bottom:10px}
.backbtn{display:inline-flex;align-items:center;gap:7px;border:2px solid #E0A42A;
  background:linear-gradient(160deg,#FFD764,#F4B12B);color:#5A3D05;border-radius:12px;
  padding:9px 15px;font-family:"Manrope";font-weight:800;font-size:14px;cursor:pointer;
  box-shadow:0 4px 12px rgba(10,21,38,.22)}
.backbtn:active{transform:translateY(2px)}

.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--line)}
.sync{color:var(--dim)} .sync.ok{color:var(--pengreen)} .sync.no{color:var(--penred)}
h1{font-family:"Caveat",cursive;font-weight:700;font-size:36px;line-height:1.05;margin:4px 0 14px;color:#fff}
.rule{height:1px;background:var(--line);opacity:.45;margin:14px 0}

.hud{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;border:1px solid var(--grid);background:rgba(15,32,56,.75);border-radius:var(--r);padding:9px 11px}
.stat b{display:block;font-family:"Caveat",cursive;font-weight:700;font-size:26px;line-height:1;margin-top:1px}
.stat .k{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

.map{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lvl{
  text-align:left;border:2px solid #E0A42A;background:linear-gradient(160deg,#FFD764 0%,#F4B12B 100%);
  color:#15294D;border-radius:var(--r);padding:12px;cursor:pointer;
  font-family:"Manrope",sans-serif;font-size:13px;font-weight:700;line-height:1.3;
  box-shadow:0 4px 12px rgba(10,21,38,.22);transition:transform .12s ease, filter .12s ease;
}
.lvl:hover{transform:translateY(-2px);filter:brightness(1.05)}
.lvl .n{display:block;margin-bottom:4px;font-family:"JetBrains Mono",monospace;font-size:10px;color:#8A5A00;letter-spacing:.1em}
.lvl.done{border-color:#1F9E63} .lvl.done .n{color:#1F7A50}
.lvl.lock{border-color:#6E86AE;color:#9FB4D4;cursor:not-allowed;box-shadow:none;
  background:linear-gradient(160deg,rgba(20,40,70,.55),rgba(15,32,56,.55))}
.lvl.lock .n{color:#7E95BC} .lvl.lock:hover{transform:none;filter:none}
.lvl .tag{display:block;margin-top:7px;font-family:"JetBrains Mono",monospace;font-size:10px;color:#7A5A1E}
.lvl.lock .tag{color:#8AA0C4}
.lvl .st{display:block;margin-top:6px;font-size:13px;letter-spacing:2px;line-height:1;color:#15294D}
.lvl .st .off{color:rgba(21,41,77,.24)}

/* --- гра --- */
.ptop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ptop .lab{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.ptop .cnt{margin-left:auto;font-family:"Caveat",cursive;font-weight:700;font-size:26px;color:#fff;line-height:1}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.dot{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.5)}
.dot.ok{background:var(--pengreen);border-color:var(--pengreen)}
.dot.no{background:var(--penred);border-color:var(--penred)}
.dot.now{background:var(--amber);border-color:var(--amber)}

.qlab{text-align:center;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;color:var(--chalk);text-transform:uppercase;margin-bottom:8px}
.board{
  border:2px solid var(--penedge);border-radius:var(--r);
  background:var(--rule);
  padding:20px 12px;text-align:center;color:var(--penink);min-height:132px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(10,21,38,.28)
}
.glyph{line-height:1}
.glyph.print{font-family:"Manrope",sans-serif;font-weight:800;font-size:82px}
.glyph.hand{font-family:"Caveat",cursive;font-weight:700;font-size:104px}
.instr{text-align:center;font-family:"Caveat",cursive;font-weight:700;font-size:26px;color:#fff;margin:10px 0 2px}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.opt{
  border:2px solid var(--penedge);color:var(--penink);
  background:var(--rule);
  border-radius:12px;padding:10px 8px;cursor:pointer;box-shadow:0 4px 12px rgba(10,21,38,.22);
  transition:transform .08s ease,border-color .1s ease;min-height:88px;display:flex;align-items:center;justify-content:center
}
.opt .glyph.print{font-size:52px} .opt .glyph.hand{font-size:64px}
.opt:hover{border-color:var(--line)} .opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--pengreen);background:#EAF7F0} .opt.ok .glyph{color:var(--pengreen)}
.opt.no{border-color:var(--penred);background:#FCEDE9} .opt.no .glyph{color:var(--penred)}
.opt:disabled{cursor:default}

.msg{text-align:center;font-size:14px;font-weight:700;margin-top:12px;min-height:18px}
.msg.no{color:var(--penred)} .msg.ok{color:var(--pengreen)}

/* результат */
.result{border:2px solid var(--penedge);border-radius:var(--r);
  background:var(--rule);
  padding:22px 14px;margin:0 0 14px;text-align:center;box-shadow:0 6px 18px rgba(10,21,38,.28)}
.result .big{font-family:"Caveat",cursive;font-weight:700;font-size:76px;line-height:.9;color:var(--penink)}
.result .cap{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;color:#6E7E97;text-transform:uppercase;margin-top:4px}
.result .stars{font-size:36px;letter-spacing:6px;margin:12px 0 6px;line-height:1;color:var(--gold)}
.result .stars .off{color:#C9D3E0}
.result .xp{margin-top:12px;font-size:13px;color:#2B3B57}

.btn{display:block;width:100%;margin-top:12px;padding:14px;border-radius:12px;border:2px solid #E0A42A;
  background:var(--amber);color:#5A3D05;font-family:"Manrope",sans-serif;font-weight:800;font-size:15px;cursor:pointer;
  box-shadow:1px 2px 0 rgba(23,48,92,.12)}
.btn.ghost{background:#fff;color:var(--penink);border-color:var(--penedge)}
.hide{display:none}

/* спільний футер сайту */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:linear-gradient(180deg,#1e3a6b,#16294f);
  border-top:3px solid #e0a42a;display:flex;align-items:center;
  gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none}
.botnav::-webkit-scrollbar{display:none}
.botnav a,.botnav button{display:flex;flex-direction:column;align-items:center;gap:2px;
  color:#cfe0f5;background:none;border:none;cursor:pointer;font-family:inherit;
  font-weight:800;font-size:.66rem;padding:5px 12px;border-radius:12px;text-decoration:none;
  white-space:nowrap;flex:1;min-width:52px;transition:.15s}
.botnav .ic{font-size:1.2rem}
.botnav a.active{background:linear-gradient(180deg,#f4c842,#e0a42a);color:#5a3d05;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.botnav a:hover:not(.active),.botnav button:hover{background:rgba(255,255,255,.1);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* вихід із акаунта Героя (спільний футер) */
(function(){
  var back=document.getElementById('heroBackBtn');
  if(back) back.addEventListener('click', function(){
    if(history.length>1) history.back(); else location.href='igry.html';
  });

<script>
/* ============================================================
   ДРУКОВАНІ І ПИСЬМОВІ ЛІТЕРИ — гра без таймера, 10 рівнів.
   Мета: показано літеру в одній формі — знайди її в іншій формі.
   Прогрес: localStorage 'sk_game_litery_forms' + heroes/{id}.progress через SK.
   ============================================================ */

const ALL = ["А","Б","В","Г","Ґ","Д","Е","Є","Ж","З","И","І","Ї","Й","К","Л","М","Н","О","П","Р","С","Т","У","Ф","Х","Ц","Ч","Ш","Щ","Ь","Ю","Я"];
const GROUPS = [
  ["А","Б","В","Г"], ["Ґ","Д","Е","Є"], ["Ж","З","И","І"], ["Ї","Й","К","Л"],
  ["М","Н","О","П"], ["Р","С","Т","У"], ["Ф","Х","Ц","Ч"], ["Ш","Щ","Ь","Ю"],
];
const LEVELS = [
  {t:"Літери А–Г", s:"А–Г", grp:0},
  {t:"Літери Ґ–Є", s:"Ґ–Є", grp:1},
  {t:"Літери Ж–І", s:"Ж–І", grp:2},
  {t:"Літери Ї–Л", s:"Ї–Л", grp:3},
  {t:"Літери М–П", s:"М–П", grp:4},
  {t:"Літери Р–У", s:"Р–У", grp:5},
  {t:"Літери Ф–Ч", s:"Ф–Ч", grp:6},
  {t:"Літери Ш–Ю", s:"Ш–Ю", grp:7},
  {t:"Повторення",  s:"мікс", all:true},
  {t:"Уся абетка",  s:"усі",  all:true},
];

const QPER = 10;   // питань на рівень
const S = { unlocked:0, done:Array(10).fill(false), best:Array(10).fill(0), xp:0 };

let L=0, qi=0, correct=0, curr=null, busy=false;
let deck=[], dpos=0, lastLetter=null;

const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

/* зірки та XP */
function starCount(best){ if(best>=10) return 3; if(best>=8) return 2; if(best>=6) return 1; return 0; }
function levelXp(best){ if(best<=0) return 0; return Math.min(best,10) + (best>=10?10:0); }
function totalXp(){ return S.best.reduce((a,b)=>a+levelXp(b),0); }
function totalStars(){ return S.best.reduce((a,b)=>a+starCount(b),0); }
function starStr(k){ let s=""; for(let i=0;i<3;i++) s+=`<span class="${i<k?"":"off"}">★</span>`; return s; }

/* набір літер рівня + колода без повторів */
function poolFor(lvl){ const lv=LEVELS[lvl]; return lv.all ? ALL : GROUPS[lv.grp]; }
function resetDeck(){ deck=[]; dpos=0; lastLetter=null; }
function reshuffle(){
  deck = shuffle(poolFor(L).slice()); dpos=0;
  if(lastLetter && deck.length>1 && deck[0]===lastLetter){
    const j=1+Math.floor(Math.random()*(deck.length-1)); [deck[0],deck[j]]=[deck[j],deck[0]];
  }
}
function drawLetter(){ if(dpos>=deck.length) reshuffle(); const x=deck[dpos]; dpos++; lastLetter=x; return x; }

function optionsFor(lvl, target){
  const pool = poolFor(lvl);
  if(pool.length<=4) return shuffle(pool.slice());
  const set = new Set([target]);
  while(set.size<4) set.add(pool[rnd(0,pool.length-1)]);
  return shuffle([...set]);
}
function makeQ(lvl){
  const target = drawLetter();
  const printedTarget = Math.random() < 0.5;   // цільова літера друкована?
  return { target, printedTarget, opts: optionsFor(lvl, target) };
}
const glyphHTML = (ch, printed) => `<span class="glyph ${printed?"print":"hand"}">${ch}</span>`;

/* карта рівнів */
function drawMap(){
  $("hud-xp").textContent = S.xp;
  $("hud-st").textContent = totalStars() + "/30";
  $("hud-lv").textContent = S.done.filter(Boolean).length + "/10";
  $("map").innerHTML = "";
  LEVELS.forEach((lv,i)=>{
    const b=document.createElement("button");
    const locked = i>S.unlocked;
    const best=S.best[i]|0, k=starCount(best);
    b.className="lvl"+(S.done[i]?" done":"")+(locked?" lock":"");
    const tag = locked ? "зачинено" : (best>0 ? `рекорд ${best}/10` : "нове");
    b.innerHTML = `<span class="n">РІВЕНЬ ${String(i+1).padStart(2,"0")} · ${lv.s}</span>${lv.t}`+
      `<span class="st">${locked?"":starStr(k)}</span><span class="tag">${tag}</span>`;
    b.disabled=locked; b.onclick=()=>startLevel(i);
    $("map").appendChild(b);
  });
}
function show(id){ ["screen-map","screen-play","screen-done"].forEach(s=>$(s).classList.toggle("hide", s!==id)); }

/* гра */
function startLevel(i){
  L=i; qi=0; correct=0; resetDeck();
  $("p-lab").textContent = `Рівень ${String(i+1).padStart(2,"0")} · ${LEVELS[i].t}`;
  $("p-msg").textContent=""; $("p-msg").className="msg";
  renderDots();
  show("screen-play");
  nextQ();
}
function renderDots(){
  let h=""; for(let i=0;i<QPER;i++){ const cls = i<qi ? "" : (i===qi?" now":""); h+=`<div class="dot${cls}" id="dot${i}"></div>`; }
  $("p-dots").innerHTML=h;
}
function nextQ(){
  if(qi>=QPER) return finishLevel();
  $("p-cnt").textContent = `${qi+1} / ${QPER}`;
  curr = makeQ(L);
  $("p-qlab").textContent = curr.printedTarget ? "Друкована літера" : "Письмова літера";
  $("p-glyph").outerHTML = glyphHTML(curr.target, curr.printedTarget).replace('class="glyph','id="p-glyph" class="glyph');
  $("p-instr").textContent = curr.printedTarget ? "Знайди письмову" : "Знайди друковану";
  $("p-opts").innerHTML="";
  curr.opts.forEach(ch=>{
    const b=document.createElement("button");
    b.className="opt"; b.innerHTML=glyphHTML(ch, !curr.printedTarget);
    b.onclick=()=>tapOpt(b, ch);
    $("p-opts").appendChild(b);
  });
  const d=$("dot"+qi); if(d) d.classList.add("now");
  busy=false;
}
function lockOpts(){ [...$("p-opts").children].forEach(b=>b.disabled=true); }
function tapOpt(btn, ch){
  if(busy) return; busy=true;
  const ok = (ch===curr.target);
  const dot=$("dot"+qi); if(dot){ dot.classList.remove("now"); dot.classList.add(ok?"ok":"no"); }
  if(ok){
    btn.classList.add("ok"); correct++;
    setTimeout(()=>{ qi++; nextQ(); }, 380);
  }else{
    btn.classList.add("no"); lockOpts();
    [...$("p-opts").children].forEach(b=>{ if(b.textContent===curr.target) b.classList.add("ok"); });
    $("p-msg").className="msg no"; $("p-msg").textContent = `Це «${curr.target}»`;
    setTimeout(()=>{ $("p-msg").textContent=""; $("p-msg").className="msg"; qi++; nextQ(); }, 850);
  }
}

/* завершення рівня */
function finishLevel(){
  const before = totalXp();
  if(correct > (S.best[L]|0)) S.best[L]=correct;
  if(L===S.unlocked && L<9) S.unlocked=L+1;      // завершив — відкрив наступний
  S.done[L] = (S.best[L]|0) >= 8;                 // «добре пройдено» = зелена рамка
  S.xp = totalXp();
  const gained = Math.max(0, S.xp - before);
  saveProgress();

  const k=starCount(correct);
  $("d-title").textContent = LEVELS[L].t;
  $("d-num").textContent = correct;
  $("d-stars").innerHTML = starStr(k);
  let line;
  if(correct>=10)     line="Бездоганно! Ти знаєш усі ці літери.";
  else if(correct>=8) line="Чудово! Майже все правильно.";
  else if(correct>=6) line="Добре! Ще трохи практики.";
  else                line="Нічого, спробуй ще раз — усе вийде!";
  $("d-xp").textContent = line + (gained>0?`  +${gained} XP`:"") + `  ·  Усього ${S.xp} XP`;

  $("d-next").classList.toggle("hide", !(L<9));
  show("screen-done"); drawMap();
}

/* кнопки */
$("p-back").onclick  = ()=>{ drawMap(); show("screen-map"); };
$("d-map").onclick   = ()=>{ drawMap(); show("screen-map"); };
$("d-again").onclick = ()=>startLevel(L);
$("d-next").onclick  = ()=>startLevel(Math.min(L+1,9));

/* прогрес */
const LS_KEY = "sk_game_litery_forms";
const setSync = (t,c)=>{ const e=$("sync"); if(e){ e.textContent=t; e.className="sync "+(c||""); } };
function readLS(){
  try{
    const o=JSON.parse(localStorage.getItem(LS_KEY)||"null");
    if(o && typeof o==="object"){
      S.unlocked=o.unlocked|0;
      S.done=Array.isArray(o.done)&&o.done.length===10?o.done.map(Boolean):Array(10).fill(false);
      S.best=Array.isArray(o.best)&&o.best.length===10?o.best.map(v=>v|0):Array(10).fill(0);
      S.xp=totalXp();
    }
  }catch(e){}
}
function saveProgress(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({unlocked:S.unlocked,done:S.done,best:S.best,xp:S.xp})); }catch(e){}
  if(window.SK && SK.pushLocal){
    SK.pushLocal().then(ok=>setSync(ok?"збережено":"локально",ok?"ok":"no")).catch(()=>setSync("локально","no"));
  }
}
window.addEventListener("pagehide", saveProgress);
function waitSK(cb){ let n=0; (function poll(){ if(window.SK&&window.SK.ready) return cb(true); if(++n>60) return cb(null); setTimeout(poll,100); })(); }
function boot(){
  readLS(); drawMap(); setSync("з'єднання…");
  waitSK(ok=>{
    if(!ok){ setSync("локально — без хмари","no"); return; }
    SK.ready.then(async ()=>{
      try{
        if(!SK.isHeroSession || !SK.isHeroSession()){ setSync("увійди як Герой","no"); return; }
        await SK.pullLocal(); readLS(); drawMap();
        const hero = await SK.getActiveChild();
        setSync(hero&&hero.name?hero.name:"прогрес у хмарі","ok");
      }catch(e){ setSync("локально","no"); }
    });
  });
}
boot();
</script>
</body>
