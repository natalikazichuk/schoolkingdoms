ng": ["Погода", "Посуд"]}]}, {"id": "odiah", "name": "Одяг", "emoji": "🧥", "accent": "#7c5cd0", "stages": [{"type": "word", "text": "Надворі холодно. Я вдягну теплу ___.", "answers": ["куртку"], "bank": ["квітку", "книжку"]}, {"type": "sentence", "words": ["Я", "взув", "нові", "чоботи."]}, {"type": "word", "text": "На руки я наділа ___, а на голову ___.", "answers": ["рукавички", "шапку"], "bank": ["тарілку", "ложку"]}, {"type": "sentence", "words": ["Мама", "купила", "мені", "шарф."]}, {"type": "order", "sentences": ["Настала зима.", "Оля вдягла куртку.", "Тепер їй тепло."]}, {"type": "title", "text": "Узимку я вдягаю куртку, шапку і рукавички. У теплому одязі не холодно.", "title": "Теплий одяг", "wrong": ["Ягоди", "Школа"]}]}, {"id": "posud", "name": "Посуд", "emoji": "🍽️", "accent": "#22a5b8", "stages": [{"type": "word", "text": "Мама поставила на стіл ___.", "answers": ["тарілки"], "bank": ["дерева", "хмари"]}, {"type": "sentence", "words": ["Я", "п'ю", "чай", "із", "чашки."]}, {"type": "word", "text": "У ___ налили ___.", "answers": ["склянку", "воду"], "bank": ["торбу", "сіль"]}, {"type": "sentence", "words": ["Ложка", "лежить", "біля", "тарілки."]}, {"type": "order", "sentences": ["Мама накрила стіл.", "Вона поставила тарілки й чашки.", "Ми сіли обідати."]}, {"type": "title", "text": "На столі стоять тарілки, чашки й ложки. З цього посуду ми їмо й п'ємо.", "title": "Посуд", "wrong": ["Птахи", "Іграшки"]}]}, {"id": "transport", "name": "Транспорт", "emoji": "🚌", "accent": "#3fa06a", "stages": [{"type": "word", "text": "По дорозі їде ___.", "answers": ["автобус"], "bank": ["ведмідь", "суп"]}, {"type": "sentence", "words": ["Літак", "летить", "у", "небі."]}, {"type": "word", "text": "___ пливе по ___.", "answers": ["Човен", "річці"], "bank": ["Кіт", "стелі"]}, {"type": "sentence", "words": ["Ми", "їдемо", "потягом", "до", "бабусі."]}, {"type": "order", "sentences": ["Ми зібралися в дорогу.", "Спершу їхали автобусом.", "Потім пересіли на потяг."]}, {"type": "tit   + '.tk-tile{border:none;border-radius:14px;padding:12px 16px;font-family:\'Fredoka\';font-size:19px;color:#fff;'
  + 'background:var(--blue);box-shadow:0 5px 0 var(--blue-d);cursor:pointer}'
  + '.tk-tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}'
  + '.tk-tile.used{opacity:.25;pointer-events:none}'
  + '.tk-tile.wide{width:100%;text-align:left;font-family:\'Nunito\';font-weight:800;font-size:15px;padding:12px 14px}'
  /* заголовок-опції */
  + '.tk-text{background:#fff8ea;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px;'
  + 'font-weight:700;line-height:1.5;margin-bottom:14px}'
  + '.tk-opts{display:flex;flex-direction:column;gap:10px}'
  + '.tk-opt{border:3px solid var(--line);background:#fff;border-radius:18px;padding:16px;font-family:\'Fredoka\';'
  + 'font-size:19px;color:var(--ink);cursor:pointer;text-align:center}'
  + '.tk-opt:active{transform:translateY(2px)}'
  + '.tk-opt.correct{background:var(--good-bg);border-color:var(--good);color:var(--good)}'
  + '.tk-opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}'
  /* кнопки/фідбек */
  + '.tk-big{border:none;border-radius:18px;padding:15px 20px;font-family:\'Fredoka\';font-size:19px;cursor:pointer;'
  + 'color:#fff;background:var(--green);box-shadow:0 6px 0 var(--green-d);width:100%;margin-top:14px}'
  + '.tk-big:active{transform:translateY(3px);box-shadow:0 3px 0 var(--green-d)}'
  + '.tk-big:disabled{filter:grayscale(.5);opacity:.6;cursor:not-allowed}'
  + '.tk-big.blue{background:var(--blue);box-shadow:0 6px 0 var(--blue-d)}'
  + '.tk-big.blue:active{box-shadow:0 3px 0 var(--blue-d)}'
  + '.tk-fb{text-align:center;font-weight:800;min-height:22px;margin-top:12px;font-size:15px}'
  + '.tk-fb.ok{color:var(--good)}.tk-fb.no{color:var(--bad)}'
  + '.shake{animation:shk .4s}'
  + '@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}'
  /* фініш */
  + '.tk-fin{justify-content:center;text-align:center;gap:14px;flex:1}'
  + '.tk-fin .em{font-size:70px}'
  + '.tk-stars{font-size:34px;letter-spacing:4px}'
  /* нижній навбар (спільний із hero/tests/igry) */
  + '.botnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,#1e3a6b,#16294f);'
  + 'border-top:3px solid #e0a42a;display:flex;align-items:center;gap:2px;'
  + 'padding:6px 8px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none}'
  + '.botnav::-webkit-scrollbar{display:none}'
  + '.botnav a,.botnav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:#cfe0f5;background:none;'
  + 'border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:.66rem;padding:5px 12px;border-radius:12px;'
  + 'text-decoration:none;white-space:nowrap;flex:1;min-width:52px;transition:.15s}'
  + '.botnav .ic{font-size:1.2rem}'
  + '.botnav a:hover{background:rgba(255,255,255,.1);color:#fff}';

  /* ───────────────────────── дрібні хелпери ───────────────────────── */
  function E(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  /* перемішати так, щоб порядок точно змінився (для order/sentence) */
  function shuffleNE(a) {
    if (a.length < 2) return a.slice();
    var s, tries = 0;
    do { s = shuffle(a); tries++; } while (tries < 12 && s.join('|') === a.join('|'));
    return s;
  }

  /* ───────────────────────── стан ───────────────────────── */
  var THEME = null, IDX = 0, STARS = 0, root = null, barSpan = null, titleSub = null;

  function mount(id) {
    THEME = BY_ID[id];
    if (!THEME) { document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">Тему «' + esc(id) + '» не знайдено.</p>'; return; }
    document.documentElement.lang = 'uk';
    document.title = THEME.name + ' — тренажер «Текст»';
    injectCSS(); setAccent(THEME.accent);
    buildShell();
    wireLogout();
    showStart();
  }

  /* Головний вхід для об'єднаного тренажера: домашній екран — вибір теми. */
  function mountHub() {
    document.documentElement.lang = 'uk';
    document.title = 'Тексти — тренажер';
    injectCSS();
    buildShell();
    wireLogout();
    showHub();
  }

  function showHub() {
    THEME = null;
    setAccent('#e05a7a');
    var s = E('div', 'tk-screen tk-hub on');
    var head = E('div', 'tk-head');
    head.appendChild(E('h1', null, '📖 Тексти'));
    head.appendChild(E('p', 'tk-sub', 'Обери тему. У кожній: вставити слова, скласти речення, скласти текст і дібрати заголовок.'));
    s.appendChild(head);
    var grid = E('div', 'tk-grid');
    THEMES.forEach(function (t) {
      var c = E('div', 'tk-tcard');
      c.style.setProperty('--tc', t.accent || '#ece3d2');
      var saved = loadProgressId(t.id);
      var badge = (saved && saved.done) ? '<span class="tk-badge">⭐' + (saved.stars || 0) + '</span>' : '';
      c.innerHTML = badge + '<span class="em">' + (t.emoji || '📖') + '</span><span class="nm">' + esc(t.name) + '</span>';
      c.onclick = function () { openTheme(t.id); };
      grid.appendChild(c);
    });
    s.appendChild(grid);
    root.innerHTML = ''; root.appendChild(s);
  }

  function openTheme(id) {
    THEME = BY_ID[id];
    if (!THEME) return showHub();
    document.title = THEME.name + ' — Тексти';
    setAccent(THEME.accent);
    showStart();
  }

  function injectCSS() {
    if (document.getElementById('tk-css')) return;
    var s = document.createElement('style');
    s.id = 'tk-css';
    s.textContent = CSS;
    document.head.appendChild(s);
  }
  function setAccent(color) {
    document.documentElement.style.setProperty('--acc', color || '#e05a7a');
  }

  function buildShell() {
    document.body.innerHTML = '';
    var wrap = E('div', 'tk-wrap');
    root = E('div');            // сюди рендеримо екрани
    wrap.appendChild(root);
    document.body.appendChild(wrap);

    var nav = E('nav', 'botnav');
    nav.innerHTML =
      '<a href="hero.html"><span class="ic">🏠</span>Головна</a>' +
      '<a href="tests.html"><span class="ic">📜</span>Тести</a>' +
      '<a href="biblioteka.html"><span class="ic">📚</span>Бібліотека</a>' +
      '<a href="igry.html"><span class="ic">🎮</span>Ігри</a>' +
      '<a href="karta.html"><span class="ic">🗺️</span>Карта</a>' +
      '<button id="heroBackBtn"><span class="ic">⬅️</span>Назад</button>';
    document.body.appendChild(nav);
  }

  function wireLogout() {
    // firebase-config.js — модуль, вантажиться відкладено; чекаємо на window.SK
    function bind() {
      var b = document.getElementById('heroBackBtn');
      if (!b) return;
      b.onclick = async function () {
        if(history.length>1){ history.back(); }else{ location.href='hero.html'; }
      };
    }
    if (window.SK) bind();
    else {
      var n = 0, iv = setInterval(function () {
        if (window.SK || n++ > 50) { clearInterval(iv); bind(); }
      }, 100);
    }
  }

  function topbar(subtitle) {
    var top = E('div', 'tk-top');
    var back = E('button', 'tk-icon', '←');
    back.title = 'Назад';
    back.onclick = showStart;
    var bar = E('div', 'tk-bar');
    barSpan = E('span'); bar.appendChild(barSpan);
    var ttl = E('div', 'tk-title', esc(THEME.name) + '<small>' + esc(subtitle || '') + '</small>');
    titleSub = ttl.querySelector('small');
    top.appendChild(back); top.appendChild(bar); top.appendChild(ttl);
    return top;
  }

  /* ───────────────────────── старт ───────────────────────── */
  function showStart() {
    var s = E('div', 'tk-screen tk-start on');
    s.style.position = 'relative';
    var back = E('button', 'tk-icon', '←'); back.title = 'Усі теми'; back.onclick = showHub;
    back.style.position = 'absolute'; back.style.top = '0'; back.style.left = '0';
    s.appendChild(back);
    var saved = loadProgress();
    var done = saved && saved.done;
    s.appendChild(E('div', 'tk-emoji', THEME.emoji || '📖'));
    s.appendChild(E('h1', null, THEME.name));
    s.appendChild(E('p', 'tk-sub', 'Читаємо, складаємо речення й текст. ' + THEME.stages.length + ' завдань — від простих до складніших.'));
    var chips = E('div', 'tk-chips');
    ['✍️ Вставити слова', '🧩 Скласти речення', '📑 Скласти текст', '🏷️ Заголовок'].forEach(function (c) {
      chips.appendChild(E('div', 'tk-chip', c));
    });
    s.appendChild(chips);
    if (done) s.appendChild(E('p', 'tk-sub', '⭐ Пройдено: ' + (saved.stars || 0) + ' з ' + THEME.stages.length));
    var btn = E('button', 'tk-big', done ? '↻ Пройти знову' : '▶ Почати');
    btn.style.maxWidth = '320px'; btn.style.margin = '8px auto 0';
    btn.onclick = startRun;
    s.appendChild(btn);
    root.innerHTML = ''; root.appendChild(s);
  }

  function startRun() { IDX = 0; STARS = 0; renderStage(); }

  function updateBar() {
    if (barSpan) barSpan.style.width = Math.round((IDX / THEME.stages.length) * 100) + '%';
    if (titleSub) titleSub.textContent = 'Завдання ' + (IDX + 1) + ' з ' + THEME.stages.length;
  }

  /* картинка етапу: файл або підказка-рамка */
  function picHtml(st, idx) {
    var src = st.img || ('img/tekst/' + THEME.id + '_' + (idx + 1) + '.jpg');
    var pic = E('div', 'tk-pic');
    var img = new Image();
    img.onload = function () { pic.innerHTML = ''; pic.appendChild(img); };
    img.onerror = function () {
      pic.innerHTML = '<div class="ph"><b>' + (THEME.emoji || '🖼️') + '</b>малюнок за бажанням:<br>' + esc(src) + '</div>';
    };
    img.alt = THEME.name;
    img.src = src;
    return pic;
  }

  function taskLabel(type) {
    return { word: '✍️ Встав пропущені слова', sentence: '🧩 Склади речення зі слів',
             order: '📑 Постав речення по порядку', title: '🏷️ Обери заголовок' }[type] || '';
  }

  function renderStage() {
    if (IDX >= THEME.stages.length) return showFinish();
    updateBar();
    var st = THEME.stages[IDX];
    var scr = E('div', 'tk-screen on');
    scr.appendChild(topbar('Завдання ' + (IDX + 1) + ' з ' + THEME.stages.length));
    var card = E('div', 'tk-card');
    card.appendChild(E('div', 'tk-task', taskLabel(st.type)));
    card.appendChild(picHtml(st, IDX));
    if (st.type === 'title') renderTitle(card, st);
    else renderFill(card, st);
    scr.appendChild(card);
    root.innerHTML = ''; root.appendChild(scr);
  }

  /* ───────── механіка «заповни слоти з банку» (word/sentence/order) ───────── */
  function renderFill(card, st) {
    var target, mode = st.type, template = null;
    if (st.type === 'word') { target = st.answers; template = st.text; }
    else if (st.type === 'sentence') target = st.words;
    else target = st.sentences; // order

    var n = target.length;
    var filled = new Array(n);       // текст у слоті
    var owner = new Array(n);        // кнопка банку, що заповнила слот

    // область слотів
    var slotsWrap, slotEls = [];
    if (mode === 'word') {
      slotsWrap = E('div', 'tk-sent');
      var parts = template.split('___');
      parts.forEach(function (p, i) {
        if (p) slotsWrap.appendChild(document.createTextNode(p));
        if (i < parts.length - 1) {
          var sl = E('span', 'tk-slot', '…'); sl.dataset.i = i;
          slotEls.push(sl); slotsWrap.appendChild(sl);
        }
      });
    } else if (mode === 'sentence') {
      slotsWrap = E('div', 'tk-slots');
      for (var i = 0; i < n; i++) {
        var s2 = E('div', 'tk-slot2', '·'); s2.dataset.i = i;
        slotEls.push(s2); slotsWrap.appendChild(s2);
      }
    } else { // order
      slotsWrap = E('div', 'tk-stack');
      for (var k = 0; k < n; k++) {
        var line = E('div', 'tk-line');
        line.dataset.i = k;
        line.innerHTML = '<span class="tk-num">' + (k + 1) + '</span><span class="txt" style="color:#b9ad93">тут буде речення…</span>';
        slotEls.push(line); slotsWrap.appendChild(line);
      }
    }
    card.appendChild(slotsWrap);

    // банк плиток
    var bankArr = (mode === 'word') ? shuffle(target.concat(st.bank)) : shuffleNE(target);
    var bank = E('div', 'tk-bank');
    var tiles = [];
    bankArr.forEach(function (word) {
      var b = E('button', 'tk-tile' + (mode === 'order' ? ' wide' : ''), esc(word));
      b.dataset.word = word;
      b.onclick = function () { place(word, b); };
      tiles.push(b); bank.appendChild(b);
    });
    card.appendChild(bank);

    var fb = E('div', 'tk-fb');
    var go = E('button', 'tk-big', 'Перевірити');
    go.disabled = true;
    card.appendChild(fb); card.appendChild(go);

    function firstEmpty() { for (var i = 0; i < n; i++) if (filled[i] == null) return i; return -1; }
    function fillSlot(i, word) {
      filled[i] = word;
      var el = slotEls[i];
      if (mode === 'order') { el.classList.add('full'); el.querySelector('.txt').style.color = ''; el.querySelector('.txt').textContent = word; }
      else { el.classList.add('full'); el.textContent = word; }
    }
    function clearSlot(i) {
      filled[i] = null;
      if (owner[i]) { owner[i].classList.remove('used'); owner[i] = null; }
      var el = slotEls[i];
      if (mode === 'order') { el.classList.remove('full'); el.querySelector('.txt').style.color = '#b9ad93'; el.querySelector('.txt').textContent = 'тут буде речення…'; }
      else { el.classList.remove('full'); el.textContent = (mode === 'word' ? '…' : '·'); }
      fb.textContent = ''; fb.className = 'tk-fb'; go.disabled = firstEmpty() !== -1;
    }
    function place(word, btn) {
      var i = firstEmpty(); if (i < 0) return;
      btn.classList.add('used'); owner[i] = btn;
      fillSlot(i, word);
      go.disabled = firstEmpty() !== -1;
    }
    slotEls.forEach(function (el) {
      el.onclick = function () { var i = +el.dataset.i; if (filled[i] != null) clearSlot(i); };
    });

    go.onclick = function () {
      if (firstEmpty() !== -1) return;
      var ok = true;
      for (var i = 0; i < n; i++) if (filled[i] !== target[i]) { ok = false; break; }
      if (ok) {
        go.disabled = true;
        slotEls.forEach(function (el) { el.onclick = null; });
        fb.className = 'tk-fb ok'; fb.textContent = '✅ Правильно!';
        advance(go);
      } else {
        markMiss();
        // повертаємо все в банк для нової спроби (clearSlot скидає фідбек)…
        for (var j = 0; j < n; j++) if (filled[j] != null) clearSlot(j);
        // …тому підказку показуємо ПІСЛЯ очищення, щоб вона лишилася на екрані
        fb.className = 'tk-fb no'; fb.textContent = '🤔 Ще не так. Спробуй переставити.';
        card.classList.add('shake'); setTimeout(function () { card.classList.remove('shake'); }, 400);
      }
    };
  }

  /* ───────── механіка «заголовок» ───────── */
  function renderTitle(card, st) {
    card.appendChild(E('div', 'tk-text', esc(st.text)));
    var opts = E('div', 'tk-opts');
    var list = shuffle([st.title].concat(st.wrong));
    var fb = E('div', 'tk-fb');
    var answered = false;
    list.forEach(function (o) {
      var b = E('button', 'tk-opt', esc(o));
      b.onclick = function () {
        if (answered) return; answered = true;
        Array.prototype.forEach.call(opts.children, function (c) { c.disabled = true; });
        if (o === st.title) {
          b.classList.add('correct'); fb.className = 'tk-fb ok'; fb.textContent = '✅ Правильно!';
          advanceInline(card, fb);
        } else {
          b.classList.add('wrong'); markMiss();
          Array.prototype.forEach.call(opts.children, function (c) {
            if (c.textContent === st.title) c.classList.add('correct');
          });
          fb.className = 'tk-fb no'; fb.textContent = '🤔 Правильний заголовок підсвічено.';
          advanceInline(card, fb);
        }
      };
      opts.appendChild(b);
    });
    card.appendChild(opts); card.appendChild(fb);
  }

  var missedThisStage = false;
  function markMiss() { missedThisStage = true; }

  function advance(afterBtn) {
    if (!missedThisStage) STARS++;
    var next = E('button', 'tk-big blue', IDX + 1 < THEME.stages.length ? 'Далі →' : 'Завершити 🎉');
    next.onclick = function () { IDX++; missedThisStage = false; renderStage(); };
    afterBtn.parentNode.replaceChild(next, afterBtn);
  }
  function advanceInline(card, fb) {
    if (!missedThisStage) STARS++;
    var next = E('button', 'tk-big blue', IDX + 1 < THEME.stages.length ? 'Далі →' : 'Завершити 🎉');
    next.onclick = function () { IDX++; missedThisStage = false; renderStage(); };
    card.appendChild(next);
  }

  /* ───────── фініш ───────── */
  function showFinish() {
    if (barSpan) barSpan.style.width = '100%';
    saveProgress(STARS);
    var total = THEME.stages.length;
    var perfect = STARS === total;
    var s = E('div', 'tk-screen tk-fin on');
    s.appendChild(E('div', 'em', perfect ? '🏆' : '🎉'));
    s.appendChild(E('h1', null, perfect ? 'Чудова робота!' : 'Молодець!'));
    var stars = ''; for (var i = 0; i < total; i++) stars += (i < STARS ? '⭐' : '☆');
    s.appendChild(E('div', 'tk-stars', stars));
    s.appendChild(E('p', 'tk-sub', 'Ти впорався з темою «' + THEME.name + '». Зірочок: ' + STARS + ' з ' + total + '.'));
    var again = E('button', 'tk-big', '↻ Ще раз');
    again.style.maxWidth = '320px'; again.style.margin = '8px auto 0';
    again.onclick = startRun;
    var toGames = E('button', 'tk-big blue', '◀ Інші теми');
    toGames.style.maxWidth = '320px'; toGames.style.margin = '10px auto 0';
    toGames.onclick = showHub;
    s.appendChild(again); s.appendChild(toGames);
    root.innerHTML = ''; root.appendChild(s);
  }

  /* ───────── прогрес (sk_-ключ → синхронізується через SK.pushLocal) ───────── */
  function pkey(id) { return 'sk_tekst_' + id; }
  function loadProgressId(id) {
    try { return JSON.parse(localStorage.getItem(pkey(id)) || 'null'); } catch (e) { return null; }
  }
  function loadProgress() { return loadProgressId(THEME.id); }
  function saveProgress(stars) {
    var prev = loadProgress() || { stars: 0 };
    var best = Math.max(prev.stars || 0, stars || 0);
    try { localStorage.setItem(pkey(THEME.id), JSON.stringify({ done: true, stars: best, ts: Date.now() })); } catch (e) {}
    // синхронізація з базою Героя, якщо є сесія
    try { if (window.SK && SK.isHeroSession && SK.isHeroSession() && SK.pushLocal) SK.pushLocal(); } catch (e) {}
  }

  window.SKTEKST = { mount: mount, mountHub: mountHub, THEMES: THEMES };
})();

</script>
<script>SKTEKST.mountHub();</script>
