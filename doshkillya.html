<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дошкільнятко — School Kingdoms</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sk-styles.css">
<style>
  .nv-wrap{max-width:940px;margin:0 auto;padding:clamp(12px,2.4vh,20px) 14px 20px}

  .nv-head{text-align:center;margin:0 auto clamp(14px,2.6vh,20px)}
  .nv-title{font-family:'Playfair Display',serif;font-weight:900;color:#FBEFD0;
    font-size:clamp(1.6rem,5.4vw,2.4rem);line-height:1.05;
    text-shadow:0 2px 12px rgba(0,0,0,.55),0 0 24px rgba(124,99,255,.35)}
  .nv-sub{color:#dce6f7;font-weight:700;font-size:clamp(.88rem,2vw,1.02rem);margin-top:8px}

  /* плитки дисциплін — однакового розміру, картинка на фоні */
  .nv-grid{display:grid;gap:clamp(12px,2.2vw,16px);
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .lv{position:relative;display:block;text-decoration:none;overflow:hidden;
    border-radius:20px;aspect-ratio:16/10;min-height:160px;
    border:2px solid rgba(242,199,92,.7);
    box-shadow:0 12px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .15s,box-shadow .15s,border-color .15s;
    background:linear-gradient(160deg,var(--g1,#27518c),var(--g2,#16356a))}
  a.lv:hover{transform:translateY(-3px);border-color:var(--gold);
    box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 22px -6px rgba(242,199,92,.6)}
  .lv-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0}
  .lv-scrim{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(8,18,40,.15) 0%,rgba(8,18,40,.35) 45%,rgba(8,18,40,.82) 100%)}
  .lv-body{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 15px}
  .lv-ic{position:absolute;top:12px;left:14px;font-size:1.9rem;line-height:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
  .lv-name{font-family:'Playfair Display',serif;font-weight:900;color:#fff;
    font-size:clamp(1.15rem,3.4vw,1.5rem);line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .lv-sub2{color:#ffe9b8;font-weight:800;font-size:.78rem;margin-top:2px;text-shadow:0 1px 5px rgba(0,0,0,.7)}
  .lv-soon{margin-top:9px;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    color:#e8eef9;font-weight:900;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
    background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px}
  .lv.locked{filter:grayscale(.2)}
  .lv.locked .lv-scrim{background:linear-gradient(180deg,rgba(8,18,40,.35),rgba(8,18,40,.85))}
  @media(max-width:560px){
    .nv-grid{grid-template-columns:1fr;gap:12px}
    .lv{aspect-ratio:16/9;min-height:150px}
    .lv-body{padding:12px 14px}
  }
</style>
</head>
<body>
  <div class="bg-fallback"></div>
  <div class="stars"></div>
  <div class="moon"></div>

  <!-- СПІЛЬНИЙ ХЕДЕР вставляється через sk-header.js -->

  <main class="nv-wrap">
    <div class="nv-head">
      <h1 class="nv-title">🌱 Дошкільнятко</h1>
      <div class="nv-sub">Обери напрям — і вперед готуватися до школи!</div>
    </div>

    <!-- ДИСЦИПЛІНИ. Плитки-заглушки (Скоро): наповнення й зв'язок з адмінкою — окрема сторінка.
         Коли з'явиться контент, заміни <div class="lv locked"> на <a class="lv" href="…"> і прибери .lv-soon.
         Картинки на фон додаються через github у img/nav/ (назви нижче). -->
    <div class="nv-grid">

      <div class="lv locked" style="--g1:#3a5aa0;--g2:#1c356b" aria-disabled="true">
        <img class="lv-bg" src="img/nav/dis-tsyfry.webp" alt="" loading="lazy" onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-soon">🔒 Скоро</span>
        </span>
      </div>

      <div class="lv locked" style="--g1:#b05a86;--g2:#6e2f52" aria-disabled="true">
        <img class="lv-bg" src="img/nav/dis-bukvy.webp" alt="" loading="lazy" onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-soon">🔒 Скоро</span>
        </span>
      </div>

      <div class="lv locked" style="--g1:#2f8f86;--g2:#155852" aria-disabled="true">
        <img class="lv-bg" src="img/nav/dis-english.webp" alt="" loading="lazy" onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-soon">🔒 Скоро</span>
        </span>
      </div>

      <div class="lv locked" style="--g1:#c08a3a;--g2:#7a531d" aria-disabled="true">
        <img class="lv-bg" src="img/nav/dis-svit.webp" alt="" loading="lazy" onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-soon">🔒 Скоро</span>
        </span>
      </div>

    </div>
  </main>

  <!-- шкала характеристик Героя (Firebase) -->
  <script type="module" src="firebase-config.js"></script>

  <!-- СПІЛЬНИЙ ХЕДЕР -->
  <script>window.SK_HEADER_SUB='Дошкільнятко';</script>
  <script src="sk-header.js"></script>

  <!-- СПІЛЬНИЙ ФУТЕР (Назад → Навчання) -->
  <script src="sk-footer.js?v=2" data-active="none" data-back="navchannia.html"></script>
</body>
</html>
