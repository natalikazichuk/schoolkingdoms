<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дошкільнятко — School Kingdoms</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sk-styles.css">
<style>
  .nv-wrap{max-width:940px;margin:0 auto;padding:clamp(12px,2.4vh,20px) 14px 20px}

  .nv-head{text-align:center;margin:0 auto clamp(14px,2.6vh,20px)}
  .nv-title{font-family:'Playfair Display',serif;font-weight:900;color:#FBEFD0;
    font-size:clamp(1.6rem,5.4vw,2.4rem);line-height:1.05;
    text-shadow:0 2px 12px rgba(0,0,0,.55),0 0 24px rgba(124,99,255,.35)}
  .nv-sub{color:#dce6f7;font-weight:700;font-size:clamp(.88rem,2vw,1.02rem);margin-top:8px}

  /* плитки дисциплін — картинка на фоні */
  /* Плитки (.lvgrid/.nv-grid + .lv*) — спільні, у sk-styles.css.
     Тут їх НЕ дублюємо: саме через копії розміри розʼїжджались. */

  /* Які предмети вже мають тести, знає база — відповідь приходить за мить після
     показу сторінки. Доти «🔒 Скоро» лише блимало й перемальовувалось на
     смужку прогресу (скарга з «Помилок»). Тримаємо місце, але не показуємо
     напис, поки не знаємо правди. */
  .nv-grid.is-loading .lv-soon{opacity:0}
  .nv-grid .lv-soon{transition:opacity .18s}

</style>
</head>
<body>
  <div class="bg-fallback"></div>
  <div class="stars"></div>
  <div class="moon"></div>

  <!-- СПІЛЬНИЙ ХЕДЕР вставляється через sk-header.js -->

  <main class="nv-wrap">
    <div class="nv-head">
      <h1 class="nv-title">🌱 Дошкільнятко</h1>
      <div class="nv-sub">Обери напрям — і вперед готуватися до школи!</div>
    </div>

    <!-- ДИСЦИПЛІНИ. data-subj — id предмета в дошкільному класі карти
         (sk-curriculum.js → tier preschool → grade gradeNum:0 → subjects[].id).
         Плитка відкривається сама, щойно в тому предметі зʼявиться бодай один
         тест: скрипт унизу проставляє href на tests.html і прибирає «Скоро».
         Картинки на фон додаються через github у img/nav/ (назви нижче). -->
    <div class="nv-grid is-loading" id="disGrid">

      <a class="lv locked" data-subj="math" data-keys="математик" style="--g1:#3a5aa0;--g2:#1c356b" aria-disabled="true">
        <img class="lv-bg" src="img/nav/dis-tsyfry.webp" alt="" loading="lazy" onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-ic">🔢</span>
          <span class="lv-name">Цифри</span>
          <span class="lv-sub2">Лічба та числа</span>
          <span class="lv-soon">🔒 Скоро</span>
        </span>
      </a>

      <a class="lv locked" data-subj="ukr" data-keys="українськ|абетк|читанн" style="--g1:#b05a86;--g2:#6e2f52" aria-disabled="true">
        <img class="lv-bg" src="img/nav/dis-bukvy.webp" alt="" loading="lazy" onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-ic">🔤</span>
          <span class="lv-name">Букви</span>
          <span class="lv-sub2">Абетка та звуки</span>
          <span class="lv-soon">🔒 Скоро</span>
        </span>
      </a>

      <!-- English має запасне посилання: словник працює й без тестів у карті. -->
      <a class="lv" data-subj="eng" data-keys="english|англійськ|англ" data-words="1" href="slovnyk-en.html" style="--g1:#2f8f86;--g2:#155852">
        <img class="lv-bg" src="img/nav/dis-english.webp" alt="" loading="lazy" onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-ic">🇬🇧</span>
          <span class="lv-name">English</span>
          <span class="lv-sub2">WORDS</span>
          <span class="lv-soon">🔒 Скоро</span>
        </span>
      </a>

      <a class="lv locked" data-subj="yads" data-keys="ядс|я досліджую світ|природознав|довкіл" style="--g1:#c08a3a;--g2:#7a531d" aria-disabled="true">
        <img class="lv-bg" src="img/nav/dis-svit.webp" alt="" loading="lazy" onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-ic">🌍</span>
          <span class="lv-name">Світ навколо нас</span>
          <span class="lv-sub2">Пізнаємо довкілля</span>
          <span class="lv-soon">🔒 Скоро</span>
        </span>
      </a>

    </div>
  </main>

  <!-- ══ Відкриваємо плитки, у яких уже є дошкільні тести ══
       Дошкільний вміст живе тут, а не поруч із «1 клас» на tests.html.
       Рахуємо тести з grade 0 за предметами дошкільного класу карти. -->
  <script>
  (function(){
    'use strict';
    var grid = document.getElementById('disGrid');
    if(!grid) return;
    var PROG = null;   // progress Героя з бази; поки null — рахуємо з localStorage
    var TIERS = null, TESTS = null;

    /* Знімаємо «очікування» рівно один раз — коли стало зрозуміло, які плитки
       відкриті. Якщо база мовчить, показуємо як є через 5 с, щоб сторінка не
       лишилась без підписів. */
    var settled = false;
    function markReady(){
      if(settled) return;
      settled = true;
      grid.classList.remove('is-loading');
    }
    setTimeout(markReady, 5000);

    function isPreTier(t){
      var s=(String(t&&t.id||'')+' '+String(t&&t.name||'')).toLowerCase();
      return s.indexOf('preschool')>=0 || s.indexOf('дошкіл')>=0;
    }
    function preGrade(tiers){
      for(var i=0;i<(tiers||[]).length;i++){
        if(!isPreTier(tiers[i])) continue;
        var gs = tiers[i].grades||[];
        for(var j=0;j<gs.length;j++) if(Number(gs[j].gradeNum)===0) return gs[j];
        if(gs.length) return gs[0];
      }
      return null;
    }
    function whenSK(cb){
      var t=0;
      (function w(){ if(window.SK){ cb(window.SK); return; } if(t++<120) setTimeout(w,50); else cb(null); })();
    }
    function nrm(v){
      return String(v==null?'':v).toLowerCase().replace(/[’'`ʼ]/g,'').replace(/\s+/g,' ').trim();
    }
    /* Предмет шукаємо спершу за id, далі — за назвою чи ключами. Id надійний
       лише для предметів із запасної карти: доданий в адмінці предмет
       отримує згенерований id ('s' + час), тож плитка за ним не знайшлась би. */
    function pickSubj(g, sid, keys){
      var subs = (g && g.subjects) || [];
      var byId = subs.filter(function(s){ return s && s.id === sid; })[0];
      if(byId) return byId;
      var want = String(keys||'').split('|').map(nrm).filter(Boolean);
      if(!want.length) return null;
      return subs.filter(function(s){
        if(!s) return false;
        var hay = [nrm(s.name)].concat((s.keys||[]).map(nrm)).filter(Boolean);
        return hay.some(function(h){
          return want.some(function(w){ return h.indexOf(w) >= 0 || w.indexOf(h) >= 0; });
        });
      })[0] || null;
    }
    /* Пройдено — ті самі ключі, що на tests.html: sk_testpass_<id> у
       localStorage або в progress Героя з бази. */
    function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
    function truthy(v){ return v==='1'||v===1||v===true; }
    function isDone(id){
      var k='sk_testpass_'+id;
      return truthy(lsGet(k)) || truthy(PROG && PROG[k]) || truthy(lsGet('sk_test100_'+id));
    }
    function unlock(g, tests){
      var gradeId = g ? g.id : '';
      Array.prototype.forEach.call(grid.querySelectorAll('[data-subj]'), function(a){
        var sid = a.getAttribute('data-subj');
        var subj = pickSubj(g, sid, a.getAttribute('data-keys'));
        if(!subj) return;
        var mine = tests.filter(function(t){
          try { return window.SKCUR.subjectMatches(subj, t.subject); } catch(e){ return false; }
        });
        /* tests.html підставляє в КОЖЕН клас вбудовану картку «WORDS»
           (словник English). Рахуємо її так само, як там, інакше на плитці
           було б на одну менше, ніж дитина побачить усередині. */
        var ids = mine.map(function(t){ return t.id; });
        if(a.getAttribute('data-words') === '1' && ids.indexOf('std-words-en') < 0){
          ids.push('std-words-en');
        }
        var n = ids.length;
        if(!n) return;                       // лишається «Скоро»
        var done = ids.filter(isDone).length;

        a.href = 'tests.html#open=preschool'
               + (gradeId ? '&grade=' + encodeURIComponent(gradeId) : '')
               + '&subj=' + encodeURIComponent(subj.id);
        a.classList.remove('locked');
        a.removeAttribute('aria-disabled');
        var soon = a.querySelector('.lv-soon');
        if(soon) soon.remove();
        var body = a.querySelector('.lv-body');
        if(body && !a.querySelector('.lv-prog')){
          var pct = n ? Math.round(done / n * 100) : 0;
          var wrap = document.createElement('span');
          wrap.className = 'lv-prog';
          wrap.innerHTML = '<span class="lv-track"' + (done >= n ? ' data-full="1"' : '')
            + '><i style="width:' + pct + '%"></i></span>'
            + '<span class="lv-ptx">' + done + ' / ' + n + '</span>';
          body.appendChild(wrap);
        }
      });
    }
    function run(tiers, tests){
      var g = preGrade(tiers);
      if(!g) return;
      unlock(g, (tests||[]).filter(function(t){
        return t && t.id && !t.hidden && Number(t.grade==null?1:t.grade)===0;
      }));
    }

    function start(){
      if(!window.SKCUR){ markReady(); return; }  // без карти лишаємо як є
      var mapP = (window.SKCUR.ready && window.SKCUR.ready.then)
        ? window.SKCUR.ready.catch(function(){ return null; })
        : Promise.resolve(null);
      var testP = new Promise(function(res){
        whenSK(function(SK){
          if(!SK || !SK.listActiveTests){ res([]); return; }
          SK.ready.then(function(){ return SK.listActiveTests(); }).then(res).catch(function(){ res([]); });
        });
      });
      Promise.all([mapP, testP]).then(function(r){
        TIERS = (r[0] && r[0].tiers) || window.SKCUR.map.tiers;
        TESTS = r[1];
        run(TIERS, TESTS);      // одразу — з localStorage
        markReady();
        loadHero();             // прийде прогрес із бази → перерахуємо
      }).catch(markReady);
    }
    /* Прогрес Героя приходить пізніше за localStorage — коли приїде,
       перемальовуємо смужки (ті самі ключі, що на tests.html). */
    function loadHero(){
      whenSK(function(SK){
        if(!SK || !SK.getHero || !SK.isHeroSession) return;
        SK.ready.then(function(){
          if(!SK.isHeroSession()) return null;
          return SK.getHero();
        }).then(function(h){
          if(!h) return;
          PROG = h.progress || {};
          Array.prototype.forEach.call(grid.querySelectorAll('.lv-prog'), function(el){ el.remove(); });
          run(TIERS, TESTS);
        }).catch(function(){});
      });
    }
    /* sk-header.js підвантажує sk-curriculum.js сам — чекаємо на SKCUR. */
    var tries = 0;
    (function wait(){
      if(window.SKCUR){ start(); return; }
      if(tries++ < 120) setTimeout(wait, 50);
      else markReady();
    })();
  })();
  </script>

  <!-- шкала характеристик Героя (Firebase) -->
  <script type="module" src="firebase-config.js"></script>

  <!-- СПІЛЬНИЙ ХЕДЕР -->
  <script>window.SK_HEADER_SUB='Дошкільнятко';</script>
  <script src="sk-header.js?v=2"></script>

  <!-- СПІЛЬНИЙ ФУТЕР (Назад → Навчання) -->
  <script src="sk-footer.js?v=5" data-active="navch" data-back="navchannia.html"></script>
</body>
</html>
