<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Королівська геометрія — School Kingdoms</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
/* Світла «пісочна» тема — як у тренажерах (замість темної sk-game.css). */
:root{
  --ink:#2c2b3a;--soft:#6b6a7d;--paper:#fff9ef;--line:#ece3d2;--card:#fff;
  --red:#ff6b6b;--orange:#ffa94d;--yellow:#ffd43b;--green:#51cf66;--teal:#22b8cf;
  --blue:#4dabf7;--purple:#cc5de8;
  --good:#37b26f;--good-bg:#e4f7ec;--bad:#e06666;--bad-bg:#fbe7e7;
  --shadow:0 6px 0 rgba(44,43,58,.13);
  --gold:#ffcf4d;--gold-deep:#e0a92e;
  /* «крейда» на світлій дошці — синя; зафарбоване — блакитне */
  --chalk:#3d7fd9;--chalk-fill:rgba(77,171,247,.32);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden;}
body{
  font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
  user-select:none; -webkit-user-select:none; touch-action:manipulation; overscroll-behavior:none;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,212,59,.28),transparent 42%),
    radial-gradient(circle at 88% 14%,rgba(77,171,247,.26),transparent 44%),
    radial-gradient(circle at 78% 92%,rgba(204,93,232,.22),transparent 46%),
    radial-gradient(circle at 8% 86%,rgba(81,207,102,.24),transparent 44%),
    var(--paper);
}
h1,.title,.cta,.ans,.pill .val,.linkbtn{font-family:'Fredoka',sans-serif;letter-spacing:.3px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── увесь ігровий шар — над футером ── */
#wrap{position:fixed; top:0; left:0; right:0;
  bottom:calc(60px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; max-width:640px; margin:0 auto;}

/* ── верхня панель ── */
#top{display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 4px;}
.iconbtn{width:44px; height:44px; border:2px solid var(--line); background:#fff; border-radius:14px;
  font-family:inherit; font-weight:700; font-size:20px; color:var(--ink); cursor:pointer; flex:none;
  display:grid; place-items:center; box-shadow:0 1px 3px rgba(44,43,58,.14);}
.iconbtn:active{transform:translateY(2px);}
.pill{background:#fff; border:2px solid var(--line); border-radius:14px;
  padding:6px 12px; font-weight:800; font-size:14px; white-space:nowrap; box-shadow:var(--shadow);}
.pill .lab{color:var(--soft); font-size:11px; display:block; line-height:1;}
.pill .val{font-size:19px; line-height:1.15; color:var(--ink);}
.pill.q .val{color:var(--orange);}
#spacer{flex:1;}
#menuBtn{cursor:pointer; font-family:'Fredoka'; font-weight:600; font-size:15px;
  background:#fff; border:2px solid var(--line); color:var(--ink);
  border-radius:14px; padding:9px 14px; box-shadow:var(--shadow); margin-right:52px;}
#menuBtn:active{transform:translateY(2px); box-shadow:0 3px 0 rgba(44,43,58,.13);}

/* ── прогрес ── */
#barWrap{padding:10px 64px 2px 16px;}   /* праворуч — місце під «жучок» 🐞 */
#bar{height:12px; border-radius:8px; background:#f0e7d6; overflow:hidden;}
#barFill{height:100%; width:0%; border-radius:8px;
  background:linear-gradient(90deg,var(--green),var(--teal)); transition:width .45s;}

/* ── сцена ── */
#main{flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:10px; padding:6px 14px; min-height:0;}
#hint{font-weight:800; font-size:15px; color:var(--soft); min-height:22px; text-align:center; line-height:1.35; max-width:460px;}
#hint b{color:var(--ink);}
#hint.bad{color:var(--bad);}
#hint.good{color:var(--good);}

#stage{position:relative; width:100%; max-width:460px; flex:1 1 auto; min-height:0;
  display:flex; align-items:center; justify-content:center;}

/* дошка в клітинку, на якій «малює» королівська крейда */
.board{position:relative; width:100%; height:100%; max-height:100%;
  border-radius:20px; border:3px solid var(--line);
  background:
    linear-gradient(#eef2f8 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, #eef2f8 1px, transparent 1px) 0 0/28px 28px,
    #fff;
  box-shadow:var(--shadow); overflow:hidden;}
.board svg{display:block; width:100%; height:100%;}

.ink{fill:none; stroke:var(--chalk); stroke-width:5; stroke-linecap:round; stroke-linejoin:round;}
.ink.draw{transition:stroke-dashoffset .9s cubic-bezier(.35,.85,.35,1);}
.ink.solid{fill:var(--chalk-fill);}
.dot{fill:var(--chalk); stroke:none;}
.tip{fill:var(--orange); filter:drop-shadow(0 0 5px rgba(255,169,77,.9));}
.popin{animation:popin .5s cubic-bezier(.3,1.4,.4,1);}
@keyframes popin{0%{transform:scale(0); opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1); opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ── сітка «Знайди фігуру» ── */
#stage.find{align-items:stretch;}
.find-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; height:100%;}
.tile{position:relative; cursor:pointer; border-radius:18px; border:3px solid var(--line);
  background:#fff; box-shadow:0 4px 0 rgba(44,43,58,.12);
  overflow:hidden; transition:transform .12s, border-color .12s, background .12s;}
.tile svg{display:block; width:100%; height:100%;}
.tile:active{transform:scale(.97);}
.tile.good{border-color:var(--good); background:var(--good-bg);}
.tile.good .ink{stroke:var(--good);}
.tile.good .ink.solid{fill:rgba(55,178,111,.3);}
.tile.good .dot{fill:var(--good);}
.tile.bad{border-color:var(--bad); background:var(--bad-bg); animation:shake .34s;}

/* ── відповіді (назви фігур) ── */
#answers{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; padding:4px 10px 16px;}
#answers:empty{padding:0;}
.ans{cursor:pointer; font-weight:700; font-size:clamp(16px,4.4vw,19px); color:#4a3300;
  background:linear-gradient(180deg,#FFE7A0,var(--gold-deep));
  border:none; border-radius:18px; padding:13px 20px; min-width:104px;
  box-shadow:0 6px 0 #c9922a, 0 8px 14px rgba(44,43,58,.18); transition:transform .1s, opacity .2s;}
.ans:active{transform:translateY(3px); box-shadow:0 3px 0 #c9922a;}
.ans.good{background:var(--green); color:#fff; box-shadow:0 6px 0 #37a052;}
.ans.bad{background:var(--bad); color:#fff; box-shadow:0 6px 0 #b84848; animation:shake .34s;}
.ans.dim{opacity:.4;}
@media (max-width:380px){ .ans{min-width:92px; padding:11px 14px;} }

/* ── точки для побудови ── */
.node{cursor:pointer; fill:#fff; stroke:#b9c3d3; stroke-width:3; transition:fill .15s, stroke .15s;}
.node.start{fill:#fff1dc; stroke:var(--orange); animation:pulse 1.3s infinite;}
.node.used{fill:var(--chalk); stroke:var(--chalk);}
.node.bad{fill:var(--bad-bg); stroke:var(--bad);}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}
@media (prefers-reduced-motion: reduce){ .ink.draw{transition:none!important;} }

/* ── оверлеї (старт / фінал) ── */
.screen{position:absolute; inset:0; z-index:60; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:22px; gap:12px;
  background:linear-gradient(180deg,#fff9ef,#fdf3e2);}
.screen.hidden{display:none;}
.crown{font-size:52px;}
.title{font-size:30px; font-weight:700; color:var(--ink); line-height:1.1;}
.sub{font-size:15px; font-weight:800; color:var(--soft); max-width:340px; line-height:1.5;}
.sub b{color:var(--blue);}
.stars{font-size:42px; letter-spacing:6px;}
.cta{margin-top:4px; border:none; cursor:pointer; font-weight:700;
  background:var(--green); color:#fff; font-size:20px; padding:15px 42px; border-radius:18px;
  box-shadow:0 6px 0 #37a052;}
.cta:active{transform:translateY(3px); box-shadow:0 3px 0 #37a052;}
.linkbtn{cursor:pointer; font-weight:600; font-size:15px; text-decoration:none;
  background:#fff; border:2px solid var(--line); color:var(--soft);
  border-radius:14px; padding:11px 22px;}
.linkbtn:active{transform:translateY(2px);}
.winrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}

/* ══ стартовий екран — вигляд як у тренажері «Вчимо літери» ══ */
#startScreen{justify-content:flex-start; gap:11px; overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 16px) 20px 16px;}
#startScreen > *:not(.start-hero){flex-shrink:0;}
#startScreen .start-head{position:relative; width:100%; max-width:540px; margin:0 auto;
  display:flex; flex-direction:column; align-items:center;}
#startScreen .start-top{position:absolute; top:22px; left:0; z-index:5;}
.num-blocks{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:6px 0 2px;}
.nb{position:relative; width:58px; height:58px; border-radius:16px; display:grid; place-items:center;
  font-family:'Fredoka'; font-weight:700; font-size:30px; color:#fff; transform:rotate(var(--r));
  box-shadow:0 6px 0 rgba(0,0,0,.14), inset 0 -5px 0 rgba(0,0,0,.12), inset 0 3px 0 rgba(255,255,255,.28);}
.nb::after{content:attr(data-o); position:absolute; right:-8px; bottom:-8px; font-size:20px;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}
.nb:nth-child(1){background:var(--red);--r:-7deg}.nb:nth-child(2){background:var(--orange);--r:5deg}
.nb:nth-child(3){background:var(--green);--r:-4deg}.nb:nth-child(4){background:var(--blue);--r:6deg}
.nb:nth-child(5){background:var(--purple);--r:-5deg}
#startScreen h1{font-family:'Comfortaa','Fredoka',sans-serif; font-weight:700; font-size:34px;
  margin:8px 0 0; line-height:1.1; color:#1e3a6b;}
.start-sub{color:var(--soft); font-weight:800; font-size:16px;}
.rhyme{background:#fff; border:3px dashed #cdd8ea; border-radius:20px; padding:12px 18px;
  font-style:italic; color:#3a5a8c; font-weight:800; max-width:400px; margin:0 auto;
  box-shadow:0 1px 3px rgba(44,43,58,.14); line-height:1.4;}
.start-hero{max-width:440px; width:100%; margin:0 auto; flex:1 1 auto; min-height:120px;
  max-height:clamp(170px,40vh,380px); display:flex; align-items:center; justify-content:center; overflow:hidden;}
.start-hero img{max-width:100%; max-height:100%; width:auto; height:auto; display:block;}
.start-btns{display:flex; flex-direction:column; gap:10px; max-width:440px; margin:2px auto 0; width:100%;}
.big-btn{border:none; border-radius:18px; padding:16px 20px; width:100%; cursor:pointer;
  font-family:'Fredoka'; font-weight:700; font-size:20px; color:#fff;
  background:var(--blue); box-shadow:0 6px 0 #2f8fd6;}
.big-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #2f8fd6;}
/* «Нагороду отримано» — на старті замість віршика */
.done-card{display:none; align-items:center; gap:12px; max-width:440px; width:100%; margin:0 auto; text-align:left;
  background:linear-gradient(180deg,#fffdf4,#fff6df); border:3px solid #f4c842; border-radius:20px;
  padding:10px 14px; box-shadow:0 0 0 3px #fff9e6;}
.done-card.on{display:flex;}
.done-card .dc-ic{font-size:30px; flex:none;}
.done-card .dc-got{font-family:'Fredoka'; font-weight:700; font-size:15px; color:#8a5e16; line-height:1.2;}
.done-card .dc-go{font-weight:800; font-size:12px; color:var(--soft); margin-top:3px; line-height:1.25;}
@media (max-width:520px){
  #startScreen .start-top{top:12px;}
  .num-blocks{padding:0 48px; gap:6px;}
  .nb{width:44px; height:44px; border-radius:12px; font-size:24px;}
  .nb::after{font-size:16px; right:-6px; bottom:-6px;}
}
@media (max-width:380px){
  .num-blocks{padding:0 46px; gap:5px;}
  .nb{width:38px; height:38px; border-radius:11px; font-size:21px;}
}
@media (max-width:440px){
  #startScreen{gap:8px; padding-left:16px; padding-right:16px;}
  #startScreen h1{font-size:30px;}
  .start-sub{font-size:14px;}
  .rhyme{padding:9px 14px; font-size:14px; border-radius:16px;}
  .big-btn{padding:13px 18px; font-size:18px;}
}
/* довга назва — не під «жучком» 🐞 справа */
@media (max-width:440px){
  #startScreen h1{font-size:27px; padding:0 40px;}
}
@media (max-height:640px){
  #startScreen h1{font-size:28px;}
  .start-hero{max-height:22vh;}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div class="pill q"><span class="lab">Завдання</span><span class="val" id="qNum">1/15</span></div>
    <div id="spacer"></div>
    <button id="menuBtn">☰ Меню</button>
  </div>

  <div id="barWrap"><div id="bar"><div id="barFill"></div></div></div>

  <div id="main">
    <div id="hint">Королівська крейда малює…</div>
    <div id="stage"></div>
  </div>

  <div id="answers"></div>

  <div class="screen" id="startScreen">
    <div class="start-head">
      <div class="start-top">
        <button class="iconbtn backbtn" type="button" title="Назад" aria-label="Назад">←</button>
      </div>
      <div class="num-blocks">
        <div class="nb" data-o="📐">▲</div><div class="nb" data-o="✏️">■</div><div class="nb" data-o="✨">●</div><div class="nb" data-o="📏">◯</div><div class="nb" data-o="⭐">╱</div>
      </div>
      <h1>Королівська геометрія</h1>
    </div>
    <p class="start-sub">Впізнай · знайди · побудуй · 15 завдань</p>
    <p class="rhyme" id="startRhyme">Точка, коло і квадрат —<br>креслить крейда все підряд!</p>
    <div class="done-card" id="startDone">
      <span class="dc-ic">🏆</span>
      <div><div class="dc-got" id="doneGot">Тренажер пройдено!</div>
        <div class="dc-go" id="doneGo">Вирушай за новими досягненнями!</div></div>
    </div>

    <div class="start-hero">
      <img src="../img/tr/mat-heometriya.webp" alt="" onerror="this.closest('.start-hero').style.display='none'">
    </div>

    <div class="start-btns">
      <button class="big-btn" id="playBtn">Грати ▶</button>
    </div>
  </div>

  <div class="screen hidden" id="winScreen">
    <div class="crown">👑</div>
    <div class="title" id="winTitle">Креслення готове!</div>
    <div class="stars" id="winStars">⭐⭐⭐</div>
    <div class="sub" id="winSub">Чудова робота!</div>
    <div class="winrow"><button class="cta" id="againBtn">↻ Ще раз</button></div>
    <div class="winrow">
      <button class="linkbtn" id="toMenuBtn" type="button">☰ У меню</button>
      <button class="linkbtn backbtn" type="button">← Назад</button>
    </div>
  </div>
</div>

<script src="../sk-footer.js?v=5" data-base="../" data-back="self"></script>

<script>
(function(){
  "use strict";

  var TOTAL = 15;
  var SVGNS = "http://www.w3.org/2000/svg";

  /* ═════════ каталог фігур ═════════ */
  var SHAPES = {
    tochka:      { name:"Точка",        why:"Точка — це просто позначка на аркуші. У неї немає ні довжини, ні сторін." },
    vidrizok:    { name:"Відрізок",     why:"Відрізок — пряма лінія, у якої два кінці.",
                   how:"зʼєднай дві точки прямою лінією." },
    lamana:      { name:"Ламана",       why:"Ламана — кілька відрізків, зʼєднаних кінцями, як зламана паличка.",
                   how:"веди лінію від точки до точки — вийде зламана доріжка." },
    kolo:        { name:"Коло",         why:"Коло — це тільки кругла лінія. Усередині порожньо." },
    kruh:        { name:"Круг",         why:"Круг — це коло разом з усім, що всередині. Він зафарбований." },
    trykutnyk:   { name:"Трикутник",    why:"Трикутник має 3 сторони і 3 кути.",
                   how:"обійди 3 точки — вийде 3 сторони і 3 кути." },
    kvadrat:     { name:"Квадрат",      why:"У квадрата 4 сторони — і всі однакові.",
                   how:"обійди 4 точки так, щоб усі сторони були однакові." },
    pryamokutnyk:{ name:"Прямокутник",  why:"У прямокутника 4 кути, а протилежні сторони однакові.",
                   how:"обійди 4 кути — протилежні сторони мають бути однакові." }
  };
  var KEYS = Object.keys(SHAPES);

  /* хто з ким плутається — саме з цього робимо варіанти відповідей */
  var CONFUSE = {
    kolo:        ["kruh","tochka"],
    kruh:        ["kolo","tochka"],
    kvadrat:     ["pryamokutnyk","trykutnyk"],
    pryamokutnyk:["kvadrat","trykutnyk"],
    trykutnyk:   ["kvadrat","lamana"],
    vidrizok:    ["lamana","tochka"],
    lamana:      ["vidrizok","trykutnyk"],
    tochka:      ["kolo","vidrizok"]
  };

  /* фігури, які можна побудувати з точок */
  var BUILDABLE = ["vidrizok","lamana","trykutnyk","kvadrat","pryamokutnyk"];

  var stageEl  = document.getElementById("stage");
  var ansEl    = document.getElementById("answers");
  var hintEl   = document.getElementById("hint");
  var qNumEl   = document.getElementById("qNum");
  var fillEl   = document.getElementById("barFill");

  var qIndex=0, mistakes=0, locked=true, current=null;

  /* ── «Назад» — туди, звідки прийшли (?skback= / попередня сторінка сайту), інакше «Тести» ── */
  function goBack(){
    if(window.skGoBackSmart){ skGoBackSmart("tests.html"); return; }
    location.href="../tests.html";
  }
  function openMenu(){
    locked = true;
    refreshStart();
    document.getElementById("winScreen").classList.add("hidden");
    document.getElementById("startScreen").classList.remove("hidden");
  }
  document.querySelectorAll(".backbtn").forEach(function(b){ b.addEventListener("click", goBack); });
  /* футер «Назад»: у грі → меню, у меню → вихід */
  var hb = document.getElementById("heroBackBtn");
  if(hb) hb.addEventListener("click", function(){
    if(document.getElementById("startScreen").classList.contains("hidden")) openMenu();
    else goBack();
  });

  /* ── нагорода з адмінки (sk-prize.js) — один раз, за перше повне проходження ── */
  var PRIZE_KEY = "sk_heometriya_prize_v1";   // нагороду отримано (і що саме)
  var TR_HREF = "heometriya.html";            // за цим іменем sk-rewards шукає нагороду з адмінки
  function refreshStart(){
    var p = window.SKPRIZE ? SKPRIZE.summary(PRIZE_KEY) : null;
    document.getElementById("startDone").classList.toggle("on", !!p);
    document.getElementById("startRhyme").style.display = p ? "none" : "";   // замість віршика — нагорода
    if(!p) return;
    var t = SKPRIZE.doneText(p, "Королівську геометрію пройдено — нагороду отримано!");
    document.getElementById("doneGot").textContent = t.got;
    document.getElementById("doneGo").textContent = t.go;
  }

  function rnd(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }
  function pick(a){ return a[rnd(0,a.length-1)]; }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(0,i); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function el(tag,attrs){
    var e=document.createElementNS(SVGNS,tag);
    for(var k in attrs){ if(Object.prototype.hasOwnProperty.call(attrs,k)) e.setAttribute(k,attrs[k]); }
    return e;
  }

  /* ═════════ малюнок фігури (viewBox 0 0 240 200) ═════════ */
  /* повертає {d, closed, fill, dot} */
  function shapeGeom(key){
    var cx=120, cy=100, r, s, w, h, i, pts;
    if(key==="tochka")  return { dot:true, cx:cx, cy:cy, r:10 };
    if(key==="kolo" || key==="kruh"){
      r = rnd(52,70);
      return { d:"M "+(cx-r)+" "+cy+" a "+r+" "+r+" 0 1 0 "+(2*r)+" 0 a "+r+" "+r+" 0 1 0 "+(-2*r)+" 0",
               closed:true, fill:(key==="kruh") };
    }
    if(key==="kvadrat"){
      s = rnd(96,126);
      pts=[[cx-s/2,cy-s/2],[cx+s/2,cy-s/2],[cx+s/2,cy+s/2],[cx-s/2,cy+s/2]];
      return { d:poly(pts,true), closed:true, rot:rnd(-7,7) };
    }
    if(key==="pryamokutnyk"){
      w = rnd(130,180); h = rnd(62,88);
      if(Math.random()<0.35){ var t=w; w=h; h=t; }          // іноді «стояча» — вужча, ніж вища
      pts=[[cx-w/2,cy-h/2],[cx+w/2,cy-h/2],[cx+w/2,cy+h/2],[cx-w/2,cy+h/2]];
      return { d:poly(pts,true), closed:true, rot:rnd(-5,5) };
    }
    if(key==="trykutnyk"){
      var bw=rnd(110,158), bh=rnd(84,116), ax=rnd(-38,38);
      pts=[[cx-bw/2,cy+bh/2],[cx+bw/2,cy+bh/2],[cx+ax,cy-bh/2]];
      return { d:poly(pts,true), closed:true, rot:rnd(-6,6) };
    }
    if(key==="vidrizok"){
      var len=rnd(120,170), ang=rnd(-38,38)*Math.PI/180;
      var dx=Math.cos(ang)*len/2, dy=Math.sin(ang)*len/2;
      return { d:"M "+(cx-dx)+" "+(cy-dy)+" L "+(cx+dx)+" "+(cy+dy),
               closed:false, ends:[[cx-dx,cy-dy],[cx+dx,cy+dy]] };
    }
    /* ламана */
    var n=rnd(3,4), x=rnd(28,58), y=rnd(40,160), lastDir=99;
    pts=[[x,y]];
    for(i=0;i<n;i++){
      var dir, guard=0;
      do { dir=rnd(0,3); } while(dir===lastDir && guard++<20);
      lastDir=dir;
      x += rnd(42,66);
      y += (dir<2 ? -1 : 1) * rnd(38,64);
      y = Math.max(28, Math.min(172, y));
      x = Math.min(214, x);
      pts.push([x,y]);
    }
    return { d:poly(pts,false), closed:false, ends:[pts[0],pts[pts.length-1]] };
  }

  function poly(pts,close){
    var d="M "+r2(pts[0][0])+" "+r2(pts[0][1]);
    for(var i=1;i<pts.length;i++) d+=" L "+r2(pts[i][0])+" "+r2(pts[i][1]);
    if(close) d+=" Z";
    return d;
  }
  function r2(v){ return Math.round(v*10)/10; }

  /* малює фігуру в новий <svg>; animate=true → крейда веде лінію */
  var uid=0;
  function drawShape(key, animate){
    var g = shapeGeom(key);
    var svg = el("svg",{viewBox:"0 0 240 200"});
    var root = el("g",{});
    if(g.rot) root.setAttribute("transform","rotate("+g.rot+" 120 100)");
    svg.appendChild(root);

    if(g.dot){
      var c = el("circle",{cx:g.cx, cy:g.cy, r:g.r, class:"dot"});
      c.style.transformOrigin = "50% 50%";
      if(animate) c.setAttribute("class","dot popin");
      root.appendChild(c);
      return svg;
    }

    var id = "gp"+(++uid);
    var p = el("path",{ id:id, d:g.d, class:"ink"+(g.fill?" solid":"") });
    root.appendChild(p);

    /* кінцеві крапочки — щоб було видно, що у відрізка/ламаної є кінці */
    if(g.ends){
      g.ends.forEach(function(pt){
        root.appendChild(el("circle",{cx:pt[0], cy:pt[1], r:5, class:"dot"}));
      });
    }

    if(animate){
      /* фарбу заливаємо тільки після того, як лінію дописано */
      if(g.fill) p.style.fill = "transparent";
      /* вимірювати довжину можна лише коли <path> уже в документі */
      requestAnimationFrame(function(){
        var len;
        try { len = p.getTotalLength(); } catch(e){ len = 0; }
        if(!len){ if(g.fill) p.style.fill=""; return; }
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        var tip = el("circle",{r:5, class:"tip"});
        var am  = el("animateMotion",{dur:"0.9s", fill:"freeze"});
        var mp  = el("mpath",{});
        mp.setAttribute("href","#"+id);
        am.appendChild(mp); tip.appendChild(am); root.appendChild(tip);
        requestAnimationFrame(function(){
          p.classList.add("draw");
          p.style.strokeDashoffset = 0;
        });
        setTimeout(function(){
          if(tip.parentNode) tip.parentNode.removeChild(tip);
          if(g.fill){ p.style.transition="fill .45s"; p.style.fill=""; }
        }, 920);
      });
    } else if(g.fill){
      /* без анімації — просто зафарбовано */
    }
    return svg;
  }

  /* ═════════ режим 1: ВПІЗНАЙ ═════════ */
  function roundIdentify(){
    var key = pick(KEYS);
    current = { mode:1, key:key };

    stageEl.className = "";
    stageEl.innerHTML = "";
    var board = document.createElement("div");
    board.className = "board";
    board.appendChild(drawShape(key, true));
    stageEl.appendChild(board);

    hintEl.className = "";
    hintEl.textContent = "Що намалювала крейда?";

    var opts = shuffle([key].concat(CONFUSE[key].slice(0,2)));
    ansEl.innerHTML = "";
    opts.forEach(function(k){
      var b=document.createElement("button");
      b.className="ans"; b.textContent=SHAPES[k].name; b.dataset.key=k;
      b.addEventListener("click", function(){ answerIdentify(b, k); });
      ansEl.appendChild(b);
    });
    setTimeout(function(){ locked=false; }, 500);
  }

  function answerIdentify(btn, k){
    if(locked) return;
    if(k === current.key){
      locked = true;
      btn.classList.add("good");
      hintEl.className="good";
      hintEl.textContent = SHAPES[k].why;
      gain();
      setTimeout(nextRound, 1300);
    } else {
      miss();
      btn.classList.add("bad");
      setTimeout(function(){ btn.classList.remove("bad"); btn.classList.add("dim"); btn.disabled=true; }, 340);
      hintEl.className="bad";
      hintEl.textContent = "Ні. " + SHAPES[k].why + " Спробуй ще.";
    }
  }

  /* ═════════ режим 2: ЗНАЙДИ ═════════ */
  function roundFind(){
    var key = pick(KEYS);
    var pool = shuffle(CONFUSE[key].concat(KEYS.filter(function(k){
      return k!==key && CONFUSE[key].indexOf(k)<0;
    })));
    var others=[], i=0;
    while(others.length<3 && i<pool.length){ others.push(pool[i++]); }
    var tiles = shuffle([key].concat(others));
    current = { mode:2, key:key };

    stageEl.className = "find";
    stageEl.innerHTML = "";
    var grid = document.createElement("div");
    grid.className = "find-grid";
    tiles.forEach(function(k, idx){
      var t=document.createElement("div");
      t.className="tile"; t.dataset.key=k;
      t.appendChild(drawShape(k, false));
      t.addEventListener("click", function(){ answerFind(t, k); });
      grid.appendChild(t);
      /* короткий сходинковий вихід плиток */
      t.style.opacity="0"; t.style.transform="scale(.9)";
      setTimeout(function(){
        t.style.transition="opacity .3s, transform .3s";
        t.style.opacity="1"; t.style.transform="scale(1)";
      }, 60*idx+40);
    });
    stageEl.appendChild(grid);

    hintEl.className="";
    hintEl.innerHTML = "Торкнись: <b>"+SHAPES[key].name+"</b>";
    ansEl.innerHTML = "";
    setTimeout(function(){ locked=false; }, 400);
  }

  function answerFind(tile, k){
    if(locked) return;
    if(k === current.key){
      locked = true;
      tile.classList.add("good");
      hintEl.className="good";
      hintEl.textContent = SHAPES[k].why;
      gain();
      setTimeout(nextRound, 1300);
    } else {
      miss();
      tile.classList.add("bad");
      setTimeout(function(){ tile.classList.remove("bad"); }, 360);
      hintEl.className="bad";
      hintEl.textContent = "Це " + SHAPES[k].name.toLowerCase() + ". " + SHAPES[current.key].why;
    }
  }

  /* ═════════ режим 3: ПОБУДУЙ ═════════ */
  /* сітка 5×4, крок 60 → viewBox 320×260 */
  var GC=5, GR=4, STEP=60, OX=40, OY=40;
  function gx(c){ return OX + c*STEP; }
  function gy(r){ return OY + r*STEP; }

  function buildTarget(key){
    var c, r, s, w, h, pts;
    if(key==="kvadrat"){
      s = rnd(2,3);
      c = rnd(0, GC-1-s); r = rnd(0, GR-1-s);
      pts=[[c,r],[c+s,r],[c+s,r+s],[c,r+s]];
      return { pts:pts, closed:true };
    }
    if(key==="pryamokutnyk"){
      do { w=rnd(2,4); h=rnd(1,3); } while(w===h);
      c = rnd(0, GC-1-w); r = rnd(0, GR-1-h);
      pts=[[c,r],[c+w,r],[c+w,r+h],[c,r+h]];
      return { pts:pts, closed:true };
    }
    if(key==="trykutnyk"){
      w = rnd(2,4);
      c = rnd(0, GC-1-w); r = rnd(2, GR-1);
      var top = rnd(0, r-2);
      pts=[[c,r],[c+w,r],[c+rnd(0,w),top]];
      return { pts:pts, closed:true };
    }
    if(key==="vidrizok"){
      var horiz = Math.random()<0.5;
      if(horiz){ var L=rnd(2,4); c=rnd(0,GC-1-L); r=rnd(0,GR-1); pts=[[c,r],[c+L,r]]; }
      else     { var V=rnd(2,3); c=rnd(0,GC-1);   r=rnd(0,GR-1-V); pts=[[c,r],[c,r+V]]; }
      return { pts:pts, closed:false };
    }
    /* ламана: 4 точки, відкрита */
    var guard=0;
    while(guard++<400){
      c = rnd(0,1); r = rnd(0,GR-1);
      pts=[[c,r]]; var ok=true, pc=c, pr=r;
      for(var i=0;i<3;i++){
        pc += rnd(1,2);
        pr += (Math.random()<0.5?-1:1) * rnd(1,2);
        if(pc>GC-1 || pr<0 || pr>GR-1){ ok=false; break; }
        pts.push([pc,pr]);
      }
      if(ok && !hasDup(pts)) return { pts:pts, closed:false };
    }
    return { pts:[[0,0],[2,1],[3,3],[4,1]], closed:false };
  }
  function hasDup(pts){
    for(var i=0;i<pts.length;i++) for(var j=i+1;j<pts.length;j++)
      if(pts[i][0]===pts[j][0] && pts[i][1]===pts[j][1]) return true;
    return false;
  }
  /* точка лежить на відрізку? (щоб зайві точки не сідали на лінію) */
  function onSeg(p,a,b){
    var cross=(b[0]-a[0])*(p[1]-a[1]) - (b[1]-a[1])*(p[0]-a[0]);
    if(cross!==0) return false;
    return Math.min(a[0],b[0])<=p[0] && p[0]<=Math.max(a[0],b[0]) &&
           Math.min(a[1],b[1])<=p[1] && p[1]<=Math.max(a[1],b[1]);
  }
  function onShape(p, t){
    for(var i=0;i<t.pts.length;i++){
      var a=t.pts[i], b=t.pts[(i+1)%t.pts.length];
      if(!t.closed && i===t.pts.length-1) break;
      if(onSeg(p,a,b)) return true;
    }
    return false;
  }

  function roundBuild(){
    var key = pick(BUILDABLE);
    var t = buildTarget(key);

    /* зайві точки */
    var extras=[], guard=0;
    while(extras.length<2 && guard++<500){
      var p=[rnd(0,GC-1), rnd(0,GR-1)];
      if(onShape(p,t)) continue;
      if(extras.some(function(e){ return e[0]===p[0] && e[1]===p[1]; })) continue;
      extras.push(p);
    }
    var all = t.pts.map(function(p,i){ return {p:p, idx:i}; })
      .concat(extras.map(function(p){ return {p:p, idx:-1}; }));
    shuffle(all);

    current = { mode:3, key:key, target:t, chain:[], nodes:[] };

    stageEl.className = "";
    stageEl.innerHTML = "";
    var board = document.createElement("div");
    board.className = "board";
    var svg = el("svg",{viewBox:"0 0 320 260"});
    var lines = el("g",{}); svg.appendChild(lines);
    current.lines = lines;

    all.forEach(function(n){
      var c = el("circle",{ cx:gx(n.p[0]), cy:gy(n.p[1]), r:11, class:"node" });
      c.dataset.idx = n.idx;
      c.addEventListener("click", function(){ tapNode(c, n.idx); });
      svg.appendChild(c);
      current.nodes.push(c);
    });
    board.appendChild(svg);
    stageEl.appendChild(board);
    markStarts();

    hintEl.className="";
    hintEl.innerHTML = "Побудуй <b>"+SHAPES[key].name.toLowerCase()+"</b> — "+SHAPES[key].how;
    ansEl.innerHTML = "";
    locked = false;
  }

  function markStarts(){
    var t=current.target, n=t.pts.length, chain=current.chain;
    current.nodes.forEach(function(c){ c.classList.remove("start"); });
    if(chain.length) return;
    current.nodes.forEach(function(c){
      var i = +c.dataset.idx;
      if(i<0) return;
      if(t.closed || i===0 || i===n-1) c.classList.add("start");
    });
  }

  function allowedNext(i){
    var t=current.target, n=t.pts.length, chain=current.chain;
    if(i<0) return false;
    if(chain.indexOf(i)>=0) return false;
    if(!chain.length) return t.closed ? true : (i===0 || i===n-1);
    var last = chain[chain.length-1];
    if(t.closed) return i===(last+1)%n || i===(last-1+n)%n;
    return i===last+1 || i===last-1;
  }

  function segLine(a,b,cls){
    var p = el("path",{ d:"M "+gx(a[0])+" "+gy(a[1])+" L "+gx(b[0])+" "+gy(b[1]),
                        class:"ink"+(cls?" "+cls:"") });
    current.lines.appendChild(p);
    var len = Math.hypot(gx(b[0])-gx(a[0]), gy(b[1])-gy(a[1]));
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    requestAnimationFrame(function(){
      p.style.transition="stroke-dashoffset .25s linear";
      p.style.strokeDashoffset = 0;
    });
    return p;
  }

  function tapNode(c, i){
    if(locked) return;
    if(!allowedNext(i)){
      miss();
      c.classList.add("bad");
      setTimeout(function(){ c.classList.remove("bad"); }, 380);
      hintEl.className="bad";
      hintEl.textContent = current.chain.length
        ? "Веди лінію далі — до сусідньої точки фігури."
        : "Почни з іншої точки.";
      return;
    }
    var t=current.target, chain=current.chain;
    if(chain.length) segLine(t.pts[chain[chain.length-1]], t.pts[i]);
    chain.push(i);
    c.classList.remove("start");
    c.classList.add("used");
    tick();
    markStarts();

    if(chain.length === t.pts.length){
      locked = true;
      if(t.closed){
        segLine(t.pts[chain[chain.length-1]], t.pts[chain[0]]);
        setTimeout(function(){
          var f = el("path",{ d:poly(t.pts.map(function(p){ return [gx(p[0]),gy(p[1])]; }), true),
                              class:"ink solid" });
          f.style.fill="transparent";
          current.lines.appendChild(f);
          requestAnimationFrame(function(){ f.style.transition="fill .5s"; f.style.fill=""; });
        }, 280);
      }
      hintEl.className="good";
      hintEl.textContent = SHAPES[current.key].why;
      gain();
      setTimeout(nextRound, 1500);
    } else {
      hintEl.className="";
      hintEl.innerHTML = "Далі — наступна точка. Будуєш <b>"+SHAPES[current.key].name.toLowerCase()+"</b>.";
    }
  }

  /* ═════════ хід гри ═════════ */
  function gain(){ buzz(20); chime(); }
  function miss(){
    mistakes++;
    buzz([30,40,30]); thud();
  }
  function tick(){ buzz(12); tone(760,0.05); }

  var MODES = [1,2,3];
  var lastMode = 0;
  function nextRound(){
    qIndex++;
    fillEl.style.width = Math.round(qIndex/TOTAL*100)+"%";
    if(window.skReportProgress) skReportProgress(qIndex, TOTAL);   // найдалі за гру — для картки в «Навчанні»
    if(qIndex >= TOTAL){ finish(); return; }
    renderRound();
  }

  function renderRound(){
    locked = true;
    qNumEl.textContent = (qIndex+1)+"/"+TOTAL;
    fillEl.style.width = Math.round(qIndex/TOTAL*100)+"%";
    var m;
    if(qIndex===0) m=1;
    else { var guard=0; do { m=pick(MODES); } while(m===lastMode && guard++<10); }
    lastMode = m;
    if(m===1) roundIdentify();
    else if(m===2) roundFind();
    else roundBuild();
  }

  /* ═════════ звук ═════════ */
  var actx=null;
  function tone(f,d,type){ try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"triangle"; o.frequency.value=f; g.gain.value=0.06;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d); o.stop(actx.currentTime+d+0.02);
  }catch(e){} }
  function chime(){ tone(660,0.09); setTimeout(function(){ tone(880,0.11); },90); }
  function thud(){ tone(180,0.16,"sine"); }
  function fanfare(){ tone(523,0.12); setTimeout(function(){ tone(659,0.12); },120);
    setTimeout(function(){ tone(784,0.14); },240); setTimeout(function(){ tone(1046,0.18); },380); }
  function buzz(v){ try{ if(navigator.vibrate) navigator.vibrate(v); }catch(e){} }

  /* ═════════ фініш ═════════ */
  function finish(){
    locked = true;
    fanfare();
    var stars = mistakes===0 ? "⭐⭐⭐" : (mistakes<=3 ? "⭐⭐" : "⭐");
    document.getElementById("winStars").textContent = stars;
    document.getElementById("winTitle").textContent = mistakes===0 ? "Бездоганне креслення!" : "Креслення готове!";
    document.getElementById("winSub").textContent = mistakes===0
      ? "Жодної помилки — ти справжній королівський кресляр!"
      : "Пройдено "+TOTAL+" з "+TOTAL+" · Помилок: "+mistakes+".";
    document.getElementById("winScreen").classList.remove("hidden");
    // перше повне проходження → нагорода з адмінки (поп-ап + предмет в інвентар), один раз
    if(window.SKPRIZE && !SKPRIZE.summary(PRIZE_KEY))
      SKPRIZE.claim({ key: PRIZE_KEY, href: TR_HREF, title: "Креслення готове!", onClose: refreshStart });
  }

  function startGame(){
    qIndex=0; mistakes=0; lastMode=0;
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("winScreen").classList.add("hidden");
    renderRound();
  }

  document.getElementById("playBtn").addEventListener("click", startGame);
  document.getElementById("againBtn").addEventListener("click", startGame);
  document.getElementById("menuBtn").addEventListener("click", openMenu);
  document.getElementById("toMenuBtn").addEventListener("click", openMenu);

  refreshStart();
  window.addEventListener("load", refreshStart);   // sk-prize.js підключено нижче
})();
</script>
