<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Читаю вголос — тренажер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
:root{
  --ink:#2c2b3a;--soft:#6b6a7d;--paper:#fff9ef;--line:#ece3d2;--card:#fff;
  --green:#51cf66;--green-d:#2f9e4a;--blue:#4dabf7;--blue-d:#2f8fd6;--red:#ff6b6b;
  --yellow:#ffd43b;--orange:#f08c00;--good-bg:#e4f7ec;--bad:#e06666;--bad-bg:#fbe7e7;
  --shadow:0 6px 0 rgba(44,43,58,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%,rgba(255,212,59,.28),transparent 42%),
    radial-gradient(circle at 88% 14%,rgba(77,171,247,.26),transparent 44%),
    radial-gradient(circle at 8% 86%,rgba(81,207,102,.24),transparent 44%),
    var(--paper);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:14px;padding-bottom:calc(82px + env(safe-area-inset-bottom));
}
.wrap{width:100%;max-width:560px;flex:1;display:flex;flex-direction:column;gap:12px}
h1,h2,.disp{font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:.3px;margin:0}
h1{font-size:1.5rem;text-align:center}
.sub{text-align:center;color:var(--soft);margin:-6px 0 0;font-size:.95rem}

/* ── текст ── */
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px 16px}
.poem-title{font-family:'Fredoka',sans-serif;font-size:1.3rem;text-align:center;margin:0 0 12px;color:var(--blue-d)}
.stanza{margin:0 0 14px}
.stanza:last-child{margin-bottom:0}
.ln{font-size:1.55rem;line-height:1.55;font-weight:800;text-align:center}
.w{display:inline-block;padding:0 3px;margin:0 1px;border-radius:8px;cursor:pointer;
  transition:color .25s,background-color .25s;color:var(--ink)}
.w.cur{background:#fff3bf;box-shadow:inset 0 -3px 0 var(--yellow)}
.w.read{color:var(--green-d);background:var(--good-bg)}
.w.skip{color:var(--orange);background:#fff4e0}
.w.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── панель керування ── */
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.1rem;border:0;border-radius:16px;
  padding:12px 20px;cursor:pointer;color:#fff;background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}
.btn.mic{background:var(--green);box-shadow:0 5px 0 var(--green-d);min-width:210px}
.btn.mic.on{background:var(--red);box-shadow:0 5px 0 #c94b4b}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.status{min-height:1.4em;text-align:center;color:var(--soft);font-weight:700}
.status.err{color:var(--bad)}
.heard{min-height:1.3em;text-align:center;color:var(--soft);font-size:.9rem;font-style:italic}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:6px;
  vertical-align:middle;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

.top{position:sticky;top:0;z-index:5;display:flex;flex-direction:column;gap:8px;
  padding:8px 0;background:var(--paper)}
.meter{display:flex;gap:10px;justify-content:center}
.meter>div{flex:1;max-width:200px;background:var(--card);border:2px solid var(--line);border-radius:16px;
  padding:6px 10px;text-align:center;box-shadow:0 4px 0 rgba(44,43,58,.08)}
.meter b{display:block;font-family:'Fredoka',sans-serif;font-size:1.7rem;line-height:1.1}
.meter span{font-size:.78rem;color:var(--soft);font-weight:700}
.meter .low b{color:var(--bad)}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}

/* ── підсумок ── */
.result{display:none;text-align:center}
.result.on{display:block}
.result .big{font-size:2.6rem}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;min-width:96px}
.stat b{display:block;font-family:'Fredoka',sans-serif;font-size:1.4rem}
.stat span{font-size:.8rem;color:var(--soft)}
.hint{font-size:.85rem;color:var(--soft);text-align:center}

/* ── режими ── */
.tabs{display:flex;gap:8px;justify-content:center}
.tab{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1rem;border:2px solid var(--line);background:#fff;
  color:var(--ink);border-radius:14px;padding:8px 16px;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.levels{display:none;gap:6px;justify-content:center;flex-wrap:wrap}
.lvl{font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;border:2px solid var(--line);background:#fff;
  color:var(--soft);border-radius:999px;padding:5px 12px;cursor:pointer}
.lvl.on{border-color:var(--green);color:var(--green-d);background:var(--good-bg)}

/* ── «Вивчити вірш»: усі картинки з рядками на одному екрані ── */
.learn-grid{display:none;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));
  gap:6px;flex:1 1 0;min-height:0}
.tile{display:flex;flex-direction:column;min-height:0;background:#fff;border:2px solid var(--line);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:border-color .25s,box-shadow .25s}
.tile img{flex:1;min-height:0;width:100%;object-fit:cover;display:block}
.tile .cap{font-size:.74rem;line-height:1.15;font-weight:800;padding:3px 2px 4px;text-align:center}
.tile .w{padding:0 1px;margin:0;border-radius:4px}
.tile.nopic .cap{flex:1;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;font-size:.95rem;padding:6px}
.tile.nopic::after{content:none}

/* вибір тексту */
.pick{display:flex;justify-content:center}
.pick select{font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;color:var(--ink);max-width:100%;
  border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:#fff}
.tile.now{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow)}
.tile.done{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.tile.say{animation:pop .5s ease}
.tile{position:relative}
.tile::after{content:'🔊';position:absolute;top:3px;right:4px;font-size:.7rem;opacity:.75}

/* Усе вміщається на один екран над футером, без гортання сторінки:
   середній блок (строфа або сітка карток) забирає решту висоти. */
body{min-height:0;padding-top:10px}
.wrap{flex:none;gap:7px;height:calc(100dvh - 10px - 82px - env(safe-area-inset-bottom))}
.sub,.heard,.hint{display:none}
h1{font-size:1.15rem}
@media (max-height:700px){ h1{display:none} }
.tab{padding:6px 12px;font-size:.92rem}
.top{position:static;padding:0}
.bar{height:8px}
.ctrl{flex-wrap:nowrap}
.btn{padding:9px 14px;font-size:1rem}
.btn.mic,.btn.listen{min-width:0;flex:1}
.status{min-height:0;font-size:.85rem}
.status:empty{display:none}
/* підсумок — поверх, щоб не гортати */
.result.on{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:30;
  max-width:520px;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}

/* «Читати»: компактний таймер і лічильник в один рядок */
.meter>div{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:4px 8px;box-shadow:none}
.meter b{display:inline;font-size:1.25rem}
/* «Читати»: строфа (4 рядки) великими літерами, сторінки гортаються */
#textCard{flex:1 1 0;min-height:0;display:flex;flex-direction:column;padding:10px 12px}
.poem-title{font-size:1.05rem;margin:0 0 4px}
#poem{flex:1 1 0;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
#poem .stanza{display:none;margin:0}
#poem .stanza.on{display:block}
#poem .ln{font-size:1em;line-height:1.25;margin:0 0 .35em}
#poem .ln:last-child{margin-bottom:0}
#poem .w{padding:0 2px;margin:0}
.pager button:not(:disabled):active{transform:translateY(2px)}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:4px}
.pager button{width:46px;height:40px;border:2px solid var(--line);background:#fff;border-radius:12px;
  font-size:1.1rem;cursor:pointer;color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{font-weight:800;color:var(--soft);min-width:48px;text-align:center}

/* «Вчити» / «Розказати» — сітка карток замість строфи */
body.learn #textCard,body.learn .meter,body.learn .read-only{display:none}
body.learn .learn-grid{display:grid}
body.m-learn .levels{display:flex}
body.learn .levels{flex-wrap:nowrap}
body:not(.learn) .learn-only{display:none}
/* «Вчити» — слухаємо вірш (без мікрофона); «Розказати» — мікрофон, лише картинки */
body.m-learn #micBtn,body:not(.m-learn) #listenBtn{display:none}
.btn.listen{background:#7c5cd0;box-shadow:0 5px 0 #5b3fa8}
.btn.listen.on{background:var(--red);box-shadow:0 5px 0 #c94b4b}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎤 Читаю вголос</h1>
  <div class="pick"><select id="textSel" aria-label="Обрати текст"></select></div>
  <p class="sub">Читай уголос 1 хвилину — прочитані слова загоряться зеленим</p>
  <div class="tabs">
    <button class="tab on" type="button" data-mode="read">📖 Читати</button>
    <button class="tab" type="button" data-mode="learn">🧠 Вчити</button>
    <button class="tab" type="button" data-mode="tell">🎤 Розказати</button>
  </div>
  <div class="levels">
    <button class="lvl on" type="button" data-level="all" title="Весь текст">📝 Текст</button>
    <button class="lvl" type="button" data-level="first" title="Перші літери слів">🔤 Літери</button>
    <button class="lvl" type="button" data-level="none" title="Лише картинки">🖼 Картинки</button>
  </div>

  <div class="top">
    <div class="meter">
      <div id="timerBox"><span>⏱</span><b id="timer">1:00</b></div>
      <div><b id="count">0</b><span id="countLbl">📖 прочитано слів</span></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </div>

  <div class="learn-grid" id="grid"></div>

  <div class="card" id="textCard">
    <h2 class="poem-title" id="poemTitle"></h2>
    <div id="poem"></div>
    <div class="pager">
      <button type="button" id="pgPrev" aria-label="Попередня строфа">◀</button>
      <span id="pgNo">1 / 1</span>
      <button type="button" id="pgNext" aria-label="Наступна строфа">▶</button>
    </div>
  </div>


  <div class="ctrl">
    <button class="btn mic" id="micBtn" type="button">🎤 Почати читати</button>
    <button class="btn listen" id="listenBtn" type="button">🔊 Слухати вірш</button>
    <button class="btn ghost" id="resetBtn" type="button">↺ Спочатку</button>
  </div>
  <div class="status" id="status"></div>
  <div class="heard" id="heard"></div>
  <p class="hint read-only">Застряг? Натисни на слово, з якого читаєш далі.</p>
  <p class="hint learn-only">Забув? Натисни на картинку — почуєш рядок.</p>

  <div class="card result" id="result">
    <div class="big">🌟</div>
    <h2 id="resTitle">Молодець! Вірш прочитано!</h2>
    <div class="stats">
      <div class="stat"><b id="stRead">0</b><span>прочитано слів</span></div>
      <div class="stat"><b id="stTime">0</b><span>секунд</span></div>
      <div class="stat read-only"><b id="stWpm">0</b><span>слів за хвилину</span></div>
      <div class="stat"><b id="stSkip">0</b><span>пропущено</span></div>
    </div>
  </div>
</div>

<script src="../sk-readtext.js?v=1"></script>
<script>
(function(){
  'use strict';

  /* Текст: строфи → рядки. Вбудований вірш і тексти з бази (адмінка
     admin-chytannia.html) розбирає SKREAD (../sk-readtext.js). */
  function prepare(entry){
    var t = SKREAD.parse(entry);
    t.pics = t.pics.map(function(p){ return SKREAD.picUrl(p, '../'); });
    return t;
  }
  var ALL = SKREAD.BUILTIN.slice();   // вбудовані + з бази (коли підвантажаться)
  var TEXT = prepare(ALL[0]);

  var LOOKAHEAD = 3;     // на скільки слів уперед шукаємо збіг (пропущені слова)
  var LIMIT = 60000;     // перевірка техніки читання — 1 хвилина
  var mode = 'read';     // read — читання з таймером; learn — вчити вірш; tell — розказати напамʼять
  function grid(){ return mode !== 'read'; }   // learn і tell — сітка карток із картинками
  function lvl(){ return mode === 'tell' ? 'none' : level; }   // «Розказати» — лише картинки
  var level = 'all';     // learn: all — весь текст, first — перші літери, none — лише картинки
  var playing = false;   // learn: «Слухати вірш» — озвучуємо рядки по черзі
  var pages = [], pageCount = 0, page = 0;   // read: строфи — сторінки по 4 рядки
  var autoPos = -1, flipTimer = 0;
  var tiles = [];        // learn: [{el, from, to}] — картка рядка й діапазон його слів

  var $ = function(id){ return document.getElementById(id); };
  var words = [];        // [{el, norm}]
  var pos = 0;           // індекс слова, яке дитина має прочитати наступним
  var sessionStart = 0;  // pos на початку поточної сесії розпізнавання
  var listening = false, rec = null, skipped = 0, readCount = 0, done = false;
  /* Таймер: час рахуємо лише поки слухаємо; «Зупинити» ставить на паузу. */
  var elapsed = 0, runFrom = 0, tickId = 0;

  /* ── нормалізація й нечітке порівняння ── */
  function norm(s){
    return String(s).toLowerCase()
      .replace(/[’ʼ'`]/g, '')
      .replace(/ё/g, 'е')
      .replace(/[^a-zа-яіїєґ]/g, '');
  }
  function lev(a, b){
    if(a === b) return 0;
    var m = a.length, n = b.length, prev = [], cur, i, j;
    for(j = 0; j <= n; j++) prev[j] = j;
    for(i = 1; i <= m; i++){
      cur = [i];
      for(j = 1; j <= n; j++){
        cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }
  var SAME = {'й':'і', 'у':'в'};   // розпізнавач плутає й/і, у/в
  /* Звуки, які розпізнавач (особливо на дитячому голосі) часто плутає:
     и/і, е/є, ї/і, ґ/г, мʼякий знак — для порівняння вважаємо однаковими. */
  function sound(w){
    return w.replace(/[иї]/g, 'і').replace(/є/g, 'е').replace(/ґ/g, 'г').replace(/ь/g, '');
  }
  function match(heard, expected){
    if(!heard || !expected) return false;
    if(heard === expected) return true;
    if((SAME[heard] || heard) === (SAME[expected] || expected)) return true;
    var h = sound(heard), x = sound(expected);
    if(h === x) return true;
    var len = x.length;
    if(len <= 2) return false;
    // коротке слово: одна помилка, але перша літера має збігтися (ній/ні, літ/літ)
    if(len === 3) return h[0] === x[0] && lev(h, x) <= 1;
    // однаковий початок довгого слова: інше закінчення (минулих/минувших)
    if(len >= 5 && h.length >= 4 && h.slice(0, 4) === x.slice(0, 4)) return true;
    return lev(h, x) <= (len <= 6 ? 1 : 2);
  }

  /* ── побудова тексту ── */
  function fillLine(ln, line){
    line.split(/\s+/).forEach(function(tok, k){
      var n = norm(tok);
      if(k) ln.appendChild(document.createTextNode(' '));
      if(!n){ ln.appendChild(document.createTextNode(tok)); return; }  // «—» тощо
      var sp = document.createElement('span');
      sp.className = 'w';
      sp.textContent = tok;
      sp.dataset.i = words.length;
      words.push({el: sp, norm: n, full: tok, pg: pageCount});
      ln.appendChild(sp);
    });
  }
  /* Слова будуємо лише в одному місці — там, де зараз режим: у тексті
     вірша або в картках «Вивчити вірш». Рушій розпізнавання той самий. */
  function render(){
    $('poemTitle').textContent = TEXT.title + (TEXT.author ? ' · ' + TEXT.author : '');
    var box = $('poem'), gridEl = $('grid');
    box.innerHTML = ''; gridEl.innerHTML = '';
    words = []; tiles = []; pages = [];
    var lineNo = 0;
    pageCount = 0;
    TEXT.stanzas.forEach(function(lines){
      var st = document.createElement('div');
      st.className = 'stanza';
      pages.push(st);
      lines.forEach(function(line){
        if(grid()){
          var tile = document.createElement('div');
          tile.className = 'tile';
          tile.dataset.line = lineNo;
          var cap = document.createElement('div');
          cap.className = 'cap';
          var from = words.length;
          fillLine(cap, line);
          if(TEXT.pics[lineNo]){
            var img = document.createElement('img');
            img.src = TEXT.pics[lineNo];
            img.alt = line;
            img.onerror = function(){ this.style.visibility = 'hidden'; };
            tile.appendChild(img);
          } else tile.classList.add('nopic');   // без картинки — сам рядок, крупніше
          tile.appendChild(cap);
          gridEl.appendChild(tile);
          tiles.push({el: tile, from: from, to: words.length, text: line});
        } else {
          var ln = document.createElement('div');
          ln.className = 'ln';
          fillLine(ln, line);
          st.appendChild(ln);
        }
        lineNo++;
      });
      if(!grid()) box.appendChild(st);
      pageCount++;
    });
    /* Сітка: до 15 рядків — усі на одному екрані; довший текст — гортається. */
    if(grid()){
      var rows = Math.ceil(tiles.length / 3);
      gridEl.style.gridTemplateRows = tiles.length <= 15 ? 'repeat(' + rows + ',minmax(0,1fr))' : 'none';
      gridEl.style.gridAutoRows = tiles.length <= 15 ? '' : 'minmax(120px,auto)';
      gridEl.style.overflowY = tiles.length <= 15 ? '' : 'auto';
    }
    applyLevel();
    autoPos = -1;
    if(!grid()) showPage(0);
  }
  /* Рівень підказки у «Вивчити вірш»: ще не сказані слова показуємо повністю,
     першою літерою або ховаємо; сказане — завжди повністю й зеленим. */
  function applyLevel(){
    words.forEach(function(w){
      var shown = w.el.classList.contains('read') || w.el.classList.contains('skip');
      w.el.textContent = (!grid() || lvl() === 'all' || shown) ? w.full
        : lvl() === 'first' ? w.full.charAt(0) + '…' : '…';
    });
  }

  function paint(){
    words.forEach(function(w, i){ w.el.classList.toggle('cur', !grid() && i === pos && pos < words.length); });
    if(!playing) tiles.forEach(function(t){ t.el.classList.toggle('now', listening && pos >= t.from && pos < t.to); });
    $('barFill').style.width = (words.length ? pos / words.length * 100 : 0) + '%';
    /* Дочитав строфу — сторінка сама перегортається на наступну
       (з короткою паузою, щоб дитина побачила останнє зелене слово). */
    if(!grid() && pos !== autoPos){
      var first = autoPos < 0;
      autoPos = pos;
      clearTimeout(flipTimer);
      if(words[pos] && words[pos].pg !== page){
        var to = words[pos].pg;
        if(first) showPage(to); else flipTimer = setTimeout(function(){ showPage(to); }, 700);
      }
    }
  }

  function showPage(n){
    page = Math.max(0, Math.min(pages.length - 1, n));
    pages.forEach(function(st, k){ st.classList.toggle('on', k === page); });
    $('pgNo').textContent = (page + 1) + ' / ' + pages.length;
    $('pgPrev').disabled = page === 0;
    $('pgNext').disabled = page === pages.length - 1;
    fitText();
  }
  /* Найбільший шрифт, з яким строфа вміщається на сторінку без гортання.
     Довгий рядок може перенестися (слово ціле), тому між рядками вірша —
     відступ, щоб перенесене не сплутати з наступним рядком. */
  function fitText(){
    var box = $('poem'), st = pages[page];
    if(grid() || !st || !box.clientHeight) return;
    var size = 56;
    st.style.fontSize = size + 'px';
    while(size > 16){
      var wide = false;
      st.querySelectorAll('.w').forEach(function(w){ if(w.offsetWidth > box.clientWidth) wide = true; });
      if(!wide && st.scrollHeight <= box.clientHeight) break;
      size -= 2;
      st.style.fontSize = size + 'px';
    }
  }
  window.addEventListener('resize', fitText);
  // вебшрифт підвантажується пізніше й міняє ширину літер — підбираємо ще раз
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);

  function markRead(i, cls){
    var el = words[i].el;
    if(el.classList.contains('read') || el.classList.contains('skip')) return;
    el.classList.add(cls, 'pop');
    if(cls === 'skip') skipped++; else readCount++;
    $('count').textContent = readCount;
    if(grid()){
      el.textContent = words[i].full;
      tiles.forEach(function(t){
        if(i === t.to - 1) t.el.classList.add('done');
      });
    }
  }

  function usedMs(){ return elapsed + (runFrom ? Date.now() - runFrom : 0); }
  function showTimer(){
    var left = Math.max(0, LIMIT - usedMs()), sec = Math.ceil(left / 1000);
    $('timer').textContent = Math.floor(sec / 60) + ':' + ('0' + sec % 60).slice(-2);
    $('timerBox').classList.toggle('low', sec <= 10);
    return left;
  }
  function tick(){ if(mode === 'read' && showTimer() <= 0) finish(true); }
  function pauseTimer(){
    if(runFrom){ elapsed += Date.now() - runFrom; runFrom = 0; }
    clearInterval(tickId); tickId = 0;
  }

  /* Пройти почутими словами від sessionStart. Позиція лише росте —
     проміжні (interim) результати можуть мінятися, але зелене не гасне. */
  function advance(heardWords){
    if(done) return;   // хвилина минула — запізнілі результати вже не рахуємо
    var p = sessionStart;
    for(var h = 0; h < heardWords.length && p < words.length; h++){
      var hw = heardWords[h];
      for(var k = 0; k <= LOOKAHEAD && p + k < words.length; k++){
        if(match(hw, words[p + k].norm)){
          if(p + k + 1 > pos){
            for(var s = Math.max(p, pos); s < p + k; s++){
              /* Слово між двома почутими розпізнавач часто просто не віддає
                 (дитячий голос, швидке читання). Пропуск одного-двох слів
                 зараховуємо; помаранчевим — лише коли пропущено три поспіль. */
              markRead(s, k >= LOOKAHEAD && words[s].norm.length > 1 ? 'skip' : 'read');
            }
            markRead(p + k, 'read');
          }
          p = p + k + 1;
          break;
        }
      }
    }
    if(p > pos){
      pos = p;
      paint();
      if(pos >= words.length) finish(false);
    }
  }

  /* ── розпізнавання мовлення ── */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function setStatus(txt, err){
    var s = $('status');
    s.innerHTML = txt;
    s.classList.toggle('err', !!err);
  }

  function makeRec(){
    var r = new SR();
    r.lang = 'uk-UA';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onresult = function(e){
      if(done) return;   // хвилина минула — запізнілі результати вже не рахуємо
      /* Chrome на Android у безперервному режимі повторює в кожному
         наступному результаті весь попередній текст — склеювати підряд
         не можна, інакше почуте подвоюється й слова «перестрибують». */
      var text = '';
      for(var i = 0; i < e.results.length; i++){
        var t = String(e.results[i][0].transcript || '').trim();
        if(!t) continue;
        var tn = t.toLowerCase(), cur = text.trim().toLowerCase();
        // новий результат уже містить попередні (від двох слів — щоб не сплутати з повтором «мова»)
        if(cur.indexOf(' ') > 0 && tn.indexOf(cur) === 0) text = t;
        else text += ' ' + t;
      }
      $('heard').textContent = text.trim().split(/\s+/).slice(-6).join(' ');
      advance(text.split(/\s+/).map(norm).filter(Boolean));
    };
    r.onerror = function(e){
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        stop();
        setStatus('Немає доступу до мікрофона. Дозволь мікрофон у налаштуваннях браузера.', true);
      } else if(e.error === 'network'){
        stop();
        setStatus('Потрібен інтернет для розпізнавання голосу.', true);
      } else if(e.error === 'audio-capture'){
        stop();
        setStatus('Мікрофон не знайдено.', true);
      }
      // no-speech / aborted — onend перезапустить
    };
    r.onend = function(){
      // браузер закінчує сесію після паузи — тихо починаємо нову з поточного слова
      if(!listening) return;
      sessionStart = pos;
      try{ r.start(); }catch(err){ setTimeout(function(){ if(listening) try{ r.start(); }catch(e2){} }, 300); }
    };
    return r;
  }

  function start(){
    if(!SR) return;
    if(done) reset();
    listening = true;
    sessionStart = pos;
    runFrom = Date.now();
    if(!tickId) tickId = setInterval(tick, 250);
    rec = rec || makeRec();
    try{ rec.start(); }catch(e){}
    $('micBtn').classList.add('on');
    $('micBtn').textContent = '⏹ Зупинити';
    setStatus('<span class="dot"></span>' + (mode === 'tell' ? 'Слухаю… розказуй вірш' : 'Слухаю… читай уголос'));
    paint();
  }

  function stop(){
    pauseTimer();
    listening = false;
    if(rec) try{ rec.abort(); }catch(e){}
    $('micBtn').classList.remove('on');
    $('micBtn').textContent = mode === 'tell' ? '🎤 Розказувати далі' : '🎤 Читати далі';
    setStatus('');
    paint();
  }

  /* timeUp — минула хвилина; інакше дитина дочитала текст раніше */
  function finish(timeUp){
    if(done) return;
    stop();
    done = true;
    var sec = Math.max(1, Math.round((mode === 'read' ? Math.min(usedMs(), LIMIT) : usedMs()) / 1000));
    showTimer();
    $('micBtn').textContent = '🎤 Ще раз';
    $('heard').textContent = '';
    $('resTitle').textContent = timeUp ? '⏱ Хвилина минула!'
      : mode === 'tell' ? 'Молодець! Розказано напамʼять!'
      : TEXT.kind === 'text' ? 'Молодець! Текст прочитано!' : 'Молодець! Вірш прочитано!';
    $('stRead').textContent = readCount;
    $('stTime').textContent = sec;
    $('stWpm').textContent = Math.round(readCount / sec * 60);
    $('stSkip').textContent = skipped;
    $('result').classList.add('on');
  }

  function reset(){
    if(listening) stop();
    pauseTimer();
    pos = 0; sessionStart = 0; skipped = 0; readCount = 0; done = false; elapsed = 0;
    $('count').textContent = 0;
    showTimer();
    words.forEach(function(w){ w.el.className = 'w'; });
    tiles.forEach(function(t){ t.el.classList.remove('done', 'now'); });
    applyLevel();
    $('result').classList.remove('on');
    $('heard').textContent = '';
    $('micBtn').textContent = mode === 'tell' ? '🎤 Розказати вірш' : '🎤 Почати читати';
    setStatus('');
    autoPos = -1;
    paint();
  }

  /* натискання на слово: «я вже тут» — попередні слова зараховуємо */
  $('poem').addEventListener('click', function(e){
    var el = e.target.closest('.w');
    if(!el || done) return;
    var i = +el.dataset.i;
    if(i <= pos) return;
    for(var s = pos; s < i; s++) markRead(s, 'skip');
    pos = i;
    sessionStart = pos;
    if(listening && rec){ try{ rec.abort(); }catch(err){} }  // нова сесія з цього місця (onend перезапустить)
    paint();
  });

  /* «Вивчити вірш»: натиснув на картку — почув рядок (підказка, якщо забув). */
  $('grid').addEventListener('click', function(e){
    var el = e.target.closest('.tile');
    if(!el) return;
    var t = tiles[+el.dataset.line];
    var ss = window.speechSynthesis;
    if(!t || !ss || !window.SpeechSynthesisUtterance) return;
    if(listening) stop();   // інакше мікрофон почує озвучку й зарахує слова
    stopPlay();
    var u = new SpeechSynthesisUtterance(t.text);
    u.lang = 'uk-UA'; u.rate = 0.85;
    ss.cancel(); ss.speak(u);
    el.classList.remove('say'); void el.offsetWidth; el.classList.add('say');
  });

  /* «Вчити»: «Слухати вірш» — рядки по черзі, картка рядка підсвічується. */
  function stopPlay(){
    if(!playing) return;
    playing = false;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    tiles.forEach(function(t){ t.el.classList.remove('now'); });
    $('listenBtn').classList.remove('on');
    $('listenBtn').textContent = '🔊 Слухати вірш';
  }
  function playLine(i){
    if(!playing) return;
    if(i >= tiles.length){ stopPlay(); return; }
    tiles.forEach(function(t, k){ t.el.classList.toggle('now', k === i); });
    var u = new SpeechSynthesisUtterance(tiles[i].text);
    u.lang = 'uk-UA'; u.rate = 0.85;
    var next = function(){ setTimeout(function(){ playLine(i + 1); }, 350); };
    u.onend = next;
    u.onerror = function(){ if(playing) next(); };
    window.speechSynthesis.speak(u);
  }
  $('listenBtn').addEventListener('click', function(){
    if(playing){ stopPlay(); return; }
    if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
    playing = true;
    this.classList.add('on');
    this.textContent = '⏹ Зупинити';
    window.speechSynthesis.cancel();
    playLine(0);
  });

  function setMode(m){
    if(m === mode) return;
    if(listening) stop();
    stopPlay();
    mode = m;
    document.body.classList.toggle('learn', grid());
    document.body.classList.toggle('m-learn', mode === 'learn');
    document.body.classList.toggle('m-tell', mode === 'tell');
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.mode === mode); });
    $('countLbl').textContent = mode === 'tell' ? '🎤 розказано слів' : '📖 прочитано слів';
    render();
    reset();
  }
  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click', function(){ setMode(b.dataset.mode); });
  });
  document.querySelectorAll('.lvl').forEach(function(b){
    b.addEventListener('click', function(){
      level = b.dataset.level;
      document.querySelectorAll('.lvl').forEach(function(x){ x.classList.toggle('on', x === b); });
      applyLevel();
    });
  });

  // підсумок поверх сітки «Вивчити вірш» — закривається дотиком
  // підсумок поверх сторінки — закривається дотиком
  $('result').addEventListener('click', function(){ this.classList.remove('on'); });
  $('pgPrev').addEventListener('click', function(){ showPage(page - 1); });
  $('pgNext').addEventListener('click', function(){ showPage(page + 1); });
  $('micBtn').addEventListener('click', function(){ listening ? stop() : start(); });
  $('resetBtn').addEventListener('click', reset);

  /* ── вибір тексту ── */
  function fillSelect(){
    var sel = $('textSel');
    sel.innerHTML = '';
    ALL.forEach(function(e, k){
      var o = document.createElement('option');
      o.value = k;
      o.textContent = (e.kind === 'text' ? '📄 ' : '📜 ') + (e.title || 'Без назви')
        + (Number(e.grade) ? ' · ' + e.grade + ' клас' : '');
      sel.appendChild(o);
    });
    var cur = 0;
    ALL.forEach(function(e, k){ if(e.id === TEXT.id) cur = k; });
    sel.value = cur;
  }
  function loadText(entry){
    if(listening) stop();
    stopPlay();
    TEXT = prepare(entry);
    try{ localStorage.setItem('sk_read_text', TEXT.id); }catch(e){}
    render();
    reset();
    fillSelect();
  }
  $('textSel').addEventListener('change', function(){ loadText(ALL[+this.value]); });

  /* Тексти з бази: потрібна сесія (Герой або батьки). Немає бази чи входу —
     лишається вбудований вірш. ?t=<id> або останній обраний — одразу. */
  function wantedId(){
    var m = /[?&]t=([^&]+)/.exec(location.search);
    if(m) return decodeURIComponent(m[1]);
    try{ return localStorage.getItem('sk_read_text') || ''; }catch(e){ return ''; }
  }
  (function whenSK(){
    var tries = 0;
    (function tick(){
      if(window.SK && window.SK.ready && window.SK.listActiveReadTexts){
        window.SK.ready.then(function(){ return window.SK.listActiveReadTexts(); })
          .then(function(list){
            ALL = SKREAD.BUILTIN.concat((list || []).filter(function(e){ return e && e.text; }));
            var want = wantedId(), hit = null;
            ALL.forEach(function(e){ if(want && e.id === want) hit = e; });
            if(hit && hit.id !== TEXT.id && !listening && !pos) loadText(hit); else fillSelect();
          })
          .catch(function(){ /* немає входу чи бази — лишається вбудоване */ });
        return;
      }
      if(tries++ < 120) setTimeout(tick, 50);
    })();
  })();

  fillSelect();
  render();
  paint();
  if(!SR){
    $('micBtn').disabled = true;
    setStatus('Цей браузер не вміє розпізнавати голос. Відкрий сторінку в Chrome.', true);
  }
})();
</script>
<!-- тексти з бази (SK.listActiveReadTexts); вбудований вірш працює й без неї -->
<script type="module" src="../firebase-config.js"></script>
