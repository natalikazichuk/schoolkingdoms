<!DOCTYPE html>
<html lang="uk">
<head>

<title>Пошта-перевертень — School Kingdoms</title>

<style>
/* ── вулиця з поштою ── */
#scene{height:210px; background:linear-gradient(180deg,#bfe3ff 0%,#e7f5ff 58%,#d9c7a3 58%,#cbb68c 100%);}
body.flipped #scene{background:linear-gradient(180deg,#cdb8ff 0%,#efe6ff 58%,#d8cfe6 58%,#c3b7d6 100%);}
#post{position:absolute; left:6%; bottom:36%; font-size:58px; line-height:1;}
#house{position:absolute; right:8%; bottom:36%; font-size:58px; line-height:1;}
#plate{position:absolute; right:7%; bottom:73%; min-width:74px; padding:2px 10px; text-align:center; background:#2f5d8a; color:#fff;
  font-family:'Fredoka'; font-weight:700; font-size:34px; line-height:1.2; border-radius:10px; border:3px solid #fff; box-shadow:0 4px 0 rgba(0,0,0,.2);
  transition:transform 1.1s cubic-bezier(.6,-.2,.3,1.2);}
#plate.upside{transform:rotate(180deg);}
#plate:before{content:"№"; font-size:18px; margin-right:2px; vertical-align:middle;}
#addr{position:absolute; left:6%; top:8%; background:#fff; border:2px dashed #c99f5c; border-radius:10px; padding:2px 10px; font-weight:800; font-size:15px;}
#letter{position:absolute; left:20%; bottom:22%; font-size:34px; transition:left 1s ease-in-out, bottom 1s ease-in-out; z-index:2;}
#letter.fly{left:72%; bottom:40%;}

/* ═════ картинки художника (img/poshta/) ═════ */
#scene{height:220px; background:#bfe3ff url(img/poshta/scene-bg.webp) center/auto 100% no-repeat; border:3px solid #e3c27a; box-shadow:0 0 0 2px #c9a05a, 0 8px 16px rgba(60,30,10,.25);}
body.flipped #scene{background:#cdb8ff url(img/poshta/scene-bg.webp) center/auto 100% no-repeat;}
#scene:before{content:""; position:absolute; inset:0; background:rgba(150,90,230,.32); opacity:0; transition:opacity .6s; pointer-events:none; z-index:1;}   /* 🔄 — фіолетовий світ */
body.flipped #scene:before{opacity:1;}
#post, #house{font-size:0; background:center bottom/contain no-repeat; filter:drop-shadow(0 4px 4px rgba(0,0,0,.25)); z-index:1;}
#post{left:2%; bottom:14px; width:94px; height:136px; background-image:url(img/poshta/post.webp);}
#house{right:3%; bottom:16px; width:104px; height:132px; background-image:url(img/poshta/house.webp);}
/* номер будинку — на синій табличці над дверима (центр таблички: 50 % ширини, 44 % висоти будинку) */
#plate{right:calc(3% + 52px); translate:50% 0; bottom:73px; min-width:52px; padding:0 7px; font-size:21px; border:2px solid #f4c842; border-radius:8px;
  background:linear-gradient(180deg,#2f5fb0,#1f3f86); box-shadow:0 3px 0 rgba(0,0,0,.25); z-index:2;}
#plate:before{font-size:12px;}
#addr{z-index:3;}
/* лист несе голуб-листоноша: від дверей пошти до дверей будинку */
#letter{left:17%; bottom:12px; width:62px; height:80px; font-size:0; z-index:3; background:url(img/poshta/postman.webp) center/contain no-repeat; filter:drop-shadow(0 4px 3px rgba(0,0,0,.3));}
#letter:after{content:""; position:absolute; right:-14px; top:26px; width:34px; height:25px; background:url(img/poshta/letter.webp) center/contain no-repeat;}
#letter.fly{left:57%; bottom:20px;}
/* табличка з назвою на старті — художника, вища за стандартну */
#startScreen.scrolled .titlebox{aspect-ratio:816/299; width:min(100%,360px);}
#startScreen.scrolled .titlebox h1{left:12%; right:18%; top:40%; bottom:18%;}
</style>
<link rel="stylesheet" href="nav-scroll.css?v=5">
</head>
<body>
<script src="../sk-footer.js?v=6" data-base="../" data-back="self"></script>
<script src="nav-common.js?v=3"></script>
<script>
(function(){
  "use strict";
  var TOTAL = 5, log;
  /* цифри, які «читаються» догори дриґом: 1→1, 6→9, 8→8, 9→6 */
  var ROT = {"1":"1","6":"9","8":"8","9":"6"};
  function swap(n){ var s = String(n); return +(s[1]+s[0]); }
  function upside(n){ return +String(n).split("").reverse().map(function(d){ return ROT[d]; }).join(""); }

  NAV.mount({
    next: "lihtari.html",   // «Вирушай далі! ›» — наступний пункт карти
    title:"Пошта-перевертень", emoji:"✉️🏤", sub:"Числа · Світ навиворіт · 5 кроків",
    riddle:"На пошті Дивного міста листи приходять не туди!<span class='seq'>✉️ №12 → 🏠 №21</span>Подивись, куди листоноша носить листи, і знайди правило. А потім — 🔄 переворот, і пошта зміниться…",
    play:"На пошту ▶", steps:TOTAL, crown:"✉️✨",
    badgeOff:"🏤 пошта", badgeOn:"🔄 догори дриґом",
    prizeKey:"sk_poshta_prize_v1", href:"poshta.html", doneText:"Листи доставлено — нагороду отримано!",
    winTitle:"Усі листи доставлено!", winPerfect:"Усі листи — за адресою, без жодної помилки!",
    lesson:[
      "Звичайна пошта-перевертень <b>міняє цифри місцями</b>: №12 → №21, №56 → №65.",
      "🔄 Після перевороту табличку з номером читають <b>догори дриґом</b>: 6 стає 9, а цифри йдуть навпаки — №16 → №91.",
      "Перевір правило на кількох прикладах: <b>+9</b> підходить для 12 і 34, але не для всіх номерів!"
    ],
    scene:'<div id="addr">✉️ на конверті: <b id="addrN">№12</b></div><span id="post">🏤</span><span id="house">🏠</span><div id="plate">21</div><span id="letter">✉️</span>',
    afterScene:'<div class="log" id="log"></div>',
    onStart:startGame
  });

  function renderLog(){
    var box = NAV.$("log"); box.innerHTML = '<div class="lh">📒 Журнал пошти</div>';
    if(!log.length){ box.appendChild(NAV.el("div","empty","Поки нічого.")); return; }
    var rows = NAV.el("div","rows"); log.slice(-4).forEach(function(r){ rows.appendChild(NAV.el("div","r",r)); }); box.appendChild(rows);
  }
  /* показати доставку: конверт летить від пошти до будинку з табличкою */
  function deliver(to, plate, upsideDown, cb){
    NAV.$("addrN").textContent = "№"+to;
    var p = NAV.$("plate"), l = NAV.$("letter");
    p.textContent = plate; p.classList.toggle("upside", !!upsideDown);
    l.classList.remove("fly"); void l.offsetWidth;
    setTimeout(function(){ l.classList.add("fly"); NAV.snd.tone(760,0.08); }, 80);
    setTimeout(cb || function(){}, 1150);
  }
  function opts(right, wrong){
    var o = [{tx:"№"+right, ok:true}], seen = {}; seen[right] = 1;
    wrong.forEach(function(w){ if(!seen[w[0]] && w[0]>0){ seen[w[0]] = 1; o.push({tx:"№"+w[0], why:w[1]}); } });
    return o.slice(0,4);
  }

  function startGame(){
    log = []; NAV.step(0,TOTAL); renderLog();
    NAV.$("letter").classList.remove("fly"); NAV.$("plate").classList.remove("upside");
    NAV.hint("Дивись, куди листоноша несе листи…");
    deliver(12, 21, false, function(){
      log.push("✉️ Лист для <b>№12</b> прийшов у <b>№21</b>"); renderLog();
      setTimeout(function(){
        deliver(34, 43, false, function(){
          log.push("✉️ Лист для <b>№34</b> прийшов у <b>№43</b>"); renderLog();
          NAV.$("addrN").textContent = "№56"; NAV.$("plate").textContent = "?";
          NAV.hint("Подивись у журнал 📒 — яке тут правило?");
          NAV.question("Куди прийде лист для <b>№56</b>?", opts(65, [
            [56, "Це адреса на конверті — а пошта-перевертень несе лист деінде!"],
            [57, "Глянь у журнал: номер не просто більшає на 1."],
            [66, "Порівняй 12 і 21: цифри ті самі — тільки стоять інакше."]
          ]), function(){
            deliver(56, 65, false, function(){
              log.push("✉️ Лист для <b>№56</b> прийшов у <b>№65</b> ✔"); renderLog();
              NAV.hint("Так! Цифри міняються місцями.","good");
              setTimeout(step2, 1000);
            });
          }, {cols:4, big:true});
        });
      }, 500);
    });
  }

  function step2(){
    NAV.step(1,TOTAL); NAV.again = step2;
    var a, b; do{ a = NAV.rnd(1,9); b = NAV.rnd(1,9); }while(a===b || Math.abs(a-b)===1);
    var n = a*10+b, r = swap(n);
    NAV.$("addrN").textContent = "№"+n; NAV.$("plate").textContent = "?";
    NAV.hint("Новий лист! Перевір правило ще раз.");
    NAV.question("Куди прийде лист для <b>№"+n+"</b>?", opts(r, [
      [n+9, "+9 підходило для 12 і 34, але не для всіх номерів! Поміняй цифри місцями."],
      [n, "Це адреса на конверті — а пошта плутає!"],
      [a*10+b+1, "Номер не більшає на 1 — цифри міняються місцями."]
    ]), function(){
      deliver(n, r, false, function(){
        log.push("✉️ Лист для <b>№"+n+"</b> прийшов у <b>№"+r+"</b> ✔"); renderLog();
        NAV.hint("Правильно: №"+n+" → №"+r+".","good");
        setTimeout(step3, 1000);
      });
    }, {cols:4, big:true});
  }

  function step3(){
    NAV.step(2,TOTAL);
    NAV.hint("Сформулюй правило пошти-перевертня 🤔");
    NAV.question("Яке правило в цієї пошти?", [
      {tx:"Цифри номера міняються місцями", ok:true},
      {tx:"До номера додають 9", why:"Для 12 і 34 — так, але глянь журнал: для інших номерів +9 не підходить."},
      {tx:"Лист приходить у сусідній будинок", why:"Сусідній — це ±1, а тут номер змінюється інакше."}
    ], function(){ setTimeout(flip, 900); });
  }

  function flip(){
    NAV.modal("🔄","Навиворіт!","Над поштою пролетів вітер-перевертун — і всі таблички з номерами перевернулись <b>догори дриґом</b>! Листоноша читає їх так, як бачить…",{nav:true, btn:"🔄 Перевернути"}, function(){
      NAV.snd.whoosh(); NAV.flipAnim();
      setTimeout(function(){
        NAV.setFlip(true); NAV.step(3,TOTAL);
        log.push("🔄 <b>Таблички перевернулись!</b>"); renderLog();
        NAV.$("addrN").textContent = "№16";
        var p = NAV.$("plate"); p.textContent = "16"; p.classList.remove("upside");
        NAV.hint("Дивись на табличку <b>№16</b>…");
        setTimeout(function(){
          p.classList.add("upside"); NAV.snd.tone(420,0.2,"sine");
          setTimeout(function(){
            NAV.hint("Табличку перевернуло. Що тепер бачить листоноша?");
            NAV.busy = false;
            NAV.question("Куди тепер прийде лист для <b>№16</b>?", opts(91, [
              [61, "Це старе правило (цифри навхрест). Тепер табличка догори дриґом — 6 стає 9!"],
              [16, "Так було б без перевороту табличок. Поверни голову догори дриґом 🙃"],
              [19, "Майже! Але перевернута табличка читається з іншого кінця: спершу 9, потім 1."]
            ]), function(){
              log.push("✉️ Лист для <b>№16</b> прийшов у <b>№91</b> 🙃"); renderLog();
              NAV.hint("Так! Догори дриґом 6 — це 9, а цифри стають у зворотному порядку: 16 → 91.","good");
              setTimeout(step5, 1400);
            }, {cols:4, big:true});
          }, 1200);
        }, 700);
      }, 500);
    });
  }

  function step5(){
    NAV.step(4,TOTAL); NAV.again = step5;
    var n = NAV.pick([18,19,61,68,81,86,89,98]), r = upside(n), s = swap(n);
    NAV.$("addrN").textContent = "№"+n;
    var p = NAV.$("plate"); p.textContent = String(n); p.classList.add("upside");
    NAV.hint("Останній лист. Табличка вже перевернута — подивись уважно!");
    NAV.question("Куди тепер прийде лист для <b>№"+n+"</b>?", opts(r, [
      [s, "Це правило до перевороту. Тепер табличку читають догори дриґом: 6↔9, а 1 і 8 не змінюються."],
      [n, "Табличка перевернута — листоноша бачить інше число!"],
      [+String(n).split("").map(function(d){ return ROT[d]; }).join(""), "6 і 9 помінялись — але ще й порядок цифр навпаки!"]
    ]), function(){
      log.push("✉️ Лист для <b>№"+n+"</b> прийшов у <b>№"+r+"</b> 🙃"); renderLog();
      NAV.hint("Чудово! №"+n+" догори дриґом — це №"+r+".","good");
      setTimeout(NAV.finish, 1500);
    }, {cols:4, big:true});
  }
})();
</script>
