<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Книги міняються місцями — School Kingdoms</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<link rel="stylesheet" href="nav-common.css?v=3">
<style>
/* ── бібліотека ── */
#scene{height:220px; background:linear-gradient(180deg,#f6e4c8 0%,#fbefdc 100%);}
body.flipped #scene{background:linear-gradient(180deg,#e4d6fb 0%,#f3ecff 100%);}
#bell{position:absolute; top:12px; right:16px; font-size:40px; transform-origin:50% 10%;}
#bell.ring{animation:ring .5s;}
@keyframes ring{20%{transform:rotate(18deg)}45%{transform:rotate(-16deg)}70%{transform:rotate(10deg)}}
#bells{position:absolute; top:20px; left:14px; background:#fff; border:2px solid var(--line); border-radius:12px; padding:3px 10px; font-weight:800; font-size:14px;}
#shelf{position:absolute; left:50%; bottom:34px; height:96px; transform:translateX(-50%);}
#shelf:after{content:""; position:absolute; left:-18px; right:-18px; bottom:-14px; height:14px; border-radius:4px; background:#a0703c; box-shadow:0 5px 0 #7d5329;}
.book{position:absolute; bottom:0; width:56px; height:92px; border-radius:6px 8px 4px 4px; border:3px solid rgba(0,0,0,.22);
  display:grid; place-items:center; font-family:'Fredoka'; font-weight:700; font-size:24px; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.3);
  transition:left .7s cubic-bezier(.5,-.3,.4,1.3), transform .7s; box-shadow:inset 6px 0 0 rgba(255,255,255,.25);}
.book.hop{transform:translateY(-22px);}
.b-r{background:#f06565;} .b-g{background:#51cf66;} .b-b{background:#4dabf7;} .b-o{background:#ffa94d;}
.opts .bk{display:inline-block; width:22px; height:30px; border-radius:3px; margin:0 2px; vertical-align:middle; border:2px solid rgba(0,0,0,.2);}
</style>
</head>
<body>
<script src="../sk-footer.js?v=6" data-base="../" data-back="self"></script>
<script src="nav-common.js?v=3"></script>
<script>
(function(){
  "use strict";
  var TOTAL = 5, log, order, bells;
  var SLOT = 64;
  /* книги: колір і буква на корінці */
  var B = {r:"А", g:"Б", b:"В", o:"Г"};

  NAV.mount({
    next: "shakhova-pidloha.html",   // «Вирушай далі! ›» — наступний пункт карти
    title:"Книги міняються місцями", emoji:"📚🔔", sub:"Логіка · Світ навиворіт · 5 кроків",
    riddle:"У бібліотеці замку щоразу, коли дзвонить дзвоник 🔔, книги на полиці міняються місцями!<span class='seq'>А Б В → 🔔 → В Б А</span>Знайди правило дзвоника. А потім — 🔄 переворот, і книги почнуть рухатись інакше…",
    play:"До бібліотеки ▶", steps:TOTAL, crown:"📚✨",
    badgeOff:"🔔 обмін крайніх", badgeOn:"🔄 рух по колу",
    prizeKey:"sk_knyhy_prize_v1", href:"knyhy.html", doneText:"Бібліотеку розгадано — нагороду отримано!",
    winTitle:"Книги на своїх місцях!", winPerfect:"Жодна книга не загубилась!",
    lesson:[
      "Дзвоник <b>міняє місцями крайні книги</b>. Два дзвінки — і все <b>як було</b>: обмін скасовує сам себе.",
      "Тому важлива лише <b>парність</b>: парна кількість дзвінків — як було, непарна — крайні помінялись.",
      "🔄 Рух по колу: кожна книга зсувається на одне місце, остання — на початок. Щоб повернутись, потрібно <b>стільки дзвінків, скільки книг</b>."
    ],
    scene:'<div id="bells">🔔 × <b id="bellN">0</b></div><span id="bell">🔔</span><div id="shelf"></div>',
    afterScene:'<div class="log" id="log"></div>',
    onStart:startGame
  });

  function renderLog(){
    var box = NAV.$("log"); box.innerHTML = '<div class="lh">📒 Журнал бібліотекаря</div>';
    if(!log.length){ box.appendChild(NAV.el("div","empty","Поки нічого.")); return; }
    var rows = NAV.el("div","rows"); log.slice(-3).forEach(function(r){ rows.appendChild(NAV.el("div","r",r)); }); box.appendChild(rows);
  }
  function txt(o){ return o.map(function(c){ return B[c]; }).join(" "); }
  function chip(o){ return o.map(function(c){ return '<span class="bk b-'+c+'"></span>'; }).join("")+" &nbsp;"+txt(o); }
  /* поставити книги на полицю (нові — створюються, наявні — їдуть на нові місця) */
  function place(o, fresh){
    var sh = NAV.$("shelf");
    if(fresh){ sh.innerHTML = ""; o.forEach(function(c){ var b = NAV.el("div","book b-"+c, B[c]); b.id = "bk-"+c; sh.appendChild(b); }); }
    sh.style.width = (o.length*SLOT - 8) + "px";
    o.forEach(function(c, i){ NAV.$("bk-"+c).style.left = (i*SLOT) + "px"; });
  }
  function setBells(n){ bells = n; NAV.$("bellN").textContent = n; }
  function swapEnds(o){ var r = o.slice(), x = r[0]; r[0] = r[r.length-1]; r[r.length-1] = x; return r; }
  function rotate(o){ return [o[o.length-1]].concat(o.slice(0, -1)); }       // остання — на початок
  function rotateBack(o){ return o.slice(1).concat([o[0]]); }
  function times(f, o, k){ for(var i=0;i<k;i++) o = f(o); return o; }
  /* один дзвінок: дзвоник, книги, що рухаються, підстрибують */
  function ring(cb){
    var prev = order;
    order = NAV.flipped ? rotate(order) : swapEnds(order);
    var b = NAV.$("bell"); b.classList.remove("ring"); void b.offsetWidth; b.classList.add("ring");
    NAV.snd.tone(1200,0.08,"sine"); setTimeout(function(){ NAV.snd.tone(1500,0.1,"sine"); }, 120);
    order.forEach(function(c, i){ if(prev[i]!==c) NAV.$("bk-"+c).classList.add("hop"); });
    place(order); setBells(bells+1);
    setTimeout(function(){ order.forEach(function(c){ NAV.$("bk-"+c).classList.remove("hop"); }); }, 380);
    setTimeout(cb || function(){}, 900);
  }
  function ringN(k, cb){ if(k<=0){ cb(); return; } ring(function(){ ringN(k-1, cb); }); }
  function opts(right, wrong){
    var o = [{tx:chip(right), ok:true}], seen = {}; seen[txt(right)] = 1;
    wrong.forEach(function(w){ var k = txt(w[0]); if(!seen[k]){ seen[k] = 1; o.push({tx:chip(w[0]), why:w[1]}); } });
    return o;
  }

  function startGame(){
    log = []; NAV.step(0,TOTAL); renderLog();
    order = ["r","g","b"]; place(order, true); setBells(0);
    NAV.hint("Слухай… дзвонить дзвоник!");
    setTimeout(function(){
      ring(function(){
        log.push("🔔 "+txt(["r","g","b"])+" → <b>"+txt(order)+"</b>"); renderLog();
        NAV.hint("Книги помінялись! Що буде після <b>ще одного</b> дзвінка?");
        var now = order.slice(), right = swapEnds(now);
        NAV.question("Яким стане порядок після другого дзвінка?", opts(right, [
          [now, "Дзвоник щоразу міняє книги — вони не стоятимуть як зараз."],
          [rotate(now), "Середня книга не рухалась — міняються лише <b>крайні</b>."]
        ]), function(){
          ring(function(){
            log.push("🔔🔔 Два дзвінки → <b>"+txt(order)+"</b> — як було!"); renderLog();
            NAV.hint("Так! Два обміни — і все як на початку.","good");
            setTimeout(step2, 1000);
          });
        }, {cols:1});
      });
    }, 700);
  }

  function step2(){
    NAV.step(1,TOTAL); NAV.again = step2;
    order = NAV.shuffle(["r","g","b","o"]); place(order, true); setBells(0);
    var k = NAV.pick([3,5]), right = times(swapEnds, order, k);
    NAV.hint("Тепер книг чотири. Дзвоник подзвонить <b>"+k+(k===3?" рази":" разів")+"</b>…");
    NAV.question("Яким буде порядок після "+k+" дзвінків?", opts(right, [
      [order.slice(), "Як було — лише після <b>парної</b> кількості дзвінків. А "+k+" — непарне!"],
      [order.slice().reverse(), "Дзвоник не розвертає весь ряд — він міняє лише <b>крайні</b> книги."],
      [rotate(order), "Книги не їдуть по колу — міняються місцями лише крайні."]
    ]), function(){
      ringN(k, function(){
        log.push("🔔 × "+k+" → <b>"+txt(order)+"</b> (крайні помінялись)"); renderLog();
        NAV.hint("Правильно! "+k+(k===3?" дзвінки":" дзвінків")+" — це як один.","good");
        setTimeout(step3, 1000);
      });
    }, {cols:1});
  }

  function step3(){
    NAV.step(2,TOTAL);
    NAV.hint("Подивись у журнал 📒 — коли книги стоять як на початку?");
    NAV.question("Яке правило дзвоника?", [
      {tx:"Після парної кількості дзвінків — усе як було", ok:true},
      {tx:"Кожен дзвінок перемішує книги по-новому", why:"Ні — щоразу міняються ті самі крайні книги."},
      {tx:"Після 3 дзвінків — як було", why:"3 дзвінки — непарне число: крайні книги будуть помінені."}
    ], function(){ setTimeout(flip, 900); });
  }

  function flip(){
    NAV.modal("🔄","Навиворіт!","Бібліотекар перевернув дзвоник догори дриґом. Тепер на кожен дзвінок <b>усі книги їдуть по колу</b>: кожна — на місце праворуч, а остання — на початок!",{nav:true, btn:"🔄 Перевернути"}, function(){
      NAV.snd.whoosh(); NAV.flipAnim();
      setTimeout(function(){
        NAV.setFlip(true); NAV.step(3,TOTAL);
        log.push("🔄 <b>Книги їдуть по колу!</b>"); renderLog();
        order = ["r","g","b"]; place(order, true); setBells(0);
        NAV.hint("Дивись, що робить дзвоник тепер…");
        setTimeout(function(){
          ring(function(){
            log.push("🔔 "+txt(["r","g","b"])+" → <b>"+txt(order)+"</b> (по колу)"); renderLog();
            NAV.hint("Книги з'їхали по колу. Коли вони <b>знову</b> стануть А Б В?");
            NAV.question("Після якого дзвінка книги вперше стануть як на початку?", [
              {tx:"Після 3-го", ok:true},
              {tx:"Після 2-го", why:"Це старе правило обміну! По колу після 2 дзвінків книги ще не на місцях — спробуй уявити."},
              {tx:"Після 4-го", why:"Забагато: книг три — кожна повертається на місце після трьох кроків по колу."},
              {tx:"Ніколи", why:"По колу книги обов'язково повернуться — книг лише три."}
            ], function(){
              ringN(2, function(){
                log.push("🔔🔔🔔 Три дзвінки → <b>"+txt(order)+"</b> — як було!"); renderLog();
                NAV.hint("Так! Три книги — три дзвінки по колу.","good");
                setTimeout(step5, 1200);
              });
            }, {cols:2, keepOrder:true});
          });
        }, 700);
      }, 500);
    });
  }

  function step5(){
    NAV.step(4,TOTAL); NAV.again = step5;
    order = NAV.shuffle(["r","g","b","o"]); place(order, true); setBells(0);
    var k = NAV.pick([1,2,3]), right = times(rotate, order, k);
    NAV.hint("Чотири книги, дзвоник по колу. Буде <b>"+k+"</b> "+(k===1?"дзвінок":"дзвінки")+"…");
    NAV.question("Яким буде порядок?", opts(right, [
      [times(rotateBack, order, k), "Книги їдуть <b>праворуч</b>, а остання стрибає на початок — не навпаки."],
      [k%2 ? swapEnds(order) : order.slice(), "Це старе правило (обмін крайніх). Тепер книги рухаються по колу!"],
      [order.slice(), "Як було — лише після 4 дзвінків: книг чотири."]
    ]), function(){
      ringN(k, function(){
        log.push("🔔 × "+k+" по колу → <b>"+txt(order)+"</b>"); renderLog();
        NAV.hint("Чудово! Бібліотеку розгадано.","good");
        setTimeout(NAV.finish, 1400);
      });
    }, {cols:1});
  }
})();
</script>
