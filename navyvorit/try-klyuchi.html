<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Три ключі — School Kingdoms</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<link rel="stylesheet" href="nav-common.css">
<style>
/* ── скарбниця ── */
#scene{height:240px; background:linear-gradient(180deg,#fff0cf 0%,#fff8e8 62%,#d8b383 62%,#c79c66 100%);}
body.flipped #scene{background:linear-gradient(180deg,#e2d3ff 0%,#f3ecff 62%,#c9b6e4 62%,#b6a2d6 100%);}
#chest{position:absolute; left:50%; top:16px; transform:translateX(-50%); width:120px; height:80px; border-radius:14px 14px 8px 8px; background:#b5763c; border:4px solid #7d4e22; box-shadow:0 5px 0 rgba(0,0,0,.2);}
#chest:before{content:""; position:absolute; left:-4px; right:-4px; top:-4px; height:28px; border-radius:14px 14px 4px 4px; background:#c98a4b; border:4px solid #7d4e22; transform-origin:50% 0; transition:transform .5s;}
#chest .lk{position:absolute; left:50%; top:30px; transform:translateX(-50%); font-size:24px; z-index:1;}
#chest .gem{position:absolute; left:50%; top:-8px; transform:translateX(-50%); font-size:30px; opacity:0; transition:opacity .4s .2s;}
#chest.open:before{transform:rotateX(75deg) translateY(-18px);}
#chest.open .gem{opacity:1;} #chest.open .lk{opacity:0;}
#plate{position:absolute; left:50%; top:104px; transform:translateX(-50%); background:#fffaf0; border:2px solid #c99f5c; border-radius:10px; padding:3px 10px; font-weight:800; font-size:12.5px; line-height:1.25; text-align:center; width:max-content; max-width:92%;}
body.flipped #plate{border-color:#a873d8;}
#plate .tg{color:var(--soft); font-size:11px; margin-right:3px;}
#gnome{position:absolute; right:8px; top:12px; display:flex; flex-direction:row-reverse; align-items:flex-start; gap:4px; max-width:40%; opacity:0; transition:opacity .4s;}
#gnome.on{opacity:1;}
#gnome .ic{font-size:40px; line-height:1;}
#gnome .say{background:#fff; border:2px solid var(--line); border-radius:12px; padding:4px 8px; font-weight:800; font-size:12.5px; line-height:1.3; text-align:right;}
#keys{position:absolute; left:0; right:0; bottom:12px; display:flex; justify-content:center; gap:16px;}
.key{display:flex; flex-direction:column; align-items:center; font-weight:800; font-size:12px; color:#5c4426; transition:transform .6s, opacity .4s;}
.key .k{width:56px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:26px; border:3px solid rgba(0,0,0,.2); box-shadow:0 4px 0 rgba(0,0,0,.15);}
.key.out{opacity:.3;}
.key.go{transform:translateY(-100px) scale(.7);}
.k-g{background:linear-gradient(135deg,#ffe066,#f4c430 60%,#fff3bf);} .k-s{background:linear-gradient(135deg,#f1f3f5,#ced4da 60%,#ffffff);} .k-b{background:linear-gradient(135deg,#d9a066,#a86b32);}
</style>
</head>
<body>
<script src="../sk-footer.js?v=6" data-base="../" data-back="self"></script>
<script src="nav-common.js"></script>
<script>
(function(){
  "use strict";
  var TOTAL = 5, log;
  var K = {g:{nm:"Золотий", gen:"золотий", em:"🟡"}, s:{nm:"Срібний", gen:"срібний", em:"⚪"}, b:{nm:"Бронзовий", gen:"бронзовий", em:"🟤"}};
  var ALL = ["g","s","b"];

  NAV.mount({
    next: "zaliznytsia.html",   // «Вирушай далі! ›» — наступний пункт карти
    title:"Три ключі", emoji:"🗝️🧰", sub:"Логіка · Світ навиворіт · 5 кроків",
    riddle:"У скарбниці — скриня і три ключі: золотий, срібний і бронзовий. Підходить лише один! На скрині напис:<span class='seq'>«Не золотий і не бронзовий»</span>Який ключ узяти? А потім — 🔄 переворот, і написи почнуть брехати…",
    play:"До скарбниці ▶", steps:TOTAL, crown:"🗝️💎",
    badgeOff:"📜 напис правдивий", badgeOn:"🔄 напис бреше",
    prizeKey:"sk_klyuchi_prize_v1", href:"try-klyuchi.html", doneText:"Скриню відчинено — нагороду отримано!",
    winTitle:"Скриню відчинено!", winPerfect:"Жодного неправильного ключа!",
    lesson:[
      "Правдивий напис «не золотий і не бронзовий» <b>викреслює</b> два ключі — лишається срібний.",
      "🔄 Якщо напис <b>бреше</b>, правда навпаки: «не золотий і не бронзовий» означає — підходить <b>золотий або бронзовий</b>.",
      "Одна брехлива підказка лишає кілька варіантів — тоді потрібна <b>ще одна, правдива</b> підказка."
    ],
    scene:'<div id="chest"><span class="lk">🔒</span><span class="gem">💎</span></div><div id="plate"></div>'+
          '<div id="gnome"><span class="ic">🧙</span><div class="say" id="gSay"></div></div><div id="keys"></div>',
    afterScene:'<div class="log" id="log"></div>',
    onStart:startGame
  });

  function renderLog(){
    var box = NAV.$("log"); box.innerHTML = '<div class="lh">📒 Записник ключника</div>';
    if(!log.length){ box.appendChild(NAV.el("div","empty","Поки нічого.")); return; }
    var rows = NAV.el("div","rows"); log.slice(-3).forEach(function(r){ rows.appendChild(NAV.el("div","r",r)); }); box.appendChild(rows);
  }
  function keys(){
    var box = NAV.$("keys"); box.innerHTML = "";
    ALL.forEach(function(k){ var d = NAV.el("div","key",'<span class="k k-'+k+'">🔑</span>'+K[k].nm); d.id = "key-"+k; box.appendChild(d); });
    NAV.$("chest").classList.remove("open");
  }
  function plate(t){ NAV.$("plate").innerHTML = '<span class="tg">'+(NAV.flipped ? "📜 бреше:" : "📜 напис:")+'</span>«'+t+'»'; }
  function gnome(t){ var g = NAV.$("gnome"); if(t){ NAV.$("gSay").innerHTML = "«"+t+"»"; g.classList.add("on"); } else g.classList.remove("on"); }
  function unlock(k, cb){
    ALL.forEach(function(x){ if(x!==k) NAV.$("key-"+x).classList.add("out"); });
    NAV.$("key-"+k).classList.add("go");
    setTimeout(function(){ NAV.$("chest").classList.add("open"); NAV.snd.fanfare(); }, 650);
    setTimeout(cb, 1600);
  }
  function keyOpts(right, why){
    return ALL.map(function(k){ return k===right ? {tx:K[k].em+" "+K[k].nm, ok:true} : {tx:K[k].em+" "+K[k].nm, why:why(k)}; });
  }

  function startGame(){
    log = []; NAV.step(0,TOTAL); renderLog(); keys(); gnome("");
    plate("Підходить не золотий і не бронзовий ключ");
    NAV.hint("Прочитай напис на скрині. Він <b>правдивий</b>.");
    NAV.question("Який ключ підійде?", keyOpts("s", function(k){
      return "Напис каже: «не "+K[k].gen+"». А напис правдивий — цей ключ не підходить.";
    }), function(){
      unlock("s", function(){
        log.push("📜 «не золотий і не бронзовий» → <b>⚪ срібний</b>"); renderLog();
        NAV.hint("Так! Два ключі викреслили — лишився срібний.","good");
        setTimeout(step2, 900);
      });
    }, {cols:3, keepOrder:true});
  }

  function step2(){
    NAV.step(1,TOTAL); keys();
    var ids = NAV.shuffle(ALL.slice()), win = ids[2];
    plate(K[ids[0]].nm+" не підходить. "+K[ids[1]].nm+" — теж");
    NAV.hint("Нова скриня — новий правдивий напис.");
    NAV.question("Який ключ підійде?", keyOpts(win, function(k){
      return "Напис правдивий і прямо каже, що "+K[k].gen+" не підходить.";
    }), function(){
      unlock(win, function(){
        log.push("📜 «"+K[ids[0]].gen+" і "+K[ids[1]].gen+" — ні» → <b>"+K[win].em+" "+K[win].gen+"</b>"); renderLog();
        NAV.hint("Правильно! Викреслюй те, що «не», — і лишиться відповідь.","good");
        setTimeout(step3, 900);
      });
    }, {cols:3, keepOrder:true});
  }

  function step3(){
    NAV.step(2,TOTAL);
    NAV.hint("Подивись у записник 📒 — як вибирати ключ?");
    NAV.question("Яке правило?", [
      {tx:"Напис правдивий — викреслюю ключі, які він забороняє", ok:true},
      {tx:"Беру ключ, який названо в написі", why:"Названо якраз ті ключі, що <b>не</b> підходять!"},
      {tx:"Беру будь-який — пощастить", why:"Підходить лише один ключ — напис підказує який."}
    ], function(){ setTimeout(flip, 900); });
  }

  function flip(){
    NAV.modal("🔄","Навиворіт!","Скарбниця перевернулась! Тепер <b>написи на скринях брешуть</b>. Але з'явився гном 🧙 — він <b>завжди каже правду</b>.",{nav:true, btn:"🔄 Перевернути"}, function(){
      NAV.snd.whoosh(); NAV.flipAnim();
      setTimeout(function(){
        NAV.setFlip(true); NAV.step(3,TOTAL); keys(); gnome("");
        log.push("🔄 <b>Написи брешуть, гном каже правду!</b>"); renderLog();
        plate("Підходить не золотий і не бронзовий ключ");
        NAV.hint("Той самий напис — але тепер він <b>бреше</b>!");
        NAV.question("Які ключі тепер можуть підійти?", [
          {tx:"🟡 Золотий або 🟤 бронзовий", ok:true},
          {tx:"⚪ Тільки срібний", why:"Так було б, якби напис казав правду. А він бреше — правда навпаки!"},
          {tx:"Будь-який із трьох", why:"Брехливий напис теж підказує: правда протилежна до його слів."}
        ], function(){
          log.push("📜❌ «не золотий і не бронзовий» → <b>🟡 або 🟤</b>"); renderLog();
          NAV.$("key-s").classList.add("out");
          NAV.hint("Так! Срібний — ні. Але двох варіантів забагато… Послухай гнома.","good");
          setTimeout(function(){
            gnome("Ключ не блищить");
            NAV.question("🧙 каже правду: «Ключ не блищить». Який ключ підійде?", keyOpts("b", function(k){
              return k==="g" ? "Золотий блищить ✨ — а гном каже правду." : "Срібний ми вже викреслили: брехливий напис означає «золотий або бронзовий».";
            }), function(){
              unlock("b", function(){
                log.push("🧙 «не блищить» → <b>🟤 бронзовий</b>"); renderLog();
                NAV.hint("Чудово! Брехливий напис + правдивий гном → бронзовий.","good");
                setTimeout(step5, 1000);
              });
            }, {cols:3, keepOrder:true});
          }, 1300);
        });
      }, 500);
    });
  }

  function step5(){
    NAV.step(4,TOTAL); keys(); gnome("");
    var ids = NAV.shuffle(ALL.slice()), x = ids[0], y = ids[1], win = ids[2];
    plate("Підходить "+K[x].gen+" ключ");
    setTimeout(function(){ gnome(K[y].nm+" не підходить"); }, 500);
    NAV.hint("Останній ключ! Напис <b>бреше</b>, гном каже <b>правду</b>.");
    NAV.question("Який ключ підійде?", keyOpts(win, function(k){
      return k===x ? "Напис бреше! Якщо він каже «"+K[x].gen+"» — саме цей ключ і не підходить."
                   : "Гном каже правду: "+K[y].gen+" не підходить.";
    }), function(){
      unlock(win, function(){
        log.push("📜❌ «"+K[x].gen+"» + 🧙 «"+K[y].gen+" — ні» → <b>"+K[win].em+" "+K[win].gen+"</b>"); renderLog();
        NAV.hint("Скарбницю розгадано!","good");
        setTimeout(NAV.finish, 1400);
      });
    }, {cols:3, keepOrder:true});
  }
})();
</script>
<script type="module" src="../firebase-config.js"></script>
<script src="../sk-items.js?v=15"></script>
<script src="../sk-curriculum.js?v=8"></script>
<script src="../sk-rewards.js?v=4"></script>
<script src="../sk-prize.js?v=2"></script>
<script src="../sk-finish.js?v=6"></script>
<script src="nav-intro.js"></script>
</body>
</html>
