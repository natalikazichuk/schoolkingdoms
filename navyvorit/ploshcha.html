<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Площа з пам'ятниками — School Kingdoms</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<link rel="stylesheet" href="nav-common.css">
<style>
/* ── площа: фон із 5 постаментами (img/ploshcha/scene-bg.webp, 1586×992), статуї стають на них ── */
body{background:linear-gradient(180deg,rgba(255,250,240,.30),rgba(255,250,240,.55)), url(img/ploshcha/page-bg.webp) center/cover no-repeat fixed, var(--paper);}
#scene{aspect-ratio:1586/992; background:#9fd2ff url(img/ploshcha/scene-bg.webp) center/100% 100% no-repeat;}
#scene:after{content:""; position:absolute; inset:0; pointer-events:none; background:rgba(150,100,255,.30); opacity:0; transition:opacity .5s; z-index:1;}   /* під статуями: кольори номерів лишаються яскравими */
body.flipped #scene:after{opacity:1;}
#statues{position:absolute; inset:0; z-index:2;}
/* кнопка-статуя: від верху сцени до низу постаменту (28.9% знизу); центр — центр постаменту */
.st{position:absolute; top:0; bottom:28.9%; width:16%; transform:translateX(-50%); border:none; background:none; cursor:pointer; padding:0; font-family:inherit; -webkit-tap-highlight-color:transparent;}
/* верх постаменту — 42.8% знизу сцени = 19.5% висоти кнопки */
.st .fig{position:absolute; bottom:19.5%; left:50%; transform-origin:50% 96%; transition:transform .25s, filter .25s; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));}
.st .no{position:absolute; bottom:3%; left:50%; transform:translateX(-50%); min-width:24px; height:24px; padding:0 5px; border-radius:12px; display:grid; place-items:center;
  font-family:'Fredoka'; font-weight:700; font-size:13px; color:#4a4136; background:rgba(255,253,246,.92); border:2px solid #d9b77c; box-shadow:0 2px 0 rgba(0,0,0,.18);}
.st.pick .no{background:#ffe066; border-color:#e0a92e;}
.st.good .no{background:#8ce99a; border-color:#37b26f; color:#0b5a2a;}
.st.bad .no{background:#ffa8a8; border-color:#e06666; color:#7a1414;}
.st.good .fig{filter:drop-shadow(0 0 6px #51cf66) drop-shadow(0 0 10px #51cf66);}
.st.bad .fig{filter:drop-shadow(0 0 6px #ff6b6b) drop-shadow(0 0 10px #ff6b6b);}
.st:active .fig{filter:brightness(1.1);}
/* туман над площею (img/ploshcha/curtain.webp — та сама площа, статуї сховані) */
#curtain{position:absolute; inset:0; z-index:5; display:flex; justify-content:center; align-items:flex-start; padding-top:5%; background:#d9ccff url(img/ploshcha/curtain.webp) center/100% 100% no-repeat; color:#fff; font-family:'Fredoka'; font-weight:700; font-size:16px;
  opacity:0; pointer-events:none; transition:opacity .45s; text-align:center; line-height:1.3;}
#curtain > div{background:rgba(44,43,58,.72); border-radius:16px; padding:6px 14px;}
#curtain.on{opacity:1; pointer-events:auto;}
#curtain .em{font-size:26px; display:inline-block; vertical-align:middle; margin-right:4px;}
#timer{position:absolute; left:10px; right:10px; top:10px; height:8px; background:rgba(255,255,255,.6); border-radius:6px; overflow:hidden; z-index:3;}
#timer i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#ffd43b,#ffa94d); transition:width linear;}
</style>
</head>
<body>
<script src="../sk-footer.js?v=5" data-base="../" data-back="self"></script>
<script src="nav-common.js"></script>
<script>
(function(){
  "use strict";
  /* фігури статуй і можливі положення: дзеркально (обличчям в інший бік) і нахил */
  var FIGS = ["🗿","🦁","🐎","🦉","🐘","🦒","🐻"];
  /* картинки статуй (img/ploshcha/st-*.webp) і їхня ширина у % ширини сцени — у масштабі фону */
  var IMG = {"🗿":["moai",12.86],"🦁":["lion",12.8],"🐎":["horse",13.75],"🦉":["owl",12.55],"🐘":["elephant",18.03],"🦒":["giraffe",13.49],"🐻":["bear",15.26]};
  var PED = [13.6, 32.2, 50.2, 68.2, 86.5];   // центри постаментів на фоні, % ширини
  var TILTS = [-18, 0, 18];
  var PLAN = [
    {same:true,  kind:"face"},          // 🗿 🗿 🗿 🗿 🗿 — одна повернулась
    {kind:"tilt"},
    {kind:"any"},
    {flip:true, kind:"any"},            // 🔄 змінюються всі, крім однієї
    {flip:true, kind:"any"},
    {flip:true, kind:"any", fast:true}
  ];
  var TOTAL = PLAN.length, qi, cur, before, after, target, phase, timerT;

  NAV.mount({
    next: "svit-navyvorit.html",   // «Вирушай далі! ›» — наступний пункт карти
    title:"Площа з пам'ятниками", emoji:"🗿🗿🗿", startImg:"img/ploshcha/start.webp", sub:"Пам'ять · Світ навиворіт · 6 раундів",
    riddle:"На площі 5 статуй. Поки ти на них дивишся — вони стоять смирно:<span class='seq'>🗿 → 🗿 → 🗿 → 🗿 → 🗿</span>Але варто відвернутися й повернутися — <b>одна статуя змінює положення</b>. Запам'ятай, як вони стоять, і знайди, яка саме змінилась!",
    play:"На площу ▶", steps:TOTAL, crown:"🗿🔍", stepLabel:"Раунд",
    badgeOff:"👀 одна зміна", badgeOn:"🔄 навиворіт",
    prizeKey:"sk_ploshcha_prize_v1", href:"ploshcha.html", doneText:"Площу з пам'ятниками розгадано — нагороду отримано!",
    winTitle:"Усі статуї перевірено!", winPerfect:"Жодна статуя тебе не обдурила!",
    lesson:[
      "Щоб помітити зміну, <b>запам'ятай</b>, як стоїть кожна статуя: куди дивиться і чи нахилена.",
      "Звичайно змінюється <b>одна</b> статуя — шукай ту, що стоїть інакше.",
      "🔄 Навиворіт: змінюються <b>всі, крім однієї</b> — тепер шукай ту, що стоїть <b>так само</b>!"
    ],
    scene:'<div id="timer"><i id="timerBar"></i></div><div id="statues"></div><div id="curtain"></div>',
    onStart:function(){ qi = 0; next(); }
  });

  Object.keys(IMG).forEach(function(k){ new Image().src = "img/ploshcha/st-"+IMG[k][0]+".webp"; });
  new Image().src = "img/ploshcha/curtain.webp";   // заздалегідь, щоб не блимало
  function pose(f){ return "scaleX("+f.face+") rotate("+f.tilt+"deg)"; }
  function render(state, clickable){
    var box = NAV.$("statues"); box.innerHTML = "";
    state.forEach(function(f,i){
      var im = IMG[f.em], w = im[1] / 16 * 100;   // ширина картинки у % ширини кнопки (кнопка — 16% сцени)
      var b = NAV.el("button","st",'<img class="fig" src="img/ploshcha/st-'+im[0]+'.webp" alt="'+f.em+'" draggable="false" style="width:'+w+'%; margin-left:'+(-w/2)+'%; transform:'+pose(f)+'"><span class="no">'+(i+1)+'</span>');
      b.style.left = PED[i] + "%";
      b.type = "button"; b.setAttribute("aria-label","Статуя "+(i+1));
      if(clickable) b.addEventListener("click", function(){ pickStatue(i, b); });
      box.appendChild(b);
    });
  }
  function changeOne(f, kind){
    var g = {em:f.em, face:f.face, tilt:f.tilt};
    var k = kind==="any" ? NAV.pick(["face","tilt"]) : kind;
    if(k==="face") g.face = -f.face;
    else g.tilt = NAV.pick(TILTS.filter(function(t){ return t!==f.tilt; }));
    return g;
  }
  function describe(a, b){
    var parts = [];
    if(a.face !== b.face) parts.push("повернулась в інший бік");
    if(a.tilt !== b.tilt) parts.push(b.tilt===0 ? "випрямилась" : "нахилилась");
    return parts.join(" і ");
  }

  function next(){
    if(qi >= TOTAL){ NAV.finish(); return; }
    cur = PLAN[qi];
    if(cur.flip && !NAV.flipped){
      NAV.busy = true;
      NAV.modal("🔄","Навиворіт!","Над площею пролетіла чарівна зірка… і статуї стали хитрішими: тепер, коли ти відвертаєшся, <b>змінюються всі статуї, крім однієї</b>. Знайди ту, що лишилась такою самою!",{nav:true, btn:"🔄 Перевернути"}, function(){
        NAV.snd.whoosh(); NAV.flipAnim();
        setTimeout(function(){ NAV.setFlip(true); next(); }, 500);
      });
      return;
    }
    NAV.step(qi, TOTAL); NAV.$("panel").innerHTML = "";
    var figs = NAV.shuffle(FIGS.slice());
    before = [];
    for(var i=0;i<5;i++) before.push(cur.same ? {em:"🗿", face:1, tilt:0}
      : {em:figs[i], face:NAV.pick([1,-1]), tilt:NAV.pick(TILTS)});
    target = NAV.rnd(0,4);
    after = before.map(function(f,i){
      var changes = cur.flip ? i!==target : i===target;
      return changes ? changeOne(f, cur.kind) : {em:f.em, face:f.face, tilt:f.tilt};
    });
    phase = "look";
    render(before, false);
    NAV.$("curtain").classList.remove("on");
    var secs = cur.fast ? 3 : (qi===0 ? 5 : 4);
    NAV.hint(cur.flip
      ? "Запам'ятай статуї! Потім <b>усі, крім однієї,</b> зміняться — знайдеш ту, що лишилась такою самою?"
      : "Запам'ятай, як стоїть кожна статуя: куди дивиться і чи нахилена 👀");
    var bar = NAV.$("timerBar");
    bar.style.transition = "none"; bar.style.width = "100%"; bar.getBoundingClientRect();
    bar.style.transition = "width "+secs+"s linear"; bar.style.width = "0%";
    NAV.actions([{id:"turn", ic:"🙈", tx:"Я запам'ятав(-ла) — відвернутися", cls:"gold", fn:turnAway}], 1);
    NAV.busy = false;
    clearTimeout(timerT); timerT = setTimeout(turnAway, secs*1000);
  }

  function turnAway(){
    if(phase !== "look") return;
    phase = "away"; clearTimeout(timerT); NAV.busy = true;
    var bar = NAV.$("timerBar"); bar.style.transition = "none"; bar.style.width = "0%";
    NAV.$("panel").innerHTML = "";
    var c = NAV.$("curtain");
    c.innerHTML = '<div><span class="em">🙈</span>Герой відвернувся… <small>над площею — чарівний туман</small></div>';
    c.classList.add("on");
    NAV.snd.tone(300,0.15,"sine"); setTimeout(function(){ NAV.snd.tone(260,0.15,"sine"); }, 400);
    setTimeout(function(){
      render(after, true);
      c.classList.remove("on");
      phase = "find"; NAV.busy = false;
      NAV.hint(cur.flip ? "Знайди статую, яка <b>НЕ змінилась</b>!" : "Яка статуя <b>змінила</b> положення? Торкнись її!");
    }, 1500);
  }

  function pickStatue(i, b){
    if(NAV.busy || phase !== "find") return;
    NAV.snd.tap();
    if(i !== target){
      b.classList.add("bad");
      NAV.miss(cur.flip
        ? "Статуя "+(i+1)+" теж змінилась: вона "+describe(before[i], after[i])+". Шукай ту, що стоїть так само!"
        : "Статуя "+(i+1)+" стоїть так само, як і була. Спробуй ще!");
      return;
    }
    NAV.busy = true; phase = "done"; b.classList.add("good"); NAV.snd.chime();
    NAV.hint(cur.flip
      ? "Так! Статуя "+(i+1)+" лишилась такою самою — а всі інші змінились 🔄"
      : "Так! Статуя "+(i+1)+" "+describe(before[i], after[i])+".", "good");
    NAV.actions([{id:"show", ic:"👀", tx:"Як було", fn:function(){ render(before,false); NAV.hint("Ось як вони стояли до того, як ти відвернувся(-лася)."); }},
                 {id:"now", ic:"🗿", tx:"Як стало", fn:function(){ render(after,false); markGood(); NAV.hint("А ось як стоять зараз."); }},
                 {id:"next", ic:"▶", tx:qi+1<TOTAL?"Далі":"Фініш", cls:"gold", fn:function(){ qi++; next(); }}], 3);
    NAV.busy = false; phase = "review";
  }
  function markGood(){ var b = NAV.$("statues").children[target]; if(b) b.classList.add("good"); }
})();
</script>
<script type="module" src="../firebase-config.js"></script>
<script src="../sk-items.js?v=12"></script>
<script src="../sk-curriculum.js?v=8"></script>
<script src="../sk-rewards.js?v=4"></script>
<script src="../sk-prize.js?v=2"></script>
<script src="../sk-finish.js?v=6"></script>
</body>
</html>
