<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Навчання — School Kingdoms</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sk-styles.css">
<style>
  /* ── полотно сторінки (на голубому небі зі sk-styles.css) ── */
  .nv-wrap{max-width:940px;margin:0 auto;padding:clamp(12px,2.4vh,20px) 14px 20px}

  /* ══════ «Продовжити пригоду» ══════ */
  .pc{display:none;align-items:center;gap:12px;margin:0 auto clamp(14px,2.6vh,22px);
    background:linear-gradient(165deg,rgba(30,58,107,.92),rgba(13,31,61,.95));
    border:2px solid var(--gold);border-radius:18px;padding:12px 14px;
    box-shadow:0 12px 30px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14)}
  .pc.show{display:flex}
  .pc-ic{flex:0 0 auto;width:56px;height:56px;display:grid;place-items:center;border-radius:14px;
    font-size:2rem;line-height:1;background:linear-gradient(180deg,#27518c,#16356a);
    border:1.5px solid rgba(242,199,92,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .pc-mid{flex:1 1 auto;min-width:0}
  .pc-kick{display:block;font-family:'Playfair Display',serif;font-weight:900;color:#FBEFD0;font-size:1.02rem;line-height:1.1}
  .pc-meta{display:block;color:#ffe08a;font-weight:800;font-size:.78rem;margin-top:3px}
  .pc-name{display:block;color:#dce6f7;font-weight:700;font-size:.86rem;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pc-cnt{flex:0 0 auto;color:#eaf1ff;font-weight:900;font-size:.9rem;white-space:nowrap;
    background:rgba(0,0,0,.24);border:1px solid rgba(242,199,92,.4);border-radius:999px;padding:5px 12px}
  .pc-go{flex:0 0 auto;text-decoration:none;font-family:'Nunito',sans-serif;font-weight:900;
    font-size:.86rem;text-transform:uppercase;letter-spacing:.03em;color:#5a3d08;
    background:linear-gradient(180deg,#FFE7A0,#E0A93A);border:2px solid var(--gold-d);
    border-radius:13px;padding:11px 16px;box-shadow:0 8px 18px rgba(216,159,34,.4);transition:filter .15s,transform .12s}
  .pc-go:hover{filter:brightness(1.06)}
  .pc-go:active{transform:translateY(1px)}
  @media(max-width:560px){
    .pc{flex-wrap:wrap;gap:10px}
    .pc-cnt{order:3}
    .pc-go{order:4;margin-left:auto}
  }

  /* ══════ заголовок ══════ */
  .nv-head{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;
    margin:0 auto clamp(12px,2.4vh,18px);text-align:center}
  .nv-title{font-family:'Playfair Display',serif;font-weight:900;color:#FBEFD0;
    font-size:clamp(1.5rem,5vw,2.3rem);line-height:1.05;
    text-shadow:0 2px 12px rgba(0,0,0,.55),0 0 24px rgba(124,99,255,.35)}
  .nv-pill{display:inline-flex;align-items:center;gap:7px;color:#eaf1ff;font-weight:800;font-size:.82rem;
    background:rgba(255,255,255,.08);border:1.5px solid rgba(242,199,92,.5);border-radius:999px;padding:7px 14px}

  /* ══════ плитки ступенів (однакового розміру) ══════ */
  .nv-grid{display:grid;gap:clamp(12px,2.2vw,16px);
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .lv{position:relative;display:block;text-decoration:none;overflow:hidden;
    border-radius:20px;aspect-ratio:16/10;min-height:170px;
    border:2px solid rgba(242,199,92,.7);
    box-shadow:0 12px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .15s,box-shadow .15s,border-color .15s}
  a.lv:hover{transform:translateY(-3px);border-color:var(--gold);
    box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 22px -6px rgba(242,199,92,.6)}
  /* запасний градієнт під картинкою (доки картинку не додано через github) */
  .lv{background:linear-gradient(160deg,var(--g1,#27518c),var(--g2,#16356a))}
  .lv-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .lv-scrim{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,rgba(8,18,40,.15) 0%,rgba(8,18,40,.35) 45%,rgba(8,18,40,.82) 100%)}
  .lv-body{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;
    padding:14px 15px}
  .lv-ic{position:absolute;top:12px;left:14px;font-size:1.9rem;line-height:1;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.6))}
  .lv-name{font-family:'Playfair Display',serif;font-weight:900;color:#fff;
    font-size:clamp(1.15rem,3.4vw,1.5rem);line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.7)}
  .lv-sub{color:#ffe9b8;font-weight:800;font-size:.78rem;margin-top:2px;text-shadow:0 1px 5px rgba(0,0,0,.7)}
  /* прогрес */
  .lv-prog{display:flex;align-items:center;gap:9px;margin-top:9px}
  .lv-track{flex:1 1 auto;height:9px;border-radius:999px;background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.18);overflow:hidden}
  .lv-track>i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#7be0a4,#4bc47f);transition:width .5s ease}
  .lv-track.full>i{background:linear-gradient(90deg,#ffe7a0,#f4c842)}
  .lv-ptx{flex:0 0 auto;color:#eaf1ff;font-weight:900;font-size:.8rem;text-shadow:0 1px 4px rgba(0,0,0,.7)}
  /* «скоро» / замок */
  .lv-soon{margin-top:9px;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    color:#e8eef9;font-weight:900;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;
    background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px}
  .lv.locked{filter:grayscale(.25)}
  .lv.locked .lv-scrim{background:linear-gradient(180deg,rgba(8,18,40,.35),rgba(8,18,40,.85))}
  /* компактніше на телефоні — щоб три ступені гортались менше */
  @media(max-width:560px){
    .nv-grid{grid-template-columns:1fr;gap:12px}
    .lv{aspect-ratio:auto;min-height:118px}
    .lv-body{justify-content:center;padding:14px 15px 14px 64px}
    .lv-ic{top:50%;left:16px;transform:translateY(-50%);font-size:2.1rem}
  }
</style>
</head>
<body>
  <div class="bg-fallback"></div>
  <div class="stars"></div>
  <div class="moon"></div>

  <!-- СПІЛЬНИЙ ХЕДЕР (бренд + шкала Героя) вставляється через sk-header.js -->

  <main class="nv-wrap">

    <!-- ══ Продовжити пригоду (останній не завершений тест) ══ -->
    <a class="pc" id="pcCard" href="#">
      <span class="pc-ic" id="pcIc">📚</span>
      <span class="pc-mid">
        <span class="pc-kick">Продовжити пригоду</span>
        <span class="pc-meta" id="pcMeta">—</span>
        <span class="pc-name" id="pcName">—</span>
      </span>
      <span class="pc-cnt" id="pcCnt">—</span>
      <span class="pc-go">Продовжити</span>
    </a>

    <!-- ══ Заголовок ══ -->
    <div class="nv-head">
      <h1 class="nv-title">Навчання</h1>
      <span class="nv-pill">🦉 Куди вирушимо сьогодні?</span>
    </div>

    <!-- ══ Ступені ══ -->
    <div class="nv-grid">

      <!-- Дошкільнятко → сторінка дисциплін -->
      <a class="lv" id="tileDoshk" href="doshkillya.html" style="--g1:#3f7d5a;--g2:#245239">
        <img class="lv-bg" src="img/nav/doshkillyatko.webp" alt="" loading="lazy"
             onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-ic">🌱</span>
          <span class="lv-name">Дошкільнятко</span>
          <span class="lv-sub">Готуємось до школи</span>
          <span class="lv-prog"><span class="lv-track" id="barDoshk"><i></i></span><span class="lv-ptx" id="ptxDoshk">0 / 0</span></span>
        </span>
      </a>

      <!-- Молодша школа (1–4 клас) → карта тестів -->
      <a class="lv" id="tileJunior" href="tests.html#open=junior" style="--g1:#3a5aa0;--g2:#1c356b">
        <img class="lv-bg" src="img/nav/molodsha.webp" alt="" loading="lazy"
             onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-ic">🎓</span>
          <span class="lv-name">Молодша школа</span>
          <span class="lv-sub">1–4 клас</span>
          <span class="lv-prog"><span class="lv-track" id="barJunior"><i></i></span><span class="lv-ptx" id="ptxJunior">0 / 0</span></span>
        </span>
      </a>

      <!-- Старша школа (5–9 клас) → поки закрито -->
      <div class="lv locked" id="tileSenior" style="--g1:#5a4a86;--g2:#332a55" aria-disabled="true">
        <img class="lv-bg" src="img/nav/starsha.webp" alt="" loading="lazy"
             onerror="this.style.display='none'">
        <span class="lv-scrim"></span>
        <span class="lv-body">
          <span class="lv-ic">🏰</span>
          <span class="lv-name">Старша школа</span>
          <span class="lv-sub">5–9 клас</span>
          <span class="lv-soon">🔒 Скоро</span>
        </span>
      </div>

    </div>
  </main>

  <!-- ══════════════ ДАНІ: прогрес ступенів + «Продовжити» ══════════════
       Джерело те саме, що й на tests.html:
         • карта королівства  — SKCUR (sk-curriculum.js)
         • активні тести      — SK.listActiveTests()
         • прогрес Героя      — heroes/{id}.progress ∪ localStorage
       Зв'язку з адмінкою тут НЕМАЄ: плитки й дисципліни задані статично. -->
  <script>
  (function(){
    'use strict';
    var CUR = [], PROG = null;
    var gradeMap = {};   // gradeNum → { num, tests:[testObj], seen:{} }
    var order    = [];   // тести в порядку карти (для «Продовжити»), без дублів
    var oseen    = {};

    function q(id){ return document.getElementById(id); }
    function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
    function pgGet(k){ return (PROG && PROG[k]!=null) ? PROG[k] : null; }
    function truthy(v){ return v==='1'||v===1||v===true; }

    function countDoneLevels(v){
      try{ var o=(typeof v==='string')?JSON.parse(v):v;
        if(Array.isArray(o)) return o.length;
        return (o && typeof o==='object') ? Object.keys(o).length : 0;
      }catch(e){ return 0; }
    }
    function doneLevels(id){
      return Math.max(countDoneLevels(lsGet('sk_lvtest_'+id+'_done')),
                      countDoneLevels(pgGet('sk_lvtest_'+id+'_done')));
    }
    /* пройдено — ті самі правила, що на tests.html */
    function isPassed(t){
      if(truthy(lsGet('sk_testpass_'+t.id)) || truthy(pgGet('sk_testpass_'+t.id))) return true;
      if(truthy(lsGet('sk_test100_'+t.id)) || truthy(pgGet('sk_test100_'+t.id))) return true;
      if(t.isLevels && t.levelCount>0) return (doneLevels(t.id)/t.levelCount) >= SKCUR.PASS_RATIO;
      return false;
    }
    /* збережений результат тесту: {pct,correct,total,passed,at} — має час `at` */
    function scoreOf(id){
      var raw = pgGet('sk_testscore_'+id); if(raw==null) raw = lsGet('sk_testscore_'+id);
      if(raw==null) return null;
      try{ return (typeof raw==='string') ? JSON.parse(raw) : raw; }catch(e){ return null; }
    }

    function isPreTier(t){
      var s=(String(t&&t.id||'')+' '+String(t&&t.name||'')).toLowerCase();
      return s.indexOf('preschool')>=0 || s.indexOf('дошкіл')>=0;
    }
    /* плитка визначається номером класу: 0 → Дошкільнятко, 1–4 → Молодша, ≥5 → Старша */
    function tileOfGrade(gn){ gn=Number(gn)||0; if(gn===0) return 'doshk'; if(gn>=5) return 'senior'; return 'junior'; }

    /* той самий toTestObj, що на tests.html (посилання/рівні/обкладинка) */
    function toTestObj(t, subjIcon){
      var isLink = !!((t.format==='link'||t.format==='html') && t.linkHref);
      var lv = !isLink && (t.format==='levels' || (Array.isArray(t.levels) && t.levels.length));
      var href = isLink
        ? (String(t.linkHref) + (String(t.linkHref).indexOf('?')>=0?'&':'?') + 'skdone=t:' + encodeURIComponent(t.id) + '&skback=navchannia.html')
        : ('test.html?id='+encodeURIComponent(t.id));
      return { id:t.id, title:t.title||'Тест', href:href, isLink:isLink,
        isLevels:!!lv, levelCount: lv ? (Array.isArray(t.levels)?t.levels.length:0) : 0,
        icon:(subjIcon||'📝') };
    }

    function addBucket(b){
      if(!b.tests || !b.tests.length) return;
      var gn = isPreTier(b.tier) ? 0 : (Number(b.grade && b.grade.gradeNum)||0);
      var subjName = (b.subj && b.subj.name) || '';
      var subjIcon = (b.subj && b.subj.icon) || '📘';
      var g = gradeMap[gn] || (gradeMap[gn] = {num:gn, tests:[], seen:{}});
      b.tests.forEach(function(raw){
        var o = toTestObj(raw, subjIcon);
        if(!g.seen[o.id]){ g.seen[o.id]=1; g.tests.push(o); }
        if(!oseen[o.id]){ oseen[o.id]=1; order.push({t:o, gn:gn, subj:subjName}); }
      });
    }

    function buildStructure(tests){
      var P = SKCUR.placeTests(CUR, tests);
      P.topics.forEach(addBucket);
      P.subjects.forEach(addBucket);
      (P.leftovers||[]).forEach(function(raw){
        var gn = Number(raw.grade)||0;
        var g = gradeMap[gn] || (gradeMap[gn] = {num:gn, tests:[], seen:{}});
        var o = toTestObj(raw, '📦');
        if(!g.seen[o.id]){ g.seen[o.id]=1; g.tests.push(o); }
        if(!oseen[o.id]){ oseen[o.id]=1; order.push({t:o, gn:gn, subj:''}); }
      });
    }

    /* ── підрахунок + малювання (викликається знову, коли прийде PROG) ── */
    function setBar(barId, ptxId, p, tot){
      var bar=q(barId), ptx=q(ptxId); if(!bar||!ptx) return;
      var pct = tot ? Math.round(p/tot*100) : 0;
      var i = bar.querySelector('i'); if(i) i.style.width = pct+'%';
      bar.classList.toggle('full', tot>0 && p>=tot);
      ptx.textContent = p+' / '+tot;
    }

    function recount(){
      var tiles = { doshk:{p:0,t:0}, junior:{p:0,t:0}, senior:{p:0,t:0} };
      var gp = {};   // gradeNum → {p,t}
      Object.keys(gradeMap).forEach(function(k){
        var g = gradeMap[k], tk = tileOfGrade(g.num);
        g.tests.forEach(function(o){
          var pass = isPassed(o);
          tiles[tk].t++; if(pass) tiles[tk].p++;
          var gg = gp[g.num] || (gp[g.num]={p:0,t:0}); gg.t++; if(pass) gg.p++;
        });
      });

      setBar('barDoshk','ptxDoshk', tiles.doshk.p, tiles.doshk.t);
      setBar('barJunior','ptxJunior', tiles.junior.p, tiles.junior.t);
      // Старша школа лишається «Скоро» (плитка закрита)

      renderContinue(gp);
    }

    /* ── останній не завершений тест ── */
    function pickContinue(){
      // 1) розпочатий, але не пройдений — з найсвіжішим часом (sk_testscore.at)
      var best=null;
      order.forEach(function(e){
        if(isPassed(e.t)) return;
        var sc = scoreOf(e.t.id);
        if(sc && sc.at){ if(!best || sc.at>best.at) best={e:e, at:sc.at}; }
      });
      if(best) return best.e;
      // 2) інакше — перший не пройдений за порядком карти (наступний у пригоді)
      for(var i=0;i<order.length;i++){ if(!isPassed(order[i].t)) return order[i]; }
      return null;   // усе пройдено або тестів немає
    }
    function ordInGrade(gn, id){
      var g=gradeMap[gn]; if(!g) return 0;
      for(var i=0;i<g.tests.length;i++) if(g.tests[i].id===id) return i+1;
      return 0;
    }
    function renderContinue(gp){
      var card=q('pcCard'); if(!card) return;
      var c=pickContinue();
      if(!c){ card.classList.remove('show'); return; }
      var gLabel = (c.gn>0) ? (c.gn+' клас') : 'Дошкілля';
      var ord = ordInGrade(c.gn, c.t.id);
      q('pcMeta').textContent = gLabel + (ord ? (' · Тест №'+ord) : '');
      q('pcName').textContent = (c.subj ? (c.subj+'. ') : '') + c.t.title;
      q('pcIc').textContent = c.t.icon || '📚';
      var g = gp[c.gn] || {p:0,t:0};
      q('pcCnt').textContent = g.p + ' / ' + g.t;
      card.setAttribute('href', c.t.href);
      card.classList.add('show');
    }

    /* ── firebase-config.js — ES-модуль, window.SK з'являється після DOM ── */
    function whenSK(cb){
      var n=0;(function tick(){
        if(window.SK && SK.ready) return cb(window.SK);
        if(n++ < 200) setTimeout(tick,50); else cb(null);
      })();
    }
    function boot(){
      var mapP = SKCUR.ready;
      var trP  = new Promise(function(res){
        whenSK(function(SK){
          if(!SK || !SK.listActiveTests){ res([]); return; }
          SK.ready.then(function(){ return SK.listActiveTests(); }).then(res).catch(function(){ res([]); });
        });
      });
      Promise.all([mapP, trP]).then(function(r){
        CUR = SKCUR.clone((r[0] && r[0].tiers) || SKCUR.map.tiers);
        var tlist = (r[1]||[]).filter(function(t){ return !(t && t.hidden); });
        buildStructure(tlist);
        recount();          // з localStorage — миттєво
        loadHeroProgress(); // з Firebase — коли прийде, перерахуємо
      }).catch(function(){
        CUR = SKCUR.clone(SKCUR.map.tiers);
        buildStructure([]); recount();
      });
    }
    function loadHeroProgress(){
      whenSK(function(SK){
        if(!SK || !SK.getHero || !SK.isHeroSession) return;
        SK.ready.then(function(){
          try{
            if(SK.isHeroSession()){
              SK.getHero().then(function(h){ if(h){ PROG=h.progress||{}; recount(); } }).catch(function(){});
            }
          }catch(e){}
        });
      });
    }

    if(document.readyState!=='loading') boot();
    else document.addEventListener('DOMContentLoaded', boot);
  })();
  </script>

  <!-- шкала характеристик Героя (Firebase) -->
  <script type="module" src="firebase-config.js"></script>

  <!-- СПІЛЬНИЙ ХЕДЕР -->
  <script>window.SK_HEADER_SUB='Навчання';</script>
  <script src="sk-header.js"></script>

  <!-- СПІЛЬНИЙ ФУТЕР -->
  <script src="sk-footer.js?v=2" data-active="none" data-back="hero.html"></script>
</body>
</html>
