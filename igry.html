<style>
  /* ── шапка (бренд малює sk-header.js) ── */
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none}

  /* ── фон: казкова долина із замком ── */
  .pg-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:url('test-bg.webp') center bottom/cover no-repeat}

  /* ── заголовок: дерев'яна табличка на мотузках ── */
  .page-head{max-width:940px;margin:0 auto;padding:clamp(22px,4vh,40px) 16px 6px;text-align:center}
  .sign{position:relative;display:inline-flex;align-items:center;gap:12px;padding:8px 38px 10px;
    border-radius:18px;background:
      repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 9px,rgba(60,30,8,.16) 9px 11px),
      linear-gradient(180deg,#b97a3e,#8a5426 60%,#6e3f1a);
    border:3px solid #5a3212;box-shadow:inset 0 2px 0 rgba(255,220,170,.45),0 8px 18px rgba(0,0,0,.35)}
  .sign::before,.sign::after{content:"";position:absolute;top:-26px;width:6px;height:28px;border-radius:3px;
    background:repeating-linear-gradient(180deg,#c9a46a 0 4px,#8b6a3a 4px 7px)}
  .sign::before{left:26px} .sign::after{right:26px}
  .sign .sic{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
  .sign h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(2rem,8vw,3rem);line-height:1.05;
    color:#ffd94a;-webkit-text-stroke:2px #6b3a0e;paint-order:stroke fill;text-shadow:0 3px 0 #5a2f0a,0 5px 8px rgba(0,0,0,.35)}
  .sign .leaf{position:absolute;bottom:-10px;font-size:1.6rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
  .sign .leaf.l{left:-14px;transform:rotate(-20deg)} .sign .leaf.r{right:-12px;transform:scaleX(-1) rotate(-20deg)}

  /* ── контейнер ── */
  .wrap{max-width:940px;margin:0 auto;padding:14px 14px 84px}

  /* ── секція-група: кольорова рамка, кругла емблема, лічильник ── */
  details.gsec{position:relative;margin:0 0 18px;border-radius:26px;
    background:linear-gradient(180deg,var(--c1),var(--c2));
    border:3px solid var(--edge);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 12px 26px rgba(0,0,0,.32)}
  details.gsec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;
    padding:12px 14px 10px;user-select:none}
  details.gsec > summary::-webkit-details-marker{display:none}
  .gsec-ic{flex:none;width:64px;height:64px;margin:-6px 0 -6px -2px;border-radius:50%;display:grid;place-items:center;
    font-size:2rem;overflow:hidden;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.75);
    box-shadow:0 4px 10px rgba(0,0,0,.3)}
  .gsec-ic img{width:100%;height:100%;object-fit:cover;display:block}
  .gsec-name{flex:1 1 auto;min-width:0;font-family:'Nunito',sans-serif;font-weight:900;
    font-size:clamp(1.25rem,4.6vw,1.75rem);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.3)}
  .gsec-cnt{flex:none;display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:800;color:#fff;
    background:rgba(10,20,50,.38);border:2px solid rgba(255,255,255,.45);padding:5px 10px 5px 12px;border-radius:999px;white-space:nowrap}
  .gsec-arrow{font-weight:900;font-size:1.1rem;line-height:1;transition:transform .25s}
  details.gsec[open] > summary .gsec-arrow{transform:rotate(90deg)}
  .gsec-body{padding:6px 12px 14px}

  /* ── сітка ігор ── */
  .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .game-card{position:relative;display:flex;flex-direction:column;overflow:hidden;text-align:center;
    border-radius:20px;text-decoration:none;color:#4a3214;
    background:
      radial-gradient(60px 46px at 0% 100%,rgba(74,150,60,.55),transparent 70%),
      radial-gradient(60px 46px at 100% 100%,rgba(74,150,60,.55),transparent 70%),
      linear-gradient(180deg,#fdf5dd,#f2e0b4);
    border:3px solid var(--edge);box-shadow:0 8px 18px rgba(0,0,0,.3)}
  .gc-art{display:block;aspect-ratio:3/1.15;background:#8fd0f5 center/cover no-repeat}
  .gc-art.emo{display:grid;place-items:start center;padding-top:8px;font-size:2.3rem;
    background:radial-gradient(circle at 50% 120%,#7cc35a 0 38%,transparent 39%),linear-gradient(180deg,#8fd3fb,#cfeeff)}
  .gc-art.emo span{filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
  .gc-info{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 10px 12px}
  .gname{position:relative;margin-top:-16px;max-width:100%;padding:5px 16px;border-radius:10px;
    font-weight:900;font-size:clamp(.92rem,3.4vw,1.15rem);line-height:1.15;color:#3c2608;
    background:linear-gradient(180deg,#fff0c8,#f1d48f);border:2px solid #c9a058;box-shadow:0 3px 6px rgba(0,0,0,.25)}
  .gdesc{font-size:clamp(.74rem,2.8vw,.9rem);font-weight:700;line-height:1.3;color:#4a3418;padding:0 2px}
  .play{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:70%;
    background:linear-gradient(180deg,#ffe36b,#f5b81c);color:#4a2c00;border:2px solid #d08f0b;
    border-radius:999px;padding:7px 18px;font-weight:900;font-size:clamp(.9rem,3.4vw,1.1rem);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #b97a06,0 6px 10px rgba(0,0,0,.25)}
  a.game-card{transition:transform .15s,box-shadow .15s}
  a.game-card:hover{transform:translateY(-4px);box-shadow:0 14px 26px rgba(0,0,0,.4)}
  a.game-card:active{transform:translateY(-1px)}

  /* широка картка (Арена): опис ліворуч, картинка праворуч */
  .game-card.wide{grid-column:1/-1;flex-direction:row-reverse;align-items:stretch}
  .game-card.wide .gc-art{flex:1 1 56%;aspect-ratio:auto;min-height:170px}
  .game-card.wide .gc-info{flex:0 0 44%;justify-content:center;padding:12px 10px}
  .game-card.wide .gname{margin-top:0}

  /* ── банер «Світ навиворіт» (карта серії логічних ігор navyvorit/) ── */
  .nav-feat{position:relative;display:flex;align-items:center;gap:14px;margin:4px 0 18px;padding:14px 16px;
    border-radius:24px;text-decoration:none;color:#fff;overflow:hidden;
    background:linear-gradient(135deg,rgba(74,40,140,.86) 0%,rgba(120,60,190,.62) 55%,rgba(160,90,220,.35) 100%), url(navyvorit/img/bg.webp) center/cover no-repeat;
    border:3px solid #e3c3ff;box-shadow:0 12px 26px rgba(0,0,0,.32);transition:transform .15s,box-shadow .15s}
  .nav-feat:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(0,0,0,.42)}
  .nav-feat .nf-tt{flex:1 1 auto;min-width:0}
  .nav-feat .nf-new{display:inline-block;font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
    background:#ffd43b;color:#5a3d05;border-radius:999px;padding:2px 8px;margin-bottom:4px}
  .nav-feat .nf-name{display:block;font-weight:900;font-size:1.3rem;line-height:1.15}
  .nav-feat .nf-desc{display:block;font-size:.8rem;color:#f1e6ff;font-weight:700;line-height:1.35;margin-top:3px}
  .nav-feat .nf-games{display:block;font-size:1.05rem;margin-top:6px;letter-spacing:2px}
  .nav-feat .play{flex:none;min-width:0;white-space:nowrap}
  .nav-feat .nf-cover{flex:none;width:96px;height:96px;border-radius:18px;object-fit:cover;border:2px solid rgba(255,255,255,.55);box-shadow:0 6px 14px rgba(0,0,0,.3)}
  @media(max-width:520px){
    .nav-feat{flex-wrap:wrap}
    .nav-feat .nf-cover{width:84px;height:84px}
    .nav-feat .play{width:100%}
  }

  .empty-note{color:#fff;font-weight:700;text-align:center;padding:20px 10px;margin-bottom:14px;
    background:rgba(10,30,70,.55);border:2px dashed rgba(255,255,255,.5);border-radius:16px}

  @media(max-width:400px){
    .game-grid{grid-template-columns:1fr 1fr;gap:10px}
    .gc-info{padding:0 7px 10px}
    .gname{padding:4px 10px}
    .play{padding:6px 12px}
    .gsec-ic{width:54px;height:54px}
  }
</style>

<script>
/* ============================================================
   ІГРОТЕКА — джерело даних.
   Ігри беруться з бази (документ curriculum/games, керується в адмінці →
   вкладка «🕹 Ігри»). Доки в базі немає документа — показуємо вбудований
   GAMES_DEFAULT (ті самі ігри, що були зашиті раніше), тож нічого не губиться.
   Ігри групуються за полем group у згортувані секції + фільтр-чіпи (той самий
   підхід, що й вкладки в бібліотеці: порожня група → «Інші», завжди останньою).
   ============================================================ */
var GAMES_DEFAULT = [
  { href:'games/zabig.html',            icon:'🏃', name:'Королівський Забіг',      desc:'Стрибай через перешкоди й збирай загін тваринок.', group:'Аркади', blank:true },
  { href:'games/zmiyka.html',           icon:'🐍', name:'Королівська Змійка',      desc:'Веди змійку до яблучок і рости що довша, то швидше.', group:'Аркади', blank:true },
  { href:'games/hrestyky.html',         icon:'✕◯', name:'Хрестики-нулики',         desc:'Зіграй проти друга або проти компʼютера.', group:'Логіка та памʼять', blank:true },
  { href:'games/shashky.html',          icon:'🔴⚪', name:'Королівські шашки',      desc:'Бий обовʼязково, дійди до кінця дошки — і стань дамкою.', group:'Логіка та памʼять', blank:true },
  { href:'games/shakhy.html',           icon:'♔♞', name:'Королівські шахи',        desc:'Справжні шахи з рокіровкою — проти друга або компʼютера.', group:'Логіка та памʼять', blank:true },
  { href:'games/kartynka.html',         icon:'🧩', name:'Картинка-пазл',           desc:'Збери картинку з частинок: замок, ракета, котик, веселка.', group:'Логіка та памʼять', blank:true },
  { href:'games/pamyat.html',           icon:'🧠', name:"Пам'ять королівства",     desc:'Перевертай картки й шукай однакові пари.', group:'Логіка та памʼять', blank:true }
];

/* Порядок і оформлення відомих груп: емблема (img або емодзі), кольори панелі
   c1→c2 і світла рамка edge. Невідомі групи йдуть після відомих (за абеткою),
   порожня група → «Інші», завжди останньою. */
var GROUP_ORDER = ['Логіка та памʼять','Аркади','RPG ігри','Українська мова','Я досліджую світ','Математика'];
var GROUP_META = {
  'Логіка та памʼять':  { ic:'🔮', img:'img/games/sec-logic.webp',  c1:'#2ba7ad', c2:'#146a79', edge:'#9ff0e6' },
  'Аркади':             { ic:'🎡', img:'img/games/sec-arcade.webp', c1:'#8d66e3', c2:'#5a3cb4', edge:'#d9c6ff' },
  'RPG ігри':           { ic:'🎮', img:'img/games/sec-rpg.webp',    c1:'#3f8bec', c2:'#1f4fb5', edge:'#b9dcff' },
  'Українська мова':    { ic:'❤️', c1:'#e06a8c', c2:'#a83a5e', edge:'#ffd0de' },
  'Я досліджую світ':   { ic:'🏃', c1:'#eda05a', c2:'#b7642a', edge:'#ffe0bd' },
  'Математика':         { ic:'🎯', c1:'#6a79d0', c2:'#3c489c', edge:'#cfd6ff' },
  'Інші':               { ic:'✨', c1:'#8a74ff', c2:'#5240c4', edge:'#dcd3ff' }
};
/* Картинки карток для вбудованих ігор (у базі можна задати власну — поле img). */
var GAME_IMG = {
  'games/kartynka.html':'img/games/kartynka.webp',
  'games/hrestyky.html':'img/games/hrestyky.webp',
  'games/zabig.html':'img/games/zabig.webp',
  'games/zmiyka.html':'img/games/zmiyka.webp',
  'arena.html':'img/games/arena.webp'
};
/* Арена завжди в ігротеці (як і банер «Світ навиворіт») — незалежно від бази. */
var ARENA_CARD = { href:'arena.html', icon:'⚔️', name:'Арена', desc:'Помірися силами з друзями або компʼютером.', group:'RPG ігри', wide:true };
var OTHER = 'Інші';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function metaFor(name){ return GROUP_META[name] || GROUP_META[OTHER]; }
function gamesWord(n){
  var d = n % 10, h = n % 100;
  if(d === 1 && h !== 11) return n + ' гра';
  if(d >= 2 && d <= 4 && (h < 12 || h > 14)) return n + ' гри';
  return n + ' ігор';
}

var GAMES = [];
var GROUPS = [];        // [{name, items:[...]}] у порядку показу

/* Групування: зберігаємо порядок GROUP_ORDER, далі — інші групи за абеткою,
   наприкінці — «Інші» (порожня/невідома). */
function buildGroups(list){
  var byName = {};
  var order = [];
  list.forEach(function(g){
    var name = (g && g.group ? String(g.group).trim() : '') || OTHER;
    if(!byName[name]){ byName[name] = []; order.push(name); }
    byName[name].push(g);
  });
  var known = GROUP_ORDER.filter(function(n){ return byName[n]; });
  var extra = order.filter(function(n){ return GROUP_ORDER.indexOf(n) < 0 && n !== OTHER; })
                   .sort(function(a,b){ return a.localeCompare(b,'uk'); });
  var tail = byName[OTHER] ? [OTHER] : [];
  return known.concat(extra, tail).map(function(n){ return { name:n, items:byName[n] }; });
}

function cardHtml(g){
  var tgt = g.blank ? ' target="_blank" rel="noopener"' : '';
  var img = g.img || GAME_IMG[String(g.href || '').replace(/^(?:\.\/)+/, '')];
  var art = img
    ? '<span class="gc-art" style="background-image:url(\'' + esc(img) + '\')"></span>'
    : '<span class="gc-art emo"><span>' + esc(g.icon || '🎮') + '</span></span>';
  return '<a class="game-card' + (g.wide ? ' wide' : '') + '" href="' + esc(g.href) + '"' + tgt + '>'
    + art
    + '<span class="gc-info">'
      + '<span class="gname">' + esc(g.name || '') + '</span>'
      + '<span class="gdesc">' + esc(g.desc || '') + '</span>'
      + '<span class="play">Грати ▶</span>'
    + '</span>'
    + '</a>';
}

function secIcon(m){
  return m.img ? '<img src="' + esc(m.img) + '" alt="">' : m.ic;
}

function renderSecs(){
  var host = document.getElementById('gsecs');
  if(!GROUPS.length){
    host.innerHTML = '<div class="empty-note">Ігор поки немає.</div>';
    return;
  }
  host.innerHTML = GROUPS.map(function(gr){
    var m = metaFor(gr.name);
    var grid = '<div class="game-grid">' + gr.items.map(cardHtml).join('') + '</div>';
    return '<details class="gsec" open style="--c1:' + m.c1 + ';--c2:' + m.c2 + ';--edge:' + m.edge + '">'
      + '<summary>'
        + '<span class="gsec-ic">' + secIcon(m) + '</span>'
        + '<span class="gsec-name">' + esc(gr.name) + '</span>'
        + '<span class="gsec-cnt">🎮 ' + gamesWord(gr.items.length) + ' <span class="gsec-arrow">›</span></span>'
      + '</summary>'
      + '<div class="gsec-body">' + grid + '</div>'
      + '</details>';
  }).join('');
}

function render(){
  var list = GAMES.slice();
  if(!list.some(function(g){ return /(^|\/)arena\.html$/.test(String((g && g.href) || '')); })) list.push(ARENA_CARD);
  GROUPS = buildGroups(list);
  renderSecs();
}

/* window.SK — модуль (defer). Чекаємо, поки зʼявиться, тоді читаємо базу. */
function whenSK(cb){
  if(window.SK){ cb(); return; }
  var n = 0;
  var t = setInterval(function(){
    if(window.SK || n++ > 100){ clearInterval(t); cb(); }
  }, 50);
}

/* ── ОФЛАЙН ──
   sw.js кешує ігротеку й ігри, тож без інтернету в них можна грати.
   Останній список із бази тримаємо в localStorage — офлайн показуємо саме
   його (а не вбудований), і кажемо sw.js докешувати ігри з цього списку. */
var GAMES_LS = 'sk_games_cache';
function lsGames(){
  try{ var d = JSON.parse(localStorage.getItem(GAMES_LS) || 'null'); return Array.isArray(d) && d.length ? d : null; }
  catch(e){ return null; }
}
/* Світ навиворіт — карта й ігри серії теж мають працювати без інтернету */

  'navyvorit/hodynnykova-vezha.html','navyvorit/budynok-z-dveryma.html','navyvorit/budynok-yakoho-nemaye.html',

  'navyvorit/poshta.html','navyvorit/kit.html','navyvorit/dzerkalna-kimnata.html','navyvorit/knyhy.html','navyvorit/laboratoriya.html',
  'navyvorit/shakhova-pidloha.html','navyvorit/try-klyuchi.html','navyvorit/zaliznytsia.html',

function warmOffline(list){
  try{
    if(!navigator.serviceWorker || !navigator.serviceWorker.controller) return;
    navigator.serviceWorker.controller.postMessage({ type:'sk-warm',
      pages: list.map(function(g){ return g && g.href; }).filter(Boolean).concat(NAV_PAGES) });
  }catch(e){}
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(){
    return navigator.serviceWorker.ready;
  }).then(function(){
    // перший візит: sw.js ще не керує сторінкою — чекаємо, доки перейме
    if(navigator.serviceWorker.controller) warmOffline(GAMES);
    else navigator.serviceWorker.addEventListener('controllerchange', function(){ warmOffline(GAMES); }, { once:true });
  }).catch(function(){});
}
function showOfflineNote(){
  var el = document.getElementById('gOffline');
  if(el) el.hidden = navigator.onLine !== false;
}
window.addEventListener('online', showOfflineNote);
window.addEventListener('offline', showOfflineNote);
showOfflineNote();

/* Тренажери «Дошкільнятка» (doshkilya/) і «1 класу» (klas-1/) живуть у своїх
   розділах — в ігротеці їх не показуємо, навіть якщо вони ще лишились у базі. */
function onlyGames(list){
  return (list || []).filter(function(g){
    return !/^(?:\.{0,2}\/)*(?:klas-1|doshkilya)\//i.test(String((g && g.href) || '').trim());
  });
}

// показуємо збережений (або вбудований) список одразу, тоді уточнюємо з бази
GAMES = onlyGames(lsGames() || GAMES_DEFAULT);
render();

whenSK(async function(){
  try{
    if(navigator.onLine !== false && window.SK && window.SK.getGames){
      var d = await window.SK.getGames();
      if(d && Array.isArray(d.games) && d.games.length){
        GAMES = onlyGames(d.games);
        try{ localStorage.setItem(GAMES_LS, JSON.stringify(GAMES)); }catch(e){}
        render();
        warmOffline(GAMES);
      }
    }
  }catch(e){ /* лишаємо збережений / вбудований список */ }
});
</script>
