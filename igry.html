<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ігри — School Kingdoms</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sk-styles.css">
<style>
  /* ── шапка (бренд малює sk-header.js) ── */
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none}

  /* ── заголовок сторінки ── */
  .page-head{max-width:940px;margin:0 auto;padding:clamp(14px,3vh,30px) 20px 4px;text-align:center}
  .page-head h1{font-family:'Playfair Display',serif;font-weight:900;
    font-size:clamp(1.5rem,5vw,2.2rem);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .page-head h1 b{color:var(--gold)}
  .page-head p{color:#cdd8ef;font-weight:600;margin-top:6px;font-size:.92rem}

  /* ── контейнер ── */
  .wrap{max-width:940px;margin:0 auto;padding:14px 18px 84px}

  /* ── панель керування: фільтр-чіпи + згорнути/розгорнути ── */
  .gtoolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 16px}
  .chips-row{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 auto}
  .gchip{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
    font-weight:800;font-size:.82rem;color:#dce6f7;padding:8px 13px;border-radius:999px;
    background:rgba(9,20,42,.6);border:1.5px solid rgba(255,255,255,.14);transition:.15s}
  .gchip:hover{border-color:rgba(242,199,92,.5);color:#fff}
  .gchip.active{background:linear-gradient(180deg,#f4c842,#e0a42a);color:#5a3d05;border-color:var(--gold-d)}
  .gchip .cnt{font-size:.72rem;font-weight:900;opacity:.85}
  .gchip .dot{width:11px;height:11px;border-radius:4px;flex-shrink:0;box-shadow:0 0 0 2px rgba(255,255,255,.14)}
  .gexpand{display:inline-flex;gap:6px;flex:0 0 auto}
  .gexpand .btn-sm{cursor:pointer;font-weight:800;font-size:.75rem;color:#dce6f7;
    background:rgba(9,20,42,.6);border:1.5px solid rgba(255,255,255,.14);border-radius:10px;padding:7px 11px;transition:.15s}
  .gexpand .btn-sm:hover{border-color:rgba(242,199,92,.5);color:#fff}

  /* ── секція-група (згортувана) ── */
  details.gsec{margin:0 0 14px;border-radius:18px;overflow:hidden;
    background:linear-gradient(165deg,rgba(30,52,92,.5),rgba(12,28,54,.6));
    border:2px solid var(--accent,#7C63FF);box-shadow:0 10px 26px rgba(0,0,0,.36)}
  details.gsec > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;
    padding:14px 16px;user-select:none;border-left:8px solid var(--accent,#7C63FF)}
  details.gsec > summary::-webkit-details-marker{display:none}
  .gsec-ic{font-size:1.7rem;line-height:1;flex-shrink:0;width:50px;height:50px;display:grid;place-items:center;
    border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18)}
  .gsec-tt{flex:1 1 auto;min-width:0}
  .gsec-name{font-family:'Playfair Display',serif;font-weight:800;font-size:1.1rem;color:#fff}
  .gsec-sub{font-size:.76rem;color:#c6d3ea;font-weight:700;margin-top:2px}
  .gsec-cnt{flex:0 0 auto;font-size:.72rem;font-weight:900;color:#eaf1ff;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);padding:5px 11px;border-radius:999px;white-space:nowrap}
  .gsec-arrow{font-size:1.05rem;color:#f0d9a6;transition:transform .25s;flex-shrink:0}
  details.gsec[open] > summary .gsec-arrow{transform:rotate(180deg)}
  .gsec-body{padding:8px 14px 16px}

  /* ── сітка ігор ── */
  .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .game-card{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;
    border-radius:20px;padding:18px 14px 14px;text-decoration:none;color:#fff;
    background:linear-gradient(165deg,rgba(30,52,92,.6),rgba(12,28,54,.66));
    border:2px solid rgba(242,199,92,.5);box-shadow:0 12px 30px rgba(0,0,0,.38)}
  .game-card .emoji{font-size:2.5rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .game-card .gname{font-family:'Playfair Display',serif;font-weight:800;font-size:1rem}
  .game-card .gdesc{font-size:.75rem;color:#c6d3ea;font-weight:600;line-height:1.3;padding-bottom:10px}
  .game-card .play{margin-top:auto;padding-top:0;display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(180deg,#FFE7A0,#E0A93A);color:#5a3d08;border:2px solid var(--gold-d);
    border-radius:999px;padding:8px 20px;font-weight:900;font-size:.85rem}
  a.game-card{transition:transform .15s,box-shadow .15s,border-color .15s}
  a.game-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 16px 34px rgba(0,0,0,.46)}
  a.game-card:active{transform:translateY(-1px)}

  .empty-note{color:#cdd8ef;font-weight:600;text-align:center;padding:30px 10px;
    background:rgba(255,255,255,.05);border:1px dashed rgba(242,199,92,.4);border-radius:16px}

  @media(max-width:400px){ .game-grid{grid-template-columns:1fr 1fr} }

</style>
</head>
<body>
  <div class="bg-fallback"></div>
  <div class="stars"></div>
  <div class="moon"></div>

  <!-- СПІЛЬНИЙ ХЕДЕР (бренд + шкала Героя) вставляється через sk-header.js -->

  <div class="page-head">
    <h1>🎮 <b>Ігротека</b> королівства</h1>
    <p>Обери гру, грай і відпочивай між тестами. Ігри згруповано за напрямом.</p>
  </div>

  <main class="wrap">
    <div class="gtoolbar" id="gtoolbar" hidden>
      <div class="chips-row" id="gchips"></div>
      <div class="gexpand">
        <button class="btn-sm" id="gCollapse">▸ Згорнути всі</button>
        <button class="btn-sm" id="gExpand">▾ Розгорнути всі</button>
      </div>
    </div>
    <div id="gsecs"></div>
  </main>

<script src="sk-footer.js?v=1"></script>

<script type="module" src="firebase-config.js"></script>
<script>window.SK_HEADER_SUB='Ігротека королівства';</script>
<script src="sk-header.js"></script>

<script>
/* ============================================================
   ІГРОТЕКА — джерело даних.
   Ігри беруться з бази (документ curriculum/games, керується в адмінці →
   вкладка «🕹 Ігри»). Доки в базі немає документа — показуємо вбудований
   GAMES_DEFAULT (ті самі ігри, що були зашиті раніше), тож нічого не губиться.
   Ігри групуються за полем group у згортувані секції + фільтр-чіпи (той самий
   підхід, що й вкладки в бібліотеці: порожня група → «Інші», завжди останньою).
   ============================================================ */
var GAMES_DEFAULT = [
  { href:'komputer.html',         icon:'🕵️', name:"Комп'ютерний детектив", desc:"Слухай завдання й упізнавай частини комп'ютера.", group:'Я досліджую світ', blank:true },
  { href:'zabig.html',            icon:'🏃', name:'Королівський Забіг',      desc:'Стрибай через перешкоди й збирай загін тваринок.', group:'Аркади', blank:true },
  { href:'zmiyka.html',           icon:'🐍', name:'Королівська Змійка',      desc:'Веди змійку до яблучок і рости що довша, то швидше.', group:'Аркади', blank:true },
  { href:'hrestyky.html',         icon:'✕◯', name:'Хрестики-нулики',         desc:'Зіграй проти друга або проти компʼютера.', group:'Логіка та памʼять', blank:true },
  { href:'shashky.html',          icon:'🔴⚪', name:'Королівські шашки',      desc:'Бий обовʼязково, дійди до кінця дошки — і стань дамкою.', group:'Логіка та памʼять', blank:true },
  { href:'shakhy.html',           icon:'♔♞', name:'Королівські шахи',        desc:'Справжні шахи з рокіровкою — проти друга або компʼютера.', group:'Логіка та памʼять', blank:true },
  { href:'kartynka.html',         icon:'🧩', name:'Картинка-пазл',           desc:'Збери картинку з частинок: замок, ракета, котик, веселка.', group:'Логіка та памʼять', blank:true },
  { href:'pamyat.html',           icon:'🧠', name:"Пам'ять королівства",     desc:'Перевертай картки й шукай однакові пари.', group:'Логіка та памʼять', blank:true },
  { href:'slovo.html',            icon:'🔤', name:'Вгадай слово',            desc:'Відгадуй слово по буквах, доки є сердечка.', group:'Українська мова', blank:true },
  { href:'labirynt.html',         icon:'🌀', name:'Математичний лабіринт',   desc:"Розв'язуй приклади й прокладай шлях до замку.", group:'Математика', blank:true },
  { href:'notky.html',            icon:'🎵', name:'Нотна математика',        desc:"Розв'язуй приклади й грай справжню мелодію на ксилофоні.", group:'Математика', blank:true },
  { href:'sklad.html',            icon:'🏠', name:'Будиночки чисел',         desc:'Склад числа: засели поверхи так, щоб разом вийшло число з даху.', group:'Математика', blank:true },
  { href:'susidy.html',           icon:'🏘️', name:'Цифри-сусіди',           desc:'Постав числа-сусіди: яке перед, а яке після. Числа до 19.', group:'Математика', blank:true },
  { href:'ryad.html',             icon:'🔢', name:'Числовий ряд',            desc:'Знайди пропущене число у ряду зірочок, сердечок і тістечок.', group:'Математика', blank:true },
  { href:'pazly.html',            icon:'🧩', name:'Математичні пазли',       desc:'Збери корону, вставляючи частинку, якої не вистачає у прикладі.', group:'Математика', blank:true },
  { href:'komponenty.html',       icon:'🏷️', name:'Компоненти дій',         desc:"Підпиши деталі рівності: доданок, сума, зменшуване, від'ємник, різниця.", group:'Математика', blank:true },
  { href:'rozriady.html',         icon:'🔟', name:'Десятки і одиниці',       desc:'Виклади число паличками й кубиками. Десять одиниць — і збереться десяток.', group:'Математика', blank:true },
  { href:'chas.html',             icon:'🕰️', name:'Годинник королівства',   desc:'Читай стрілки й став їх сам. Година, доба, тиждень.', group:'Математика', blank:true },
  { href:'zadachi-zapys.html',    icon:'📝', name:'Задачі: короткий запис',  desc:'Прочитай задачу й склади її короткий запис, а тоді обчисли.', group:'Математика', blank:true },
  { href:'zadachi-malyunok.html', icon:'🖼️', name:'Задачі за малюнком',     desc:'Порахуй на малюнку: скільки стало разом і скільки залишилося.', group:'Математика', blank:true },
  { href:'zadachi-diya.html',     icon:'➕', name:'Вибери правильну дію',    desc:'Стало більше чи менше? Постав + або − і розвʼяжи задачу.', group:'Математика', blank:true },
  { href:'hroshi.html',           icon:'🪙', name:'Королівський гаманець',   desc:'Кидай монети в гаманець і збери рівно стільки, скільки коштує товар.', group:'Математика', blank:true },
  { href:'heometriya.html',       icon:'📐', name:'Королівська геометрія',   desc:'Крейда малює фігури: точка, відрізок, ламана, коло, круг, трикутник, квадрат, прямокутник.', group:'Математика', blank:true },
  { href:'lohika.html',           icon:'🧠', name:'Вежа Логіки',            desc:'Закономірності, ряди, зайве, магічні квадрати, судоку й лабіринти.', group:'Логіка та памʼять', blank:true }
];

/* Порядок і оформлення відомих груп (мапінг напрям → характеристика Героя,
   як на карті королівства). Невідомі групи йдуть після відомих (за абеткою),
   порожня група → «Інші», завжди останньою. */
var GROUP_ORDER = ['Українська мова','Я досліджую світ','Логіка та памʼять','Математика','Аркади'];
var GROUP_META = {
  'Українська мова':    { ic:'❤️', sub:"Здоров'я", accent:'#D6577A' },
  'Я досліджую світ':   { ic:'🏃', sub:'Спритність', accent:'#E0954E' },
  'Логіка та памʼять':  { ic:'🔮', sub:'Мана', accent:'#3FB6A8' },
  'Математика':         { ic:'🎯', sub:'Точність', accent:'#5C6BC0' },
  'Аркади':             { ic:'🎡', sub:'Відпочинок', accent:'#9B6BD6' },
  'Інші':               { ic:'✨', sub:'Різне', accent:'#7C63FF' }
};
var OTHER = 'Інші';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function metaFor(name){ return GROUP_META[name] || { ic:'🎮', sub:'Ігри', accent:'#7C63FF' }; }

var GAMES = [];
var GROUPS = [];        // [{name, items:[...]}] у порядку показу
var filter = 'all';

/* Групування: зберігаємо порядок GROUP_ORDER, далі — інші групи за абеткою,
   наприкінці — «Інші» (порожня/невідома). */
function buildGroups(list){
  var byName = {};
  var order = [];
  list.forEach(function(g){
    var name = (g && g.group ? String(g.group).trim() : '') || OTHER;
    if(!byName[name]){ byName[name] = []; order.push(name); }
    byName[name].push(g);
  });
  var known = GROUP_ORDER.filter(function(n){ return byName[n]; });
  var extra = order.filter(function(n){ return GROUP_ORDER.indexOf(n) < 0 && n !== OTHER; })
                   .sort(function(a,b){ return a.localeCompare(b,'uk'); });
  var tail = byName[OTHER] ? [OTHER] : [];
  return known.concat(extra, tail).map(function(n){ return { name:n, items:byName[n] }; });
}

function cardHtml(g){
  var tgt = g.blank ? ' target="_blank" rel="noopener"' : '';
  return '<a class="game-card" href="' + esc(g.href) + '"' + tgt + '>'
    + '<span class="emoji">' + esc(g.icon || '🎮') + '</span>'
    + '<span class="gname">' + esc(g.name || '') + '</span>'
    + '<span class="gdesc">' + esc(g.desc || '') + '</span>'
    + '<span class="play">Грати ▶</span>'
    + '</a>';
}

function renderChips(){
  var box = document.getElementById('gchips');
  var total = GAMES.length;
  var html = '<span class="gchip' + (filter === 'all' ? ' active' : '') + '" data-f="all">'
    + '🎲 Усі <span class="cnt">' + total + '</span></span>';
  GROUPS.forEach(function(gr){
    var m = metaFor(gr.name);
    html += '<span class="gchip' + (filter === gr.name ? ' active' : '') + '" data-f="' + esc(gr.name) + '">'
      + '<span class="dot" style="background:' + m.accent + '"></span>'
      + esc(gr.name) + ' <span class="cnt">' + gr.items.length + '</span></span>';
  });
  box.innerHTML = html;
}

function renderSecs(){
  var host = document.getElementById('gsecs');
  var shown = GROUPS.filter(function(gr){ return filter === 'all' || filter === gr.name; });
  if(!shown.length){
    host.innerHTML = '<div class="empty-note">Ігор поки немає.</div>';
    return;
  }
  host.innerHTML = shown.map(function(gr){
    var m = metaFor(gr.name);
    var grid = '<div class="game-grid">' + gr.items.map(cardHtml).join('') + '</div>';
    return '<details class="gsec" open style="--accent:' + m.accent + '">'
      + '<summary>'
        + '<span class="gsec-ic">' + m.ic + '</span>'
        + '<span class="gsec-tt"><span class="gsec-name">' + esc(gr.name) + '</span>'
        + '<span class="gsec-sub">' + esc(m.sub) + '</span></span>'
        + '<span class="gsec-cnt">' + gr.items.length + ' ігор</span>'
        + '<span class="gsec-arrow">▾</span>'
      + '</summary>'
      + '<div class="gsec-body">' + grid + '</div>'
      + '</details>';
  }).join('');
}

function render(){
  GROUPS = buildGroups(GAMES);
  document.getElementById('gtoolbar').hidden = (GROUPS.length <= 1);
  renderChips();
  renderSecs();
}

/* події */
document.getElementById('gchips').addEventListener('click', function(e){
  var chip = e.target.closest('.gchip');
  if(!chip) return;
  filter = chip.dataset.f || 'all';
  renderChips();
  renderSecs();
});
document.getElementById('gCollapse').addEventListener('click', function(){
  document.querySelectorAll('details.gsec').forEach(function(d){ d.open = false; });
});
document.getElementById('gExpand').addEventListener('click', function(){
  document.querySelectorAll('details.gsec').forEach(function(d){ d.open = true; });
});

/* window.SK — модуль (defer). Чекаємо, поки зʼявиться, тоді читаємо базу. */
function whenSK(cb){
  if(window.SK){ cb(); return; }
  var n = 0;
  var t = setInterval(function(){
    if(window.SK || n++ > 100){ clearInterval(t); cb(); }
  }, 50);
}

// показуємо вбудований список одразу (швидко), тоді уточнюємо з бази
GAMES = GAMES_DEFAULT.slice();
render();

whenSK(async function(){
  try{
    if(window.SK && window.SK.getGames){
      var d = await window.SK.getGames();
      if(d && Array.isArray(d.games) && d.games.length){
        GAMES = d.games;
        render();
      }
    }
  }catch(e){ /* лишаємо вбудований список */ }
});
</script>
</body>
</html>
