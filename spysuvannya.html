:root{
  --blue:#16305c; --blue2:#0d1f3d; --gold:#e0a42a; --line:#9fb4dd;
  --ink:#22314f; --paper:#fff; --panel:#f4f7fd;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Nunito",system-ui,sans-serif;color:var(--ink);
  background:#e9eef7;
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
}
.start-top{position:sticky;top:0;left:0;z-index:20;padding:8px 10px}
.iconbtn{
  width:44px;height:44px;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(180deg,#1c3b6e,#122a52);color:#efd9a0;
  font-size:1.4rem;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.25)
}
.iconbtn:active{transform:translateY(1px)}

.wrap{max-width:1080px;margin:0 auto;padding:4px 12px 24px;
  display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media(max-width:820px){ .wrap{grid-template-columns:1fr} }

.panel{
  background:var(--panel);border:2px solid #dbe6fb;border-radius:18px;
  padding:16px;position:sticky;top:60px;
  box-shadow:0 6px 20px rgba(22,48,92,.08)
}
.panel h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.25rem;
  margin:0 0 2px;color:var(--blue)}
.panel .sub{margin:0 0 14px;font-size:.82rem;color:#6b7a99;font-weight:700}
.grp{margin:0 0 14px}
.grp>label,.lbl{display:block;font-weight:800;font-size:.8rem;color:#41527a;
  margin:0 0 6px;letter-spacing:.02em;text-transform:uppercase}
textarea{
  width:100%;min-height:96px;resize:vertical;border:2px solid #cdd9f2;
  border-radius:12px;padding:10px 12px;font-family:"Nunito",sans-serif;
  font-size:1rem;font-weight:700;color:var(--ink);background:#fff;line-height:1.35}
textarea:focus{outline:none;border-color:var(--gold)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid #cdd9f2;background:#fff;color:#3a4c73;border-radius:999px;
  padding:6px 12px;font-weight:800;font-size:.8rem;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--gold)}
.chip:active{transform:translateY(1px)}

.seg{display:flex;gap:6px;background:#e6edfb;border-radius:12px;padding:4px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px 6px;
  font-family:inherit;font-weight:800;font-size:.85rem;color:#5a6a8a;cursor:pointer}
.seg button.on{background:#fff;color:var(--blue);
  box-shadow:0 2px 6px rgba(22,48,92,.15)}

.chk{display:flex;align-items:center;gap:9px;font-weight:800;font-size:.9rem;
  color:#41527a;cursor:pointer;user-select:none}
.chk input{width:20px;height:20px;accent-color:var(--gold)}

.print{display:flex;gap:10px;margin-top:6px}
.print button{flex:1;border:none;border-radius:13px;padding:13px 8px;cursor:pointer;
  font-family:"Fredoka",sans-serif;font-weight:700;font-size:1rem;color:#5a3d05;
  background:linear-gradient(180deg,#fdeeb6,#f4c842);border:2px solid #fff6d8;
  box-shadow:0 3px 10px rgba(224,164,42,.35)}
.print button:active{transform:translateY(1px)}
.hint{font-size:.72rem;color:#8492ad;margin-top:8px;font-weight:700;line-height:1.4}

.stage{min-width:0}
.sheet{
  background:var(--paper);border-radius:6px;overflow:hidden;
  box-shadow:0 10px 30px rgba(22,48,92,.18);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  margin:0 auto;max-width:820px}
.sheet svg{display:block;width:100%;height:auto}

@media print{
  @page{margin:0}
  html,body{background:#fff;margin:0;padding:0}
  .noprint,.start-top,.panel,.botnav{display:none!important}
  .wrap{display:block;max-width:none;margin:0;padding:0}
  .stage{min-width:0}
  .sheet{max-width:none;margin:0;border-radius:0;box-shadow:none}
  .sheet svg{width:100%;height:100vh}
}
</style>
</head>
<body>

<div class="start-top noprint">
  <button class="iconbtn" onclick="location.href='tests.html'" title="Назад до тестів" aria-label="Назад до тестів">&larr;</button>
</div>

<div class="wrap">

  <aside class="panel noprint">
    <h1>Списування</h1>
    <p class="sub">1 клас · косая лінійка / клітинка</p>

    <div class="grp">
      <label for="txt">Текст для аркуша</label>
      <textarea id="txt" placeholder="Введи літери, склади, речення або цифри…&#10;Кожен рядок — окремо."></textarea>
    </div>

    <div class="grp">
      <span class="lbl">Або обери шаблон</span>
      <div class="chips" id="chips"></div>
    </div>

    <div class="grp">
      <span class="lbl">Аркуш</span>
      <div class="seg" id="segPaper">
        <button data-v="liniya" class="on">Коса лінійка</button>
        <button data-v="grid">Клітинка</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">Знаки</span>
      <div class="seg" id="segStyle">
        <button data-v="dot" class="on">Пунктир</button>
        <button data-v="gray">Сірі</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">Розмір</span>
      <div class="seg" id="segSize">
        <button data-v="big" class="on">Великий</button>
        <button data-v="mid">Середній</button>
      </div>
    </div>

    <div class="grp">
      <span class="lbl">Режим</span>
      <div class="seg" id="segMode">
        <button data-v="trace" class="on">Обведи</button>
        <button data-v="copy">Спиши</button>
      </div>
    </div>

    <div class="grp">
      <label class="chk"><input type="checkbox" id="chkName" checked> Рядок «Ім'я / Дата»</label>
    </div>

    <div class="grp">
      <label class="chk"><input type="checkbox" id="chkDecor" checked> Оздоблення (для друку кольором)</label>
    </div>

    <div class="print">
      <button onclick="printPaper('A4')">🖨 Друк A4</button>
      <button onclick="printPaper('A5')">🖨 Друк A5</button>
    </div>
    <p class="hint">«Обведи» — усі знаки пунктиром для трасування. «Спиши» — зразок зверху, під ним порожній рядок. Шаблон «Цифри» вмикає клітинку.</p>
  </aside>

  <main class="stage">
    <div class="sheet"><svg id="page" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision"></svg></div>
  </main>

</div>

  }

  /* ---- декоративні елементи (вектор, у стилі шаблонів) ---- */
  function P(d,attrs){ attrs=attrs||{}; attrs.d=d; return el("path",attrs); }
  function starPath(cx,cy,R,r,rotDeg){
    var out="", rot=(rotDeg==null?-90:rotDeg)*Math.PI/180;
    for(var i=0;i<10;i++){
      var ang=rot+i*Math.PI/5, rad=(i%2===0)?R:r;
      out+=(i?" L":"M")+(cx+rad*Math.cos(ang)).toFixed(2)+","+(cy+rad*Math.sin(ang)).toFixed(2);
    }
    return out+" Z";
  }
  function heart(cx,cy,s,fill,stroke,sw){
    var d="M"+cx+","+(cy+s*0.9)
      +" C"+(cx-s*1.1)+","+(cy-s*0.2)+" "+(cx-s*0.5)+","+(cy-s*1.0)+" "+cx+","+(cy-s*0.25)
      +" C"+(cx+s*0.5)+","+(cy-s*1.0)+" "+(cx+s*1.1)+","+(cy-s*0.2)+" "+cx+","+(cy+s*0.9)+" Z";
    return P(d,{fill:fill||"none",stroke:stroke||"none","stroke-width":sw||0,"stroke-linejoin":"round"});
  }
  function plane(g){
    g.appendChild(el("polygon",{points:"7,8 45,12.5 22,19",fill:"#a9d1f7",stroke:"#5f97e0","stroke-width":0.25,"stroke-linejoin":"round"}));
    g.appendChild(el("polygon",{points:"7,8 22,19 16,26",fill:"#6aa9ee",stroke:"#3f86d8","stroke-width":0.25,"stroke-linejoin":"round"}));
    g.appendChild(el("polygon",{points:"22,19 45,12.5 26,23",fill:"#3f86d8"}));
    g.appendChild(el("line",{x1:7,y1:8,x2:26,y2:23,stroke:"#2f6fc8","stroke-width":0.25}));
  }
  function trail(g){
    g.appendChild(P("M53,18 C63,10 77,10 87,15 C93,18 96,16 97,13",{fill:"none",stroke:"#8fbdf0","stroke-width":0.5,"stroke-dasharray":"1.6 1.5","stroke-linecap":"round"}));
    g.appendChild(heart(51,17,1.7,"none","#8fbdf0",0.5));
  }
  function clip(g){
    g.appendChild(el("polygon",{points:"158.5,15 171.5,15 168.5,6 161.5,6",fill:"#2f7fd0",stroke:"#2569b4","stroke-width":0.2,"stroke-linejoin":"round"}));
    g.appendChild(el("polygon",{points:"161.5,6 168.5,6 168,8.4 162,8.4",fill:"#57a0e4"}));
    g.appendChild(P("M162.6,6 C161.4,-0.4 166.2,-0.4 165,6",{fill:"none",stroke:"#7fb8ee","stroke-width":0.8,"stroke-linecap":"round"}));
    g.appendChild(P("M164,6 C163.2,1.6 167,1.6 166.2,6",{fill:"none",stroke:"#a9d1f7","stroke-width":0.7,"stroke-linecap":"round"}));
  }
  function starFace(g,cx,cy,R,r){
    g.appendChild(P(starPath(cx,cy,R,r,-90),{fill:"#ffde59",stroke:"#f2a63a","stroke-width":0.4,"stroke-linejoin":"round"}));
    g.appendChild(el("ellipse",{cx:cx-2,cy:cy-0.4,rx:0.9,ry:1.25,fill:"#3a2a10"}));
    g.appendChild(el("ellipse",{cx:cx+2,cy:cy-0.4,rx:0.9,ry:1.25,fill:"#3a2a10"}));
    g.appendChild(P("M"+(cx-1.9)+","+(cy+1.6)+" Q"+cx+","+(cy+3.3)+" "+(cx+1.9)+","+(cy+1.6),{fill:"none",stroke:"#3a2a10","stroke-width":0.5,"stroke-linecap":"round"}));
    g.appendChild(el("circle",{cx:cx-3.4,cy:cy+1.4,r:0.9,fill:"#ff9fb6",opacity:0.85}));
    g.appendChild(el("circle",{cx:cx+3.4,cy:cy+1.4,r:0.9,fill:"#ff9fb6",opacity:0.85}));
  }
  function pencil(tx,ty,rot,body,dark){
    var g=el("g",{transform:"translate("+tx+","+ty+") rotate("+rot+")"});
    var w=4.0, cone=5.6, L=28;
    g.appendChild(el("polygon",{points:"0,0 "+(-w/2)+","+cone+" "+(w/2)+","+cone,fill:"#f0c98c",stroke:"#d9a95f","stroke-width":0.2}));
    g.appendChild(el("polygon",{points:"0,0 "+(-w*0.2)+","+(cone*0.52)+" "+(w*0.2)+","+(cone*0.52),fill:"#4a4a4a"}));
    g.appendChild(el("rect",{x:-w/2,y:cone,width:w,height:L,fill:body,stroke:dark,"stroke-width":0.2}));
    g.appendChild(el("rect",{x:-w/2+0.5,y:cone,width:w*0.26,height:L,fill:"#ffffff",opacity:0.28}));
    g.appendChild(el("rect",{x:w/2-1.0,y:cone,width:1.0,height:L,fill:dark,opacity:0.35}));
    g.appendChild(el("rect",{x:-w/2,y:cone+L,width:w,height:1.4,fill:dark}));
    return g;
  }
  function eraser(tx,ty,rot){
    var g=el("g",{transform:"translate("+tx+","+ty+") rotate("+rot+")"});
    g.appendChild(el("rect",{x:0,y:0,width:14,height:6.4,rx:2.2,fill:"#ff9fb6",stroke:"#f07b98","stroke-width":0.25}));
    g.appendChild(el("rect",{x:0,y:2.3,width:14,height:1.9,fill:"#ffffff",opacity:0.85}));
    return g;
  }
  function corner(g){
    g.appendChild(P("M210,270 L210,297 L184,297 C196,290 205,281 210,270 Z",{fill:"#dfe6f2"}));
    g.appendChild(P("M210,270 C205,281 196,290 184,297",{fill:"none",stroke:"#c2cee4","stroke-width":0.4}));
    g.appendChild(heart(193,289,3,"none","#3f9be8",0.6));
    g.appendChild(P(starPath(201,283,2.6,1.2,-90),{fill:"#ffde59",stroke:"#f2a63a","stroke-width":0.25}));
    [[188,282],[204,290],[197,294]].forEach(function(p){
      g.appendChild(P(starPath(p[0],p[1],1.2,0.4,-90),{fill:"#7fb0ea"}));
    });
  }
  function holes(g,y0,y1){
    var n=7;
    for(var i=0;i<n;i++){
      var y=y0+(y1-y0)*i/(n-1);
      g.appendChild(el("circle",{cx:10,cy:y,r:2.3,fill:"#ffffff",stroke:"#c3cfe6","stroke-width":0.45}));
    }
  }
  function appendDecor(blockTop,blockBottom){
    var g=el("g",{});
    plane(g); trail(g); clip(g); starFace(g,160,26,8.5,4);
    g.appendChild(pencil(15,251,-12,"#29a6f0","#1f74c4"));
    g.appendChild(pencil(24,252,-3,"#ffce3a","#e0a41f"));
    g.appendChild(eraser(9,285,-9));
    corner(g);
    holes(g, Math.max(34,blockTop-1), Math.min(250,blockBottom+1));
    SVG.appendChild(g);
  }

  /* ---- спільні частини аркуша ---- */
  function drawPageBase(TOP, decor){
    while(SVG.firstChild) SVG.removeChild(SVG.firstChild);
    SVG.appendChild(el("rect",{x:0,y:0,width:PAGE_W,height:PAGE_H,fill:"#ffffff"}));
    var blockTop=TOP;
    if(chkName.checked){
      var ny=TOP+6;
      var rEnd = decor ? 148 : (PAGE_W-M.right);
      var t1=el("text",{x:M.left, y:ny, "font-size":3.6, "font-family":"Nunito, sans-serif", "font-weight":800, fill:"#5a6a8a"}); t1.textContent="Ім'я:";
      var t2=el("text",{x:M.left+70, y:ny, "font-size":3.6, "font-family":"Nunito, sans-serif", "font-weight":800, fill:"#5a6a8a"}); t2.textContent="Дата:";
      SVG.appendChild(t1); SVG.appendChild(t2);
      SVG.appendChild(line(M.left+15, ny+0.6, M.left+64, ny+0.6, "#c3d0ea", 0.25));
      SVG.appendChild(line(M.left+86, ny+0.6, rEnd, ny+0.6, "#c3d0ea", 0.25));
      blockTop=TOP+12;
    }
    return blockTop;
  }

  /* ---- КОСА ЛІНІЙКА (літери) ---- */
  function renderLiniya(blockTop, BOTLIM){
    var rowH = state.size==='big' ? 13 : 10;
    var fs=rowH*0.76;
    var writeW=PAGE_W-M.left-M.right-3;

    var avail=BOTLIM-blockTop;
    var N=Math.floor(avail/rowH); if(N<1)N=1;
    var blockBottom=blockTop+N*rowH, blockH=blockBottom-blockTop;

    var clip=el("clipPath",{id:"wa"});
    clip.appendChild(el("rect",{x:M.left,y:blockTop,width:(PAGE_W-M.right-M.left),height:blockH}));
    var defs=el("defs",{}); defs.appendChild(clip); SVG.appendChild(defs);

    var g=el("g",{"clip-path":"url(#wa)"});
    var tan65=Math.tan(65*Math.PI/180), dxFull=blockH/tan65, S=rowH*0.95;
    for(var x=M.left-dxFull; x<=(PAGE_W-M.right); x+=S){
      g.appendChild(line(x, blockBottom, x+dxFull, blockTop, "#d3ddf1", 0.14));
    }
    SVG.appendChild(g);

    for(var i=0;i<N;i++){
      var ym=blockTop+i*rowH+rowH/2;
      SVG.appendChild(line(M.left, ym, PAGE_W-M.right, ym, "#d9e2f4", 0.12, "1.3 1.6"));
    }
    for(var j=0;j<=N;j++){
      var y=blockTop+j*rowH;
      SVG.appendChild(line(M.left, y, PAGE_W-M.right, y, "#9fb4dd", 0.2));
    }
    SVG.appendChild(line(M.left, blockTop, M.left, blockBottom, "#e2a0a0", 0.28));

    /* переноси */
    mctx.font = fs + "px Propysy, Nunito, sans-serif";
    function wl(str){
      if(str.trim()==='') return [''];
      var words=str.split(/\s+/).filter(Boolean), out=[], cur='';
      var w=function(s){return mctx.measureText(s).width;};
      for(var q=0;q<words.length;q++){
        var word=words[q], tryl=cur?cur+" "+word:word;
        if(w(tryl)<=writeW){cur=tryl;continue;}
        if(cur){out.push(cur);cur='';}
        if(w(word)<=writeW){cur=word;continue;}
        var piece='';
        for(var c=0;c<word.length;c++){var t2=piece+word[c]; if(w(t2)<=writeW)piece=t2; else{if(piece)out.push(piece);piece=word[c];}}
        cur=piece;
      }
      if(cur)out.push(cur);
      return out.length?out:[''];
    }
    var raw=txt.value.replace(/\r/g,"");
    var src = raw.length ? raw.split("\n") : [];
    var visual=[];
    for(var s=0;s<src.length;s++){ var arr=wl(src[s]); for(var k=0;k<arr.length;k++) visual.push(arr[k]); }

    var rowsText=new Array(N).fill(null);
    if(state.mode==='trace'){ for(var r=0;r<visual.length&&r<N;r++) rowsText[r]=visual[r]; }
    else{ var rr=0; for(var vi=0; vi<visual.length && rr<N; vi++){ if(visual[vi].trim()==='')continue; rowsText[rr]=visual[vi]; rr+=2; } }

    var baseOff=rowH*0.84;
    for(var rw=0; rw<N; rw++){
      var T=rowsText[rw]; if(T==null||T==='')continue;
      var tEl=el("text",{x:M.left+2.2, y:blockTop+rw*rowH+baseOff,
        "font-family":"Propysy, Nunito, sans-serif", "font-size":fs, "text-anchor":"start"});
      styleMark(tEl,true); tEl.textContent=T; SVG.appendChild(tEl);
    }
  }

  /* ---- КЛІТИНКА (цифри) ---- */
  function renderGrid(blockTop, BOTLIM){
    var cell = state.size==='big' ? 10 : 7;
    var fs=cell*0.66;

    var usableW=PAGE_W-M.right-M.left;
    var cols=Math.floor(usableW/cell); if(cols<1)cols=1;
    var avail=BOTLIM-blockTop;
    var rows=Math.floor(avail/cell); if(rows<1)rows=1;
    var gridW=cols*cell, gridH=rows*cell;
    var gridBottom=blockTop+gridH, gridRight=M.left+gridW;

    /* сітка */
    for(var c=0;c<=cols;c++){
      var x=M.left+c*cell;
      SVG.appendChild(line(x, blockTop, x, gridBottom, "#c9d5ee", 0.13));
    }
    for(var r=0;r<=rows;r++){
      var y=blockTop+r*cell;
      SVG.appendChild(line(M.left, y, gridRight, y, "#c9d5ee", 0.13));
    }
    /* червоне поле */
    SVG.appendChild(line(M.left, blockTop, M.left, gridBottom, "#e2a0a0", 0.28));

    /* розкладка знаків по клітинках */
    var raw=txt.value.replace(/\r/g,"");
    var src = raw.length ? raw.split("\n") : [];

    var gr=0; /* поточний рядок сітки */
    function placeLine(str){
      var col=0;
      for(var ci=0; ci<str.length; ci++){
        var ch=str[ci];
        if(ch===' '){ col++; if(col>=cols){col=0; gr++; if(gr>=rows)return;} continue; }
        if(col>=cols){ col=0; gr++; if(gr>=rows) return; }
        var cx=M.left+col*cell+cell/2;
        var cy=blockTop+gr*cell+cell/2;
        var tEl=el("text",{x:cx, y:cy, "font-family":DIGIT_FONT, "font-size":fs,
          "font-weight":800, "text-anchor":"middle", "dominant-baseline":"central"});
        styleMark(tEl,true,true); tEl.textContent=ch; SVG.appendChild(tEl);
        col++;
      }
    }
    for(var s=0; s<src.length && gr<rows; s++){
      if(src[s].trim()===''){ gr++; continue; }
      placeLine(src[s]);
      gr++;                                  /* новий рядок сітки для наступного джерела */
      if(state.mode==='copy') gr++;          /* + порожній рядок для списування */
    }
  }

  function render(){
    var decor=chkDecor.checked;
    var TOP = decor?30:16;
    var BOTLIM = decor?248:(PAGE_H-14);
    var blockTop=drawPageBase(TOP, decor);
    if(decor) appendDecor(blockTop, BOTLIM);
    if(state.paper==='grid') renderGrid(blockTop, BOTLIM);
    else renderLiniya(blockTop, BOTLIM);
  }

  window.printPaper=function(size){
    var st=document.getElementById('pgsize');
    if(!st){ st=document.createElement('style'); st.id='pgsize'; document.head.appendChild(st); }
    st.textContent='@page{size:'+size+'; margin:0}';
    setTimeout(function(){ window.print(); }, 30);
  };

  function activateSeg(boxId, val){
    var box=document.getElementById(boxId);
    [].forEach.call(box.querySelectorAll('button'), function(b){
      b.classList.toggle('on', b.dataset.v===val);
    });
  }

  var chips=document.getElementById('chips');
  TEMPLATES.forEach(function(t){
    var b=document.createElement('button');
    b.className='chip'; b.textContent=t.k;
    b.onclick=function(){
      txt.value=t.v;
      if(t.paper){ state.paper=t.paper; activateSeg('segPaper', t.paper); }
      if(t.size){ state.size=t.size; activateSeg('segSize', t.size); }
      render();
    };
    chips.appendChild(b);
  });

  function seg(id, key){
    var box=document.getElementById(id);
    box.addEventListener('click', function(e){
      var b=e.target.closest('button'); if(!b) return;
      [].forEach.call(box.querySelectorAll('button'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      state[key]=b.dataset.v;
      render();
    });
  }
  seg('segPaper','paper'); seg('segStyle','style'); seg('segSize','size'); seg('segMode','mode');

  txt.addEventListener('input', render);
  chkName.addEventListener('change', render);
  chkDecor.addEventListener('change', render);

  txt.value="а б в г ґ д е\nма мо му ми ме\nМама мила раму.";

  function boot(){ render(); }
  if(document.fonts && document.fonts.load){
    Promise.all([document.fonts.load('30px Propysy')]).then(boot, boot);
    if(document.fonts.ready) document.fonts.ready.then(render);
  } else { boot(); }
})();
</script>
