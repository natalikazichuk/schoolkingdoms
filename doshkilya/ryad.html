<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Числовий ряд — Знайди пропущене число</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
/* Світла «пісочна» тема — як у «Будиночках чисел» і тренажерах (замість темної sk-game.css). */
:root{
  --ink:#2c2b3a;--soft:#6b6a7d;--paper:#fff9ef;--line:#ece3d2;--card:#fff;
  --red:#ff6b6b;--orange:#ffa94d;--yellow:#ffd43b;--green:#51cf66;--teal:#22b8cf;
  --blue:#4dabf7;--indigo:#748ffc;--purple:#cc5de8;--pink:#f783ac;
  --good:#37b26f;--good-bg:#e4f7ec;--bad:#e06666;--bad-bg:#fbe7e7;
  --shadow:0 6px 0 rgba(44,43,58,.13);
  --gold:#ffcf4d;--gold-deep:#e0a92e;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden;}
body{
  font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
  user-select:none; -webkit-user-select:none; touch-action:manipulation; overscroll-behavior:none;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,212,59,.28),transparent 42%),
    radial-gradient(circle at 88% 14%,rgba(77,171,247,.26),transparent 44%),
    radial-gradient(circle at 78% 92%,rgba(204,93,232,.22),transparent 46%),
    radial-gradient(circle at 8% 86%,rgba(81,207,102,.24),transparent 44%),
    var(--paper);
}
h1,h2,.disp,.title,.cta,.opt,.piece,.win,#roofNum{font-family:'Fredoka',sans-serif;letter-spacing:.3px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── увесь ігровий шар — над футером ── */
#wrap{position:fixed; top:0; left:0; right:0;
  bottom:calc(60px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column;}

/* ── верхня панель ── */
#top{display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top) + 12px) 14px 4px;}
.pill{background:#fff; border:2px solid var(--line); border-radius:14px;
  padding:6px 12px; font-weight:800; font-size:14px; white-space:nowrap; box-shadow:var(--shadow);}
.pill .lab{color:var(--soft); font-size:11px; display:block; line-height:1;}
.pill .val{font-family:'Fredoka'; font-size:19px; line-height:1.15; color:var(--ink);}
.pill.q .val{color:var(--orange);}
#spacer{flex:1;}
#menuBtn{cursor:pointer; font-family:'Fredoka'; font-weight:600; font-size:15px;
  background:#fff; border:2px solid var(--line); color:var(--ink);
  border-radius:14px; padding:9px 14px; box-shadow:var(--shadow);}
#menuBtn:active{transform:translateY(2px); box-shadow:0 3px 0 rgba(44,43,58,.13);}

/* ── прогрес ── */
#barWrap{padding:10px 16px 2px;}
#bar{height:12px; border-radius:8px; background:#f0e7d6; overflow:hidden;}
#barFill{height:100%; width:0%; border-radius:8px;
  background:linear-gradient(90deg,var(--green),var(--teal)); transition:width .45s;}

/* ── overlays (старт / фінал) ── */
.screen{position:absolute; inset:0; z-index:60; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:22px; gap:12px;
  background:rgba(255,249,239,.92); backdrop-filter:blur(3px);}
.screen.hidden{display:none;}

.num-blocks{display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-bottom:2px;}
.nb{width:52px; height:52px; border-radius:16px; display:grid; place-items:center;
  font-family:'Fredoka'; font-size:28px; color:#fff; box-shadow:var(--shadow);
  transform:rotate(var(--r));}
.nb:nth-child(1){background:var(--red);--r:-7deg}
.nb:nth-child(2){background:var(--orange);--r:5deg}
.nb:nth-child(3){background:var(--green);--r:-4deg}
.nb:nth-child(4){background:var(--blue);--r:6deg}
.nb:nth-child(5){background:var(--purple);--r:-5deg}

.crown{font-size:48px;}
.title{font-size:30px; font-weight:700; color:var(--ink); line-height:1.1;}
.sub{font-size:15px; font-weight:800; color:var(--soft); max-width:340px; line-height:1.5;}
.sub b{color:var(--red);}
.group{display:flex; flex-direction:column; gap:9px; width:min(340px,92vw);}
.glabel{font-size:13px; font-weight:800; color:var(--soft);}
.pick{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
.opt{cursor:pointer; font-family:'Fredoka'; font-weight:700; font-size:19px;
  width:52px; height:52px; display:flex; align-items:center; justify-content:center;
  background:#fff; border:3px solid var(--line); color:var(--ink);
  border-radius:16px; box-shadow:var(--shadow); transition:transform .1s;}
.opt:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(44,43,58,.13);}
.opt.sel{background:var(--green); border-color:var(--green); color:#fff; box-shadow:0 5px 0 #37a052;}
.cta{margin-top:4px; border:none; cursor:pointer; font-family:'Fredoka'; font-weight:700;
  background:var(--green); color:#fff; font-size:20px; padding:15px 42px; border-radius:18px;
  box-shadow:0 6px 0 #37a052; transition:transform .06s, box-shadow .06s;}
.cta:active{transform:translateY(3px); box-shadow:0 3px 0 #37a052;}
.linkbtn{cursor:pointer; font-family:'Fredoka'; font-weight:600; font-size:15px; text-decoration:none;
  background:#fff; border:2px solid var(--line); color:var(--soft);
  border-radius:14px; padding:11px 22px;}
.linkbtn:active{transform:translateY(2px);}
.stars{font-size:42px; letter-spacing:6px;}
.winrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
/* пройдені будиночки в меню */
.opt.done{position:relative;}
.opt.done::after{content:"✓"; position:absolute; top:-7px; right:-7px; width:20px; height:20px;
  border-radius:50%; background:var(--good); color:#fff; font-size:12px; display:grid; place-items:center;
  box-shadow:0 2px 0 rgba(0,0,0,.12);}
/* скільки будиночків заселено до нагороди */
.prog{font-weight:800; font-size:14px; color:var(--soft);}
.prog b{color:var(--good); font-family:'Fredoka';}
/* «Нагороду отримано» — на старті, як у тренажерах */
.done-card{display:none; align-items:center; gap:12px; width:min(340px,92vw); text-align:left;
  background:linear-gradient(180deg,#fffdf4,#fff6df); border:3px solid #f4c842; border-radius:20px;
  padding:10px 14px; box-shadow:0 0 0 3px #fff9e6;}
.done-card.on{display:flex;}
.done-card .dc-ic{font-size:30px; flex:none;}
.done-card .dc-got{font-family:'Fredoka'; font-weight:700; font-size:15px; color:#8a5e16; line-height:1.2;}
.done-card .dc-go{font-weight:800; font-size:12px; color:var(--soft); margin-top:3px; line-height:1.25;}
/* блок нагороди на екрані перемоги */
.prize{display:none; flex-direction:column; align-items:center; gap:8px; width:min(340px,92vw);}
.prize.on{display:flex;}
.prize .p-got{font-family:'Fredoka'; font-weight:700; font-size:17px; color:#ff7a5c; line-height:1.2;}
.prize .p-why{display:block; margin-top:4px; font-family:'Nunito'; font-weight:700; font-size:11px; color:var(--soft); word-break:break-word;}
.prize .p-coins{display:none; align-items:center; gap:8px; background:#fff6df; border:2px solid #f4c842;
  color:#8a5e16; font-family:'Fredoka'; font-weight:700; font-size:18px; padding:6px 16px; border-radius:999px;}
.prize .p-stat{display:none; align-items:center; gap:8px; background:#eaf7ef; border:2px solid #9ad8b4;
  color:#1f7a4d; font-family:'Fredoka'; font-weight:700; font-size:15px; padding:6px 14px; border-radius:999px;}
.reward-item{position:relative; display:flex; align-items:center; gap:12px; text-align:left; background:#fff;
  border:3px solid var(--line); border-radius:18px; padding:10px; width:100%;}
.reward-new{position:absolute; top:-9px; left:12px; background:#ff7a5c; color:#fff; font-family:'Fredoka';
  font-weight:700; font-size:10px; letter-spacing:.5px; padding:2px 9px; border-radius:8px;}
.reward-item .pic{width:64px; height:64px; flex:none; border-radius:14px; display:grid; place-items:center;
  font-size:34px; background:linear-gradient(160deg,#efe4ff,#d3bcff);}
.reward-item .pic img{width:100%; height:100%; object-fit:contain; padding:6px;}
.reward-item .rname{font-family:'Fredoka'; font-weight:700; font-size:16px; color:var(--ink); line-height:1.15;}
.reward-item .rstat{display:inline-block; margin-top:4px; background:var(--good-bg); color:var(--good);
  font-weight:800; font-size:12px; padding:2px 8px; border-radius:8px;}
.reward-item .rmeta{color:var(--soft); font-weight:700; font-size:12px; margin-top:4px;}

/* ── анімації ── */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}



  /* ── ряд ── */
  #rowWrap{flex:1 1 auto; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; padding:6px 10px;}
  #hint{font-weight:800; font-size:14px; color:var(--soft); min-height:20px; text-align:center;}
  #hint b{color:var(--blue); font-family:'Fredoka'; font-weight:700;}

  #row{position:relative; display:flex; align-items:center; justify-content:center;
    gap:clamp(5px,1.8vw,12px); max-width:100%;}
  #row::before{content:""; position:absolute; left:4%; right:4%; top:50%;
    height:6px; transform:translateY(-50%); border-radius:999px;
    background:linear-gradient(90deg,rgba(255,169,77,0),rgba(255,169,77,.35),rgba(255,169,77,0));
    z-index:0;}

  .cell{position:relative; z-index:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px;
    width:clamp(42px,13.2vw,74px); height:clamp(56px,17vw,96px);
    border-radius:18px; border:3px solid var(--line); background:#fff;
    box-shadow:var(--shadow);}
  .cell .ico{font-size:clamp(17px,5vw,26px); line-height:1;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));}
  .cell .val{font-family:'Fredoka'; font-size:clamp(20px,6.4vw,34px); font-weight:700; line-height:1.05;
    color:var(--ink);}

  .cell.socket{border:3px dashed var(--orange);
    background:#fff6e6;
    box-shadow:none;
    transition:box-shadow .15s, border-color .15s, background .2s, transform .2s;}
  .cell.socket .ico{opacity:.4; filter:grayscale(.5);}
  .cell.socket .val{color:var(--orange);}
  .cell.socket.hot{border-color:var(--orange); background:#ffe9c7;
    box-shadow:0 0 0 4px rgba(255,169,77,.25);
    transform:translateY(-3px);}
  .cell.socket.good{border-style:solid; border-color:var(--good);
    background:var(--good-bg); box-shadow:0 4px 0 rgba(55,178,111,.25);}
  .cell.socket.good .ico{opacity:1; filter:none;}
  .cell.socket.good .val{color:var(--good);}
  .cell.pop{animation:pop .34s;}
  @keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.14)}100%{transform:scale(1)}}

  /* ── лоток з цифрами ── */
  #tray{display:flex; align-items:center; justify-content:center; gap:clamp(8px,3.2vw,16px);
    padding:8px 12px calc(env(safe-area-inset-bottom) + 16px); flex-wrap:wrap;}
  .piece{position:relative; cursor:grab; touch-action:none; font-family:'Fredoka'; font-weight:700;
    width:clamp(58px,18vw,86px); height:clamp(58px,18vw,86px);
    font-size:clamp(26px,8vw,40px); color:#4a3300;
    background:linear-gradient(180deg,#FFE7A0,var(--gold-deep));
    border:none; border-radius:20px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 0 #c9922a, 0 8px 14px rgba(44,43,58,.18);
    transition:transform .12s, box-shadow .12s; will-change:transform;}
  .piece::before{content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:26px; height:16px; background:inherit; border-radius:50%;}
  .piece:active{cursor:grabbing;}
  .piece.dragging{transition:none; box-shadow:0 12px 22px rgba(44,43,58,.3); z-index:50; opacity:.96;}
  .piece.flyto{transition:transform .22s cubic-bezier(.3,.9,.3,1.2);}
  .piece.wrong{animation:shake .34s;}
  .piece.placed{opacity:0; transform:scale(.3); pointer-events:none;}

/* прогрес до нагороди */
.prog{font-weight:800; font-size:14px; color:var(--soft);}
.prog b{color:var(--good); font-family:'Fredoka';}
/* «Нагороду отримано» — на старті, як у тренажерах */
.done-card{display:none; align-items:center; gap:12px; width:min(340px,92vw); text-align:left;
  background:linear-gradient(180deg,#fffdf4,#fff6df); border:3px solid #f4c842; border-radius:20px;
  padding:10px 14px; box-shadow:0 0 0 3px #fff9e6;}
.done-card.on{display:flex;}
.done-card .dc-ic{font-size:30px; flex:none;}
.done-card .dc-got{font-family:'Fredoka'; font-weight:700; font-size:15px; color:#8a5e16; line-height:1.2;}
.done-card .dc-go{font-weight:800; font-size:12px; color:var(--soft); margin-top:3px; line-height:1.25;}
/* блок нагороди на екрані перемоги */
.prize{display:none; flex-direction:column; align-items:center; gap:8px; width:min(340px,92vw);}
.prize.on{display:flex;}
.prize .p-got{font-family:'Fredoka'; font-weight:700; font-size:17px; color:#ff7a5c; line-height:1.2;}
.prize .p-why{display:block; margin-top:4px; font-family:'Nunito'; font-weight:700; font-size:11px; color:var(--soft); word-break:break-word;}
.prize .p-coins{display:none; align-items:center; gap:8px; background:#fff6df; border:2px solid #f4c842;
  color:#8a5e16; font-family:'Fredoka'; font-weight:700; font-size:18px; padding:6px 16px; border-radius:999px;}
.prize .p-stat{display:none; align-items:center; gap:8px; background:#eaf7ef; border:2px solid #9ad8b4;
  color:#1f7a4d; font-family:'Fredoka'; font-weight:700; font-size:15px; padding:6px 14px; border-radius:999px;}
.reward-item{position:relative; display:flex; align-items:center; gap:12px; text-align:left; background:#fff;
  border:3px solid var(--line); border-radius:18px; padding:10px; width:100%;}
.reward-new{position:absolute; top:-9px; left:12px; background:#ff7a5c; color:#fff; font-family:'Fredoka';
  font-weight:700; font-size:10px; letter-spacing:.5px; padding:2px 9px; border-radius:8px;}
.reward-item .pic{width:64px; height:64px; flex:none; border-radius:14px; display:grid; place-items:center;
  font-size:34px; background:linear-gradient(160deg,#efe4ff,#d3bcff);}
.reward-item .pic img{width:100%; height:100%; object-fit:contain; padding:6px;}
.reward-item .rname{font-family:'Fredoka'; font-weight:700; font-size:16px; color:var(--ink); line-height:1.15;}
.reward-item .rstat{display:inline-block; margin-top:4px; background:var(--good-bg); color:var(--good);
  font-weight:800; font-size:12px; padding:2px 8px; border-radius:8px;}
.reward-item .rmeta{color:var(--soft); font-weight:700; font-size:12px; margin-top:4px;}

  /* ══ стартовий екран — вигляд як у тренажері «Вчимо літери» ══ */
  #startScreen{background:linear-gradient(180deg,#fff9ef,#fdf3e2); backdrop-filter:none;
    justify-content:flex-start; text-align:center; gap:11px; overflow-y:auto;
    padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 20px);}
  /* шапка (← + цифри + заголовок) — в одній колонці 540px, як у «Вчимось рахувати» */
  #startScreen .start-head{position:relative; width:100%; max-width:540px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center; flex:none;}
  #startScreen .start-top{position:absolute; top:22px; left:0; z-index:5;}
  #startScreen .iconbtn{width:44px; height:44px; border:2px solid #ece3d2; background:#fff; border-radius:14px;
    font-family:inherit; font-weight:700; font-size:20px; color:#2c2b3a; cursor:pointer;
    display:grid; place-items:center; box-shadow:0 1px 3px rgba(44,43,58,.14);}
  #startScreen .iconbtn:active{transform:translateY(2px);}
  #startScreen .num-blocks{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:6px 0 2px;}
  #startScreen .nb{position:relative; width:58px; height:58px; border-radius:16px; display:grid; place-items:center;
    font-family:"Fredoka",sans-serif; font-weight:700; font-size:30px; color:#fff; transform:rotate(var(--r));
    box-shadow:0 6px 0 rgba(0,0,0,.14), inset 0 -5px 0 rgba(0,0,0,.12), inset 0 3px 0 rgba(255,255,255,.28);}
  #startScreen .nb::after{content:attr(data-o); position:absolute; right:-8px; bottom:-8px; font-size:20px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}
  #startScreen .nb:nth-child(1){background:#ff6b6b; --r:-7deg;}
  #startScreen .nb:nth-child(2){background:#ffa94d; --r:5deg;}
  #startScreen .nb:nth-child(3){background:#51cf66; --r:-4deg;}
  #startScreen .nb:nth-child(4){background:#4dabf7; --r:6deg;}
  #startScreen .nb:nth-child(5){background:#cc5de8; --r:-5deg;}
  #startScreen h1{font-family:"Comfortaa","Fredoka",sans-serif; font-weight:700; font-size:34px;
    margin:8px 0 0; line-height:1.1; color:#1e3a6b;}
  #startScreen .start-sub{color:#6b6a7d; font-weight:800; margin:0; flex:none; font-size:16px; opacity:1; max-width:none;}
  #startScreen .rhyme{background:#fff; border:3px dashed #cdd8ea; border-radius:20px; padding:13px 18px;
    font-style:italic; color:#3a5a8c; font-weight:800; max-width:400px; margin:2px auto 0;
    box-shadow:0 1px 3px rgba(44,43,58,.14); line-height:1.4;}
  #startScreen > *:not(.start-hero){flex-shrink:0;}
  #startScreen .start-hero{max-width:440px; width:100%; margin:0 auto; flex:1 1 auto; min-height:120px;
    max-height:clamp(170px,48vh,420px); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  #startScreen .start-hero img{max-width:100%; max-height:100%; width:auto; height:auto; display:block;}
  #startScreen .hero-emoji{font-size:60px; letter-spacing:6px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));}
  #startScreen .start-btns{display:flex; flex-direction:column; gap:10px; max-width:440px; margin:4px auto 0; width:100%;}
  #startScreen .big-btn{border:none; border-radius:18px; padding:16px 20px; width:100%; cursor:pointer;
    font-family:"Fredoka",sans-serif; font-weight:700; font-size:20px; color:#fff;
    background:#4dabf7; box-shadow:0 6px 0 #2f8fd6;}
  #startScreen .big-btn:active{transform:translateY(3px); box-shadow:0 3px 0 #2f8fd6;}
  @media (max-width:440px){
    #startScreen{gap:8px;}
    #startScreen .num-blocks{gap:8px; margin:2px 0;}
    #startScreen .nb{width:52px; height:52px; border-radius:14px; font-size:28px;}
    #startScreen .nb::after{font-size:19px; right:-7px; bottom:-7px;}
    #startScreen h1{font-size:30px;}
    #startScreen .start-sub{font-size:14px;}
    #startScreen .rhyme{padding:9px 14px; font-size:14px; border-radius:16px;}
    #startScreen .big-btn{padding:13px 18px; font-size:18px;}
  }
  /* вузький екран: стрілочка ← зліва від цифр, не поверх «1» */
  @media (max-width:520px){
    #startScreen .start-top{top:12px;}
    #startScreen .num-blocks{padding:0 48px; gap:6px;}
    #startScreen .nb{width:44px; height:44px; border-radius:12px; font-size:24px;}
    #startScreen .nb::after{font-size:16px; right:-6px; bottom:-6px;}
  }
  @media (max-width:380px){
    #startScreen{padding-left:14px; padding-right:14px;}
  }
  @media (max-height:640px) and (min-width:521px){
    #startScreen .nb{width:50px; height:50px; font-size:26px;}
  }
  @media (max-height:640px){
    #startScreen h1{font-size:28px;}
    #startScreen .start-hero{max-height:22vh;}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div class="pill q"><span class="lab">Питання</span><span class="val" id="qNum">1/20</span></div>
    <div id="spacer"></div>
    <button id="menuBtn">☰ Меню</button>
  </div>

  <div id="barWrap"><div id="bar"><div id="barFill"></div></div></div>

  <div id="rowWrap">
    <div id="hint">Перетягни або торкнись потрібної цифри 🔢</div>
    <div id="row"></div>
  </div>

  <div id="tray"></div>

  <!-- start / menu -->
  <div class="screen" id="startScreen">
    <div class="start-head">
      <div class="start-top">
        <button class="iconbtn backbtn" type="button" title="Назад" aria-label="Назад">←</button>
      </div>
      <div class="num-blocks">
        <div class="nb" data-o="⭐">1</div><div class="nb" data-o="🍎">2</div><div class="nb" data-o="🐝">3</div><div class="nb" data-o="🌸">4</div><div class="nb" data-o="🎈">5</div>
      </div>
      <h1>Числовий ряд</h1>
    </div>
    <p class="start-sub">Знайди пропущене число · від 1 до 9</p>
    <p class="rhyme" id="startRhyme">Числа в ряд стоять, як діти, —<br>хто сховався? Треба знайти!</p>
    <div class="done-card" id="startDone">
      <span class="dc-ic">🏆</span>
      <div><div class="dc-got" id="doneGot">Числовий ряд пройдено!</div>
        <div class="dc-go" id="doneGo">Вирушай за новими досягненнями!</div></div>
    </div>

    <div class="start-hero">
      <img src="../img/tr/ryad.webp?v=1" alt="" onerror="this.style.display='none';var e=this.parentNode.querySelector('.hero-emoji');if(e)e.style.display='block'">
      <span class="hero-emoji" style="display:none">1 2 ? 4</span>
    </div>

    <div class="start-btns">
      <button class="big-btn" id="playBtn">Грати ▶</button>
    </div>
  </div>

  <!-- win -->
  <div class="screen hidden" id="winScreen">
    <div class="crown">👑</div>
    <div class="title" id="winTitle">Ряд зібрано!</div>
    <div class="stars" id="winStars">⭐⭐⭐</div>
    <div class="sub" id="winSub">Чудова робота!</div>
    <div class="prize" id="prize">
      <div class="p-got" id="pGot"></div>
      <div class="p-coins" id="pCoins"></div>
      <div class="p-stat" id="pStat"></div>
      <div id="pItems" style="width:100%"></div>
    </div>
    <div class="winrow">
      <button class="cta" id="againBtn">↻ Ще раз</button>
    </div>
    <div class="winrow">
      <button class="linkbtn backbtn" type="button">← Назад</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var TOTAL = 20;          // питань у грі
  var MIN = 1, MAX = 9;    // діапазон чисел

  // ── теми оформлення ряду ──
  var THEMES = ["⭐","❤️","🧁","🍎","🌸","🐝","🍄","🎈","🐟","🍓","🍪","🌟","🦋","🍋","🐞","🎀"];

  var rowEl   = document.getElementById("row");
  var trayEl  = document.getElementById("tray");
  var hintEl  = document.getElementById("hint");
  var qNumEl  = document.getElementById("qNum");
  var fillEl  = document.getElementById("barFill");

  /* ── «Назад» — туди, звідки прийшли (?skback= / попередня сторінка сайту), інакше «Ігри» ── */
  function goBack(){
    if(window.skGoBackSmart){ skGoBackSmart("igry.html"); return; }
    location.href="../igry.html";
  }
  document.querySelectorAll(".backbtn").forEach(function(b){ b.addEventListener("click", goBack); });

  /* ── нагорода з адмінки (sk-rewards.js) — один раз, за перше повне проходження ряду ── */
  var PRIZE_KEY="sk_ryad_prize_v1";    // нагороду отримано (і що саме)
  var TR_HREF="ryad.html";             // за цим іменем sk-rewards шукає нагороду з адмінки
  function prizeSummary(){
    var raw=null; try{ raw=localStorage.getItem(PRIZE_KEY); }catch(e){}
    if(!raw) return null;
    try{ return JSON.parse(raw)||{}; }catch(e){ return {}; }
  }
  function escH(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function refreshStart(){
    var p=prizeSummary(), card=document.getElementById("startDone");
    card.classList.toggle("on", !!p);
    var rhyme=document.getElementById("startRhyme");
    if(rhyme) rhyme.style.display = p ? "none" : "";   // замість віршика — нагорода
    if(!p) return;
    document.getElementById("doneGot").textContent = (p.names && p.names.length)
      ? ("Ти отримав нагороду — "+p.names.join(", ")+"!") : "Числовий ряд пройдено — нагороду отримано!";
    var bits=[];
    if(p.coins) bits.push(p.coins+" 🪙");
    if(p.stat && p.stat.value){
      var ic=(String(p.stat.label||"").match(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\u2764\uFE0F]+/u)||[""])[0];
      bits.push("+"+p.stat.value+" "+(ic||p.stat.label));
    }
    bits.push("Вирушай за новими досягненнями!");
    document.getElementById("doneGo").textContent=bits.join(" · ");
  }

  var prizeBusy=false;
  function showPrize(o){
    var box=document.getElementById("prize"); box.classList.add("on");
    var got=document.getElementById("pGot"), coins=document.getElementById("pCoins"),
        stat=document.getElementById("pStat"), items=document.getElementById("pItems");
    got.innerHTML=o.got||""; coins.style.display="none"; stat.style.display="none"; items.innerHTML="";
    if(o.coins>0){ coins.style.display="inline-flex"; coins.textContent="+"+o.coins+" 🪙 монет"; }
    if(o.stat){ stat.style.display="inline-flex"; stat.textContent="✨ +"+o.stat.value+" до «"+o.stat.label+"»"; }
    if(o.items && o.items.length){
      items.innerHTML=o.items.map(function(it){
        var b=it.bonus>1.15?"+20%":(it.bonus>1?"+10%":(it.bonus<1?"−10%":""));
        return '<div class="reward-item"><span class="reward-new">НОВЕ</span>'
          +'<div class="pic"><img src="'+escH(it.img)+'" alt="'+escH(it.name)+'" onerror="this.onerror=null;this.parentNode.textContent=\'🎁\'"></div>'
          +'<div><div class="rname">'+escH(it.name)+'</div>'
          +(b?'<span class="rstat">✨ Бонус '+b+'</span>':'')
          +'<div class="rmeta">Додано в інвентар героя</div></div></div>';
      }).join("");
    }
  }
  function claimPrize(){
    if(prizeBusy) return; prizeBusy=true;
    try{ if(window.skFinishRecord) skFinishRecord(); }catch(e){}   // зарахувати запис (якщо з «Тестів»)
    var p = window.SKREWARD ? SKREWARD.claim(TR_HREF) : Promise.resolve({skipped:true});
    p.catch(function(){ return {skipped:true}; }).then(function(res){
      prizeBusy=false;
      if(!res || res.skipped) return;                 // не Герой / офлайн — спробуємо наступного разу
      if(res.failed){
        showPrize({got:'Нагорода не збереглась — заберемо її, щойно буде звʼязок 🎁'
          +'<span class="p-why">'+escH(res.failed.join(" · "))+'</span>'});
        return;
      }
      if(res.already){
        // уже забрано раніше (напр. на іншому пристрої) — запамʼятати, щоб не питати щоразу
        try{ if(!localStorage.getItem(PRIZE_KEY)) localStorage.setItem(PRIZE_KEY, JSON.stringify({at:Date.now()})); }catch(e){}
        if(res.restored && res.items && res.items.length)
          showPrize({got:"Ось твоя нагорода: "+escH(res.items.map(function(x){return x.name;}).join(", "))+"!", items:res.items});
        return;
      }
      var names=(res.items||[]).map(function(x){ return x.name; });
      showPrize({got: names.length ? "🎁 Ти отримав: "+escH(names.join(", "))+"!" : "🎁 Ти отримав нагороду!",
                 coins:res.coins, stat:res.stat, items:res.items});
      try{ localStorage.setItem(PRIZE_KEY, JSON.stringify({at:Date.now(), coins:res.coins||0, names:names,
        stat:res.stat?{label:res.stat.label,value:res.stat.value}:null})); }catch(e){}
    });
  }

  var streak=0, qIndex=0, mistakes=0;
  var current=null, locked=false, socketEl=null;

  function rnd(min,max){ return min + Math.floor(Math.random()*(max-min+1)); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=rnd(0,i); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  // ── генерація ряду ──
  function makeOptions(ans){
    var set={}; var list=[ans]; set[ans]=1;
    var guard=0;
    while(list.length<4 && guard++<200){
      var d = rnd(1,3) * (Math.random()<0.5?-1:1);
      var v = ans + d;
      if(v<MIN || v>MAX) continue;
      if(set[v]) continue;
      set[v]=1; list.push(v);
    }
    // добираємо будь-якими вільними числами діапазону
    guard=0;
    while(list.length<4 && guard++<200){
      var w = rnd(MIN,MAX);
      if(set[w]) continue;
      set[w]=1; list.push(w);
    }
    shuffle(list);
    return { list:list, idx:list.indexOf(ans) };
  }

  var lastKey="", lastTheme="";
  function genRow(){
    for(var tries=0; tries<400; tries++){
      var step = Math.random()<0.72 ? 1 : 2;                 // крок ряду
      var dir  = Math.random()<0.72 ? 1 : -1;                // зростає / спадає
      var len  = step===1 ? rnd(5,6) : 4;                    // довжина ряду
      var span = step*(len-1);
      if(span > MAX-MIN) continue;

      var start;
      if(dir===1) start = rnd(MIN, MAX-span);
      else        start = rnd(MIN+span, MAX);

      var vals=[], i;
      for(i=0;i<len;i++) vals.push(start + dir*step*i);
      if(vals.some(function(v){ return v<MIN || v>MAX; })) continue;

      var hole = rnd(0, len-1);
      var answer = vals[hole];

      var key = vals.join(",")+"|"+hole;
      if(key===lastKey) continue;

      var theme;
      do { theme = THEMES[rnd(0,THEMES.length-1)]; } while(theme===lastTheme && THEMES.length>1);

      var opts = makeOptions(answer);
      lastKey=key; lastTheme=theme;
      return { vals:vals, hole:hole, answer:answer, theme:theme,
               options:opts.list, correctIndex:opts.idx };
    }
    lastKey=""; lastTheme="";
    var o = makeOptions(3);
    return { vals:[1,2,3,4,5], hole:2, answer:3, theme:"⭐", options:o.list, correctIndex:o.idx };
  }

  // ── рендер ──
  function renderRow(){
    current = genRow();
    rowEl.innerHTML=""; socketEl=null;

    current.vals.forEach(function(v,i){
      var c=document.createElement("div");
      c.className="cell";
      var ico=document.createElement("span");
      ico.className="ico"; ico.textContent=current.theme;
      var val=document.createElement("span");
      val.className="val";
      if(i===current.hole){ c.classList.add("socket"); val.textContent="?"; socketEl=c; }
      else { val.textContent=v; }
      c.appendChild(ico); c.appendChild(val);
      rowEl.appendChild(c);
    });

    trayEl.innerHTML="";
    current.options.forEach(function(val,i){
      var p=document.createElement("button");
      p.className="piece"; p.textContent=val;
      p.dataset.correct = (i===current.correctIndex) ? "1" : "0";
      attachDrag(p);
      trayEl.appendChild(p);
    });

    qNumEl.textContent=(qIndex+1)+"/"+TOTAL;
    fillEl.style.width = Math.round(qIndex/TOTAL*100)+"%";
    locked=false;
  }

  // ── взаємодія: перетягування + тап ──
  function socketRect(){ return socketEl ? socketEl.getBoundingClientRect() : null; }
  function overSocket(x,y){
    var r=socketRect(); if(!r) return false;
    var pad=26;
    return x>=r.left-pad && x<=r.right+pad && y>=r.top-pad && y<=r.bottom+pad;
  }

  function attachDrag(p){
    var startX=0, startY=0, dx=0, dy=0, moved=false, dragging=false, pid=null;

    p.addEventListener("pointerdown", function(e){
      if(locked) return;
      dragging=true; moved=false; pid=e.pointerId;
      startX=e.clientX; startY=e.clientY; dx=0; dy=0;
      p.classList.add("dragging");
      try{ p.setPointerCapture(pid); }catch(_){}
    });

    p.addEventListener("pointermove", function(e){
      if(!dragging) return;
      dx=e.clientX-startX; dy=e.clientY-startY;
      if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
      p.style.transform="translate("+dx+"px,"+dy+"px)";
      if(socketEl) socketEl.classList.toggle("hot", overSocket(e.clientX,e.clientY));
    });

    function endDrag(e){
      if(!dragging) return;
      dragging=false;
      try{ p.releasePointerCapture(pid); }catch(_){}
      p.classList.remove("dragging");
      if(socketEl) socketEl.classList.remove("hot");
      if(!moved){ flyToSocket(p); return; }        // тап → летить у гніздо
      if(overSocket(e.clientX, e.clientY)){ resolve(p); }
      else { returnPiece(p); }
    }
    p.addEventListener("pointerup", endDrag);
    p.addEventListener("pointercancel", endDrag);
  }

  function returnPiece(p){
    p.classList.add("flyto"); p.style.transform="translate(0,0)";
    setTimeout(function(){ p.classList.remove("flyto"); p.style.transform=""; }, 240);
  }

  function flyToSocket(p){
    if(locked) return;
    var pr=p.getBoundingClientRect(), sr=socketRect();
    if(!sr){ resolve(p); return; }
    var tx=(sr.left+sr.width/2)-(pr.left+pr.width/2);
    var ty=(sr.top+sr.height/2)-(pr.top+pr.height/2);
    p.classList.add("flyto");
    p.style.transform="translate("+tx+"px,"+ty+"px)";
    setTimeout(function(){ resolve(p); }, 210);
  }

  function resolve(p){
    if(locked) return;
    var correct = p.dataset.correct==="1";
    if(correct){
      locked=true;
      p.classList.add("placed");
      if(socketEl){
        socketEl.classList.add("good","pop");
        socketEl.querySelector(".val").textContent=current.answer;
      }
      streak++;
      buzz(20); chime();
      hintEl.textContent = streak>=3 ? ("Так тримати! "+streak+" поспіль 🔥") : "Правильно! 🎉";
      qIndex++;
      if(window.skReportProgress) skReportProgress(qIndex, TOTAL);   // найдалі за гру — для картки в «Навчанні»
      fillEl.style.width = Math.round(qIndex/TOTAL*100)+"%";
      if(qIndex>=TOTAL){ setTimeout(finish, 620); return; }
      setTimeout(function(){
        hintEl.textContent="Перетягни або торкнись потрібної цифри 🔢";
        renderRow();
      }, 560);
    } else {
      streak=0; mistakes++;
      buzz([30,40,30]); thud();
      p.classList.remove("flyto"); p.style.transform="";
      p.classList.add("wrong");
      hintEl.textContent="Подивись, на скільки зростає ряд 🤔";
      setTimeout(function(){
        p.classList.remove("wrong");
        hintEl.textContent="Перетягни або торкнись потрібної цифри 🔢";
      }, 900);
    }
  }

  // ── звук ──
  var actx=null;
  function tone(f,d,type){ try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"triangle"; o.frequency.value=f; g.gain.value=0.06;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+d); o.stop(actx.currentTime+d+0.02);
  }catch(e){} }
  function chime(){ tone(660,0.09); setTimeout(function(){tone(880,0.11);},90); }
  function thud(){ tone(180,0.16,"sine"); }
  function fanfare(){ tone(523,0.12); setTimeout(function(){tone(659,0.12);},120);
    setTimeout(function(){tone(784,0.14);},240); setTimeout(function(){tone(1046,0.18);},380); }
  function buzz(v){ try{ if(navigator.vibrate) navigator.vibrate(v); }catch(e){} }

  // ── фініш ──
  function finish(){
    fanfare();
    var stars = mistakes===0 ? "⭐⭐⭐" : (mistakes<=3 ? "⭐⭐" : "⭐");
    document.getElementById("winStars").textContent=stars;
    document.getElementById("winTitle").textContent =
      mistakes===0 ? "Бездоганно!" : "Ряд зібрано!";
    document.getElementById("winSub").textContent =
      "Пройдено "+TOTAL+" з "+TOTAL+" • Помилок: "+mistakes;
    // перше повне проходження → нагорода з адмінки (один раз)
    document.getElementById("prize").classList.remove("on");
    if(!prizeSummary()) claimPrize();
    document.getElementById("winScreen").classList.remove("hidden");
  }

  function startGame(){
    streak=0; qIndex=0; mistakes=0;
    lastKey=""; lastTheme="";
    hintEl.textContent="Перетягни або торкнись потрібної цифри 🔢";
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("winScreen").classList.add("hidden");
    renderRow();
  }

  document.getElementById("playBtn").addEventListener("click", startGame);
  document.getElementById("againBtn").addEventListener("click", startGame);
  document.getElementById("menuBtn").addEventListener("click", function(){
    refreshStart();
    document.getElementById("startScreen").classList.remove("hidden");
  });

  refreshStart();
  renderRow();
})();
</script>
