# nginx на VM. deploy.sh кладе файл у /etc/nginx/sites-available/default.
# HTTPS закінчується на домашньому проксі; сюди приходить простий HTTP.
server {
  listen 80 default_server;
  server_name _;
  root /srv/sk/repo;
  index index.html;
  charset utf-8;
  client_max_body_size 13m;   # образ від воркера (API сам обмежує решту запитів 4 МБ)

  # API: дані й вхід
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # образи Героїв (server/app/src/avatar.js пише в /srv/sk/avatars); ім'я файлу
  # щоразу нове, тож кешуються назавжди
  # завантажене з адмінки (картинки речей і архів оригіналів) напряму не віддаємо —
  # картинки речей ідуть лише через /img/items/ (нижче)
  location ^~ /img/ava/gen/upload/ { return 404; }
  location ^~ /img/ava/gen/ {
    alias /srv/sk/avatars/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # картинки речей: спершу з репозиторію, а якщо такого файлу немає — завантажені з адмінки
  # «Предмети» (server/app/src/itemimg.js пише в /srv/sk/avatars/upload/img/items/). Браузер щоразу
  # звіряє їх із сервером (замінили картинку — видно одразу; незмінні → коротка відповідь 304)
  location ^~ /img/items/ {
    add_header Cache-Control "no-cache";
    try_files $uri @itemupload;
  }
  location @itemupload {
    root /srv/sk/avatars/upload;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # озвучка (server/app/src/tts.js пише в /srv/sk/tts); ім'я — хеш фрази, не змінюється
  location ^~ /tts/ {
    alias /srv/sk/tts/;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # службове — не віддаємо
  location ~ ^/(server|\.git|\.github|\.claude)(/|$) { return 404; }
  location ~ /\. { return 404; }

  # картинки словника адмінка замінює під тією самою назвою — браузер щоразу
  # звіряє їх із сервером (незмінні → коротка відповідь 304 без завантаження)
  location ^~ /img/en/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  # сторінки й модулі — завжди свіжі (версії інших файлів — через ?v=N)
  location ~ \.(html|js|webmanifest)$ {
    add_header Cache-Control "no-cache";
  }
  location ~ \.(css|json)$ {
    add_header Cache-Control "public, max-age=3600";
  }
  # картинки, звуки, шрифти: добу з кешу браузера без запиту на сервер, далі
  # ще тиждень показуються з кешу, поки у фоні перевіряється свіжа версія.
  # (Замінив картинку з тією ж назвою — у когось стара може лишитись до доби.)
  location ~ \.(png|jpe?g|webp|gif|svg|ico|mp3|wav|ogg|woff2?)$ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
