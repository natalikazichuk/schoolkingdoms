# nginx на VM. deploy.sh підставляє __TUNNEL_PATH__ (секрет, лежить у
# /srv/sk/tunnel_path, у репозиторій не потрапляє) і кладе файл у
# /etc/nginx/sites-available/default.
# HTTPS закінчується на домашньому проксі; сюди приходить простий HTTP.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80 default_server;
  server_name _;
  root /srv/sk/repo;
  index index.html;
  charset utf-8;
  client_max_body_size 5m;

  # SSH через WebSocket (websockify, sk-tunnel.service) — доступ Claude до консолі
  location /__TUNNEL_PATH__ {
    proxy_pass http://127.0.0.1:8022;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }

  # API: дані й вхід
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # службове — не віддаємо
  location ~ ^/(server|\.git|\.github|\.claude)(/|$) { return 404; }
  location ~ /\. { return 404; }

  # сторінки й модулі — завжди свіжі (версії інших файлів — через ?v=N)
  location ~ \.(html|js|webmanifest)$ {
    add_header Cache-Control "no-cache";
  }
  location ~ \.(css|png|jpe?g|webp|gif|svg|ico|mp3|wav|ogg|woff2?|json)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
