# SchoolKingdoms на VM: API (Node.js) + PostgreSQL.
# Статику віддає nginx на самій VM (server/nginx/site.conf), /api/ — сюди.
# Запуск — server/deploy.sh (він передає --env-file /srv/sk/.env).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sk
      POSTGRES_DB: sk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD}
    volumes:
      - /srv/sk/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sk -d sk"]
      interval: 5s
      retries: 20

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sk:${DB_PASSWORD}@db:5432/sk
      FB_HASH_CONFIG: /data/hash-config.json
      MIGRATION_DIR: /migration
      SITE_DIR: /site            # sk-skills.js — ті самі правила вмінь, що й на сторінці
      APP_VERSION: ${APP_VERSION:-dev}
      AVATAR_DIR: /avatars       # згенеровані образи Героїв (nginx віддає як /img/ava/gen/)
      AVATAR_WORKER_TOKEN: ${AVATAR_WORKER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}            # «Згенерувати аватар» з фото (рахунок OpenAI власника)
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
      AVATAR_PHOTO_PER_DAY: ${AVATAR_PHOTO_PER_DAY:-3}
      AVATAR_PHOTO_DAY_TOTAL: ${AVATAR_PHOTO_DAY_TOTAL:-30}
      PUBLIC_URL: https://school-king.pp.ua
    volumes:
      - /srv/sk/data:/data:ro
      - /srv/sk/migration:/migration:ro
      - /srv/sk/repo:/site:ro
      - /srv/sk/avatars:/avatars
    ports:
      - "127.0.0.1:3000:3000"   # лише для nginx на цій VM
