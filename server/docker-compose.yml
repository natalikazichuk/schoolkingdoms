# SchoolKingdoms на VM: API (Node.js) + PostgreSQL.
# Статику віддає nginx на самій VM (server/nginx/site.conf), /api/ — сюди.
# Запуск — server/deploy.sh (він передає --env-file /srv/sk/.env).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sk
      POSTGRES_DB: sk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD}
    volumes:
      - /srv/sk/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sk -d sk"]
      interval: 5s
      retries: 20

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sk:${DB_PASSWORD}@db:5432/sk
      FB_HASH_CONFIG: /data/hash-config.json
      MIGRATION_DIR: /migration
      SITE_DIR: /site            # sk-skills.js — ті самі правила вмінь, що й на сторінці
      APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      - /srv/sk/data:/data:ro
      - /srv/sk/migration:/migration:ro
      - /srv/sk/repo:/site:ro
    ports:
      - "127.0.0.1:3000:3000"   # лише для nginx на цій VM
