<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Повідомлення про помилки — School Kingdom</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Спільна дизайн-система адмінки (та сама, що в admin.html / admin-books.html) -->
<link rel="stylesheet" href="sk-styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Токени й фон — 1:1 з admin.html. */
  :root{
    --bg:#9ad6f5; --bg-2:#2f74c8;
    --panel:rgba(22,29,66,.72); --panel-2:rgba(30,39,86,.6);
    --border:rgba(140,155,255,.22);
    --gold:#f5c542; --gold-2:#e0a83a;
    --text:#e9ecff; --muted:#9aa3d0;
    --danger:#ff6b7a; --ok:#58d68d; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--text);min-height:100vh;line-height:1.5;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(900px 600px at 0% 100%, rgba(47,111,237,.16), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg-2));
  }
  #wrap{max-width:920px;margin:0 auto;padding:24px 18px 80px}

  h1,h2,h3{font-family:'Fredoka One',cursive;font-weight:400;letter-spacing:.3px;margin:0}
  a{color:var(--gold)}

  /* Шапка — темний текст на світлому фоні; локально гасимо .topbar із sk-styles.css. */
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:none;box-shadow:none;
    margin-bottom:22px;padding:0 0 16px;border-bottom:1px solid rgba(20,50,100,.25);
    justify-content:flex-start;text-align:left}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
  .brand .crown{font-size:1.6rem;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
  .brand .bt-name{font-family:'Fredoka One',cursive;font-size:1.3rem;color:#123a6b;
    text-shadow:0 1px 2px rgba(255,255,255,.5);line-height:1.1;display:block}
  .brand .bt-sub{font-size:.76rem;color:#2b4a72;font-weight:700}
  .spacer{flex:1}
  .nav{display:flex;gap:8px;flex-wrap:wrap}
  .nav a,.nav button{font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:7px 12px;border-radius:11px;cursor:pointer;text-decoration:none;transition:.15s;
    display:inline-flex;align-items:center;gap:6px;width:auto;margin:0}
  .nav a:hover,.nav button:hover{transform:translateY(-1px);border-color:var(--gold)}

  #root>h1{color:#123a6b;text-shadow:0 1px 2px rgba(255,255,255,.5);font-size:1.7rem}
  #root>.sub{color:#2b4a72;font-weight:600;font-size:.92rem;margin:6px 0 18px}

  /* Фільтр-чіпи */
  .chips{display:flex;gap:8px;margin:0 0 16px}
  .chip{font-family:'Nunito',sans-serif;font-weight:800;font-size:.82rem;cursor:pointer;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:7px 14px;border-radius:999px;transition:.15s}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:linear-gradient(180deg,var(--gold),var(--gold-2));color:#2a1e06;border-color:var(--gold-2)}
  .chip .n{opacity:.7;font-weight:700}

  /* Список повідомлень */
  .rlist{display:flex;flex-direction:column;gap:12px}
  .rcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
  .rcard.done{opacity:.6}
  .rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .tag{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;border:1px solid var(--border)}
  .tag.hero{background:rgba(124,92,255,.18);color:#d6ccff;border-color:rgba(124,92,255,.4)}
  .tag.parent{background:rgba(47,111,237,.2);color:#cfe0ff;border-color:rgba(47,111,237,.45)}
  .tag.new{background:rgba(245,197,66,.18);color:#ffe9a6;border-color:rgba(245,197,66,.45)}
  .tag.st-done{background:rgba(88,214,141,.2);color:#c7f5cd;border-color:var(--ok)}
  .rwhen{margin-left:auto;font-size:.76rem;color:var(--muted);font-weight:700}
  .rmsg{font-size:1rem;color:#fff;font-weight:700;white-space:pre-wrap;word-break:break-word;margin:2px 0 10px}
  .rmsg.empty{color:var(--muted);font-style:italic;font-weight:600}
  .rmeta{font-size:.78rem;color:var(--muted);line-height:1.5;
    border-top:1px dashed var(--border);padding-top:8px;word-break:break-word}
  .rmeta b{color:#b7bfe6;font-weight:800}
  .rmeta a{color:#9fc4ff}
  .racts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .mini{font-family:'Nunito',sans-serif;font-weight:800;font-size:.8rem;
    border:1px solid var(--border);background:var(--panel-2);color:var(--text);
    border-radius:10px;padding:7px 13px;cursor:pointer;transition:.15s}
  .mini:hover{transform:translateY(-1px);border-color:var(--gold)}
  .mini.ok{background:rgba(88,214,141,.2);border-color:var(--ok);color:#c7f5cd}
  .mini.danger{background:rgba(255,107,122,.14);border-color:rgba(255,107,122,.4);color:#ffc9ca}
  .mini.danger:hover{background:rgba(255,107,122,.22)}

  .empty{color:#2b4a72;font-weight:700;font-size:.95rem;padding:22px 4px;text-align:center}
  .gate{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:34px 22px;text-align:center;max-width:460px;margin:40px auto}
  .gate h1{color:var(--gold);font-size:1.3rem}
  .gate .sub{color:var(--muted)}
  .gate .big{font-size:2.6rem;margin-bottom:8px}
  .btn{width:auto;margin:0;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;
    border:1px solid var(--gold-2);border-radius:12px;padding:11px 18px;cursor:pointer;text-decoration:none;
    display:inline-flex;align-items:center;gap:7px;
    background:linear-gradient(180deg,var(--gold),var(--gold-2));color:#2a1e06}
  .btn.ghost{background:var(--panel-2);color:var(--text);border-color:var(--border)}
</style>
</head>
<body>
<div id="wrap">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="crown">👑</span>
      <span><span class="bt-name">Повідомлення про помилки</span><span class="bt-sub">School Kingdom · зворотний звʼязок</span></span>
    </a>
    <div class="spacer"></div>
    <nav class="nav">
      <a href="admin.html">🧩 Тести</a>
      <a href="admin-books.html">📖 Книги</a>
      <button id="btnReload">🔄 Оновити</button>
      <button id="logoutBtn" style="display:none">🚪 Вийти</button>
    </nav>
  </header>

  <div id="root">
    <div class="empty">Завантаження…</div>
  </div>
</div>

<script type="module" src="firebase-config.js"></script>
<script>
(function(){
  'use strict';
  var root = document.getElementById('root');
  var REPORTS = [];
  var FILTER = 'new';   // 'new' | 'all'

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtWhen(ts){
    if(!ts || !ts.seconds) return '';
    var d = new Date(ts.seconds*1000);
    var pad = function(n){ return (n<10?'0':'')+n; };
    return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()
         + ' ' + pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function gate(msg){
    root.innerHTML = '<div class="gate"><div class="big">🔒</div>'
      + '<h1>Доступ обмежено</h1>'
      + '<p class="sub" style="margin:8px 0 16px">'+esc(msg)+'</p>'
      + '<a class="btn ghost" href="login.html">Увійти</a></div>';
  }

  function cardHtml(r){
    var role = r.role==='hero' ? '<span class="tag hero">🦸 Дитина</span>'
             : r.role==='parent' ? '<span class="tag parent">👩‍👧 Батьки</span>'
             : '<span class="tag">Гість</span>';
    var status = r.status==='done'
             ? '<span class="tag st-done">✓ Вирішено</span>'
             : '<span class="tag new">● Нове</span>';
    var msg = (r.message && r.message.trim())
             ? '<div class="rmsg">'+esc(r.message)+'</div>'
             : '<div class="rmsg empty">(без опису)</div>';
    var meta = [];
    if(r.page)     meta.push('<b>Сторінка:</b> '+esc(r.page));
    if(r.url)      meta.push('<b>URL:</b> <a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.url)+'</a>');
    if(r.heroName) meta.push('<b>Герой:</b> '+esc(r.heroName));
    if(r.heroId)   meta.push('<b>ID героя:</b> '+esc(r.heroId));
    if(r.reporterEmail) meta.push('<b>Акаунт:</b> '+esc(r.reporterEmail));
    if(r.screen)   meta.push('<b>Екран:</b> '+esc(r.screen));
    if(r.ua)       meta.push('<b>Пристрій:</b> '+esc(r.ua));

    var toggle = r.status==='done'
      ? '<button class="mini" data-act="undone" data-id="'+esc(r.id)+'">↩︎ У нові</button>'
      : '<button class="mini ok" data-act="done" data-id="'+esc(r.id)+'">✓ Вирішено</button>';

    return '<div class="rcard'+(r.status==='done'?' done':'')+'">'
      + '<div class="rhead">'+role+status+'<span class="rwhen">'+esc(fmtWhen(r.createdAt))+'</span></div>'
      + msg
      + (meta.length ? '<div class="rmeta">'+meta.join('<br>')+'</div>' : '')
      + '<div class="racts">'+toggle
      +   '<button class="mini danger" data-act="del" data-id="'+esc(r.id)+'">🗑 Видалити</button>'
      + '</div>'
      + '</div>';
  }

  function render(){
    var newCount = REPORTS.filter(function(r){ return r.status!=='done'; }).length;
    var list = REPORTS.filter(function(r){ return FILTER==='all' || r.status!=='done'; });
    var html = '<h1>🐞 Повідомлення про помилки</h1>'
      + '<p class="sub">Скарги надходять сюди з дитячих сторінок і кабінету батьків.</p>'
      + '<div class="chips">'
      +   '<button class="chip'+(FILTER==='new'?' on':'')+'" data-f="new">Нові <span class="n">'+newCount+'</span></button>'
      +   '<button class="chip'+(FILTER==='all'?' on':'')+'" data-f="all">Усі <span class="n">'+REPORTS.length+'</span></button>'
      + '</div>';
    if(!list.length){
      html += '<div class="empty">'+(FILTER==='new'?'Нових повідомлень немає 🎉':'Повідомлень поки немає.')+'</div>';
    } else {
      html += '<div class="rlist">'+list.map(cardHtml).join('')+'</div>';
    }
    root.innerHTML = html;

    root.querySelectorAll('.chip').forEach(function(c){
      c.addEventListener('click', function(){ FILTER=c.getAttribute('data-f'); render(); });
    });
    root.querySelectorAll('.mini').forEach(function(b){
      b.addEventListener('click', function(){ onAct(b.getAttribute('data-act'), b.getAttribute('data-id'), b); });
    });
  }

  function byId(id){ for(var i=0;i<REPORTS.length;i++){ if(REPORTS[i].id===id) return REPORTS[i]; } return null; }

  function onAct(act, id, btn){
    var r = byId(id); if(!r) return;
    if(act==='del'){
      if(!confirm('Видалити це повідомлення? Дію не можна скасувати.')) return;
      btn.disabled=true;
      window.SK.deleteReport(id).then(function(){
        REPORTS = REPORTS.filter(function(x){ return x.id!==id; }); render();
      }).catch(function(){ btn.disabled=false; alert('Не вдалося видалити.'); });
      return;
    }
    var newStatus = (act==='done') ? 'done' : 'new';
    btn.disabled=true;
    window.SK.setReportStatus(id, newStatus).then(function(){
      r.status=newStatus; render();
    }).catch(function(){ btn.disabled=false; alert('Не вдалося оновити статус.'); });
  }

  function load(){
    root.innerHTML='<div class="empty">Завантаження…</div>';
    window.SK.listReports().then(function(list){ REPORTS=list||[]; render(); })
      .catch(function(){ root.innerHTML='<div class="empty">Не вдалося завантажити повідомлення.</div>'; });
  }

  (function whenSK(){
    var tries=0;
    (function tick(){
      if(window.SK && SK.ready){
        SK.ready.then(function(){
          if(!SK.getCurrentUser || !SK.getCurrentUser()){ gate('Увійди адміністратором, щоб переглядати повідомлення.'); return; }
          SK.isAdmin().then(function(isA){
            if(!isA){ gate('Ця сторінка лише для адміністраторів.'); return; }
            var lo=document.getElementById('logoutBtn');
            if(lo){ lo.style.display=''; lo.onclick=function(){ SK.logout().then(function(){ location.href='login.html'; }); }; }
            var rl=document.getElementById('btnReload');
            if(rl) rl.onclick=load;
            load();
          }).catch(function(){ gate('Не вдалося перевірити права доступу.'); });
        });
        return;
      }
      if(tries++<100) setTimeout(tick,50);
      else gate('Не вдалося підключитися до бази.');
    })();
  })();
})();
</script>
</body>
</html>
