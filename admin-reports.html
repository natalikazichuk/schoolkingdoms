<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Повідомлення про помилки — School Kingdom</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Спільна дизайн-система адмінки (та сама, що в admin.html / admin-books.html) -->
<link rel="stylesheet" href="sk-styles.css">
<!-- Спільна оболонка адмінки: дизайн, шрифт і фон (та сама мова, що в Словнику).
     Порядок важливий: ПІСЛЯ sk-styles.css і ДО локальних стилів нижче. -->
<link rel="stylesheet" href="sk-admin.css?v=2">
<script src="sk-admin.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Дизайн, шрифт і фон — спільні (sk-admin.css, та сама мова, що в Словнику).
     Тут лишається тільки те, що є саме в «Помилках». */
  *{-webkit-tap-highlight-color:transparent}
  body{line-height:1.5}
  #wrap{padding:0 0 80px}
  .wrap-in{max-width:920px;margin:0 auto;padding:16px 16px 0}
  #root>h1{color:var(--ink);font-size:1.5rem}
  #root>.sub{color:var(--muted);font-weight:600;font-size:.92rem;margin:6px 0 18px}

  /* Фільтр-чіпи */
  .chips{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
  .chip{font-family:inherit;font-weight:800;font-size:.82rem;cursor:pointer;
    background:var(--card);border:2px solid var(--border);color:var(--ink);
    padding:7px 14px;border-radius:999px;transition:border-color .15s}
  .chip:hover{border-color:var(--gold-deep)}
  .chip.on{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:var(--gold-ink);border-color:var(--gold-deep)}
  .chip .n{opacity:.7;font-weight:700}

  /* Список повідомлень */
  .rlist{display:flex;flex-direction:column;gap:12px}
  .rcard{background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:16px 16px 12px;box-shadow:var(--shadow)}
  .rcard.done{opacity:.6}
  .rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .tag{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;
    border:1px solid var(--border);background:#f4f1e8;color:var(--muted)}
  .tag.hero{background:#f3edfc;color:#6b3fa0;border-color:#d9c9ef}
  .tag.parent{background:#eaf1fb;color:#2f5ea8;border-color:#c2d4ef}
  .tag.new{background:#fdf5e0;color:var(--gold-ink);border-color:#f0dca8}
  .tag.st-done{background:#e8f6ee;color:#1f7a4d;border-color:#bde2ce}
  .rwhen{margin-left:auto;font-size:.76rem;color:var(--muted);font-weight:700}
  .rmsg{font-size:1rem;color:var(--ink);font-weight:700;white-space:pre-wrap;word-break:break-word;margin:2px 0 10px}
  .rmsg.empty{color:var(--muted);font-style:italic;font-weight:600;text-align:left;padding:0}
  .rshot{margin:2px 0 10px}
  .shot-thumb{max-width:260px;max-height:180px;border-radius:10px;border:1px solid var(--border);
    cursor:zoom-in;display:block;background:#f5eeda}
  .lightbox{position:fixed;inset:0;z-index:90;background:rgba(20,26,50,.75);
    display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:100%;border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .rmeta{font-size:.78rem;color:var(--muted);line-height:1.5;
    border-top:1px dashed var(--border);padding-top:8px;word-break:break-word}
  .rmeta b{color:var(--ink);font-weight:800}
  .rmeta a{color:var(--primary-ink)}
  .racts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

  /* .mini, .empty і .gate — у sk-admin.css. Тут — тільки своя геометрія. */
  .empty{color:var(--muted);font-weight:700;font-size:.95rem;padding:22px 4px}
  .gate{padding:34px 22px;max-width:460px;margin:40px auto}
  .gate h1{font-size:1.25rem}
</style>
</head>
<body>
<!-- Вміст малює SKADMIN.header() наприкінці файлу. -->
<header class="topbar"></header>
<div id="wrap">
  <div class="wrap-in" id="root">
    <div class="empty">Завантаження…</div>
  </div>
</div>

<script type="module" src="firebase-config.js"></script>
<script>
(function(){
  'use strict';
  var root = document.getElementById('root');
  var REPORTS = [];
  var FILTER = 'new';   // 'new' | 'all'

  var esc = SKADMIN.esc;     // спільний, екранує й апостроф
  function fmtWhen(ts){
    if(!ts || !ts.seconds) return '';
    var d = new Date(ts.seconds*1000);
    var pad = function(n){ return (n<10?'0':'')+n; };
    return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()
         + ' ' + pad(d.getHours())+':'+pad(d.getMinutes());
  }

  var gate = SKADMIN.gate;   // спільний екран «Доступ обмежено»

  function cardHtml(r){
    var role = r.role==='hero' ? '<span class="tag hero">🦸 Дитина</span>'
             : r.role==='parent' ? '<span class="tag parent">👩‍👧 Батьки</span>'
             : '<span class="tag">Гість</span>';
    var status = r.status==='done'
             ? '<span class="tag st-done">✓ Вирішено</span>'
             : '<span class="tag new">● Нове</span>';
    var msg = (r.message && r.message.trim())
             ? '<div class="rmsg">'+esc(r.message)+'</div>'
             : '<div class="rmsg empty">(без опису)</div>';
    var meta = [];
    if(r.page)     meta.push('<b>Сторінка:</b> '+esc(r.page));
    if(r.url)      meta.push('<b>URL:</b> <a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.url)+'</a>');
    if(r.heroName) meta.push('<b>Герой:</b> '+esc(r.heroName));
    if(r.heroId)   meta.push('<b>ID героя:</b> '+esc(r.heroId));
    if(r.reporterEmail) meta.push('<b>Акаунт:</b> '+esc(r.reporterEmail));
    if(r.screen)   meta.push('<b>Екран:</b> '+esc(r.screen));
    if(r.ua)       meta.push('<b>Пристрій:</b> '+esc(r.ua));

    var toggle = r.status==='done'
      ? '<button class="mini" data-act="undone" data-id="'+esc(r.id)+'">↩︎ У нові</button>'
      : '<button class="mini ok" data-act="done" data-id="'+esc(r.id)+'">✓ Вирішено</button>';

    var shot = r.screenshot
      ? '<div class="rshot"><img class="shot-thumb" src="'+esc(r.screenshot)+'" alt="скрін" data-full="'+esc(r.screenshot)+'"></div>'
      : '';

    return '<div class="rcard'+(r.status==='done'?' done':'')+'">'
      + '<div class="rhead">'+role+status+'<span class="rwhen">'+esc(fmtWhen(r.createdAt))+'</span></div>'
      + msg
      + shot
      + (meta.length ? '<div class="rmeta">'+meta.join('<br>')+'</div>' : '')
      + '<div class="racts">'+toggle
      +   '<button class="mini danger" data-act="del" data-id="'+esc(r.id)+'">🗑 Видалити</button>'
      + '</div>'
      + '</div>';
  }

  function render(){
    var newCount = REPORTS.filter(function(r){ return r.status!=='done'; }).length;
    var list = REPORTS.filter(function(r){ return FILTER==='all' || r.status!=='done'; });
    var html = '<h1>🐞 Повідомлення про помилки</h1>'
      + '<p class="sub">Скарги надходять сюди з дитячих сторінок і кабінету батьків.</p>'
      + '<div class="chips">'
      +   '<button class="chip'+(FILTER==='new'?' on':'')+'" data-f="new">Нові <span class="n">'+newCount+'</span></button>'
      +   '<button class="chip'+(FILTER==='all'?' on':'')+'" data-f="all">Усі <span class="n">'+REPORTS.length+'</span></button>'
      + '</div>';
    if(!list.length){
      html += '<div class="empty">'+(FILTER==='new'?'Нових повідомлень немає 🎉':'Повідомлень поки немає.')+'</div>';
    } else {
      html += '<div class="rlist">'+list.map(cardHtml).join('')+'</div>';
    }
    root.innerHTML = html;

    root.querySelectorAll('.chip').forEach(function(c){
      c.addEventListener('click', function(){ FILTER=c.getAttribute('data-f'); render(); });
    });
    root.querySelectorAll('.mini').forEach(function(b){
      b.addEventListener('click', function(){ onAct(b.getAttribute('data-act'), b.getAttribute('data-id'), b); });
    });
    root.querySelectorAll('.shot-thumb').forEach(function(img){
      img.addEventListener('click', function(){
        var lb = document.createElement('div');
        lb.className = 'lightbox';
        lb.innerHTML = '<img src="'+img.getAttribute('data-full')+'" alt="скрін">';
        lb.addEventListener('click', function(){ lb.remove(); });
        document.body.appendChild(lb);
      });
    });
  }

  function byId(id){ for(var i=0;i<REPORTS.length;i++){ if(REPORTS[i].id===id) return REPORTS[i]; } return null; }

  function onAct(act, id, btn){
    var r = byId(id); if(!r) return;
    if(act==='del'){
      if(!confirm('Видалити це повідомлення? Дію не можна скасувати.')) return;
      btn.disabled=true;
      window.SK.deleteReport(id).then(function(){
        REPORTS = REPORTS.filter(function(x){ return x.id!==id; }); render();
      }).catch(function(){ btn.disabled=false; alert('Не вдалося видалити.'); });
      return;
    }
    var newStatus = (act==='done') ? 'done' : 'new';
    btn.disabled=true;
    window.SK.setReportStatus(id, newStatus).then(function(){
      r.status=newStatus; render();
    }).catch(function(){ btn.disabled=false; alert('Не вдалося оновити статус.'); });
  }

  function load(){
    root.innerHTML='<div class="empty">Завантаження…</div>';
    window.SK.listReports().then(function(list){ REPORTS=list||[]; render(); })
      .catch(function(){ root.innerHTML='<div class="empty">Не вдалося завантажити повідомлення.</div>'; });
  }

  /* Шапка й гейт доступу — спільні (sk-admin.js). */
  SKADMIN.header({
    name:'Повідомлення про помилки',
    sub:'School Kingdom · зворотний звʼязок',
    nav:[ { href:'admin.html', label:'🏠 Головна (Адмінка)' },
          { href:'admin-books.html', label:'📖 Книги' },
          { id:'btnReload', label:'🔄 Оновити' } ]
  });

  SKADMIN.guard({
    denyMsg:'Увійди адміністратором, щоб переглядати повідомлення.',
    onOk:function(){
      var rl = document.getElementById('btnReload');
      if(rl) rl.onclick = load;
      load();
    }
  });
})();
</script>
</body>
</html>
