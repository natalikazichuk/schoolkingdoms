<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вхід — School Kingdoms</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="image" href="login-bg.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sk-styles.css">
<style>
  /* ── Фон: казкове королівство (login-bg.webp) ── */
  body{display:flex;flex-direction:column;color:var(--ink);background:#5aa3e6}
  .kingdom-bg{position:fixed;inset:0;z-index:-3;background:#5aa3e6 url(login-bg.webp) center top/cover no-repeat}

  .login-wrap{flex:1;width:100%;max-width:560px;margin:0 auto;padding:14px 16px 40px;
    display:flex;flex-direction:column;align-items:center;position:relative}

  /* ── Логотип ── */
  .login-logo{display:block;width:min(300px,70vw);margin:0 auto -6px;position:relative;z-index:2;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));transition:transform .2s}
  .login-logo:hover{transform:scale(1.03)}
  .login-logo img{width:100%;height:auto;display:block}

  /* ── Кремова картка ── */
  .login-card{position:relative;width:100%;margin-top:34px;padding:62px clamp(16px,4.5vw,30px) 24px;
    background:linear-gradient(180deg,#fffaf0,#f8ecd2);border:4px solid #e2b24c;border-radius:26px;
    box-shadow:0 0 0 2px #fff6dc inset,0 0 0 1.5px #b9852a,0 20px 44px rgba(20,40,80,.45)}

  /* ── Синя стрічка із заголовком ── */
  .ribbon{position:absolute;top:-30px;left:-20px;right:-20px;z-index:1;text-align:center;
    padding:12px 44px 14px;border-radius:16px;color:#fff;
    background:linear-gradient(180deg,#3a6fd0 0%,#2150a8 55%,#183f8a 100%);
    border:3px solid #f2c75c;box-shadow:0 8px 18px rgba(16,40,90,.45),inset 0 2px 0 rgba(255,255,255,.25)}
  .ribbon::before,.ribbon::after{content:"";position:absolute;top:14px;width:30px;height:100%;
    background:#153775;z-index:-1}
  .ribbon::before{left:-18px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
  .ribbon::after{right:-18px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
  @media(max-width:480px){.ribbon{left:-10px;right:-10px;padding:10px 22px 12px}
    .ribbon::before,.ribbon::after{width:16px}.ribbon::before{left:-10px}.ribbon::after{right:-10px}}
  .ribbon h1{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(1.45rem,5.6vw,2.05rem);line-height:1.1;
    text-shadow:0 3px 0 #0f2b63,0 4px 10px rgba(0,0,0,.35)}
  .ribbon h1 b{color:#ffd54a}
  .ribbon p{margin-top:4px;font-weight:700;font-size:clamp(.84rem,3.2vw,.98rem);color:#dce8ff}

  /* ── Картки вибору ролі ── */
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,3vw,16px);margin-bottom:22px}
  .role{position:relative;display:flex;flex-direction:column;border:3px solid #eadcb9;border-radius:20px;
    background:#fdf6e6;padding:0;overflow:hidden;cursor:pointer;font-family:'Nunito',sans-serif;
    color:var(--ink);text-align:center;box-shadow:0 4px 12px rgba(120,90,30,.14);
    transition:transform .15s,border-color .15s,box-shadow .15s}
  .role:not(.active){filter:saturate(.8)}
  .role:not(.active) .role-pic{opacity:.85}
  .role:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(120,90,30,.22)}
  .role:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(242,199,92,.55)}
  .role.active{border-color:#ffd23f;
    box-shadow:0 0 0 3px rgba(255,214,70,.55),0 0 22px rgba(255,200,40,.65),0 8px 18px rgba(120,90,30,.2)}
  .role-pic{display:block;width:100%;height:auto;aspect-ratio:5/4;object-fit:cover;object-position:50% 30%;background:#cfe3f5}
  .role-badge{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);isolation:isolate;
    width:48px;height:52px;display:grid;place-items:center;font-size:1.35rem;
    background:linear-gradient(180deg,#ffe38a,#d9a23a);
    clip-path:polygon(50% 0,100% 22%,100% 74%,50% 100%,0 74%,0 22%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
  .role-badge::before{content:"";position:absolute;inset:3px;z-index:-1;
    background:linear-gradient(180deg,#2d64c4,#173f8e);
    clip-path:polygon(50% 0,100% 22%,100% 74%,50% 100%,0 74%,0 22%)}
  .role-badge svg{width:26px;height:26px;fill:#ffd54a}
  .role-body{position:relative;flex:1;padding:30px 8px 14px;display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(180deg,#fffaf0,#f7ecd4)}
  .role-title{font-weight:900;font-size:clamp(.95rem,3.6vw,1.2rem);line-height:1.2;color:#2b2210}
  .role-sub{font-weight:700;font-size:.84rem;color:#6b5e45;margin-top:2px}

  /* ── Поля з іконками ── */
  .ifield{display:flex;align-items:center;margin-bottom:14px;border:2px solid #e3d3ae;border-radius:16px;
    background:#fffdf7;box-shadow:inset 0 2px 4px rgba(120,90,30,.08);transition:.15s}
  .ifield:focus-within{border-color:#e0a93a;box-shadow:0 0 0 4px rgba(242,199,92,.28)}
  .ifield .ico{flex:0 0 54px;align-self:stretch;display:grid;place-items:center;border-right:2px solid #eee2c6;color:#8d7c5a}
  .ifield .ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ifield input{flex:1;min-width:0;border:none;background:transparent;padding:15px 14px;font-family:'Nunito',sans-serif;
    font-size:1rem;font-weight:700;color:#2b2210;outline:none}
  .ifield input::placeholder{color:#9a8e76;font-weight:600}
  .ifield .pass-toggle{position:static;transform:none;margin-right:8px;color:#6b5e45}
  .ifield .pass-toggle:hover{color:#2b2210;background:rgba(224,169,58,.16)}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .form-hint{text-align:center;color:#6b5e45;font-weight:700;font-size:.9rem;margin:-6px 0 14px}
  .row-end{display:flex;justify-content:flex-end;margin:-4px 2px 16px}
  .login-card .link{color:#1f5bd1;font-weight:800;font-size:.92rem}
  .login-card .link:hover{color:#123f9a}

  /* ── Велика золота кнопка ── */
  .btn-kingdom{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
    padding:17px 18px;border-radius:18px;border:3px solid #d29a22;cursor:pointer;
    font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(1.05rem,4.2vw,1.3rem);color:#3a2604;
    background:linear-gradient(180deg,#ffe98f 0%,#ffd04a 50%,#f4b52a 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 6px 0 #c48a17,0 12px 20px rgba(160,110,20,.35);
    transition:transform .12s,box-shadow .12s,filter .15s}
  .btn-kingdom:hover{filter:brightness(1.05)}
  .btn-kingdom:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 2px 0 #c48a17,0 6px 12px rgba(160,110,20,.3)}
  .btn-kingdom[disabled]{opacity:.7;cursor:default}
  .btn-kingdom .arr{font-size:1.3em;line-height:1}

  /* ── Роздільник з короною ── */
  .crown-div{display:flex;align-items:center;gap:14px;margin:26px 10px 14px;color:#e0a93a;font-size:1.3rem}
  .crown-div::before,.crown-div::after{content:"";flex:1;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#dcc79b)}
  .crown-div::after{background:linear-gradient(90deg,#dcc79b,transparent)}

  .no-acc{text-align:center;font-weight:700;color:#4a3f2a;margin-bottom:10px}
  .btn-outline{display:flex;align-items:center;justify-content:center;gap:10px;width:min(100%,380px);margin:0 auto;
    padding:13px 16px;border-radius:999px;border:3px solid #2c62cf;background:#fff;color:#1f4fb4;cursor:pointer;
    font-family:'Nunito',sans-serif;font-weight:900;font-size:1.05rem;text-decoration:none;
    box-shadow:0 4px 0 #bcd0f3,0 8px 16px rgba(30,70,160,.15);transition:.15s}
  .btn-outline:hover{background:#f1f6ff}
  .btn-outline svg{width:24px;height:24px;fill:currentColor}

  .help{display:flex;align-items:flex-start;justify-content:center;gap:10px;margin-top:20px;
    color:#4a3f2a;font-weight:600;font-size:.9rem;line-height:1.45;text-align:left}
  .help svg{flex:0 0 26px;width:26px;height:26px;fill:none;stroke:#c9942f;stroke-width:1.8;stroke-linejoin:round;margin-top:2px}
  .help a{color:#1f5bd1;font-weight:800}

  /* ── Принцеса-помічниця (декор, лише на широких екранах) ── */
  .guide{position:fixed;right:max(8px,calc(50% - 540px));bottom:0;width:clamp(150px,18vw,230px);
    pointer-events:none;z-index:1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
  .guide img{width:100%;height:auto;display:block}
  @media(max-width:900px){.guide{display:none}}
  @media(min-width:520px){.role-pic{aspect-ratio:352/210}}

  .toast{color:#fff}
</style>
</head>
<body>
  <div class="kingdom-bg" aria-hidden="true"></div>

  <main class="login-wrap">
    <a class="login-logo" href="index.html" aria-label="SchoolKingdoms — на головну">
      <img src="logo-big.webp" alt="School Kingdoms" width="1450" height="900">
    </a>

    <div class="login-card">
      <div class="ribbon">
        <h1>Вхід до <b>королівства</b></h1>
        <p>Оберіть, хто заходить у систему.</p>
      </div>

      <!-- ── Вибір ролі ── -->
      <div class="roles" role="group" aria-label="Хто входить">
        <button type="button" id="tabParent" class="role active" aria-pressed="true" onclick="showTab('parent')">
          <img class="role-pic" src="img/login-role-parent.webp" alt="" width="352" height="210">
          <span class="role-body">
            <span class="role-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.2"/><circle cx="5.5" cy="9" r="2.5"/><circle cx="18.5" cy="9" r="2.5"/><path d="M6.5 19a5.5 5.5 0 0 1 11 0z"/><path d="M1 18.5a4.5 4.5 0 0 1 6.3-4.1A7 7 0 0 0 5 19H1z"/><path d="M23 18.5a4.5 4.5 0 0 0-6.3-4.1A7 7 0 0 1 19 19h4z"/></svg></span>
            <span class="role-title">Батьки, Вчитель<br>або Репетитор</span>
          </span>
        </button>
        <button type="button" id="tabChild" class="role" aria-pressed="false" onclick="showTab('hero')">
          <img class="role-pic" src="img/login-role-hero.webp" alt="" width="348" height="210">
          <span class="role-body">
            <span class="role-badge" aria-hidden="true">👑</span>
            <span class="role-title">Я — Герой</span>
            <span class="role-sub">Дитина</span>
          </span>
        </button>
      </div>

      <!-- ── ФОРМА ДОРОСЛОГО ── -->
      <form id="parentForm" onsubmit="event.preventDefault();doParentLogin()" novalidate>
        <label class="ifield">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          <span class="sr-only">Email</span>
          <input id="loginEmail" type="email" autocomplete="email" placeholder="Введіть логін (email)">
        </label>
        <label class="ifield">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
          <span class="sr-only">Пароль</span>
          <input id="loginPass" type="password" autocomplete="current-password" placeholder="Введіть пароль">
          <button type="button" class="pass-toggle" aria-label="Показати пароль" aria-pressed="false" onclick="togglePass(this,'loginPass')"><svg viewBox="0 0 24 24"></svg></button>
        </label>
        <div class="row-end"><button type="button" class="link" onclick="forgotPass()">Забули пароль?</button></div>
        <button type="submit" class="btn-kingdom">Увійти до королівства <span class="arr" aria-hidden="true">→</span></button>
      </form>

      <!-- ── ФОРМА ГЕРОЯ ── -->
      <form id="childForm" class="hidden" onsubmit="event.preventDefault();doHeroLogin()" novalidate>
        <div class="form-hint">Введи свій логін і пароль Героя.</div>
        <label class="ifield">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>
          <span class="sr-only">Логін Героя</span>
          <input id="heroLogin" type="text" autocomplete="username" autocapitalize="none"
                 spellcheck="false" placeholder="Логін Героя, напр. lev2024">
        </label>
        <label class="ifield">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
          <span class="sr-only">Пароль</span>
          <input id="heroPass" type="password" autocomplete="current-password" placeholder="Введи пароль">
          <button type="button" class="pass-toggle" aria-label="Показати пароль" aria-pressed="false" onclick="togglePass(this,'heroPass')"><svg viewBox="0 0 24 24"></svg></button>
        </label>
        <div class="row-end"><button type="button" class="link" onclick="toast('Попроси дорослого нагадати пароль — він є в кабінеті батьків 🙂')">Забув пароль?</button></div>
        <button type="submit" class="btn-kingdom">Почати пригоду <span class="arr" aria-hidden="true">→</span></button>
      </form>

      <div class="crown-div" aria-hidden="true">👑</div>

      <div class="no-acc">Немає акаунту?</div>
      <a class="btn-outline" href="auth.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M1.5 20.5a7.5 7.5 0 0 1 15 0z"/><path d="M19 8v3h3v2h-3v3h-2v-3h-3v-2h3V8z"/></svg>
        Зареєструватися
      </a>

      <!-- ── Контакт підтримки ── -->
      <div class="help">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <div>Потрібна допомога? Напишіть нам:<br>
          <a href="mailto:schoolkingdoms@gmail.com">schoolkingdoms@gmail.com</a></div>
      </div>
    </div>
  </main>

  <div class="guide" aria-hidden="true"><img src="img/ava/knight-purple-girl-full.webp" alt=""></div>

  <div class="toast" id="toast"></div>

  <!-- Реальний вхід через спільний firebase-config.js -->
  <script type="module" src="firebase-config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    // 'hero' (новий) або 'child' (старий) → одразу вкладка Героя
    const authNext = params.get('next') || '';
    const wantHeroFirst = (authNext === 'hero' || authNext === 'child');

    function $(id){ return document.getElementById(id); }
    let toastT;
    function toast(msg){
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 2600);
    }
    function friendlyAuthError(e){
      const c = (e && e.code) || '';
      if (c.includes('sk/login-too-short')) return 'логін закороткий';
      if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'невірний логін/email або пароль';
      if (c.includes('invalid-email')) return 'некоректний логін або email';
      if (c.includes('too-many-requests')) return 'забагато спроб, спробуйте пізніше';
      if (c.includes('network')) return 'немає зв\'язку з мережею';
      return 'спробуйте ще раз';
    }

    // Показати / приховати пароль (як на auth.html)
    const EYE_OPEN  = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
    const EYE_CLOSED= '<path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.4 5.2A9.6 9.6 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3.1 3.9"/><path d="M6.1 6.1A16 16 0 0 0 2 12s3.5 7 10 7a9.5 9.5 0 0 0 3.9-.8"/>';
    document.querySelectorAll('.pass-toggle svg').forEach(s => s.innerHTML = EYE_OPEN);
    function togglePass(btn, inputId){
      const inp = $(inputId);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.querySelector('svg').innerHTML = show ? EYE_CLOSED : EYE_OPEN;
      btn.setAttribute('aria-pressed', show ? 'true' : 'false');
      btn.setAttribute('aria-label', show ? 'Приховати пароль' : 'Показати пароль');
    }

    function showTab(which){
      const isHero = (which === 'hero' || which === 'child');
      $('tabParent').classList.toggle('active', !isHero);
      $('tabChild').classList.toggle('active', isHero);
      $('tabParent').setAttribute('aria-pressed', String(!isHero));
      $('tabChild').setAttribute('aria-pressed', String(isHero));
      $('parentForm').classList.toggle('hidden', isHero);
      $('childForm').classList.toggle('hidden', !isHero);
      if (isHero) { const h = $('heroLogin'); if (h) h.focus(); }
    }

    // дочекатися firebase-config (SK)
    function whenSK(cb){
      let n = 0;
      (function wait(){
        if (window.SK && SK.ready){ SK.ready.then(cb); return; }
        if (n++ < 100) setTimeout(wait, 50);
      })();
    }

    // на старті: залогінених ведемо в їхній кабінет
    whenSK(function(u){
      if (u){
        location.replace(SK.isHeroSession() ? 'hero.html' : 'parent.html');
      } else {
        showTab(wantHeroFirst ? 'hero' : 'parent');
      }
    });

    async function doParentLogin(){
      const email = $('loginEmail').value.trim();
      const pass  = $('loginPass').value;
      if (!email || !pass){ toast('⚠️ Введіть email і пароль'); return; }
      if (!window.SK){ toast('⚠️ Зачекайте, ще завантажується…'); return; }
      try{
        await SK.login(email, pass);
        location.href = 'parent.html';
      }catch(e){
        toast('❌ Не вдалося увійти: ' + friendlyAuthError(e));
      }
    }

    async function doHeroLogin(){
      const login = $('heroLogin').value.trim();
      const pass  = $('heroPass').value;
      if (!login || !pass){ toast('⚠️ Введіть логін і пароль'); return; }
      if (!window.SK){ toast('⚠️ Зачекайте, ще завантажується…'); return; }
      try{
        await SK.heroLogin(login, pass);
        location.href = 'hero.html';
      }catch(e){
        console.warn('[login] heroLogin:', e);
        toast('❌ Не вдалося увійти: ' + friendlyAuthError(e));
      }
    }

    function forgotPass(){
      toast('Відновлення пароля зʼявиться згодом. Поки що напишіть на schoolkingdoms@gmail.com');
    }
  </script>
</body>
</html>
