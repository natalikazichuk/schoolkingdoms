<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Слова на літеру А — картки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
:root{
  --ink:#2c2b3a;--soft:#6b6a7d;--paper:#fff9ef;--line:#ece3d2;--card:#fff;
  --red:#ff5a4d;--blue:#2f5fb0;--good:#37b26f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(1200px 500px at 50% -120px,#eaf3ff,transparent),
    var(--paper);
  padding:14px;padding-bottom:calc(82px + env(safe-area-inset-bottom));
  min-height:100vh}
.wrap{max-width:760px;margin:0 auto}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{width:44px;height:44px;border:2px solid var(--line);background:#fff;border-radius:14px;
  font-size:22px;font-weight:800;color:var(--ink);cursor:pointer;flex:none;box-shadow:0 4px 0 rgba(44,43,58,.12)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(44,43,58,.12)}

.headline{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;
  background:#fff;border:2px solid var(--line);border-radius:22px;padding:10px 16px;
  box-shadow:0 6px 0 rgba(44,43,58,.10)}
.headline .t{font-family:'Fredoka';font-weight:700;font-size:clamp(18px,4.5vw,26px);
  color:var(--blue);letter-spacing:.5px}
.headline .L{font-family:'Fredoka';font-weight:700;font-size:clamp(26px,7vw,40px);color:#fff;
  background:var(--red);border-radius:14px;line-height:1;padding:6px 14px;box-shadow:0 4px 0 #c9463b}

.tools{display:flex;gap:8px;justify-content:center;margin:2px 0 16px;flex-wrap:wrap}
.tbtn{font-family:'Nunito';font-weight:800;font-size:.85rem;border:2px solid var(--line);
  background:#fff;color:var(--ink);border-radius:14px;padding:8px 14px;cursor:pointer;
  box-shadow:0 4px 0 rgba(44,43,58,.10)}
.tbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(44,43,58,.10)}
.tbtn.on{background:var(--good);color:#fff;border-color:var(--good);box-shadow:0 4px 0 #2c9159}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}

.flip{border:none;background:none;padding:0;cursor:pointer;perspective:1000px;font-family:inherit}
.inner{position:relative;display:block;width:100%;aspect-ratio:1/1;
  transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  box-shadow:0 6px 0 rgba(44,43,58,.13);border:3px solid #fff}
.front{background:var(--tile);display:grid;place-items:center;padding:8px}
.front img{width:100%;height:100%;object-fit:contain}
.back{transform:rotateY(180deg);background:var(--tile);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.back .word{font-family:'Fredoka';font-weight:700;color:var(--blue);
  font-size:clamp(20px,6vw,30px);line-height:1.05;text-align:center;padding:0 6px;word-break:break-word}
.back .word b{color:var(--red)}
.back .spk{font-size:1.1rem;opacity:.7}

.hint{text-align:center;color:var(--soft);font-weight:700;font-size:.82rem;margin:16px 0 4px}

/* нижній навбар героя — спільний */
</style>

<script>
(function(){
  var soundOn=true;
  var sBtn=document.getElementById('soundBtn');
  sBtn.addEventListener('click',function(){
    soundOn=!soundOn;
    sBtn.classList.toggle('on',soundOn);
    sBtn.textContent=soundOn?'🔊 Звук: увімк.':'🔇 Звук: вимк.';
  });

  // український голос
  var ukVoice=null;
  function pickVoice(){
    var vs=speechSynthesis.getVoices();
    ukVoice=vs.find(function(v){return /uk(-|_)?UA/i.test(v.lang);})
          ||vs.find(function(v){return /^uk/i.test(v.lang);})||null;
  }
  if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function speak(w){
    if(!soundOn||!('speechSynthesis' in window))return;
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(w);
      u.lang='uk-UA'; u.rate=.9; if(ukVoice)u.voice=ukVoice;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  var cards=[].slice.call(document.querySelectorAll('.flip'));
  cards.forEach(function(c){
    c.addEventListener('click',function(){
      var nowFlipped=!c.classList.contains('flipped');
      c.classList.toggle('flipped',nowFlipped);
      if(nowFlipped) speak(c.getAttribute('data-word'));
    });
  });

  var allFlipped=false;
  document.getElementById('flipAllBtn').addEventListener('click',function(){
    allFlipped=!allFlipped;
    this.classList.toggle('on',allFlipped);
    cards.forEach(function(c){c.classList.toggle('flipped',allFlipped);});
  });
})();
</script>
