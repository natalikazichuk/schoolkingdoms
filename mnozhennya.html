<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Таблиця множення — 10 рівнів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2038;
  --ink-deep:#0A1526;
  --grid:#1E3A5C;
  --line:#4C7FB8;
  --chalk:#E8F1FF;
  --dim:#8FA9C7;
  --amber:#FFC145;
  --mint:#4FD6A4;
  --coral:#FF6B6B;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(120% 80% at 50% 0%,#9ad6f5 0%,#5aa3e6 45%,#2f74c8 100%) fixed;
  color:var(--chalk);
  font-family:"Manrope",system-ui,sans-serif;
  min-height:100vh;
  padding:18px 16px calc(28px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto}
.eyebrow{
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--line)
}
.sync{color:var(--dim)}
.sync.ok{color:var(--mint)}
.sync.no{color:var(--coral)}
h1{font-family:"Unbounded",sans-serif;font-weight:800;font-size:23px;line-height:1.15;margin:6px 0 14px}
.rule{height:1px;background:var(--line);opacity:.45;margin:14px 0}

.hud{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;border:1px solid var(--grid);background:rgba(15,32,56,.75);border-radius:var(--r);padding:9px 11px}
.stat b{display:block;font-family:"Unbounded",sans-serif;font-size:18px;margin-top:2px}
.stat .k{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}

.map{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lvl{
  text-align:left;border:1px solid var(--grid);background:rgba(15,32,56,.75);
  color:var(--chalk);border-radius:var(--r);padding:12px;cursor:pointer;
  font-family:"Manrope",sans-serif;font-size:13px;font-weight:600;line-height:1.3;
  transition:transform .12s ease, border-color .12s ease;
}
.lvl:hover{transform:translateY(-2px);border-color:var(--line)}
.lvl .n{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--line);letter-spacing:.1em}
.lvl.done{border-color:var(--mint)}
.lvl.done .n{color:var(--mint)}
.lvl.lock{opacity:.4;cursor:not-allowed}
.lvl.lock:hover{transform:none}
.lvl .tag{display:block;margin-top:7px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--dim)}
.lvl .st{margin-top:6px;font-size:13px;letter-spacing:2px;line-height:1}
.lvl .st .off{opacity:.22}

.backlink{display:inline-block;margin-top:14px;color:var(--line);text-decoration:none;
  font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.06em}
.backlink:hover{color:var(--chalk)}

/* --- гра --- */
.pbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pbar .lab{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.pbar .score{margin-left:auto;font-family:"Unbounded",sans-serif;font-weight:800;font-size:20px}
.pbar .score small{font-family:"JetBrains Mono",monospace;font-weight:400;font-size:10px;color:var(--dim);letter-spacing:.08em}

.timer{height:10px;border-radius:6px;background:rgba(10,21,38,.7);border:1px solid var(--grid);overflow:hidden;margin-bottom:14px}
.timer > i{display:block;height:100%;width:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--mint),var(--amber));transition:width .15s linear}
.timer.low > i{background:linear-gradient(90deg,var(--coral),var(--amber))}

.board{
  border:1px solid var(--line);border-radius:var(--r);
  background:rgba(10,21,38,.85);padding:30px 12px;margin:0 0 4px;text-align:center;
  font-family:"Unbounded",sans-serif;font-weight:800;font-size:40px;letter-spacing:1px;
  min-height:110px;display:flex;align-items:center;justify-content:center
}
.board .eqq{white-space:nowrap}
.board .hole{color:var(--amber)}

.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.opt{
  border:1px solid var(--grid);background:rgba(15,32,56,.75);color:var(--chalk);
  border-radius:12px;padding:18px 8px;font-family:"Unbounded",sans-serif;font-weight:800;font-size:24px;cursor:pointer;
  transition:transform .08s ease,border-color .1s ease
}
.opt:hover{border-color:var(--line)}
.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--mint);color:var(--mint);background:rgba(79,214,164,.12)}
.opt.no{border-color:var(--coral);color:var(--coral);background:rgba(255,107,107,.12)}
.opt:disabled{cursor:default}

.msg{text-align:center;font-size:13px;font-weight:600;margin-top:12px;min-height:18px}
.msg.no{color:var(--coral)}
.msg.ok{color:var(--mint)}
.msg.hint{color:var(--amber)}

/* зворотний відлік перед стартом */
.count{
  position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  background:rgba(10,21,38,.82)
}
.count.on{display:flex}
.count b{font-family:"Unbounded",sans-serif;font-weight:800;font-size:96px;color:var(--amber);
  animation:pop .55s ease}
.count b.go{font-size:56px;color:var(--mint)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* екран результату */
.result{border:1px solid var(--line);border-radius:var(--r);background:rgba(10,21,38,.85);
  padding:22px 14px;margin:0 0 14px;text-align:center}
.result .big{font-family:"Unbounded",sans-serif;font-weight:800;font-size:56px;line-height:1;color:var(--amber)}
.result .cap{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:6px}
.result .stars{font-size:34px;letter-spacing:6px;margin:14px 0 6px;line-height:1}
.result .stars .off{opacity:.22}
.result .super{display:inline-block;margin-top:8px;padding:8px 16px;border-radius:20px;
  border:1px solid var(--mint);color:var(--mint);font-family:"Unbounded",sans-serif;font-weight:800;font-size:15px;
  animation:pop .5s ease}
.result .xp{margin-top:12px;font-size:13px;color:var(--chalk)}

.btn{
  display:block;width:100%;margin-top:12px;padding:14px;border-radius:12px;
  border:1px solid var(--line);background:var(--amber);color:var(--ink-deep);
  font-family:"Unbounded",sans-serif;font-weight:600;font-size:14px;cursor:pointer
}
.btn.ghost{background:transparent;color:var(--chalk);border-color:var(--grid)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div id="screen-map">
    <div class="eyebrow">Математика · 10 рівнів · <span id="sync" class="sync">…</span></div>
    <h1>Таблиця множення</h1>
    <div class="hud">
      <div class="stat"><span class="k">XP</span><b id="hud-xp">0</b></div>
      <div class="stat"><span class="k">Рекорд/хв</span><b id="hud-rec">—</b></div>
      <div class="stat"><span class="k">Рівні</span><b id="hud-lv">0/10</b></div>
    </div>
    <div class="map" id="map"></div>
    <div class="rule"></div>
    <div class="eyebrow">Супер-результат — 30 правильних за хвилину</div>
    <a class="backlink" href="igry.html">← До ігор</a>
  </div>

  <div id="screen-play" class="hide">
    <div class="pbar">
      <span class="lab" id="p-lab"></span>
      <span class="score" id="p-score">0<small> / 30</small></span>
    </div>
    <div class="timer" id="p-timer"><i id="p-bar"></i></div>
    <div class="board"><div class="eqq" id="p-eq"></div></div>
    <div class="opts" id="p-opts"></div>
    <div class="msg" id="p-msg"></div>
    <button class="btn ghost" id="p-back">Зупинити · до карти</button>
  </div>

  <div id="screen-done" class="hide">
    <div class="eyebrow">Рівень завершено</div>
    <h1 id="d-title"></h1>
    <div class="result">
      <div class="big" id="d-num">0</div>
      <div class="cap">правильних за 60 секунд</div>
      <div class="stars" id="d-stars"></div>
      <div id="d-super"></div>
      <div class="xp" id="d-xp"></div>
    </div>
    <button class="btn" id="d-again">Спробувати ще раз</button>
    <button class="btn" id="d-next">Наступний рівень</button>
    <button class="btn ghost" id="d-map">До карти рівнів</button>
  </div>

</div>

<div class="count" id="count"><b id="count-n">3</b></div>

<script type="module" src="firebase-config.js"></script>
<script>
/* ============================================================
   ТАБЛИЦЯ МНОЖЕННЯ — 10 рівнів, спринт на 60 секунд.
   Супер-результат: 30 правильних за хвилину.
   Прогрес: localStorage 'sk_game_mnozhennya' + heroes/{id}.progress через SK.
   best[i] — рекорд правильних за рівень; XP і зірки рахуються з best[].
   ============================================================ */

const LEVELS = [
  {t:"Таблиця числа 2", s:"×2", n:2},
  {t:"Таблиця числа 3", s:"×3", n:3},
  {t:"Таблиця числа 4", s:"×4", n:4},
  {t:"Таблиця числа 5", s:"×5", n:5},
  {t:"Таблиця числа 6", s:"×6", n:6},
  {t:"Таблиця числа 7", s:"×7", n:7},
  {t:"Таблиця числа 8", s:"×8", n:8},
  {t:"Таблиця числа 9", s:"×9", n:9},
  {t:"Змішана таблиця", s:"2–9", n:0},
  {t:"Чемпіон множення", s:"з ×", n:-1},
];

const ROUND_SEC = 60;   // тривалість спринту
const SUPER     = 30;   // супер-результат за хвилину
const PASS      = 12;   // мінімум, щоб відчинити наступний рівень (= 1 зірка)

/* стан гравця (дзеркалиться у localStorage) */
const S = { unlocked:0, done:Array(10).fill(false), best:Array(10).fill(0), xp:0 };

let L = 0, correct = 0, curr = null, busy = false;
let roundEndAt = 0, ticker = null;

const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);

/* ---------- зірки та XP ---------- */
function starCount(best){ if(best>=SUPER) return 3; if(best>=20) return 2; if(best>=PASS) return 1; return 0; }
function levelXp(best){ if(best<=0) return 0; let xp = Math.min(best, SUPER); if(best>=SUPER) xp += 20; return xp; }
function totalXp(){ return S.best.reduce((a,b)=>a+levelXp(b), 0); }
function recordPerMin(){ return Math.max(0, ...S.best); }
function starStr(k){ let s=""; for(let i=0;i<3;i++) s += `<span class="${i<k?"":"off"}">★</span>`; return s; }

/* ---------- генерація питань ---------- */
function pickPair(n){
  if(n>=2 && n<=9){                       // рівень однієї таблиці: один множник = n
    const other = rnd(2,9);
    return Math.random()<0.5 ? [n,other] : [other,n];
  }
  return [rnd(2,9), rnd(2,9)];            // змішана / чемпіон
}
function optsProduct(c,a,b){
  const set = new Set([c]);
  const cand = [a*(b+1), a*(b-1), (a+1)*b, (a-1)*b, c+a, c-a, c+b, c-b, c+1, c-1, c+2, c-2];
  cand.forEach(v => { if(v>0 && v!==c) set.add(v); });
  let arr = [...set].filter(v => v!==c);
  let guard = 0;
  while(arr.length < 3 && guard++ < 60){ const v = c + rnd(-9,9); if(v>0 && v!==c && !arr.includes(v)) arr.push(v); }
  return shuffle([c, ...shuffle(arr).slice(0,3)]);
}
function optsFactor(ans){
  const set = new Set([ans]);
  let guard = 0;
  while(set.size < 4 && guard++ < 60) set.add(rnd(2,9));
  return shuffle([...set]);
}
function make(lvl){
  const champ = LEVELS[lvl].n === -1;
  const reverse = champ && Math.random() < 0.35;
  const [a,b] = pickPair(LEVELS[lvl].n);
  const c = a*b;
  if(reverse){                            // знайди множник: □ × b = c
    const hideA = Math.random() < 0.5;
    const ans = hideA ? a : b;
    const eq = hideA
      ? `<span class="hole">?</span> × ${b} = ${c}`
      : `${a} × <span class="hole">?</span> = ${c}`;
    return { eq, ans, opts: optsFactor(ans) };
  }
  return { eq: `${a} × ${b} = <span class="hole">?</span>`, ans: c, opts: optsProduct(c,a,b) };
}

/* ---------- карта рівнів ---------- */
function drawMap(){
  $("hud-xp").textContent  = S.xp;
  $("hud-rec").textContent = recordPerMin() > 0 ? recordPerMin() : "—";
  $("hud-lv").textContent  = S.done.filter(Boolean).length + "/10";
  $("map").innerHTML = "";
  LEVELS.forEach((lv,i) => {
    const b = document.createElement("button");
    const locked = i > S.unlocked;
    const best = S.best[i]|0, k = starCount(best);
    b.className = "lvl" + (S.done[i] ? " done" : "") + (locked ? " lock" : "");
    const tag = locked ? "зачинено"
              : (best > 0 ? `рекорд ${best}` : `спринт 60 с`);
    b.innerHTML =
      `<span class="n">РІВЕНЬ ${String(i+1).padStart(2,"0")} · ${lv.s}</span>${lv.t}` +
      `<span class="st">${locked ? "" : starStr(k)}</span>` +
      `<span class="tag">${tag}</span>`;
    b.disabled = locked;
    b.onclick = () => startLevel(i);
    $("map").appendChild(b);
  });
}
function show(id){ ["screen-map","screen-play","screen-done"].forEach(s => $(s).classList.toggle("hide", s !== id)); }

/* ---------- запуск рівня ---------- */
function startLevel(i){
  L = i; show("screen-play");
  $("p-lab").textContent = `Рівень ${String(i+1).padStart(2,"0")} · ${LEVELS[i].t}`;
  $("p-msg").textContent = ""; $("p-msg").className = "msg";
  $("p-opts").innerHTML = ""; $("p-eq").innerHTML = "";
  preCount(() => beginRound());
}
function preCount(done){
  const box = $("count"), n = $("count-n");
  const seq = ["3","2","1","Вперед!"];
  let i = 0;
  box.classList.add("on");
  const step = () => {
    n.textContent = seq[i];
    n.className = (seq[i] === "Вперед!") ? "go" : "";
    i++;
    if(i < seq.length){ setTimeout(step, 620); }
    else { setTimeout(() => { box.classList.remove("on"); done(); }, 520); }
  };
  step();
}
function beginRound(){
  correct = 0; busy = false;
  updateScore();
  roundEndAt = Date.now() + ROUND_SEC*1000;
  $("p-timer").classList.remove("low");
  $("p-bar").style.width = "100%";
  if(ticker) clearInterval(ticker);
  ticker = setInterval(tick, 120);
  nextQ();
}
function tick(){
  const left = roundEndAt - Date.now();
  const frac = Math.max(0, left) / (ROUND_SEC*1000);
  $("p-bar").style.width = (frac*100).toFixed(1) + "%";
  $("p-timer").classList.toggle("low", left <= 10000);
  if(left <= 0) endRound();
}
function updateScore(){ $("p-score").innerHTML = `${correct}<small> / ${SUPER}</small>`; }

function nextQ(){
  curr = make(L);
  $("p-eq").innerHTML = curr.eq;
  $("p-opts").innerHTML = "";
  curr.opts.forEach(v => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = v;
    b.onclick = () => tapOpt(b, v);
    $("p-opts").appendChild(b);
  });
  busy = false;
}
function lockOpts(){ [...$("p-opts").children].forEach(b => b.disabled = true); }

function tapOpt(btn, val){
  if(busy || Date.now() >= roundEndAt) return;
  busy = true;
  const ok = (val === curr.ans);
  if(ok){
    btn.classList.add("ok");
    correct++; updateScore();
    setTimeout(() => { if(Date.now() < roundEndAt) nextQ(); }, 170);
  }else{
    btn.classList.add("no");
    lockOpts();
    [...$("p-opts").children].forEach(b => { if(Number(b.textContent) === curr.ans) b.classList.add("ok"); });
    $("p-msg").className = "msg no";
    $("p-msg").textContent = `${curr.eq.replace(/<[^>]+>/g,"?")} → ${curr.ans}`;
    setTimeout(() => { $("p-msg").textContent = ""; $("p-msg").className = "msg"; if(Date.now() < roundEndAt) nextQ(); }, 700);
  }
}

/* ---------- кінець раунду ---------- */
function endRound(){
  if(ticker){ clearInterval(ticker); ticker = null; }
  busy = true; lockOpts();
  $("p-bar").style.width = "0%";

  const before = totalXp();
  const isBest = correct > (S.best[L]|0);
  if(isBest) S.best[L] = correct;
  if(correct >= PASS && !S.done[L]){
    S.done[L] = true;
    if(L === S.unlocked && L < 9) S.unlocked = L + 1;
  }else if(correct >= PASS && L === S.unlocked && L < 9){
    S.unlocked = L + 1;
  }
  S.xp = totalXp();
  const gained = Math.max(0, S.xp - before);
  saveProgress();

  const k = starCount(correct);
  $("d-title").textContent = LEVELS[L].t;
  $("d-num").textContent   = correct;
  $("d-stars").innerHTML   = starStr(k);
  $("d-super").innerHTML   = correct >= SUPER ? `<span class="super">🏆 СУПЕР · 30+ за хвилину</span>` : "";

  let line;
  if(correct >= SUPER)      line = "Неймовірно! Ти справжній чемпіон таблиці множення.";
  else if(correct >= 20)    line = "Чудово! До супер-результату лишилось зовсім трохи.";
  else if(correct >= PASS)  line = "Рівень пройдено! Спробуй побити свій рекорд.";
  else                      line = `Треба ${PASS}, щоб відчинити наступний рівень. Ще один спринт!`;
  const xpLine = gained > 0 ? ` +${gained} XP` : (isBest ? "" : " (рекорд не побито)");
  $("d-xp").textContent = line + xpLine + `  ·  Усього ${S.xp} XP`;

  $("d-next").classList.toggle("hide", !(S.done[L] && L < 9));
  show("screen-done");
  drawMap();
}

/* ---------- кнопки ---------- */
$("p-back").onclick  = () => { if(ticker){ clearInterval(ticker); ticker=null; } drawMap(); show("screen-map"); };
$("d-map").onclick   = () => { drawMap(); show("screen-map"); };
$("d-again").onclick = () => startLevel(L);
$("d-next").onclick  = () => startLevel(Math.min(L+1, 9));

/* ---------- прогрес: localStorage (ключі sk_*) + heroes/{id}.progress через SK ---------- */
const LS_KEY = "sk_game_mnozhennya";
const setSync = (t,c) => { const e=$("sync"); if(e){ e.textContent=t; e.className="sync "+(c||""); } };

function readLS(){
  try{
    const o = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if(o && typeof o === "object"){
      S.unlocked = o.unlocked|0;
      S.done = Array.isArray(o.done) && o.done.length===10 ? o.done.map(Boolean) : Array(10).fill(false);
      S.best = Array.isArray(o.best) && o.best.length===10 ? o.best.map(v=>v|0) : Array(10).fill(0);
      S.xp = totalXp();
    }
  }catch(e){}
}
function saveProgress(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({unlocked:S.unlocked, done:S.done, best:S.best, xp:S.xp})); }catch(e){}
  if(window.SK && SK.pushLocal){
    SK.pushLocal().then(ok=>setSync(ok?"збережено":"локально",ok?"ok":"no")).catch(()=>setSync("локально","no"));
  }
}
window.addEventListener("pagehide", saveProgress);

function waitSK(cb){
  let n = 0;
  (function poll(){
    if(window.SK && window.SK.ready) return cb(true);
    if(++n > 60) return cb(null);           // ~6 с — firebase-config.js не піднявся
    setTimeout(poll, 100);
  })();
}
function boot(){
  readLS(); drawMap(); setSync("з'єднання…");
  waitSK(ok => {
    if(!ok){ setSync("локально — без хмари","no"); return; }
    SK.ready.then(async () => {
      try{
        if(!SK.isHeroSession || !SK.isHeroSession()){ setSync("увійди як Герой","no"); return; }
        await SK.pullLocal();               // хмара → localStorage
        readLS(); drawMap();
        const hero = await SK.getActiveChild();
        setSync(hero && hero.name ? hero.name : "прогрес у хмарі", "ok");
      }catch(e){ setSync("локально","no"); }
    });
  });
}
boot();
</script>
</body>
</html>
