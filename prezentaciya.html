<meta name="description" content="School Kingdoms — гейміфікована освітня платформа для початкової школи. Тести, тренажери, ігри, завдання та контроль батьків — українською.">

<style>
  :root{
    --night:#081733; --navy:#13315f; --navy-l:#1e4d8b;
    --gold:#F2C75C; --gold-d:#C9942F; --gold-deep:#8a5e16;
    --cream:#FBEFD0;
    --line:rgba(242,199,92,.28);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--night);color:var(--cream);
    font-family:'Nunito',system-ui,sans-serif;font-weight:600;line-height:1.6;
    overflow-x:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit}

  .sky{position:fixed;inset:0;z-index:-3;
    background:
      radial-gradient(1200px 700px at 50% -10%, #1b3f74 0%, transparent 60%),
      radial-gradient(900px 600px at 85% 10%, rgba(140,107,255,.18) 0%, transparent 55%),
      linear-gradient(180deg,#081733 0%, #0a1d3d 45%, #081226 100%)}
  .stars{position:fixed;inset:0;z-index:-2;pointer-events:none}
  .star{position:absolute;border-radius:50%;background:#fff;opacity:.5;
    animation:tw 4s var(--ease) infinite}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.3)}}

  .wrap{max-width:1000px;margin:0 auto;padding:0 24px}

  .eyebrow{font-weight:900;letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;
    color:var(--gold);display:inline-flex;align-items:center;gap:12px}
  .eyebrow::before,.eyebrow::after{content:'';height:1px;width:34px;
    background:linear-gradient(90deg,transparent,var(--gold))}
  .eyebrow::after{background:linear-gradient(90deg,var(--gold),transparent)}

  /* ── HERO ── */
  header.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:80px 24px 40px}
