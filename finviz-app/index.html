<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finviz Oversold Screener</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fcfcf8'/%3E%3Cpath d='M1 12l4-4 3 3 6-7' stroke='%232f5fa8' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#fcfcf8;
    --grid:#dfe7f0;
    --ink:#1f2933;
    --ink-soft:#5b6774;
    --line:#c8d2de;
    --accent:#2f5fa8;
    --margin:#e0a0a0;
    --up:#1f7a45;
    --down:#b3372c;
    --bull:#eaf6ee;
    --cell:24px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(to right,  transparent 0 calc(var(--cell) - 1px), var(--grid) calc(var(--cell) - 1px) var(--cell)),
      repeating-linear-gradient(to bottom, transparent 0 calc(var(--cell) - 1px), var(--grid) calc(var(--cell) - 1px) var(--cell)),
      var(--paper);
    padding:24px 16px 48px;
  }
  .sheet{max-width:1080px;margin:0 auto}

  header{border-bottom:2px solid var(--line);padding-bottom:12px;margin-bottom:20px}
  h1{font-size:23px;margin:0 0 4px;letter-spacing:.2px}
  .sub{color:var(--ink-soft);font-size:13px;margin:0}

  /* ── панель фільтрів ── */
  .filters{
    background:rgba(255,255,255,.82);
    border:1px solid var(--line);
    border-left:3px solid var(--margin);
    padding:14px 16px;
    margin-bottom:18px;
  }
  .row{display:flex;flex-wrap:wrap;gap:18px 26px;align-items:flex-end}
  .row + .row{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  fieldset{border:0;margin:0;padding:0}
  legend, .lbl{
    font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--ink-soft);margin-bottom:6px;display:block;padding:0;
  }
  .seg{display:inline-flex;border:1px solid var(--line);background:#fff}
  .seg label{padding:6px 16px;cursor:pointer;font:600 14px/1 var(--mono)}
  .seg label + label{border-left:1px solid var(--line)}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg input:checked + span{color:#fff}
  .seg label:has(input:checked){background:var(--accent);color:#fff}
  .seg label:focus-within{outline:2px solid var(--accent);outline-offset:1px}

  .checks{display:flex;flex-wrap:wrap;gap:8px 20px}
  .checks label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:14px}
  .checks input{width:16px;height:16px;accent-color:var(--accent);margin:0}

  select{
    font:14px var(--mono);padding:6px 8px;background:#fff;
    border:1px solid var(--line);color:var(--ink);min-width:110px;
  }
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-left:auto}
  button{
    font:600 14px system-ui,sans-serif;padding:9px 20px;cursor:pointer;
    border:1px solid var(--accent);background:var(--accent);color:#fff;
  }
  button.ghost{background:#fff;color:var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button:not(:disabled):hover{filter:brightness(1.08)}

  /* ── статус ── */
  .status{min-height:22px;font-size:13px;color:var(--ink-soft);margin-bottom:12px}
  .status.err{color:var(--down)}
  .spin{
    display:inline-block;width:13px;height:13px;margin-right:8px;vertical-align:-2px;
    border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .warn{
    border:1px solid var(--margin);border-left:3px solid var(--margin);
    background:#fff6f6;padding:8px 12px;margin-bottom:12px;font-size:13px;color:var(--down);
  }

  /* ── таблиця ── */
  .scroll{overflow-x:auto;border:1px solid var(--line);background:rgba(255,255,255,.9)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:8px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  thead th{
    position:sticky;top:0;background:#f2f5f9;border-bottom:2px solid var(--line);
    font:600 11px/1.4 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.07em;
    color:var(--ink-soft);cursor:pointer;user-select:none;
  }
  thead th:hover{color:var(--accent)}
  thead th .arr{opacity:.35;margin-left:4px;font-size:10px}
  thead th[aria-sort] .arr{opacity:1;color:var(--accent)}
  tbody tr:nth-child(even){background:rgba(223,231,240,.22)}
  tbody tr.bull{background:var(--bull);box-shadow:inset 3px 0 0 var(--up)}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  td.up{color:var(--up)}
  td.down{color:var(--down)}
  a{color:var(--accent);font-weight:700;font-family:var(--mono);text-decoration:none}
  a:hover{text-decoration:underline}
  .flag{font-family:var(--mono);font-size:13px}

  .empty{
    border:1px dashed var(--line);background:rgba(255,255,255,.7);
    padding:28px 20px;text-align:center;color:var(--ink-soft);font-size:14px;
  }
  .empty b{color:var(--ink)}
  footer{margin-top:22px;font-size:11.5px;color:var(--ink-soft);line-height:1.6}
  [hidden]{display:none !important}

  @media (max-width:700px){
    body{padding:16px 10px 36px;--cell:20px}
    h1{font-size:20px}
    .row{gap:14px 18px}
    .actions{margin-left:0;width:100%}
    .actions button{flex:1}
    th,td{padding:7px 9px;font-size:13px}
  }
</style>
</head>
<body>
<div class="sheet">

  <header>
    <h1>Finviz Oversold Screener</h1>
    <p class="sub">Перепродані акції NYSE / NASDAQ, які вже почали розворот угору</p>
  </header>

  <form class="filters" id="filters">
    <div class="row">
      <fieldset>
        <legend>RSI (14)</legend>
        <div class="seg">
          <label><input type="radio" name="rsi" value="30" checked><span>30</span></label>
          <label><input type="radio" name="rsi" value="40"><span>40</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Умови розвороту</legend>
        <div class="checks">
          <label><input type="checkbox" id="day" checked> Ріст сьогодні</label>
          <label><input type="checkbox" id="week" checked> Ріст за тиждень</label>
          <label><input type="checkbox" id="month" checked> Місяць у плюсі</label>
          <label><input type="checkbox" id="macd"> MACD-підтвердження</label>
        </div>
      </fieldset>
    </div>

    <div class="row">
      <div>
        <label class="lbl" for="min_price">Мін. ціна</label>
        <select id="min_price">
          <option value="0">будь-яка</option>
          <option value="1">$1</option>
          <option value="2">$2</option>
          <option value="3">$3</option>
          <option value="5" selected>$5</option>
          <option value="7">$7</option>
          <option value="10">$10</option>
          <option value="15">$15</option>
          <option value="20">$20</option>
          <option value="30">$30</option>
          <option value="50">$50</option>
        </select>
      </div>
      <div>
        <label class="lbl" for="min_vol">Мін. сер. обсяг</label>
        <select id="min_vol">
          <option value="0">будь-який</option>
          <option value="50K">50K</option>
          <option value="100K">100K</option>
          <option value="200K">200K</option>
          <option value="300K">300K</option>
          <option value="400K">400K</option>
          <option value="500K" selected>500K</option>
          <option value="750K">750K</option>
          <option value="1M">1M</option>
          <option value="2M">2M</option>
        </select>
      </div>
      <div class="actions">
        <button type="submit" id="scan">Сканувати</button>
        <button type="button" class="ghost" id="csv" disabled>Експорт CSV</button>
      </div>
    </div>
  </form>

  <div class="status" id="status" aria-live="polite"></div>
  <div class="warn" id="warn" hidden></div>

  <div class="scroll" id="tableWrap" hidden>
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div class="empty" id="empty" hidden></div>

  <footer>
    Дані Finviz затримані ~15 хв. Не для реального входу — звіряй ціну в терміналі.
  </footer>
</div>

<script>
(function () {
  "use strict";

  var COLS = [
    { key: "ticker",     label: "Ticker",     type: "text" },
    { key: "exchange",   label: "Exchange",   type: "text" },
    { key: "price",      label: "Price",      type: "num",  fmt: function (v) { return money(v); } },
    { key: "change",     label: "Change",     type: "num",  fmt: pct, color: true, csv: "Change %" },
    { key: "perf_week",  label: "Perf Week",  type: "num",  fmt: pct, color: true, csv: "Perf Week %" },
    { key: "perf_month", label: "Perf Month", type: "num",  fmt: pct, color: true, csv: "Perf Month %" },
    { key: "rsi",        label: "RSI",        type: "num",  fmt: function (v) { return dec(v, 1); } }
  ];
  var MACD_COLS = [
    { key: "macd",             label: "MACD",   type: "num",  fmt: function (v) { return dec(v, 3); } },
    { key: "signal",           label: "Signal", type: "num",  fmt: function (v) { return dec(v, 3); } },
    { key: "macd_bull",        label: "Bull",   type: "bool", fmt: flag },
    { key: "macd_fresh_cross", label: "Cross",  type: "bool", fmt: flag }
  ];

  var el = {
    form:   document.getElementById("filters"),
    scan:   document.getElementById("scan"),
    csv:    document.getElementById("csv"),
    status: document.getElementById("status"),
    warn:   document.getElementById("warn"),
    wrap:   document.getElementById("tableWrap"),
    head:   document.getElementById("head"),
    body:   document.getElementById("body"),
    empty:  document.getElementById("empty")
  };

  var state = { rows: [], cols: COLS, sortKey: "change", sortDir: -1, macd: false, busy: false };

  // ── форматування ──
  function dec(v, d) { return v === null || v === undefined ? "—" : Number(v).toFixed(d); }
  function money(v) { return v === null || v === undefined ? "—" : Number(v).toFixed(2); }
  function pct(v) {
    if (v === null || v === undefined) return "—";
    return (v > 0 ? "+" : "") + Number(v).toFixed(2) + "%";
  }
  function flag(v) { return v ? "так" : "—"; }

  // ── запит ──
  function params() {
    var q = new URLSearchParams();
    q.set("rsi", el.form.querySelector('input[name="rsi"]:checked').value);
    q.set("min_price", document.getElementById("min_price").value);
    q.set("min_vol", document.getElementById("min_vol").value);
    q.set("day",   document.getElementById("day").checked   ? "1" : "0");
    q.set("week",  document.getElementById("week").checked  ? "1" : "0");
    q.set("month", document.getElementById("month").checked ? "1" : "0");
    q.set("macd",  document.getElementById("macd").checked  ? "1" : "0");
    return q;
  }

  function scan(e) {
    if (e) e.preventDefault();
    if (state.busy) return;

    var q = params();
    var withMacd = q.get("macd") === "1";
    state.busy = true;
    el.scan.disabled = true;
    el.csv.disabled = true;
    el.warn.hidden = true;
    el.empty.hidden = true;
    el.status.className = "status";
    el.status.innerHTML = '<span class="spin"></span>Сканую NASDAQ, NYSE…' +
      (withMacd ? " Рахую MACD по денних свічках — це довше." : "");

    fetch("/api/screen?" + q.toString(), { headers: { Accept: "application/json" } })
      .then(function (r) {
        return r.json().then(function (data) { return { ok: r.ok, data: data }; })
          .catch(function () { throw new Error("сервер відповів не JSON (HTTP " + r.status + ")"); });
      })
      .then(function (res) {
        if (!res.ok) throw new Error(res.data && res.data.error ? res.data.error : "HTTP помилка");
        show(res.data, withMacd);
      })
      .catch(function (err) {
        state.rows = [];
        render();
        el.wrap.hidden = true;
        el.empty.hidden = true;
        el.status.className = "status err";
        el.status.textContent = "Не вдалося отримати дані: " + err.message +
          ". Перевір, чи запущений app.py і чи є інтернет до Finviz.";
      })
      .then(function () {
        state.busy = false;
        el.scan.disabled = false;
      });
  }

  function show(data, withMacd) {
    state.rows = data.rows || [];
    state.macd = withMacd;
    state.cols = withMacd ? COLS.concat(MACD_COLS) : COLS;
    if (!state.cols.some(function (c) { return c.key === state.sortKey; })) state.sortKey = "change";

    var errs = data.errors || [];
    el.warn.hidden = errs.length === 0;
    if (errs.length) el.warn.textContent = "Частина бірж не відповіла — " + errs.join("; ");

    el.status.className = "status";
    if (state.rows.length) {
      var raw = data.stats && data.stats.raw ? data.stats.raw : state.rows.length;
      el.status.textContent = "Знайдено: " + state.rows.length + " з " + raw +
        " після серверних фільтрів · " + (data.elapsed_sec || 0) + " с";
    } else {
      el.status.textContent = "Знайдено: 0 · " + (data.elapsed_sec || 0) + " с";
    }

    el.csv.disabled = state.rows.length === 0;
    render();
  }

  // ── таблиця ──
  function render() {
    if (!state.rows.length) {
      el.wrap.hidden = true;
      el.body.innerHTML = "";
      el.empty.hidden = false;
      el.empty.innerHTML = "<b>Нічого не знайшлося.</b><br>Спробуй RSI 40 або зніми умову тижня.";
      return;
    }
    el.empty.hidden = true;
    el.wrap.hidden = false;

    el.head.innerHTML = "";
    state.cols.forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c.label;
      th.tabIndex = 0;
      if (state.sortKey === c.key) th.setAttribute("aria-sort", state.sortDir === 1 ? "ascending" : "descending");
      var arr = document.createElement("span");
      arr.className = "arr";
      arr.textContent = state.sortKey === c.key ? (state.sortDir === 1 ? "▲" : "▼") : "▲";
      th.appendChild(arr);
      th.addEventListener("click", function () { sortBy(c.key); });
      th.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); sortBy(c.key); }
      });
      el.head.appendChild(th);
    });

    el.body.innerHTML = "";
    sorted().forEach(function (row) {
      var tr = document.createElement("tr");
      if (state.macd && row.macd_bull) tr.className = "bull";
      state.cols.forEach(function (c) {
        var td = document.createElement("td");
        var v = row[c.key];
        if (c.key === "ticker") {
          var a = document.createElement("a");
          a.href = "https://finviz.com/quote.ashx?t=" + encodeURIComponent(row.ticker);
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = row.ticker;
          td.appendChild(a);
        } else if (c.type === "num") {
          td.className = "num";
          if (c.color && typeof v === "number") td.classList.add(v > 0 ? "up" : (v < 0 ? "down" : ""));
          td.textContent = c.fmt(v);
        } else if (c.type === "bool") {
          td.className = "flag";
          td.textContent = c.fmt(v);
        } else {
          td.textContent = v === null || v === undefined ? "—" : v;
        }
        tr.appendChild(td);
      });
      el.body.appendChild(tr);
    });
  }

  function sortBy(key) {
    if (state.sortKey === key) state.sortDir = -state.sortDir;
    else { state.sortKey = key; state.sortDir = (key === "ticker" || key === "exchange") ? 1 : -1; }
    render();
  }

  function sorted() {
    var key = state.sortKey, dir = state.sortDir;
    return state.rows.slice().sort(function (a, b) {
      var x = a[key], y = b[key];
      var xn = x === null || x === undefined, yn = y === null || y === undefined;
      if (xn && yn) return 0;
      if (xn) return 1;                       // порожні — завжди донизу
      if (yn) return -1;
      if (typeof x === "string") return x.localeCompare(y) * dir;
      return (Number(x) - Number(y)) * dir;
    });
  }

  // ── CSV із того, що зараз у таблиці ──
  function cell(v) {
    var s = v === null || v === undefined ? "" : String(v);
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCsv() {
    if (!state.rows.length) return;
    var lines = [state.cols.map(function (c) { return cell(c.csv || c.label); }).join(",")];
    sorted().forEach(function (row) {
      lines.push(state.cols.map(function (c) {
        var v = row[c.key];
        if (c.type === "bool") return v ? "true" : "false";
        return cell(v);
      }).join(","));
    });
    // BOM — щоб Excel не ламав кирилицю
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "finviz_oversold_" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 0);
  }

  el.form.addEventListener("submit", scan);
  el.csv.addEventListener("click", exportCsv);
  el.status.textContent = "Постав фільтри і натисни «Сканувати».";
})();
</script>
</body>
</html>
