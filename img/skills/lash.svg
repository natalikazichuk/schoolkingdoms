<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Захльост: світлий кнут, що петлею обвиває й сплутує -->
  <defs>
    <linearGradient id="rp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c9"/><stop offset="1" stop-color="#d9a24a"/></linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8673a"/><stop offset="1" stop-color="#6b3b1d"/></linearGradient>
  </defs>
  <!-- руків'я -->
  <rect x="5" y="40" width="9" height="20" rx="3" transform="rotate(-35 9 50)" fill="url(#hd)" stroke="#3d1f0c" stroke-width="1.5"/>
  <!-- ремінь: дуга й дві петлі -->
  <path d="M14 42 C 22 28, 36 18, 48 14" fill="none" stroke="#5a3311" stroke-width="7" stroke-linecap="round"/>
  <path d="M14 42 C 22 28, 36 18, 48 14" fill="none" stroke="url(#rp)" stroke-width="4.2" stroke-linecap="round"/>
  <ellipse cx="44" cy="34" rx="13" ry="8" transform="rotate(-20 44 34)" fill="none" stroke="#5a3311" stroke-width="6.5"/>
  <ellipse cx="44" cy="34" rx="13" ry="8" transform="rotate(-20 44 34)" fill="none" stroke="url(#rp)" stroke-width="3.8"/>
  <ellipse cx="42" cy="46" rx="12" ry="7" transform="rotate(-15 42 46)" fill="none" stroke="#5a3311" stroke-width="6.5"/>
  <ellipse cx="42" cy="46" rx="12" ry="7" transform="rotate(-15 42 46)" fill="none" stroke="url(#rp)" stroke-width="3.8"/>
  <path d="M48 14 C 54 12, 58 16, 56 22 C 55 26, 52 27, 50 26" fill="none" stroke="#5a3311" stroke-width="5" stroke-linecap="round"/>
  <path d="M48 14 C 54 12, 58 16, 56 22 C 55 26, 52 27, 50 26" fill="none" stroke="url(#rp)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- іскри руху -->
  <path d="M30 8 l2 5 M37 5 l0 5 M24 13 l3 4" stroke="#fff7d6" stroke-width="2.2" stroke-linecap="round"/>
</svg>
