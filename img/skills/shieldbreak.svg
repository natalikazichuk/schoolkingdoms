<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Розбити щит: меч навскіс і тріснутий щит, що розлітається -->
  <defs>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd8e6"/><stop offset="1" stop-color="#7d8ba3"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd970"/><stop offset="1" stop-color="#c98a1c"/></linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9fb3cc"/></linearGradient>
  </defs>
  <!-- меч -->
  <g transform="rotate(-45 32 32)">
    <rect x="29.5" y="2" width="5" height="40" rx="2" fill="url(#bl)" stroke="#3b4a63" stroke-width="1.2"/>
    <path d="M29.5 4 L32 0 L34.5 4 Z" fill="#fff" stroke="#3b4a63" stroke-width="1"/>
    <rect x="22" y="41" width="20" height="5" rx="2.2" fill="url(#rim)" stroke="#6b4310" stroke-width="1.2"/>
    <rect x="29.6" y="46" width="4.8" height="11" rx="2" fill="#7a4a1e" stroke="#3d220b" stroke-width="1"/>
    <circle cx="32" cy="59.5" r="3" fill="url(#rim)" stroke="#6b4310" stroke-width="1"/>
  </g>
  <!-- ліва половина щита -->
  <path d="M30 14 L14 18 C14 32 17 44 29 54 L33 41 L27 34 L32 26 Z" fill="url(#sh)" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round"/>
  <!-- права половина щита, трохи відлетіла -->
  <g transform="translate(4 -2) rotate(8 40 30)">
    <path d="M33 14 L49 18 C49 32 46 44 34 54 L38 41 L32 34 L37 26 Z" fill="url(#sh)" stroke="url(#rim)" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- іскри від удару -->
  <g fill="#ffd34d" stroke="#e0661b" stroke-width=".8">
    <path d="M33 30 l3 -6 l1 5 l5 -2 l-4 4 l5 3 l-6 0 l-1 5 l-2 -5 l-5 1 l4 -3 z"/>
  </g>
  <circle cx="20" cy="12" r="1.6" fill="#ffd34d"/><circle cx="48" cy="52" r="1.4" fill="#ffd34d"/><circle cx="52" cy="12" r="1.2" fill="#ffd34d"/>
</svg>
