<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>
  /* ── контейнер сторінки (на голубому небі зі sk-styles.css) ── */
  /* та сама ширина й поля, що в .nv-wrap на navchannia/doshkillya — щоб плитки збігались */
  .wrap{max-width:940px;margin:0 auto;padding:20px 14px calc(94px + env(safe-area-inset-bottom))}
  .page-head{text-align:left;margin:2px 4px 16px}
  .page-head h1{font-family:'Playfair Display',serif;font-weight:900;
    font-size:clamp(1.4rem,4vw,1.9rem);color:var(--gold);margin:0;
    text-shadow:0 2px 6px rgba(0,0,0,.45)}
  .page-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .page-head[hidden]{display:none}
  .crumb{font-family:'Playfair Display',Georgia,serif;font-weight:800;color:#ffe9a8;
    font-size:clamp(1.05rem,3.6vw,1.35rem);line-height:1.1;
    text-shadow:0 2px 6px rgba(0,0,0,.35);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ── кнопка «назад» усередині drill-down ── */
  .back{display:inline-flex;align-items:center;gap:7px;border:1.5px solid rgba(242,199,92,.5);
    background:linear-gradient(180deg,rgba(30,52,92,.7),rgba(12,28,54,.78));color:#fff;
    border-radius:12px;padding:9px 16px;font-family:inherit;font-weight:800;font-size:.9rem;
    cursor:pointer;margin:0;transition:transform .15s,border-color .15s}
  #pgBack{flex:0 0 auto;padding:9px 14px;font-size:1.05rem;line-height:1}
  .back:hover{transform:translateY(-2px);border-color:var(--gold)}

  /* ── сітка карток ── */
  .tgroup{display:flex;align-items:baseline;gap:10px;margin:22px 4px 10px}
  .tgroup:first-of-type{margin-top:6px}
  .tg-name{font-family:'Playfair Display',Georgia,serif;font-weight:800;font-size:1.12rem;
    color:#ffe9a8;text-shadow:0 2px 6px rgba(0,0,0,.35)}
  .tg-cnt{font-weight:800;font-size:.8rem;color:#cfe0ff;opacity:.85;
    background:rgba(255,255,255,.10);border-radius:999px;padding:2px 10px}
  /* Плитки (.lvgrid/.nv-grid + .lv*) — спільні, у sk-styles.css.
     Тут їх НЕ дублюємо: саме через копії розміри розʼїжджались. */

  /* 240px, як у спільній .lvgrid: на широкому екрані виходить 3 плитки в ряд,
     а не 5 дрібних. Скарга з «Помилок»: «у веб переглядачі розмісти по 3 в ряд». */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  @media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:12px}}

  /* базова картка-квадрат (клас / предмет) */

  /* картка тесту (емодзі/обкладинка → назва → прогрес унизу) */
  .tcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
    text-decoration:none;color:#fff;padding:14px 12px 14px;border-radius:20px;
    background:linear-gradient(165deg,rgba(30,52,92,.62),rgba(12,28,54,.7));
    border:2px solid rgba(242,199,92,.45);box-shadow:0 12px 30px rgba(0,0,0,.38);
    transition:transform .15s,border-color .15s,box-shadow .15s}
  .tcard:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 16px 34px rgba(0,0,0,.46)}
  .tcard:active{transform:translateY(-1px)}
  .tcard .thumb{width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#f5eeda;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.26)}
  .tcard .thumb img{width:100%;height:100%;object-fit:contain}
  .tcard .emoji{font-size:3rem;line-height:1;padding:8px 0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .tcard .tname{font-family:'Playfair Display',serif;font-weight:800;font-size:.96rem;
    line-height:1.18;text-align:center}
  .tcard .cprog{width:100%;margin-top:auto}

  /* ── прогрес унизу картки ── */
  .cprog{display:flex;flex-direction:column;gap:4px}
  .cprog .track{height:9px;border-radius:999px;overflow:hidden;
    background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.16)}
  .cprog .track>i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#7be0a4,#f5c542);
    box-shadow:0 0 8px -2px rgba(245,197,66,.8);transition:width .55s ease}
  .cprog .ptx{font-size:.68rem;font-weight:800;color:#e6edff;white-space:nowrap;line-height:1}
  .cprog.done .track>i{background:linear-gradient(90deg,#7be0a4,#4bc47f)}
  .cprog.done .ptx{color:#bff0cd}

  .empty{grid-column:1/-1;color:#eaf1ff;font-weight:700;text-align:center;
    padding:34px 12px;line-height:1.6;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .empty span{opacity:.7;font-weight:600;font-size:.82rem}

  /* приземлення з навігації хедера: золоте кільце + легкий «стрибок» */
  @keyframes skNavRing{
    0%{box-shadow:0 0 0 0 rgba(242,199,92,0)}
    12%{box-shadow:0 0 0 4px rgba(242,199,92,.95),0 0 30px 8px rgba(242,199,92,.6)}
    55%{box-shadow:0 0 0 3px rgba(242,199,92,.5),0 0 18px 5px rgba(242,199,92,.28)}
    100%{box-shadow:0 0 0 0 rgba(242,199,92,0)}}
  @keyframes skNavPop{0%{transform:scale(1)}12%{transform:scale(1.04)}34%{transform:scale(.997)}100%{transform:scale(1)}}
  .sk-nav-land{animation:skNavRing 1.9s ease-out 1,skNavPop .6s ease-out 1;border-radius:22px;position:relative;z-index:3}
  @media(prefers-reduced-motion:reduce){.sk-nav-land{animation:none}}

  /* ── футер: активний пункт + ромби-роздільники (як на hero.html) ── */
  body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
  .botnav > *:not(:last-child)::after{content:"◈";position:absolute;right:-3px;top:50%;
    transform:translateY(-50%);color:#e0a42a;font-size:.72rem;opacity:.85;
    text-shadow:0 1px 2px rgba(0,0,0,.55);pointer-events:none}
  .botnav a.active{background:linear-gradient(180deg,#fdeeb6,#f4c842);color:#5a3d05;
    border:2px solid #fff6d8;box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 16px -3px rgba(244,200,66,.8),
    inset 0 1px 0 rgba(255,255,255,.6);transform:translateY(-2px)}
  .botnav a.active .ic{filter:none}
  .botnav a:hover:not(.active),.botnav button:hover{background:rgba(255,255,255,.08);color:#fff}
</style>
</head>

  <div class="bg-fallback"></div>
  <div class="stars"></div>
  <div class="moon"></div>

  <!-- СПІЛЬНИЙ ХЕДЕР (бренд + шкала Героя) вставляється через sk-header.js -->

  <main class="wrap">
    <!-- Один компактний рядок: стрілочка назад + де дитина зараз.
         Назву сторінки не дублюємо — вона вже є в шапці (SK_HEADER_SUB). -->
    <div class="page-head" id="pgHead" hidden>
      <button class="back" id="pgBack" type="button" aria-label="Назад">←</button>
      <span class="crumb" id="pgSub"></span>
    </div>
    <div id="screen"><div class="empty">Завантаження тестів…</div></div>
  </main>

<script src="sk-footer.js?v=5" data-active="navch" data-back="navchannia.html"></script>

<!-- Спільна карта королівства. МАЄ йти перед інлайн-скриптом нижче -->
<script src="sk-curriculum.js?v=4"></script>
<script>
/* ── Запобіжник: sk-curriculum.js має бути свіжим ── */
(function(){
  var need = 5;
  var uses = ['norm','clone','subjectMatches','placeTests','PASS_RATIO','ready','map'];
  var bad = null;
  if(!window.SKCUR) bad = 'Файл sk-curriculum.js не завантажився.';
  else {
    var miss = uses.filter(function(k){ return window.SKCUR[k] == null; });
    if(miss.length) bad = 'Файл sk-curriculum.js застарілий — немає: ' + miss.join(', ') + '.';
    else if((Number(window.SKCUR.API_VERSION)||0) < need)
      bad = 'Файл sk-curriculum.js застарілий (версія ' + (window.SKCUR.API_VERSION||'?') + ', потрібна ' + need + ').';
  }
  if(!bad) return;
  var r = document.getElementById('screen');
  if(r) r.innerHTML = '<p class="empty">😔 Королівство лагодиться. Спробуй трохи згодом!'
    + '<br><span>' + bad + '</span></p>';
  throw new Error('SKCUR: ' + bad);
})();

/* ============================================================
   ТЕСТИ — покрокова навігація картками:
     Клас (1–11) → Предмет → Тести.
   Кістяк (класи/предмети/розділи) приходить із sk-curriculum.js
   (документ curriculum/map, редагується в адмінці). Тести — з бази
   (SK.listActiveTests) і розкладаються по предметах спільною логікою
   SKCUR.placeTests (та сама, що й у перевірці карти в адмінці).
   Прогрес — з Firebase (heroes/{id}.progress) ∪ localStorage.
   ============================================================ */
(function(){
  'use strict';

  var CURRICULUM = [];      // клон SKCUR.map.tiers
  var IDX = null;           // { grades:{num:{num,order[],subs{}}}, nums[] }
  var ALL_GRADES = [];      // усі класи з карти (для сітки, навіть порожні)
  var GRADE_ID2NUM = {};    // gradeId → gradeNum (для навігації з хедера)
  var GRADE_NUM2ID = {};    // і назад: щоб адреса рядка завжди знала поточний клас
  var PROG = null;          // прогрес Героя з Firebase (heroes/{id}.progress)

  /* Чому список тестів порожній. Раніше помилка доступу й «тестів справді
     немає» виглядали однаково: .catch мовчки підставляв [], і на екрані
     лишалась сама вбудована картка словника — «1 тест» у кожному класі.
     LOAD.err — текст причини, LOAD.raw — скільки документів віддала база,
     LOAD.shown — скільки лишилось після фільтра hidden. */
  var LOAD = { err:'', raw:null, shown:null };

  var view = 'classes', selGrade = null, selSubj = null;
  /* Ступінь, у якому зараз дитина. Сторінка показує класи ЛИШЕ цього
     ступеня: дошкільний вміст живе у «Дошкільнятку» (doshkillya.html) і
     не має стояти поруч із «1 клас». null — ступінь ще невідомий. */
  var selTier = null;

  /* Код помилки Firestore → зрозуміла причина. Саме він відрізняє
     «база не пускає» від «у базі порожньо». */
  function whyFailed(e){
    var code = String((e && (e.code || e.name)) || '').toLowerCase();
    if(code.indexOf('permission-denied') >= 0)
      return 'база не дозволила читати тести — перевір правила доступу до колекції tests або вхід в акаунт';
    if(code.indexOf('resource-exhausted') >= 0)
      return 'вичерпано денний ліміт Firebase — тести повернуться завтра або на платному тарифі';
    if(code.indexOf('unauthenticated') >= 0)
      return 'вхід в акаунт злетів — дитину треба залогінити заново';
    if(code.indexOf('unavailable') >= 0 || code.indexOf('deadline') >= 0)
      return 'база не відповіла — схоже на мережу';
    var msg = String((e && e.message) || e || '').slice(0, 120);
    return msg || 'невідома помилка';
  }

  /* Рядок-пояснення над сіткою класів, коли тестів з бази не приїхало. */
  function loadNote(){
    if(LOAD.err)
      return '<div class="empty">⚠️ Тести не завантажились: ' + esc(LOAD.err)
           + '<br><span>Показано лише вбудовану картку словника.</span></div>';
    if(LOAD.raw === 0)
      return '<div class="empty">⚠️ База відповіла, але жодного тесту в ній немає.'
           + '<br><span>Перевір адмінку → «Тести»: можливо, їх вимкнено (active) або видалено.</span></div>';
    if(LOAD.raw > 0 && LOAD.shown === 0)
      return '<div class="empty">⚠️ Тестів у базі ' + LOAD.raw + ', але всі вони приховані (hidden).'
           + '<br><span>Такі тести живуть лише як посилання-випробування і в цьому списку не показуються.</span></div>';
    return '';
  }

  function q(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function pgGet(k){ return (PROG && PROG[k]!=null) ? PROG[k] : null; }
  /* дошкільний ступінь — за id/назвою («preschool» / «дошкіл…»). Його вміст
     виноситься в окрему картку «Дошкільнятко» ПЕРЕД 1 класом. */
  function isPreschoolTier(t){
    if(!t) return false;
    var s=(String(t.id||'')+' '+String(t.name||'')).toLowerCase();
    return s.indexOf('preschool')>=0 || s.indexOf('дошкіл')>=0;
  }

  /* ── підрахунок пройдених рівнів зі збереженого стану ── */
  function countDoneLevels(v){
    try{ var o=(typeof v==='string')?JSON.parse(v):v;
      if(Array.isArray(o)) return o.length;
      return (o && typeof o==='object') ? Object.keys(o).length : 0;
    }catch(e){ return 0; }
  }
  function doneLevels(id){
    return Math.max(countDoneLevels(lsGet('sk_lvtest_'+id+'_done')),
                    countDoneLevels(pgGet('sk_lvtest_'+id+'_done')));
  }
  function truthy(v){ return v==='1'||v===1||v===true; }
  /* пройдено = прапорець проходження / 100% АБО (тести-рівні) ≥ PASS_RATIO рівнів —
     точно ті самі правила, що були на старій сторінці */
  function isPassed(t){
    if(t.std){ var ep=enProg(t.gkey); if(ep) return ep[0]>=ep[1]; }
    if(truthy(lsGet('sk_testpass_'+t.id)) || truthy(pgGet('sk_testpass_'+t.id))) return true;
    if(truthy(lsGet('sk_test100_'+t.id)) || truthy(pgGet('sk_test100_'+t.id))) return true;
    if(t.isLevels && t.levelCount>0) return (doneLevels(t.id)/t.levelCount) >= SKCUR.PASS_RATIO;
    return false;
  }
  /* Прогрес словника (WORDS) для класу key: [зроблено, усього] або null.
     Пише його slovnyk-en.html у sk_en_prog — по два кроки на тему
     («Тест» + «Випробування»). Беремо більше з локального й Героєвого. */
  function enProg(key){
    var g = (key==='p') ? '0' : String(Number(key)||0), best=null;
    [lsGet('sk_en_prog'), pgGet('sk_en_prog')].forEach(function(raw){
      var o=raw; if(typeof o==='string'){ try{ o=JSON.parse(o); }catch(e){ o=null; } }
      var r=o && o[g];
      if(r && r.length===2 && Number(r[1])>0 && (!best || Number(r[0])>best[0])) best=[Number(r[0]), Number(r[1])];
    });
    if(best && best[0]>best[1]) best[0]=best[1];
    return best;
  }
  /* дріб для смужки на КАРТЦІ ТЕСТУ (гранулярно): рівні, словник або 0/1 */
  function testFrac(t){
    if(t.isLevels && t.levelCount>0){ var d=doneLevels(t.id); if(d>t.levelCount)d=t.levelCount; return d/t.levelCount; }
    if(t.std){ var ep=enProg(t.gkey); if(ep) return ep[0]/ep[1]; }
    return isPassed(t) ? 1 : 0;
  }
  function subjProg(s){ var passed=0; s.tests.forEach(function(t){ if(isPassed(t)) passed++; }); return {total:s.tests.length, passed:passed}; }
  function gradeProg(gr){ var total=0,passed=0; if(gr) gr.order.forEach(function(sid){ gr.subs[sid].tests.forEach(function(t){ total++; if(isPassed(t)) passed++; }); }); return {total:total,passed:passed}; }

  /* ── смужка прогресу унизу картки ── */
  function bar(frac, label, cls){
    var pct=Math.max(0,Math.min(100,Math.round(frac*100)));
    var done=(frac>=1)?' done':'';
    return '<span class="cprog'+done+(cls?' '+cls:'')+'"><span class="track"><i style="width:'+pct+'%"></i></span>'
         + '<span class="ptx">'+esc(label)+'</span></span>';
  }

  /* ── обкладинка тесту: якщо в базі задано imgCard — показуємо, інакше емодзі предмета ── */
  function testVisual(t){
    if(t.imgCard){
      return '<span class="thumb"><img src="'+esc(t.imgCard)+'" alt="" loading="lazy" '
           + 'onerror="this.parentNode.outerHTML=\'<span class=&quot;emoji&quot;>'+esc(t.icon)+'</span>\'"></span>';
    }
    return '<span class="emoji">'+esc(t.icon)+'</span>';
  }

  /* ── побудова індексу «клас → предмет → тести» зі спільної розкладки ── */
  function toTestObj(t, subjIcon){
    /* 'html' (стара назва 'link') і 'video' ведуть на окрему сторінку,
       решта — на test.html. Окремого сховища «випробувань» немає. */
    var isLink = !!((t.format==='link'||t.format==='html'||t.format==='video') && t.linkHref);
    var lv = !isLink && (t.format==='levels' || (Array.isArray(t.levels) && t.levels.length));
    var href = isLink
      ? (String(t.linkHref) + (String(t.linkHref).indexOf('?')>=0?'&':'?') + 'skdone=t:' + encodeURIComponent(t.id) + '&skback=tests.html')
      : ('test.html?id='+encodeURIComponent(t.id));
    var img = t.imgCard||t.cover||'';
    if(isLink && !img){ var slug=String(t.linkHref).replace(/[?#].*$/,'').replace(/\.html?$/i,'').replace(/^.*\//,''); if(slug) img='img/tr/'+slug+'.webp'; }
    return { id:t.id, title:t.title||'Тест', href:href, isLink:isLink, blank:!!t.blank,
      isLevels:!!lv, levelCount: lv ? (Array.isArray(t.levels)?t.levels.length:0) : 0,
      icon:(t.icon||subjIcon||'📝'), imgCard: img };
  }
  function buildIndex(tests){
    var P = SKCUR.placeTests(CURRICULUM, tests);
    var G = {};
    function ensureGrade(n){ return G[n] || (G[n]={num:n, order:[], subs:{}}); }
    function ensureSubj(gr, subj){
      var s = gr.subs[subj.id];
      if(!s){ s={id:subj.id,name:subj.name,icon:subj.icon||'📘',accent:subj.accent||'#5C6BC0',
        stat:subj.stat||'',tests:[],_seen:{},groups:[],_gseen:{}}; gr.subs[subj.id]=s; gr.order.push(subj.id); }
      return s;
    }
    /* Розділ («Числа в межах 10» тощо) — той самий, що в структурі адмінки.
       Тести показуємо згрупованими за ним; те, що лежить поза розділами,
       іде в кінець без заголовка. */
    function ensureGroup(s, name){
      var key = name || '';
      if(!s._gseen) s._gseen = {};       // не даємо формі предмета знести весь список
      if(!s.groups) s.groups = [];
      var g = s._gseen[key];
      if(!g){ g = { name:key, tests:[] }; s._gseen[key]=g; s.groups.push(g); }
      return g;
    }
    function addBucket(b){
      // placeTests повертає запис на КОЖЕН розділ карти, навіть порожній —
      // тож порожні розділи створювали б предмети-дублі («немає»). Пропускаємо їх.
      if(!b.tests || !b.tests.length) return;
      var key = isPreschoolTier(b.tier) ? 'p' : String(Number(b.grade.gradeNum)||0);
      var gr=ensureGrade(key); var s=ensureSubj(gr,b.subj);
      var gname = (b.topic && b.topic.topic) ? String(b.topic.topic) : '';
      var grp = ensureGroup(s, gname);
      b.tests.forEach(function(t){
        if(s._seen[t.id]) return; s._seen[t.id]=1;
        var o = toTestObj(t, b.subj.icon);
        s.tests.push(o); grp.tests.push(o);
      });
    }
    P.topics.forEach(addBucket);
    P.subjects.forEach(addBucket);
    // катч-ол: несопоставлені тести → «Інші тести» до першого класу карти
    if(P.leftovers && P.leftovers.length){
      var firstKey=null;
      CURRICULUM.forEach(function(t){ if(isPreschoolTier(t)) return;
        (t.grades||[]).forEach(function(g){ if(firstKey==null) firstKey=String(Number(g.gradeNum)||1); }); });
      if(firstKey==null) firstKey='1';
      /* ⚠ Форма предмета мусить збігатися з ensureSubj: groups/_gseen тут
         колись забули, і ensureGroup(s,'') падав на s._gseen[''] —
         «Cannot read properties of undefined (reading '')». Падіння ловив
         зовнішній catch у bootMap, який відбудовував індекс порожнім, тож
         ОДИН тест без відповідного предмета в карті стирав з екрана ВСІ
         тести: у кожному класі лишалась сама вбудована картка словника. */
      function otherSubj(key, name){
        var gr=ensureGrade(key); var s=gr.subs['other'];
        if(!s){ s={id:'other',name:name,icon:'📦',accent:'#8a8fb0',stat:'',
          tests:[],_seen:{},groups:[],_gseen:{}}; gr.subs['other']=s; gr.order.push('other'); }
        return s;
      }
      P.leftovers.forEach(function(t){
        var isPre = Number(t.grade)===0;                       // дошкільні тести (grade 0)
        var s = isPre ? otherSubj('p','Інші (дошкілля)') : otherSubj(firstKey,'Інші тести');
        if(s._seen[t.id]) return; s._seen[t.id]=1;
        var o=toTestObj(t,'📦');
        if(!isPre && Number(t.grade) && String(Number(t.grade))!==firstKey) o.title='['+t.grade+' кл] '+o.title;
        s.tests.push(o); ensureGroup(s, '').tests.push(o);
      });
    }
    return { grades:G };
  }
  /* ── стандартні вбудовані картки: WORDS (English-словник) у КОЖНОМУ класі ── */
  /* Предмет English цього класу так, як він описаний у карті: щоб у класі,
     де англійська ще без тестів, картка словника лягла під справжню назву,
     іконку й колір предмета, а не під підставні. */
  function mapEngSubj(key){
    var found = null;
    CURRICULUM.forEach(function(t){
      (t.grades||[]).forEach(function(g){
        var k = isPreschoolTier(t) ? 'p' : String(Number(g.gradeNum)||0);
        if(found || k !== String(key)) return;
        (g.subjects||[]).forEach(function(s){
          if(found) return;
          if(s.id === 'eng' || /english|англ/i.test(String(s.name||''))) found = s;
        });
      });
    });
    return found;
  }
  function injectStdCards(){
    if(!IDX) return;
    if(!IDX.grades) IDX.grades = {};
    /* Тільки класи, які справді є в карті: у заплановані («Скоро») вбудовану
       картку словника підставляти не можна — інакше порожній клас виглядав
       би так, ніби в ньому вже є контент. */
    var keys = (ALL_GRADES && ALL_GRADES.length)
      ? ALL_GRADES.filter(function(g){ return !g.soon; }).map(function(g){ return g.key; })
      : Object.keys(IDX.grades);
    keys.forEach(function(key){
      var gr = IDX.grades[key];
      if(!gr){ gr = IDX.grades[key] = { num:(key==='p'?0:(Number(key)||0)), order:[], subs:{} }; }
      var eng = gr.subs['eng'];
      if(!eng){ for(var sid in gr.subs){ if(gr.subs[sid] && /english|англ/i.test(gr.subs[sid].name||'')){ eng=gr.subs[sid]; break; } } }
      if(!eng){
        var ms = mapEngSubj(key) || {};
        eng = { id: ms.id||'eng', name: ms.name||'English', icon: ms.icon||'🔤',
                accent: ms.accent||'#3FB6A8', stat: ms.stat||'Мана 🔮',
                tests:[], _seen:{}, groups:[], _gseen:{} };
        gr.subs[eng.id]=eng; gr.order.push(eng.id);
      }
      if(!eng._seen) eng._seen={};
      if(eng._seen['std-words-en']) return;
      eng._seen['std-words-en']=1;
      /* std:true — картка не належить жодному розділу карти. renderTests малює
         такі картки окремо, над розділами: інакше в класі, де в англійської
         вже є розділи з тестами, словник лежав би лише в s.tests і на екран
         не потрапляв (малюються тільки тести з розділів). */
      eng.tests.unshift({
        id:'std-words-en', title:'WORDS', std:true, gkey:key,   // клас — для прогресу словника
        href:'slovnyk-en.html?skdone=t:std-words-en&skback=tests.html',
        isLink:true, isLevels:false, levelCount:0, icon:'🔤',
        imgCard:'img/tr/slovnyk-en.webp'   // немає файлу → лишиться емодзі
      });
    });
  }
  function buildGradeMeta(){
    ALL_GRADES=[]; GRADE_ID2NUM={}; GRADE_NUM2ID={};
    var pre=null, nums=[], seen={};
    CURRICULUM.forEach(function(t){
      if(isPreschoolTier(t)){
        if(!pre) pre={key:'p', preschool:true, icon:(t.icon||'🌱'), label:'Дошкільнятко', tier:(t.id||'preschool')};
        (t.grades||[]).forEach(function(g){ GRADE_ID2NUM[g.id]='p'; if(!GRADE_NUM2ID['p']) GRADE_NUM2ID['p']=g.id; });
        return;
      }
      (t.grades||[]).forEach(function(g){
        var n=Number(g.gradeNum)||0; GRADE_ID2NUM[g.id]=String(n);
        if(!GRADE_NUM2ID[String(n)]) GRADE_NUM2ID[String(n)]=g.id;
        if(!seen[n]){ seen[n]=1; nums.push({key:String(n), num:n, name:g.name||(n+' клас'), tier:(t.id||'')}); }
      });
    });
    /* Дитина має бачити весь ступінь, а не лише заповнені класи: 3 і 4
       стоять як «Скоро», щоб було видно, що попереду. Ті самі діапазони,
       що в адмінці. */
    var RANGE = { junior:[1,2,3,4], senior:[5,6,7,8,9] };
    function tierKind(t){
      var v=(String(t&&t.id||'')+' '+String(t&&t.name||'')).toLowerCase();
      if(v.indexOf('junior')>=0 || v.indexOf('молодш')>=0) return 'junior';
      if(v.indexOf('senior')>=0 || v.indexOf('старш')>=0)  return 'senior';
      return '';
    }
    CURRICULUM.forEach(function(t){
      if(isPreschoolTier(t)) return;
      var want = RANGE[tierKind(t)] || [];
      want.forEach(function(n){
        if(seen[n]) return;
        seen[n]=1;
        nums.push({ key:String(n), num:n, name:n+' клас', tier:(t.id||''), soon:true });
      });
    });
    nums.sort(function(a,b){return a.num-b.num;});
    // дошкільна картка завжди перша (навіть якщо ступеня нема в карті)
    if(!pre) pre={key:'p', preschool:true, icon:'🌱', label:'Дошкільнятко', tier:'preschool'};
    ALL_GRADES = [pre].concat(nums);
  }
  /* У якому ступені живе клас із номером n (те саме правило, що в sk-header.js). */
  function tierIdOfGradeNum(n){
    n = Number(n);
    var i, j, t, gs;
    for(i=0;i<CURRICULUM.length;i++){
      t=CURRICULUM[i]; gs=t.grades||[];
      for(j=0;j<gs.length;j++) if(Number(gs[j].gradeNum)===n) return t.id||'';
    }
    return (n<=0) ? 'preschool' : (n<=4 ? 'junior' : 'senior');
  }
  /* Класи, які показуємо: лише обраного ступеня. Поки ступінь невідомий
     (гість, клас Героя ще не приїхав) — показуємо все, щоб нічого не зникло. */
  function visibleGrades(){
    if(!selTier) return ALL_GRADES;
    var out = ALL_GRADES.filter(function(g){ return g.tier === selTier; });
    return out.length ? out : ALL_GRADES;
  }
  function secByKey(k){ for(var i=0;i<ALL_GRADES.length;i++){ if(ALL_GRADES[i].key===String(k)) return ALL_GRADES[i]; } return null; }
  function secTitle(k){ var s=secByKey(k); return (s&&s.preschool)?'Дошкільнятко':(k+' клас'); }

  /* ── рендер ── */
  /* Спільна плитка: фон-картинка (якщо є), затемнення, назва, підпис,
     смужка прогресу або замок «Скоро». Картинку шукаємо за передбачуваним
     шляхом і ховаємо, якщо файлу немає — тоді лишається кольорова плашка. */
  /* Кілька шляхів до картинки: спершу власна (subj-<id>.webp / klas-N.webp),
     далі — спільна за темою. Якщо файлу немає, браузер кидає error і ми
     пробуємо наступний; коли скінчились — ховаємо, лишиться кольорова плашка. */
  window.SKIMGFB = function(el){
    var fb = String(el.getAttribute('data-fb')||'').split('|').filter(Boolean);
    if(!fb.length){ el.style.display = 'none'; return; }
    var next = String(fb[0]).split('~');
    el.setAttribute('data-fb', fb.slice(1).join('|'));
    el.style.objectPosition = next[1] || '';
    el.src = next[0];
  };
  /* Кожен варіант — 'шлях' або 'шлях~кадрування' (object-position). */
  function lvImg(list){
    var arr = (list||[]).filter(Boolean);
    if(!arr.length) return '';
    var one = String(arr[0]).split('~');
    return '<img class="lv-bg" src="'+esc(one[0])+'" alt="" loading="lazy"'
         + (one[1] ? ' style="object-position:'+esc(one[1])+'"' : '')
         + ' data-fb="'+esc(arr.slice(1).join('|'))+'" onerror="SKIMGFB(this)">';
  }
  /* Спільні фони за темою предмета — ті самі файли, що на doshkillya.html.
     Предмет із адмінки має згенерований id, тож шукаємо ще й за назвою. */
  var SUBJ_IMG = [
    { re:/математ|лічб|цифр|number|math/,                    img:'img/nav/dis-tsyfry.webp' },
    { re:/українськ|абетк|букв|читанн|грамот|мова/,           img:'img/nav/dis-bukvy.webp' },
    { re:/english|англ/,                                     img:'img/nav/dis-english.webp' },
    { re:/ядс|досліджую світ|природ|довкіл|світ/,             img:'img/nav/dis-svit.webp' }
  ];
  var SUBJ_IMG_ID = { math:'img/nav/dis-tsyfry.webp', ukr:'img/nav/dis-bukvy.webp',
                      eng:'img/nav/dis-english.webp', yads:'img/nav/dis-svit.webp' };
  function subjImgs(sj){
    var own = 'img/nav/subj-'+encodeURIComponent(sj.id)+'.webp';
    var hay = (String(sj.id||'')+' '+String(sj.name||'')).toLowerCase().replace(/[’'`ʼ]/g,'');
    var byTheme = SUBJ_IMG_ID[sj.id] || '';
    if(!byTheme){
      for(var i=0;i<SUBJ_IMG.length;i++) if(SUBJ_IMG[i].re.test(hay)){ byTheme = SUBJ_IMG[i].img; break; }
    }
    return [own, byTheme];
  }
  /* Запасна картинка класу — банер ступеня з «Навчання». Угорі на ньому
     намальована назва ступеня, тому кадруємо знизу: інакше поряд із «2 клас»
     великими літерами читалось би «Молодша школа». */
  function gradeImgs(g){
    if(g.preschool) return ['img/nav/doshkillyatko.webp~center bottom'];
    var n = Number(g.num)||0;
    return ['img/nav/klas-'+n+'.webp',
            (n<=4 ? 'img/nav/molodsha.webp' : 'img/nav/starsha.webp') + '~center bottom'];
  }
  function lvTile(o){
    var img = lvImg(o.imgs || [o.img]);
    var body = '<span class="lv-ic">'+esc(o.icon||'📘')+'</span>'
      + '<span class="lv-name">'+esc(o.name)+'</span>'
      + (o.sub ? '<span class="lv-sub2">'+esc(o.sub)+'</span>' : '');
    if(o.soon){
      body += '<span class="lv-soon">🔒 Скоро</span>';
    } else {
      var pct = o.total ? Math.round(o.passed/o.total*100) : 0;
      body += '<span class="lv-prog"><span class="lv-track"'+(o.total && o.passed>=o.total ? ' data-full="1"' : '')
            + '><i style="width:'+pct+'%"></i></span>'
            + '<span class="lv-ptx">'+o.passed+' / '+o.total+'</span></span>';
    }
    return '<button class="lv'+(o.soon?' locked':'')+'"'
      + (o.soon ? ' disabled aria-disabled="true"' : ' '+o.attr)
      + ' style="--g1:'+esc(o.g1)+';--g2:'+esc(o.g2)+'">'
      + img + '<span class="lv-scrim"></span>'
      + '<span class="lv-body">'+body+'</span></button>';
  }
  /* Пара кольорів для плашки без картинки — стабільна для того самого
     предмета, щоб вигляд не стрибав між заходами. */
  function accentPair(hex){
    var c = String(hex||'').trim();
    if(!/^#[0-9a-f]{6}$/i.test(c)) c = '#3a5aa0';
    function mix(f){
      var n = parseInt(c.slice(1),16);
      var r = Math.round(((n>>16)&255)*f), g = Math.round(((n>>8)&255)*f), b = Math.round((n&255)*f);
      return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
    }
    return { g1:mix(.95), g2:mix(.55) };
  }

  /* Рядок «← де я зараз». На екрані класів ховаємо: повертатись усередині
     сторінки нікуди, для виходу є «Назад» у нижньому меню. */
  function setCrumb(back, text){
    var head=q('pgHead'), sub=q('pgSub'), btn=q('pgBack');
    if(!head) return;
    if(!back){ head.hidden = true; return; }
    head.hidden = false;
    if(sub) sub.textContent = text || '';
    if(btn) btn.setAttribute('data-back', back);
  }

  function renderClasses(){
    setCrumb(null);
    var list = visibleGrades();
    if(!list.length){
      q('screen').innerHTML=loadNote()+'<div class="empty">Класів ще немає. Додай їх у адмінці → «🗺 Структура».</div>'; return;
    }
    q('screen').innerHTML=loadNote()+'<div class="lvgrid">'+list.map(function(g){
      var gr=IDX.grades[g.key]; var p=gradeProg(gr); var has=p.total>0;
      var pre = !!g.preschool;
      return lvTile({
        name: pre ? (g.label||'Дошкільнятко') : (g.num+' клас'),
        sub:  has ? (p.total+' тест.') : (g.soon ? 'Готуємо' : 'Поки порожньо'),
        icon: pre ? (g.icon||'🌱') : '📖',
        imgs: gradeImgs(g),
        g1:'#3a5aa0', g2:'#1c356b',
        soon: !has,
        passed: p.passed, total: p.total,
        attr: 'data-grade="'+esc(g.key)+'"'
      });
    }).join('')+'</div>';
  }
  function renderSubjects(){
    setCrumb('classes', secTitle(selGrade));
    var gr=IDX.grades[selGrade];
    var html='';
    if(!gr || !gr.order.length){ html+='<div class="empty">У цьому класі ще немає предметів із тестами.</div>'; q('screen').innerHTML=html; return; }
    html+='<div class="lvgrid">'+gr.order.map(function(sid){
      var sj=gr.subs[sid]; var p=subjProg(sj); var has=p.total>0;
      var ac=accentPair(sj.accent);
      return lvTile({
        name: sj.name,
        sub:  has ? (p.total+' тест.') : 'Поки порожньо',
        icon: sj.icon,
        imgs: subjImgs(sj),
        g1: ac.g1, g2: ac.g2,
        soon: !has,
        passed: p.passed, total: p.total,
        attr: 'data-subj="'+esc(sj.id)+'"'
      });
    }).join('')+'</div>';
    q('screen').innerHTML=html;
  }
  function renderTests(){
    var gr=IDX.grades[selGrade]; var s=gr && gr.subs[selSubj];
    setCrumb('subjects', secTitle(selGrade));
    var html='';
    if(!s || !s.tests.length){ html+='<div class="empty">Тестів поки немає — додай їх в адмін-панелі.</div>'; q('screen').innerHTML=html; return; }
    function cardHtml(t){
      var label, cls='';
      var ep = t.std ? enProg(t.gkey) : null;
      if(ep){ label = (ep[0]>=ep[1]) ? '✅ пройдено' : ('📖 '+ep[0]+' / '+ep[1]); if(ep[0]>=ep[1]) cls='done'; }
      else if(t.isLink){ var pdl=isPassed(t); label=pdl?'✅ пройдено':'▶ відкрити'; if(pdl) cls='done'; }
      else if(t.isLevels){ var d=doneLevels(t.id); if(d>t.levelCount)d=t.levelCount;
        label='🧩 '+d+'/'+t.levelCount+' рівнів'; if(t.levelCount && d>=t.levelCount) cls='done'; }
      else { var pd=isPassed(t); label=pd?'✅ пройдено':'▶ не пройдено'; if(pd) cls='done'; }
      var tgt = (t.isLink && t.blank) ? ' target="_blank" rel="noopener"' : '';
      return '<a class="tcard" href="'+esc(t.href)+'" data-testid="'+esc(t.id)+'"'+(t.isLink?' data-link="1"':'')+tgt+'>'
        + testVisual(t)
        + '<span class="tname">'+esc(t.title)+'</span>'
        + bar(testFrac(t), label, cls) + '</a>';
    }
    /* Вбудовані картки (словник) не лежать у розділах карти — малюємо їх
       окремим розділом «Словник» під усіма розділами, у кожному класі,
       де є предмет English. */
    var std = s.tests.filter(function(t){ return t.std; });
    var rest = s.tests.filter(function(t){ return !t.std; });
    /* Групи — розділи з карти. Якщо розділ один і без назви, заголовки не
       малюємо: для предмета без структури нічого не змінюється. */
    var groups = (s.groups && s.groups.length) ? s.groups.filter(function(g){ return g.tests.length; })
                                               : (rest.length ? [{ name:'', tests:rest }] : []);
    var titled = groups.filter(function(g){ return g.name; }).length;
    groups.forEach(function(g){
      var done = g.tests.filter(isPassed).length;
      if(titled && g.name){
        html += '<div class="tgroup"><span class="tg-name">'+esc(g.name)+'</span>'
              + '<span class="tg-cnt">'+done+' / '+g.tests.length+'</span></div>';
      } else if(titled){
        html += '<div class="tgroup"><span class="tg-name">Інші</span>'
              + '<span class="tg-cnt">'+done+' / '+g.tests.length+'</span></div>';
      }
      html += '<div class="grid">'+g.tests.map(cardHtml).join('')+'</div>';
    });
    if(std.length){
      html += '<div class="tgroup"><span class="tg-name">Словник</span>'
            + '<span class="tg-cnt">'+std.filter(isPassed).length+' / '+std.length+'</span></div>'
            + '<div class="grid">'+std.map(cardHtml).join('')+'</div>';
    }
    q('screen').innerHTML=html;
  }
  function render(){
    if(view==='subjects' && IDX && IDX.grades[selGrade]) renderSubjects();
    else if(view==='tests' && IDX && IDX.grades[selGrade] && IDX.grades[selGrade].subs[selSubj]) renderTests();
    else { view='classes'; renderClasses(); }
    syncHash();
  }
  /* Переходи всередині сторінки не міняли адресу, тож у рядку лишався хеш
     тієї плитки, з якої дитина зайшла, — і оновлення сторінки повертало її
     туди (зайшла в «Букви», перейшла в English, F5 → знову «Букви»).
     Тепер адреса завжди описує те, що на екрані. replaceState не додає
     записів в історію і не кидає hashchange, тож повторного рендера немає. */
  function syncHash(){
    /* Шапка підсвічує ступінь того, що на екрані, а не класу Героя. */
    var sec = (view!=='classes' && selGrade!=null) ? secByKey(selGrade) : null;
    var shown = sec ? (sec.preschool ? (sec.tier||'preschool') : tierIdOfGradeNum(sec.num)) : selTier;
    if(shown){
      if(window.skHeaderSetTier) window.skHeaderSetTier(shown); else window.SK_HEADER_TIER = shown;
    }
    var p=[];
    if(selTier) p.push('open='+encodeURIComponent(selTier));
    if(view!=='classes' && selGrade!=null && GRADE_NUM2ID[selGrade]) p.push('grade='+encodeURIComponent(GRADE_NUM2ID[selGrade]));
    if(view==='tests' && selSubj) p.push('subj='+encodeURIComponent(selSubj));
    var h = p.length ? '#'+p.join('&') : '';
    if(h === (location.hash||'')) return;
    try{ history.replaceState(null,'', location.pathname+location.search+h); }catch(e){}
  }

  /* ── навігація картками + збереження позиції для повернення ── */
  q('screen').addEventListener('click',function(e){
    var g=e.target.closest('[data-grade]');
    if(g){ selGrade=g.getAttribute('data-grade'); selSubj=null; view='subjects'; render(); window.scrollTo(0,0); return; }
    var s=e.target.closest('[data-subj]');
    if(s){ selSubj=s.getAttribute('data-subj'); view='tests'; render(); window.scrollTo(0,0); return; }
    var b=e.target.closest('[data-back]');
    if(b){ view=b.getAttribute('data-back'); render(); window.scrollTo(0,0); return; }
  });
  /* Стрілочка тепер у шапці, а не всередині #screen. */
  if(q('pgBack')) q('pgBack').addEventListener('click',function(){
    var to=this.getAttribute('data-back'); if(!to) return;
    view=to; render(); window.scrollTo(0,0);
  });
  /* при переході на тест — запамʼятати клас+предмет, щоб повернутись саме сюди.
     Зарахування тесту-посилання тепер відбувається ПРИ ЗАВЕРШЕННІ на самій
     сторінці тренажера (sk-finish.js), а не на вході. */
  q('screen').addEventListener('click',function(e){
    var a=e.target.closest('a.tcard'); if(!a) return;
    try{ sessionStorage.setItem('sk_tests_view', JSON.stringify({g:selGrade,s:selSubj})); }catch(_){}
  }, true);
  function restoreView(){
    var raw=null; try{ raw=sessionStorage.getItem('sk_tests_view'); }catch(_){}
    if(!raw) return false;
    try{ sessionStorage.removeItem('sk_tests_view'); }catch(_){}
    var v; try{ v=JSON.parse(raw); }catch(_){ return false; }
    if(!v || v.g==null) return false;
    var gr=IDX.grades[v.g]; if(!gr) return false;
    selGrade=v.g;
    if(v.s && gr.subs[v.s]){ selSubj=v.s; view='tests'; } else { view='subjects'; }
    return true;
  }

  /* ── приземлення з навігації хедера: #open=<tier>&grade=<gradeId>&subj=<subjId> ── */
  function hashParams(){
    var h=(location.hash||'').replace(/^#/,''); var p={};
    if(!h) return p;
    h.split('&').forEach(function(kv){ var a=kv.split('='); if(a[0]) p[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||''); });
    return p;
  }
  function landGlow(){
    var el=q('screen').querySelector('.lv:not(.locked), .tcard'); if(!el) return;
    el.classList.remove('sk-nav-land'); void el.offsetWidth;
    requestAnimationFrame(function(){ el.classList.add('sk-nav-land'); setTimeout(function(){ el.classList.remove('sk-nav-land'); },2000); });
  }
  function openFromHash(){
    if(!IDX) return false;
    var p=hashParams();
    if(!p.open && !p.tier && !p.grade && !p.subj) return false;
    var key = p.grade ? GRADE_ID2NUM[p.grade] : null;
    var tv = String(p.open||p.tier||'').toLowerCase();
    if(tv) selTier = tv;                       // прийшли з меню ступеня
    else if(key) selTier = (key==='p') ? 'preschool' : tierIdOfGradeNum(key);
    // ступінь без класу: якщо це дошкілля — відкриваємо дошкільну секцію
    if(!key && (tv.indexOf('preschool')>=0 || tv.indexOf('дошкіл')>=0) && IDX.grades['p']) key='p';
    if(key && IDX.grades[key]){
      selGrade=key;
      if(p.subj && IDX.grades[key].subs[p.subj]){ selSubj=p.subj; view='tests'; }
      else { selSubj=null; view='subjects'; }
      render(); window.scrollTo(0,0); landGlow(); return true;
    }
    // лише ступінь → показуємо перелік класів
    view='classes'; render(); window.scrollTo(0,0); return true;
  }
  window.addEventListener('hashchange', openFromHash);

  /* firebase-config.js — це ES-модуль з імпортами Firebase з CDN, тож window.SK
     зʼявляється ПІСЛЯ DOMContentLoaded. Тому не перевіряємо його один раз, а
     чекаємо в циклі (як стара сторінка) — інакше тести не встигають підтягнутись. */
  function whenSK(cb){
    var t=0;
    (function tick(){
      if(window.SK && SK.ready) return cb(window.SK);
      if(t++ < 200) setTimeout(tick, 50);   // до ~10 c
      else cb(null);
    })();
  }
  /* ── старт: карта + активні тести з бази → індекс → рендер ── */
  /* ── Страхування карти королівства ──
     sk-header.js підвантажує sk-curriculum.js динамічно. Якщо піти з
     попередньої сторінки, поки цей запит у польоті, браузер лишає в кеші
     обірваний запис — і на наступній сторінці той самий URL віддається
     «успішно», але скрипт не виконується: window.SKCUR немає, сторінка
     мовчки висить на «Завантаження…». Тому чекаємо на SKCUR, а якщо його
     нема — перезапитуємо файл з унікальним хвостом (повз кеш). */
  function whenSKCUR(cb){
    var n = 0, retried = false;
    (function w(){
      if(window.SKCUR && window.SKCUR.ready) return cb(true);
      if(n === 10 && !retried){
        retried = true;
        var sc = document.createElement('script');
        sc.src = 'sk-curriculum.js?v=4&r=' + Date.now();
        sc.onerror = function(){ /* далі просто добіжить таймаут */ };
        document.head.appendChild(sc);
      }
      if(n++ < 120) return setTimeout(w, 50);
      cb(false);
    })();
  }

  function boot(){
    whenSKCUR(function(ok){
      if(!ok){
        q('screen').innerHTML = '<div class="empty">Не вдалося завантажити карту королівства.'
          + '<br>Онови сторінку.</div>';
        return;
      }
      bootMap();
    });
  }
  function bootMap(){
    var mapP = SKCUR.ready;
    var trP = new Promise(function(res){
      whenSK(function(SK){
        if(!SK || !SK.listActiveTests){
          LOAD.err = 'Firebase не підключився';
          res([]); return;
        }
        SK.ready.then(function(u){
          if(!u) LOAD.err = 'немає входу в акаунт';
          return SK.listActiveTests();
        }).then(function(list){
          LOAD.raw = (list || []).length;
          res(list);
        }).catch(function(e){
          LOAD.err = whyFailed(e);
          res([]);
        });
      });
    });
    Promise.all([mapP, trP]).then(function(res){
      CURRICULUM = SKCUR.clone((res[0] && res[0].tiers) || SKCUR.map.tiers);
      buildGradeMeta();
      // ховаємо тести, перетворені на випробування (hidden) — вони живуть як посилання
      var tlist = (res[1] || []).filter(function(t){ return !(t && t.hidden); });
      LOAD.shown = tlist.length;
      IDX = buildIndex(tlist);
      injectStdCards();
      if(!openFromHash()){ restoreView(); render(); }
      loadHeroProgress();
    }).catch(function(e){
      if(!LOAD.err) LOAD.err = whyFailed(e);
      CURRICULUM = SKCUR.clone(SKCUR.map.tiers);
      buildGradeMeta(); IDX = buildIndex([]); injectStdCards();
      render();
    });
  }

  /* ── прогрес Героя з Firebase → перерендер поточного екрана ── */
  function loadHeroProgress(){
    whenSK(function(SK){
      if(!SK || !SK.getHero || !SK.isHeroSession) return;
      SK.ready.then(function(){
        try{
          if(SK.isHeroSession()){
            SK.getHero().then(function(h){
              if(!h) return;
              PROG = h.progress||{};
              // Без хеша ступінь беремо з класу Героя — щоб першокласник
              // не бачив дошкільної картки, і навпаки.
              if(selTier == null && h.grade != null) selTier = tierIdOfGradeNum(h.grade);
              render();
            }).catch(function(){});
          }
        }catch(e){}
      });
    });
  }

  if(document.readyState!=='loading') boot();
  else document.addEventListener('DOMContentLoaded', boot);
})();
</script>

<script type="module" src="firebase-config.js"></script>
