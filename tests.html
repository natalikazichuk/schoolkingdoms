<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Тести — School Kingdoms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sk-styles.css">
<style>
  /* ── контейнер сторінки (на голубому небі зі sk-styles.css) ── */
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px calc(94px + env(safe-area-inset-bottom))}
  .page-head{text-align:left;margin:2px 4px 16px}
  .page-head h1{font-family:'Playfair Display',serif;font-weight:900;
    font-size:clamp(1.4rem,4vw,1.9rem);color:var(--gold);margin:0;
    text-shadow:0 2px 6px rgba(0,0,0,.45)}
  .page-head .sub{color:#eaf1ff;font-weight:700;font-size:.95rem;margin:4px 0 0;
    text-shadow:0 1px 3px rgba(0,0,0,.4)}

  /* ── кнопка «назад» усередині drill-down ── */
  .back{display:inline-flex;align-items:center;gap:7px;border:1.5px solid rgba(242,199,92,.5);
    background:linear-gradient(180deg,rgba(30,52,92,.7),rgba(12,28,54,.78));color:#fff;
    border-radius:12px;padding:9px 16px;font-family:inherit;font-weight:800;font-size:.9rem;
    cursor:pointer;margin:0 0 14px;transition:transform .15s,border-color .15s}
  .back:hover{transform:translateY(-2px);border-color:var(--gold)}

  /* ── сітка карток ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  @media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:12px}}

  /* базова картка-квадрат (клас / предмет) */
  .cardbtn{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;text-align:center;
    padding:16px 12px 34px;border-radius:22px;cursor:pointer;color:#fff;font-family:inherit;
    background:linear-gradient(165deg,rgba(30,52,92,.62),rgba(12,28,54,.7));
    border:2px solid rgba(242,199,92,.45);box-shadow:0 12px 30px rgba(0,0,0,.38);
    transition:transform .15s,border-color .15s,box-shadow .15s}
  .cardbtn:hover:not(.dis){transform:translateY(-3px);border-color:var(--gold);
    box-shadow:0 16px 34px rgba(0,0,0,.46)}
  .cardbtn:active:not(.dis){transform:translateY(-1px)}
  .cardbtn .big{font-family:'Playfair Display',serif;font-weight:900;font-size:2.7rem;
    color:var(--gold);line-height:1;text-shadow:0 2px 5px rgba(0,0,0,.4)}
  .cardbtn .ico{font-size:2.6rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .cardbtn .lbl{font-family:'Playfair Display',serif;font-weight:800;font-size:1.02rem;
    color:#fff;line-height:1.16}
  .cardbtn .cnt{font-size:.76rem;color:#c6d3ea;font-weight:700}
  .cardbtn.dis{opacity:.45;cursor:default;filter:grayscale(.5)}
  .cardbtn.dis .big{color:#c6d3ea}

  /* картка тесту (емодзі/обкладинка → назва → прогрес унизу) */
  .tcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;
    text-decoration:none;color:#fff;padding:14px 12px 14px;border-radius:20px;
    background:linear-gradient(165deg,rgba(30,52,92,.62),rgba(12,28,54,.7));
    border:2px solid rgba(242,199,92,.45);box-shadow:0 12px 30px rgba(0,0,0,.38);
    transition:transform .15s,border-color .15s,box-shadow .15s}
  .tcard:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 16px 34px rgba(0,0,0,.46)}
  .tcard:active{transform:translateY(-1px)}
  .tcard .thumb{width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#f5eeda;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.26)}
  .tcard .thumb img{width:100%;height:100%;object-fit:contain}
  .tcard .emoji{font-size:3rem;line-height:1;padding:8px 0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .tcard .tname{font-family:'Playfair Display',serif;font-weight:800;font-size:.96rem;
    line-height:1.18;text-align:center}
  .tcard .cprog{width:100%;margin-top:auto}

  /* ── прогрес унизу картки ── */
  .cprog{display:flex;flex-direction:column;gap:4px}
  .cardbtn .cprog{position:absolute;left:14px;right:14px;bottom:12px}
  .cprog .track{height:9px;border-radius:999px;overflow:hidden;
    background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.16)}
  .cprog .track>i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#7be0a4,#f5c542);
    box-shadow:0 0 8px -2px rgba(245,197,66,.8);transition:width .55s ease}
  .cprog .ptx{font-size:.68rem;font-weight:800;color:#e6edff;white-space:nowrap;line-height:1}
  .cprog.done .track>i{background:linear-gradient(90deg,#7be0a4,#4bc47f)}
  .cprog.done .ptx{color:#bff0cd}

  .empty{grid-column:1/-1;color:#eaf1ff;font-weight:700;text-align:center;
    padding:34px 12px;line-height:1.6;text-shadow:0 1px 3px rgba(0,0,0,.4)}
  .empty span{opacity:.7;font-weight:600;font-size:.82rem}

  /* приземлення з навігації хедера: золоте кільце + легкий «стрибок» */
  @keyframes skNavRing{
    0%{box-shadow:0 0 0 0 rgba(242,199,92,0)}
    12%{box-shadow:0 0 0 4px rgba(242,199,92,.95),0 0 30px 8px rgba(242,199,92,.6)}
    55%{box-shadow:0 0 0 3px rgba(242,199,92,.5),0 0 18px 5px rgba(242,199,92,.28)}
    100%{box-shadow:0 0 0 0 rgba(242,199,92,0)}}
  @keyframes skNavPop{0%{transform:scale(1)}12%{transform:scale(1.04)}34%{transform:scale(.997)}100%{transform:scale(1)}}
  .sk-nav-land{animation:skNavRing 1.9s ease-out 1,skNavPop .6s ease-out 1;border-radius:22px;position:relative;z-index:3}
  @media(prefers-reduced-motion:reduce){.sk-nav-land{animation:none}}

  /* ── футер: активний пункт + ромби-роздільники (як на hero.html) ── */
  body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
  .botnav > *:not(:last-child)::after{content:"◈";position:absolute;right:-3px;top:50%;
    transform:translateY(-50%);color:#e0a42a;font-size:.72rem;opacity:.85;
    text-shadow:0 1px 2px rgba(0,0,0,.55);pointer-events:none}
  .botnav a.active{background:linear-gradient(180deg,#fdeeb6,#f4c842);color:#5a3d05;
    border:2px solid #fff6d8;box-shadow:0 3px 10px rgba(0,0,0,.35),0 0 16px -3px rgba(244,200,66,.8),
    inset 0 1px 0 rgba(255,255,255,.6);transform:translateY(-2px)}
  .botnav a.active .ic{filter:none}
  .botnav a:hover:not(.active),.botnav button:hover{background:rgba(255,255,255,.08);color:#fff}
</style>
</head>
<body>
  <div class="bg-fallback"></div>
  <div class="stars"></div>
  <div class="moon"></div>

  <!-- СПІЛЬНИЙ ХЕДЕР (бренд + шкала Героя) вставляється через sk-header.js -->

  <main class="wrap">
    <div class="page-head">
      <h1>📜 Тести королівства</h1>
      <p class="sub" id="pgSub">Завантаження…</p>
    </div>
    <div id="screen"><div class="empty">Завантаження тестів…</div></div>
  </main>

<script src="sk-footer.js?v=1" data-active="tests"></script>

<!-- Спільна карта королівства. МАЄ йти перед інлайн-скриптом нижче -->
<script src="sk-curriculum.js"></script>
<script>
/* ── Запобіжник: sk-curriculum.js має бути свіжим ── */
(function(){
  var need = 5;
  var uses = ['norm','clone','subjectMatches','placeTests','PASS_RATIO','ready','map'];
  var bad = null;
  if(!window.SKCUR) bad = 'Файл sk-curriculum.js не завантажився.';
  else {
    var miss = uses.filter(function(k){ return window.SKCUR[k] == null; });
    if(miss.length) bad = 'Файл sk-curriculum.js застарілий — немає: ' + miss.join(', ') + '.';
    else if((Number(window.SKCUR.API_VERSION)||0) < need)
      bad = 'Файл sk-curriculum.js застарілий (версія ' + (window.SKCUR.API_VERSION||'?') + ', потрібна ' + need + ').';
  }
  if(!bad) return;
  var r = document.getElementById('screen');
  if(r) r.innerHTML = '<p class="empty">😔 Королівство лагодиться. Спробуй трохи згодом!'
    + '<br><span>' + bad + '</span></p>';
  throw new Error('SKCUR: ' + bad);
})();

/* ============================================================
   ТЕСТИ — покрокова навігація картками:
     Клас (1–11) → Предмет → Тести.
   Кістяк (класи/предмети/розділи) приходить із sk-curriculum.js
   (документ curriculum/map, редагується в адмінці). Тести — з бази
   (SK.listActiveTests) і розкладаються по предметах спільною логікою
   SKCUR.placeTests (та сама, що й у перевірці карти в адмінці).
   Прогрес — з Firebase (heroes/{id}.progress) ∪ localStorage.
   ============================================================ */
(function(){
  'use strict';

  var CURRICULUM = [];      // клон SKCUR.map.tiers
  var IDX = null;           // { grades:{num:{num,order[],subs{}}}, nums[] }
  var ALL_GRADES = [];      // усі класи з карти (для сітки, навіть порожні)
  var GRADE_ID2NUM = {};    // gradeId → gradeNum (для навігації з хедера)
  var PROG = null;          // прогрес Героя з Firebase (heroes/{id}.progress)

  var view = 'classes', selGrade = null, selSubj = null;

  function q(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function pgGet(k){ return (PROG && PROG[k]!=null) ? PROG[k] : null; }
  /* дошкільний ступінь — за id/назвою («preschool» / «дошкіл…»). Його вміст
     виноситься в окрему картку «Дошкільна освіта» ПЕРЕД 1 класом. */
  function isPreschoolTier(t){
    if(!t) return false;
    var s=(String(t.id||'')+' '+String(t.name||'')).toLowerCase();
    return s.indexOf('preschool')>=0 || s.indexOf('дошкіл')>=0;
  }

  /* ── підрахунок пройдених рівнів зі збереженого стану ── */
  function countDoneLevels(v){
    try{ var o=(typeof v==='string')?JSON.parse(v):v;
      if(Array.isArray(o)) return o.length;
      return (o && typeof o==='object') ? Object.keys(o).length : 0;
    }catch(e){ return 0; }
  }
  function doneLevels(id){
    return Math.max(countDoneLevels(lsGet('sk_lvtest_'+id+'_done')),
                    countDoneLevels(pgGet('sk_lvtest_'+id+'_done')));
  }
  function truthy(v){ return v==='1'||v===1||v===true; }
  /* пройдено = прапорець проходження / 100% АБО (тести-рівні) ≥ PASS_RATIO рівнів —
     точно ті самі правила, що були на старій сторінці */
  function isPassed(t){
    if(truthy(lsGet('sk_testpass_'+t.id)) || truthy(pgGet('sk_testpass_'+t.id))) return true;
    if(truthy(lsGet('sk_test100_'+t.id)) || truthy(pgGet('sk_test100_'+t.id))) return true;
    if(t.isLevels && t.levelCount>0) return (doneLevels(t.id)/t.levelCount) >= SKCUR.PASS_RATIO;
    return false;
  }
  /* дріб для смужки на КАРТЦІ ТЕСТУ (гранулярно): рівні або 0/1 */
  function testFrac(t){
    if(t.isLevels && t.levelCount>0){ var d=doneLevels(t.id); if(d>t.levelCount)d=t.levelCount; return d/t.levelCount; }
    return isPassed(t) ? 1 : 0;
  }
  function subjProg(s){ var passed=0; s.tests.forEach(function(t){ if(isPassed(t)) passed++; }); return {total:s.tests.length, passed:passed}; }
  function gradeProg(gr){ var total=0,passed=0; if(gr) gr.order.forEach(function(sid){ gr.subs[sid].tests.forEach(function(t){ total++; if(isPassed(t)) passed++; }); }); return {total:total,passed:passed}; }

  /* ── смужка прогресу унизу картки ── */
  function bar(frac, label, cls){
    var pct=Math.max(0,Math.min(100,Math.round(frac*100)));
    var done=(frac>=1)?' done':'';
    return '<span class="cprog'+done+(cls?' '+cls:'')+'"><span class="track"><i style="width:'+pct+'%"></i></span>'
         + '<span class="ptx">'+esc(label)+'</span></span>';
  }

  /* ── обкладинка тесту: якщо в базі задано imgCard — показуємо, інакше емодзі предмета ── */
  function testVisual(t){
    if(t.imgCard){
      return '<span class="thumb"><img src="'+esc(t.imgCard)+'" alt="" loading="lazy" '
           + 'onerror="this.parentNode.outerHTML=\'<span class=&quot;emoji&quot;>'+esc(t.icon)+'</span>\'"></span>';
    }
    return '<span class="emoji">'+esc(t.icon)+'</span>';
  }

  /* ── побудова індексу «клас → предмет → тести» зі спільної розкладки ── */
  function toTestObj(t, subjIcon){
    var isLink = !!((t.format==='link'||t.format==='html') && t.linkHref);
    var lv = !isLink && (t.format==='levels' || (Array.isArray(t.levels) && t.levels.length));
    var href = isLink ? String(t.linkHref) : ('test.html?id='+encodeURIComponent(t.id));
    var img = t.imgCard||t.cover||'';
    if(isLink && !img){ var slug=String(t.linkHref).replace(/[?#].*$/,'').replace(/\.html?$/i,'').replace(/^.*\//,''); if(slug) img='img/tr/'+slug+'.webp'; }
    return { id:t.id, title:t.title||'Тест', href:href, isLink:isLink,
      isLevels:!!lv, levelCount: lv ? (Array.isArray(t.levels)?t.levels.length:0) : 0,
      icon:(subjIcon||'📝'), imgCard: img };
  }
  function buildIndex(tests){
    var P = SKCUR.placeTests(CURRICULUM, tests);
    var G = {};
    function ensureGrade(n){ return G[n] || (G[n]={num:n, order:[], subs:{}}); }
    function ensureSubj(gr, subj){
      var s = gr.subs[subj.id];
      if(!s){ s={id:subj.id,name:subj.name,icon:subj.icon||'📘',accent:subj.accent||'#5C6BC0',
        stat:subj.stat||'',tests:[],_seen:{}}; gr.subs[subj.id]=s; gr.order.push(subj.id); }
      return s;
    }
    function addBucket(b){
      // placeTests повертає запис на КОЖЕН розділ карти, навіть порожній —
      // тож порожні розділи створювали б предмети-дублі («немає»). Пропускаємо їх.
      if(!b.tests || !b.tests.length) return;
      var key = isPreschoolTier(b.tier) ? 'p' : String(Number(b.grade.gradeNum)||0);
      var gr=ensureGrade(key); var s=ensureSubj(gr,b.subj);
      b.tests.forEach(function(t){ if(s._seen[t.id]) return; s._seen[t.id]=1; s.tests.push(toTestObj(t,b.subj.icon)); });
    }
    P.topics.forEach(addBucket);
    P.subjects.forEach(addBucket);
    // катч-ол: несопоставлені тести → «Інші тести» до першого класу карти
    if(P.leftovers && P.leftovers.length){
      var firstKey=null;
      CURRICULUM.forEach(function(t){ if(isPreschoolTier(t)) return;
        (t.grades||[]).forEach(function(g){ if(firstKey==null) firstKey=String(Number(g.gradeNum)||1); }); });
      if(firstKey==null) firstKey='1';
      function otherSubj(key, name){
        var gr=ensureGrade(key); var s=gr.subs['other'];
        if(!s){ s={id:'other',name:name,icon:'📦',accent:'#8a8fb0',stat:'',tests:[],_seen:{}}; gr.subs['other']=s; gr.order.push('other'); }
        return s;
      }
      P.leftovers.forEach(function(t){
        var isPre = Number(t.grade)===0;                       // дошкільні тести (grade 0)
        var s = isPre ? otherSubj('p','Інші (дошкілля)') : otherSubj(firstKey,'Інші тести');
        if(s._seen[t.id]) return; s._seen[t.id]=1;
        var o=toTestObj(t,'📦');
        if(!isPre && Number(t.grade) && String(Number(t.grade))!==firstKey) o.title='['+t.grade+' кл] '+o.title;
        s.tests.push(o);
      });
    }
    return { grades:G };
  }
  function buildGradeMeta(){
    ALL_GRADES=[]; GRADE_ID2NUM={};
    var pre=null, nums=[], seen={};
    CURRICULUM.forEach(function(t){
      if(isPreschoolTier(t)){
        if(!pre) pre={key:'p', preschool:true, icon:(t.icon||'🌱'), label:'Дошкільна освіта'};
        (t.grades||[]).forEach(function(g){ GRADE_ID2NUM[g.id]='p'; });
        return;
      }
      (t.grades||[]).forEach(function(g){
        var n=Number(g.gradeNum)||0; GRADE_ID2NUM[g.id]=String(n);
        if(!seen[n]){ seen[n]=1; nums.push({key:String(n), num:n, name:g.name||(n+' клас')}); }
      });
    });
    nums.sort(function(a,b){return a.num-b.num;});
    // дошкільна картка завжди перша (навіть якщо ступеня нема в карті)
    if(!pre) pre={key:'p', preschool:true, icon:'🌱', label:'Дошкільна освіта'};
    ALL_GRADES = [pre].concat(nums);
  }
  function secByKey(k){ for(var i=0;i<ALL_GRADES.length;i++){ if(ALL_GRADES[i].key===String(k)) return ALL_GRADES[i]; } return null; }
  function secTitle(k){ var s=secByKey(k); return (s&&s.preschool)?'Дошкільна освіта':(k+' клас'); }

  /* ── рендер ── */
  function renderClasses(){
    q('pgSub').textContent='Обери клас.';
    if(!ALL_GRADES.length){
      q('screen').innerHTML='<div class="empty">Класів ще немає. Додай їх у адмінці → «🗺 Структура».</div>'; return;
    }
    q('screen').innerHTML='<div class="grid">'+ALL_GRADES.map(function(g){
      var gr=IDX.grades[g.key]; var p=gradeProg(gr); var has=p.total>0;
      var prog = has ? bar(p.passed/p.total, p.passed+' / '+p.total+' пройдено') : '';
      var head = g.preschool
        ? '<span class="ico">'+esc(g.icon)+'</span><span class="lbl">'+esc(g.label)+'</span>'
        : '<span class="big">'+g.num+'</span><span class="lbl">клас</span>';
      return '<button class="cardbtn'+(has?'':' dis')+'" '+(has?'data-grade="'+esc(g.key)+'"':'disabled')+'>'
        + head
        + '<span class="cnt">'+(has?p.total+' тест.':'скоро')+'</span>'
        + prog + '</button>';
    }).join('')+'</div>';
  }
  function renderSubjects(){
    q('pgSub').textContent=secTitle(selGrade)+' — обери предмет.';
    var gr=IDX.grades[selGrade];
    var html='<button class="back" data-back="classes">← Класи</button>';
    if(!gr || !gr.order.length){ html+='<div class="empty">У цьому класі ще немає предметів із тестами.</div>'; q('screen').innerHTML=html; return; }
    html+='<div class="grid">'+gr.order.map(function(sid){
      var s=gr.subs[sid]; var p=subjProg(s); var has=p.total>0;
      var prog = has ? bar(p.passed/p.total, p.passed+' / '+p.total+' пройдено') : '';
      return '<button class="cardbtn'+(has?'':' dis')+'" '+(has?'data-subj="'+esc(s.id)+'"':'disabled')+'>'
        + '<span class="ico">'+esc(s.icon)+'</span><span class="lbl">'+esc(s.name)+'</span>'
        + '<span class="cnt">'+(has?p.total+' тест.':'немає')+'</span>'
        + prog + '</button>';
    }).join('')+'</div>';
    q('screen').innerHTML=html;
  }
  function renderTests(){
    var gr=IDX.grades[selGrade]; var s=gr && gr.subs[selSubj];
    q('pgSub').textContent=secTitle(selGrade)+' · '+(s?s.name:'');
    var html='<button class="back" data-back="subjects">← Предмети</button>';
    if(!s || !s.tests.length){ html+='<div class="empty">Тестів поки немає — додай їх в адмін-панелі.</div>'; q('screen').innerHTML=html; return; }
    html+='<div class="grid">'+s.tests.map(function(t){
      var label, cls='';
      if(t.isLink){ var pdl=isPassed(t); label=pdl?'✅ пройдено':'▶ відкрити'; if(pdl) cls='done'; }
      else if(t.isLevels){ var d=doneLevels(t.id); if(d>t.levelCount)d=t.levelCount;
        label='🧩 '+d+'/'+t.levelCount+' рівнів'; if(t.levelCount && d>=t.levelCount) cls='done'; }
      else { var pd=isPassed(t); label=pd?'✅ пройдено':'▶ не пройдено'; if(pd) cls='done'; }
      return '<a class="tcard" href="'+esc(t.href)+'" data-testid="'+esc(t.id)+'"'+(t.isLink?' data-link="1"':'')+'>'
        + testVisual(t)
        + '<span class="tname">'+esc(t.title)+'</span>'
        + bar(testFrac(t), label, cls) + '</a>';
    }).join('')+'</div>';
    q('screen').innerHTML=html;
  }
  function render(){
    if(view==='subjects' && IDX && IDX.grades[selGrade]) renderSubjects();
    else if(view==='tests' && IDX && IDX.grades[selGrade] && IDX.grades[selGrade].subs[selSubj]) renderTests();
    else { view='classes'; renderClasses(); }
  }

  /* ── навігація картками + збереження позиції для повернення ── */
  q('screen').addEventListener('click',function(e){
    var g=e.target.closest('[data-grade]');
    if(g){ selGrade=g.getAttribute('data-grade'); selSubj=null; view='subjects'; render(); window.scrollTo(0,0); return; }
    var s=e.target.closest('[data-subj]');
    if(s){ selSubj=s.getAttribute('data-subj'); view='tests'; render(); window.scrollTo(0,0); return; }
    var b=e.target.closest('[data-back]');
    if(b){ view=b.getAttribute('data-back'); render(); window.scrollTo(0,0); return; }
  });
  /* при переході на тест — запамʼятати клас+предмет, щоб повернутись саме сюди */
  q('screen').addEventListener('click',function(e){
    var a=e.target.closest('a.tcard'); if(!a) return;
    try{ sessionStorage.setItem('sk_tests_view', JSON.stringify({g:selGrade,s:selSubj})); }catch(_){}
    // тест-посилання: зараховуємо на вході (тап) — синхронно у localStorage + best-effort у Firebase
    if(a.getAttribute('data-link')==='1'){
      var id=a.getAttribute('data-testid');
      if(id){
        try{ localStorage.setItem('sk_testpass_'+id,'1'); }catch(_){}
        try{ if(window.SK && SK.pushLocal) SK.pushLocal(); }catch(_){}
      }
    }
  }, true);
  function restoreView(){
    var raw=null; try{ raw=sessionStorage.getItem('sk_tests_view'); }catch(_){}
    if(!raw) return false;
    try{ sessionStorage.removeItem('sk_tests_view'); }catch(_){}
    var v; try{ v=JSON.parse(raw); }catch(_){ return false; }
    if(!v || v.g==null) return false;
    var gr=IDX.grades[v.g]; if(!gr) return false;
    selGrade=v.g;
    if(v.s && gr.subs[v.s]){ selSubj=v.s; view='tests'; } else { view='subjects'; }
    return true;
  }

  /* ── приземлення з навігації хедера: #open=<tier>&grade=<gradeId>&subj=<subjId> ── */
  function hashParams(){
    var h=(location.hash||'').replace(/^#/,''); var p={};
    if(!h) return p;
    h.split('&').forEach(function(kv){ var a=kv.split('='); if(a[0]) p[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||''); });
    return p;
  }
  function landGlow(){
    var el=q('screen').querySelector('.cardbtn:not(.dis), .tcard'); if(!el) return;
    el.classList.remove('sk-nav-land'); void el.offsetWidth;
    requestAnimationFrame(function(){ el.classList.add('sk-nav-land'); setTimeout(function(){ el.classList.remove('sk-nav-land'); },2000); });
  }
  function openFromHash(){
    if(!IDX) return false;
    var p=hashParams();
    if(!p.open && !p.tier && !p.grade && !p.subj) return false;
    var key = p.grade ? GRADE_ID2NUM[p.grade] : null;
    // ступінь без класу: якщо це дошкілля — відкриваємо дошкільну секцію
    if(!key){
      var tv=String(p.open||p.tier||'').toLowerCase();
      if((tv.indexOf('preschool')>=0 || tv.indexOf('дошкіл')>=0) && IDX.grades['p']) key='p';
    }
    if(key && IDX.grades[key]){
      selGrade=key;
      if(p.subj && IDX.grades[key].subs[p.subj]){ selSubj=p.subj; view='tests'; }
      else { selSubj=null; view='subjects'; }
      render(); window.scrollTo(0,0); landGlow(); return true;
    }
    // лише ступінь → показуємо перелік класів
    view='classes'; render(); window.scrollTo(0,0); return true;
  }
  window.addEventListener('hashchange', openFromHash);

  /* firebase-config.js — це ES-модуль з імпортами Firebase з CDN, тож window.SK
     зʼявляється ПІСЛЯ DOMContentLoaded. Тому не перевіряємо його один раз, а
     чекаємо в циклі (як стара сторінка) — інакше тести не встигають підтягнутись. */
  function whenSK(cb){
    var t=0;
    (function tick(){
      if(window.SK && SK.ready) return cb(window.SK);
      if(t++ < 200) setTimeout(tick, 50);   // до ~10 c
      else cb(null);
    })();
  }
  /* ── старт: карта + активні тести з бази → індекс → рендер ── */
  function boot(){
    var mapP = SKCUR.ready;
    var trP = new Promise(function(res){
      whenSK(function(SK){
        if(!SK || !SK.listActiveTests){ res([]); return; }
        SK.ready.then(function(){ return SK.listActiveTests(); }).then(res).catch(function(){ res([]); });
      });
    });
    Promise.all([mapP, trP]).then(function(res){
      CURRICULUM = SKCUR.clone((res[0] && res[0].tiers) || SKCUR.map.tiers);
      buildGradeMeta();
      // ховаємо тести, перетворені на випробування (hidden) — вони живуть як посилання
      var tlist = (res[1] || []).filter(function(t){ return !(t && t.hidden); });
      IDX = buildIndex(tlist);
      if(!openFromHash()){ restoreView(); render(); }
      loadHeroProgress();
    }).catch(function(){
      CURRICULUM = SKCUR.clone(SKCUR.map.tiers);
      buildGradeMeta(); IDX = buildIndex([]);
      render();
    });
  }

  /* ── прогрес Героя з Firebase → перерендер поточного екрана ── */
  function loadHeroProgress(){
    whenSK(function(SK){
      if(!SK || !SK.getHero || !SK.isHeroSession) return;
      SK.ready.then(function(){
        try{
          if(SK.isHeroSession()){
            SK.getHero().then(function(h){ if(h){ PROG=h.progress||{}; render(); } }).catch(function(){});
          }
        }catch(e){}
      });
    });
  }

  if(document.readyState!=='loading') boot();
  else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
