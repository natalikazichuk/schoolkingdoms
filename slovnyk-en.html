<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Словник English — тренажер</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
  :root{
    --bg1:#eaf6ff; --bg2:#ddecff; --bg3:#e2f3de; --ink:#1e3a6b; --soft:#7b869c; --line:#d9e2f0;
    --card:#fff; --primary:#3d86d4; --primary-d:#2f8fd6; --success:#37a052; --success-d:#2c8544;
    --gold:#f4c842; --gold-ink:#8a5e16; --coral:#ff6f52; --coral-d:#e2573c; --good-bg:#e7f7ee; --good:#1c8a52;
    --learn:#37b0c4; --e2:0 6px 18px rgba(19,63,120,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 46%,var(--bg3) 100%) fixed;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
    display:flex;flex-direction:column;min-height:100dvh;padding:14px;}
  h1,h2,h3,.disp{font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:.3px;margin:0}
  .wrap{width:100%;max-width:540px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}

  /* топбар: стрілка ← вертикально по центру ряду прогресу */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex:none}
  .iconbtn{width:44px;height:44px;flex:none;border:2px solid var(--line);background:#fff;border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink);cursor:pointer}
  .iconbtn:active{transform:translateY(2px)}
  .progress-line{flex:1;min-width:0}
  .bar{height:12px;background:#e3ecf8;border-radius:8px;overflow:hidden}
  .bar>span{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--learn),#63d3e3);transition:width .4s ease}
  .pt{font-weight:800;font-size:12px;color:var(--soft);margin:3px 2px 0;display:block}
  .ttl{flex:1;min-width:0;font-family:'Fredoka';font-size:19px;line-height:1.1}
  .ttl small{display:block;font-family:'Nunito';font-weight:800;font-size:12px;color:var(--soft)}

  .screen{display:none;flex:1;min-height:0;flex-direction:column}
  .screen.on{display:flex}

  .big-btn{border:none;border-radius:18px;padding:15px 18px;font-family:'Fredoka';font-size:19px;
    cursor:pointer;color:#fff;background:var(--primary);box-shadow:0 6px 0 var(--primary-d);width:100%}
  .big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--primary-d)}
  .big-btn.green{background:var(--success);box-shadow:0 6px 0 var(--success-d)}
  .big-btn.gold{background:linear-gradient(180deg,#ffdd6b,var(--gold));box-shadow:0 6px 0 #d9a81f;color:var(--gold-ink)}
  .big-btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #cdd8ea;border:2px solid var(--line)}
  .big-btn.sm{font-size:16px;padding:12px 14px}
  /* Головна дія на екрані набору — «спочатку вивчити слова». Блідою
     примарною кнопкою її не помічали й ішли одразу в тест, тому вона
     кольорова, пульсує і по ній пробігає блік. */
  .big-btn.cta{position:relative;overflow:hidden;color:#fff;font-size:18px;padding:14px 16px;
    background:linear-gradient(180deg,#5fd0df,var(--learn));
    box-shadow:0 6px 0 #2a8b9b,0 0 0 0 rgba(55,176,196,.55);
    animation:ctaPulse 2.6s ease-in-out infinite}
  .big-btn.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #2a8b9b;animation:none}
  .big-btn.cta .cta-ic{display:inline-block;margin-right:7px;animation:ctaWiggle 2.6s ease-in-out infinite}
  .big-btn.cta::after{content:"";position:absolute;top:0;bottom:0;left:-45%;width:38%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
    transform:skewX(-18deg);animation:ctaShine 2.6s ease-in-out infinite;pointer-events:none}
  @keyframes ctaPulse{0%,100%{box-shadow:0 6px 0 #2a8b9b,0 0 0 0 rgba(55,176,196,.55)}
                      60%{box-shadow:0 6px 0 #2a8b9b,0 0 0 13px rgba(55,176,196,0)}}
  @keyframes ctaWiggle{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(-13deg)}91%{transform:rotate(13deg)}}
  @keyframes ctaShine{0%{left:-45%}55%,100%{left:120%}}
  @media (prefers-reduced-motion:reduce){
    .big-btn.cta,.big-btn.cta .cta-ic,.big-btn.cta::after{animation:none}
  }

  /* ── банер словника (екран вибору набору) ──
     Картинка — намальована шапка. Якщо файлу немає, вона ховається і
     лишається градієнт із тим самим написом: екран не їде. */
  .hero{position:relative;flex:none;margin-bottom:13px;border-radius:22px;overflow:hidden;
    aspect-ratio:941/348;background:linear-gradient(160deg,#7cc2f0,#3f83cf);box-shadow:var(--e2)}
  .hero-txt{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:5px;padding:0 14px;text-align:center;color:#fff}
  .hero-txt b{font-family:'Fredoka';font-weight:700;font-size:clamp(20px,6.4vw,30px)}
  .hero-txt small{font-weight:800;font-size:13px;opacity:.92}
  .hero-bg{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
  /* Стрілка стоїть рівно на намальованій кнопці банера й перекриває її. */
  .hero-back{position:absolute;z-index:2;left:3.2%;top:4.4%;width:11.2%;height:21.5%;
    min-width:40px;min-height:34px;border:none;border-radius:15px;background:#fff;color:var(--ink);
    font-size:clamp(17px,4.8vw,23px);line-height:1;display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 3px 9px rgba(19,63,120,.2)}
  .hero-back:active{transform:translateY(2px)}

  /* вибір набору / режиму */
  .pick{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:13px;padding:2px 0 4px}
  /* Набір — кольорова смужка: плитка з малюнком, назва, переклад, стрілка.
     Колір приходить із JS (--c1/--c1b — плитка, --c2 — тло, --c3 — акцент). */
  .deck{position:relative;overflow:hidden;display:flex;align-items:center;gap:13px;
    background:var(--c2,#fff);border:3px solid #fff;border-radius:24px;padding:10px 12px;
    box-shadow:0 7px 18px rgba(19,63,120,.16);cursor:pointer;text-align:left}
  .deck:active{transform:translateY(2px);box-shadow:0 3px 10px rgba(19,63,120,.16)}
  .deck .ic{position:relative;z-index:1;width:clamp(68px,21vw,86px);aspect-ratio:1;flex:none;
    border-radius:19px;background:linear-gradient(160deg,var(--c1,#dbe9fb),var(--c1b,#b9d4f4));
    display:flex;align-items:center;justify-content:center;font-size:clamp(34px,10vw,46px);overflow:hidden}
  .deck .ic img{width:100%;height:100%;object-fit:contain;padding:9px}
  .deck .dx{position:relative;z-index:1;flex:1;min-width:0}
  .deck .dt{display:block;font-family:'Fredoka';font-size:clamp(19px,5.6vw,23px);line-height:1.15}
  .deck .ds{display:block;font-family:'Comfortaa','Fredoka',sans-serif;font-weight:700;
    font-size:clamp(14px,4vw,16px);color:var(--c3,#7b869c);margin-top:2px}
  /* Прикраса тулиться до правого краю під стрілкою — так вона ніколи не
     налазить на довгий підпис на вузькому екрані. */
  .deck .wm{position:absolute;z-index:0;right:-6px;top:50%;transform:translateY(-50%);
    font-size:56px;opacity:.13;pointer-events:none}
  .deck .go{position:relative;z-index:1;width:42px;height:42px;flex:none;border-radius:50%;
    background:linear-gradient(160deg,var(--c1,#dbe9fb),var(--c1b,#b9d4f4));color:var(--c3,#2f7ed6);
    display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-size:26px;
    box-shadow:0 2px 0 rgba(255,255,255,.8) inset}
  .lead{text-align:center;color:var(--soft);font-weight:800;font-size:13px;margin:0 0 8px}
  h1.page{font-family:'Comfortaa','Fredoka',sans-serif;font-size:26px;color:var(--ink);text-align:center;margin:2px 0 10px}

  /* Вибір класen:'classroomen:'home', ', у всередині набору. Тема (Home, Numbers) може мати слова
     кількох класів; за замовчуванням показуємо клас самого набору, щоб
     четвертий клас не підмішувався до першого, але дитина може взяти всі. */
  .gpick{flex:none;margin:0 0 10px}
  .gpick .gp-lab{display:block;text-align:center;color:var(--soft);font-weight:800;font-size:13px;margin-bottom:6px}
  .gpick .gp-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .gchip{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;
    padding:8px 15px;font-family:'Fredoka';font-size:15px;line-height:1;cursor:pointer}
  .gchip:active{transform:translateY(2px)}
  .gchip.on{background:var(--learn);border-color:var(--learn);color:#fff;box-shadow:0 3px 0 #2a8b9b}

  /* шапка обраного набору на екрані режимів — той самий кольоровий почерк */
  .dhead{display:flex;align-items:center;gap:12px;background:var(--c2,#fff);border:3px solid #fff;
    border-radius:22px;padding:10px 12px;box-shadow:0 6px 16px rgba(19,63,120,.14);margin-bottom:12px;flex:none}
  .dhead .ic{width:60px;height:60px;flex:none;border-radius:16px;overflow:hidden;
    background:linear-gradient(160deg,var(--c1,#dbe9fb),var(--c1b,#b9d4f4));
    display:flex;align-items:center;justify-content:center;font-size:30px}
  .dhead .ic img{width:100%;height:100%;object-fit:contain;padding:7px}
  .dhead .dt{display:block;font-family:'Fredoka';font-size:21px;line-height:1.15}
  .dhead .ds{display:block;font-weight:800;font-size:14px;color:var(--c3,#7b869c)}

  .mode-card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--e2);
    display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;margin-bottom:12px}
  .mode-card:active{transform:translateY(2px)}
  .mode-card.trial{border-color:#f4d78a}
  .mode-h{display:flex;align-items:center;gap:10px}
  .mode-h .m-ic{font-size:28px}
  .mode-h .m-t{font-family:'Fredoka';font-size:20px}
  .mode-note{color:var(--soft);font-weight:800;font-size:13px;line-height:1.35}
  .reward-tag{align-self:flex-start;background:var(--good-bg);color:var(--good);font-weight:800;font-size:13px;padding:4px 12px;border-radius:9px}
  .reward-tag.gold{background:#fff3d0;color:var(--gold-ink)}

  /* вивчення — флеш-картка.
     Картка тулиться до змісту (flex:0 1 auto) і разом із рядом кнопок стоїть
     по центру екрана: так немає ні білої порожнечі всередині, ні кнопок, що
     ховаються за футером на невисокому телефоні. */
  #sStudy{justify-content:center}
  .fcard{flex:0 1 auto;min-height:0;background:var(--card);border-radius:24px;box-shadow:var(--e2);border:2px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:12px;cursor:pointer;position:relative}
  .fpic{width:100%;flex:0 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
  .fpic img{max-width:100%;max-height:min(46vh,100%);object-fit:contain;border-radius:14px}
  .fpic .emoji{font-size:72px}
  /* слово і 🔊 в один ряд — це економить цілий рядок висоти */
  .fwrow{display:flex;align-items:center;justify-content:center;gap:12px;flex:none}
  .fword{font-family:'Fredoka';font-weight:700;font-size:clamp(30px,8.5vw,44px);line-height:1.05;color:var(--ink)}
  .fipa{color:var(--soft);font-weight:800;font-size:15px;line-height:1}
  .fuk{font-family:'Comfortaa','Fredoka',sans-serif;font-weight:700;font-size:clamp(24px,7vw,34px);color:var(--coral)}
  .fphr{font-size:14px;color:var(--soft);font-weight:800;text-align:center;line-height:1.35}
  .fhint{font-size:12px;color:var(--soft);font-weight:800;line-height:1}
  .speak{width:46px;height:46px;flex:none;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:21px;cursor:pointer;box-shadow:0 4px 0 var(--primary-d)}
  .speak:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-d)}
  .nav-row{display:flex;gap:9px;align-items:stretch;margin-top:10px;flex:none}
  .nav-row .big-btn{flex:1;white-space:nowrap}
  .nav-row .big-btn.side{flex:none;width:62px;padding-left:0;padding-right:0}

  /* перевірка.
     Картинка віддає висоту першою і ніколи не вилазить за свій бокс:
     на довгому слові («pencil sharpener» — три ряди літер) вона інакше
     налазила на переклад під нею. */
  .prompt{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:6px 0}
  .prompt .qtxt{flex:none;font-weight:800;color:var(--soft);font-size:14px}
  .prompt .qpic{width:100%;max-width:min(100%,320px);flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
  .prompt .qpic img{max-width:100%;max-height:min(30vh,100%);object-fit:contain;border-radius:12px}
  .prompt .qpic .emoji{font-size:74px}
  .prompt .qword{flex:none;font-family:'Fredoka';font-size:clamp(30px,8vw,44px)}
  .prompt .quk{flex:none;font-family:'Comfortaa','Fredoka',sans-serif;font-weight:700;font-size:clamp(22px,6.5vw,32px);color:var(--coral);text-align:center;line-height:1.15}
  .prompt .qgap{flex:none;font-family:'Fredoka';font-size:clamp(22px,6vw,30px);text-align:center;line-height:1.3}
  .prompt .qgap b{color:var(--coral)}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none;margin-top:6px}
  .opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 10px;font-family:'Fredoka';
    font-size:19px;color:var(--ink);cursor:pointer;min-height:56px;word-break:break-word}
  .opt:active{transform:translateY(2px)}
  .opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .opt.no{background:#ffe6e2;border-color:var(--coral);color:var(--coral-d);animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* збери слово.
     Довге слово («pencil sharpener») — дрібніші клітинки й літери, інакше
     три ряди слотів плюс три ряди літер з'їдають увесь екран і зверху
     нема де стати картинці з перекладом. */
  .slots.long .slot{width:min(8.6vw,34px);height:min(10.5vw,42px);font-size:min(5.6vw,21px);border-radius:10px}
  .keys.long .key{min-width:34px;height:40px;padding:0 7px;font-size:18px;border-radius:10px}
  .slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:none;margin:4px 0}
  .slot{width:min(11vw,44px);height:min(13vw,54px);border-radius:12px;background:#eef4fc;border:2px dashed #b9cbe6;
    display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-size:min(7vw,26px);color:var(--primary)}
  .slot.filled{background:linear-gradient(180deg,#fff,#eaf1fb);border-style:solid;border-color:var(--primary);color:var(--ink)}
  .slot.wrong{border-color:var(--coral);color:var(--coral);animation:shake .35s}
  .keys{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;flex:none;margin-top:8px}
  .key{min-width:44px;height:50px;padding:0 10px;border-radius:12px;border:2px solid var(--line);background:#fff;
    font-family:'Fredoka';font-size:22px;color:var(--ink);cursor:pointer}
  .key:active{transform:translateY(2px)}
  .key:disabled{opacity:.28}
  .tools{display:flex;gap:8px;justify-content:center;margin-top:10px;flex:none}
  .tool{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font-weight:800;font-size:15px;color:var(--ink);cursor:pointer}

  .fb{min-height:22px;text-align:center;font-weight:800;font-size:15px;margin-top:6px;flex:none}
  .fb.good{color:var(--good)} .fb.bad{color:var(--coral-d)}

  /* фініш */
  .done{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:6px}
  .done .star{font-size:64px;animation:pop .5s ease both}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .done h2{font-family:'Comfortaa','Fredoka',sans-serif;font-size:26px;color:var(--success)}
  .rtable{width:100%;max-width:420px;background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:var(--e2);overflow:hidden}
  .rtable .rh{background:#f3f7fd;font-weight:800;color:var(--soft);font-size:13px;padding:9px 14px;text-align:left}
  .rrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);text-align:left}
  .rrow .ri{width:52px;height:52px;flex:none;border-radius:12px;background:#f5eeda;display:grid;place-items:center;overflow:hidden}
  .rrow .ri img{width:100%;height:100%;object-fit:contain;padding:5px}
  .rrow .ri span{font-size:26px}
  .rrow .rn{flex:1;min-width:0}
  .rrow .rn b{font-family:'Fredoka';font-weight:700;font-size:16px;display:block}
  .rrow .rn small{color:var(--soft);font-weight:800}
  .rrow .rv{font-family:'Fredoka';font-weight:700;font-size:19px;color:var(--good);flex:none}
  .rrow .rv.gold{color:var(--gold-ink)}
  .save-note{font-weight:800;font-size:13px;color:var(--soft)}
  .done-btns{width:100%;max-width:420px;display:flex;flex-direction:column;gap:9px;margin-top:4px}

  .msg{margin:auto;text-align:center;color:var(--soft);font-weight:800;padding:30px 14px}
  .msg .gobtn{display:inline-block;margin-top:12px;padding:12px 20px;border-radius:16px;text-decoration:none;
    background:var(--primary);color:#fff;font-family:'Fredoka';font-size:17px;box-shadow:0 5px 0 var(--primary-d)}
  .msg .gobtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--primary-d)}
</style>
</head>
<body>
<div class="wrap">

  <!-- вибір набору -->
  <section id="sDeck" class="screen on">
    <div class="hero">
      <span class="hero-txt"><b>Словник English</b><small>обери набір слів ❤️</small></span>
      <img class="hero-bg" src="img/en-hero.webp" alt="Словник English"
           onerror="this.style.display='none'">
      <button class="hero-back" id="deckBack" title="Назад">←</button>
    </div>
    <div class="pick" id="deckList"><div class="msg">Завантаження…</div></div>
  </section>

  <!-- вибір режиму -->
  <section id="sMode" class="screen">
    <div class="topbar"><button class="iconbtn" id="modeBack">←</button>
      <div class="ttl" id="modeTitle">Набір</div></div>
    <div class="pick">
      <div class="dhead" id="modeHead" hidden></div>
      <div class="gpick" id="gradePick" hidden></div>
      <p class="lead" id="modeLead"></p>
      <button class="big-btn cta" id="btnStudy"><span class="cta-ic">📖</span>Спочатку вивчити слова</button>
      <div style="height:8px"></div>
      <div class="mode-card" id="cardTest">
        <div class="mode-h"><span class="m-ic">🎯</span><span class="m-t">Тест</span></div>
        <div class="mode-note">Обери правильну відповідь. Легше — на впізнавання.</div>
        <span class="reward-tag" id="tagTest">🔮 +? мани</span>
      </div>
      <div class="mode-card trial" id="cardTrial">
        <div class="mode-h"><span class="m-ic">🏆</span><span class="m-t">Випробування</span></div>
        <div class="mode-note">Збери слово з літер. Важче — на пригадування.</div>
        <span class="reward-tag gold" id="tagTrial">🎁 предмет + 💰</span>
      </div>
      <p class="lead">⚠️ Помилка повертає на початок. Пройди все без помилок!</p>
    </div>
  </section>

  <!-- вивчення -->
  <section id="sStudy" class="screen">
    <div class="topbar"><button class="iconbtn" id="studyBack">←</button>
      <div class="progress-line"><div class="bar"><span id="studyBar"></span></div><span class="pt" id="studyPt"></span></div></div>
    <div class="fcard" id="fcard"></div>
    <div class="nav-row">
      <button class="big-btn ghost sm side" id="fPrev">←</button>
      <button class="big-btn green sm" id="fStart">Почати →</button>
      <button class="big-btn ghost sm side" id="fNext">→</button>
    </div>

  <!-- перевірка -->

    <div class="topbar"><button class="iconbtn" id="playBack">←</button>
      <div class="progress-line"><div class="bar"><span id="playBar"></span></div><span class="pt" id="playPt"></span></div>
      <button class="iconbtn" id="playSpeak" title="Озвучити">🔊</button></div>
    <div class="prompt" id="prompt"></div>
    <div id="answer"></div>
    <div class="fb" id="fb"></div>

<script src="sk-avatar.js"></script>
<script type="module" src="firebase-config.js"></script>
<script>
"use strict";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function num(n){var x=Number(n);return isFinite(x)?x:0;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function sample(a,n,not){var pool=a.filter(function(x){return x!==not;});return shuffle(pool).slice(0,n);}

var HERO=null, HERO_SESSION=false, DECKS=[], deck=null, WORDS=[], mode='test';
/* ALLWORDS — усі слова теми (всіх класів); WORDS — те, що дитина зараз тренує.
   gradeSel: числen:'numbers', о = тілen:'body', ьки цей клас, null = усі класи набору. */
var ALLWORDS=[], gradeSel=null;
var QS=[], pos=0, attempts=1, studyPos=0, flipped=false;

/* ---- шляхи ---- */
function wImg(w){var u=String((w&&w.img)||'').trim();if(/^https?:\/\//i.test(u))return u;if(w&&w.id)return 'img/en/'+w.id+'.webp';return '';}
function itImg(base){var u=String((base&&base.img)||'').trim();if(/^https?:\/\//i.test(u))return u;if(base&&base.id)return 'img/items/'+base.id+'.webp';return '';}
function aud(w){var u=String((w&&w.audio)||'').trim();return u||'';}

/* ---- озвучка: файл, якщо є; інакше браузерний TTS (en-US) ---- */
function play(w){
  try{
    var a=aud(w);
    if(a){ var el=new Audio(a); el.play().catch(function(){tts(w.word);}); return; }
  }catch(e){}
  tts(w&&w.word);
}
function tts(t){ if(!t)return; try{ var u=new SpeechSynthesisUtterance(String(t)); u.lang='en-US'; u.rate=.9; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }catch(e){} }

/* ---- звуки фідбеку ---- */
var AC=null;
function beep(ok){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); var o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);o.type='sine';
    if(ok){o.frequency.setValueAtTime(660,AC.currentTime);o.frequency.setValueAtTime(880,AC.currentTime+.09);}
    else{o.frequency.setValueAtTime(300,AC.currentTime);o.frequency.setValueAtTime(200,AC.currentTime+.12);}
    g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.2);
    o.start();o.stop(AC.currentTime+.22);
  }catch(e){}
}

/* ---- навігація екранів ---- */
function show(id){['sDeck','sMode','sStudy','sPlay','sDone'].forEach(function(s){$(s).classList.toggle('on',s===id);});}

/* ============ ВИБІР НАБОРУ ============ */
/* Кольори наборів ідуть по колу — набір лишається того самого кольору,
   доки не змінився порядок у адмінці. */
var DECK_SKINS=[
  {c1:'#ffe3a3',c1b:'#ffc75c',c2:'#fff7e6',c3:'#cf8317'},
  {c1:'#cdf0a6',c1b:'#93da6b',c2:'#eefae3',c3:'#4c9a2a'},
  {c1:'#e0d4fb',c1b:'#bfa4f2',c2:'#f3edfe',c3:'#7a4fd0'},
  {c1:'#ffd3e4',c1b:'#ffa5c6',c2:'#ffeef5',c3:'#df4d89'},
  {c1:'#cfe6ff',c1b:'#9cc9fb',c2:'#e9f4ff',c3:'#2f7ed6'},
  {c1:'#c3f1e7',c1b:'#8fdfd0',c2:'#e6f9f5',c3:'#14948a'},
  {c1:'#dcdefb',c1b:'#b6bcf4',c2:'#eef0fe',c3:'#5a63d2'}
];
/* Малюнок і переклад теми. Набір в адмінці має лише title/topic, тож
   картинку й українську назву впізнаємо за темою — і англійською, і
   українською. Немає збігу — лишається 🗂 і те, що задано в адмінці. */
/* Малюнок і переклад теми. `re` — для картинки й емодзі (широко, бо
   «School Subjects» теж про школу), `en` — точна назва теми, лише за нею
   підставляємо український підпис: інакше «School Subjects» підписувалось
   би як «Шкільне приладдя». */
var TOPIC_ART=[
  {re:/action|verb|дії|дієслов/,               en:'actions',    emo:'🏃', uk:'Дії',              img:'img/en/EN-run.webp'},
  {re:/animal|pet|тварин/,                     en:'animals',    emo:'🐶', uk:'Тварини',          img:''},
  {re:/classroom|school|клас|школ|приладд/,    en:'classroom',  emo:'🎒', uk:'Шкільне приладдя', img:'img/en/EN-schoolbag.webp'},
  {re:/colou?r|кольор/,                        en:'colors',     emo:'🎨', uk:'Кольори',          img:'img/en/EN-palette.webp'},
  {re:/number|count|числ|лічб|цифр/,           en:'numbers',    emo:'🔢', uk:'Числа',            img:''},
  {re:/tech|comput|digital|технолог|компʼют|компют/, en:'technology', emo:'💻', uk:'Технології',  img:'img/en/EN-laptop.webp'},
  {re:/home|house|room|дім|дом|кімнат|оселя/,  en:'home',       emo:'🏠', uk:'Дім',              img:'img/en/EN-room.webp'},
  {re:/food|fruit|meal|їж|фрукт|харч|овоч/,    en:'food',       emo:'🍎', uk:'Їжа',              img:''},
  {re:/famil|родин|сім/,                       en:'family',     emo:'👨‍👩‍👧', uk:'Родина',      img:''},
  {re:/body|face|тіл|облич/,                   en:'body',       emo:'✋', uk:'Тіло',             img:''},
  {re:/cloth|wear|одяг|вбранн/,                en:'clothes',    emo:'👕', uk:'Одяг',             img:''},
  {re:/weather|season|погод|пора рок/,         en:'weather',    emo:'☀️', uk:'Погода',           img:''},
  {re:/toy|game|іграшк|ігр/,                   en:'toys',       emo:'🧸', uk:'Іграшки',          img:''},
  {re:/nature|plant|природ|рослин/,            en:'nature',     emo:'🌳', uk:'Природа',          img:''},
  {re:/sport|спорт/,                           en:'sports',     emo:'⚽', uk:'Спорт',            img:''}
];
function deckArt(d){
  var hay=(String(d.title||'')+' '+String(d.topic||'')+' '+String(d.id||'')).toLowerCase();
  for(var i=0;i<TOPIC_ART.length;i++) if(TOPIC_ART[i].re.test(hay)) return TOPIC_ART[i];
  return null;
}
function nrm(v){ return String(v==null?'':v).toLowerCase().replace(/\s+/g,' ').trim(); }
/* Порожній екран має називати ПРИЧИНУ.
   Раніше на всі три випадки — гість, збій читання і справді порожній
   словник — писалось однакове «Наборів ще немає. Додай їх в адмінці»:
   дитина без входу бачила пораду для адміна й не розуміла, що робити.
   Набори читає лише той, хто увійшов (firestore.rules: vocabDecks →
   allow read: if signedIn()). */
function deckMsg(html){ $('deckList').innerHTML='<div class="msg">'+html+'</div>'; }
function renderDecks(err){
  if(!DECKS.length){
    var signed = !!(window.SK && window.SK.user);
    if(err || !signed){
      deckMsg('Щоб відкрити словник, увійди Героєм.<br><a class="gobtn" href="login.html">Увійти</a>');
      return;
    }
    /* Увійшли, база відповіла, а список порожній: або наборів немає, або
       всі вимкнені перемикачем в адмінці. Друге кажемо окремо — інакше
       марно шукати те, що вже створене. */
    deckMsg('Наборів ще немає.<br>Додай їх в адмінці → Словник → Набори.');
    if(window.SK.listVocabDecks) window.SK.listVocabDecks().then(function(all){
      var off=(all||[]).filter(function(d){ return d.active===false; }).length;
      if(off && !DECKS.length) deckMsg('Усі набори вимкнені ('+off+').<br>Увімкни їх в адмінці → Словник → Набори.');
    }).catch(function(){});
    return;
  }
  /* Клас пишемо в підписі лише тоді, коли в списку намішані різні класи —
     інакше це шум: дитина й так у своєму. */
  var grades={}; DECKS.forEach(function(d){ grades[String(d.grade||1)]=1; });
  var manyGrades=Object.keys(grades).length>1;
  $('deckList').innerHTML=DECKS.map(function(d,i){
    var sk=DECK_SKINS[i%DECK_SKINS.length], art=deckArt(d);
    var title=d.title||d.topic||d.id;
    d._skin=sk;                         // той самий колір потім на екрані режимів
    /* Підпис: свій переклад із адмінки → переклад теми → тема → клас. */
    var sub=String(d.uk||d.subtitle||'').trim();
    /* Переклад теми ставимо лише за точним збігом назви: «School Subjects»
       і «Classroom» — різні теми, хоч обидві про школу. */
    if(!sub && art && art.en && nrm(title)===art.en && nrm(art.uk)!==nrm(title)) sub=art.uk;
    if(!sub && d.topic && nrm(d.topic)!==nrm(title)) sub=String(d.topic);
    if(manyGrades) sub=(sub?sub+' · ':'')+(d.grade||1)+' клас';
    if(!sub) sub=(d.grade||1)+' клас';
    var emo=(art&&art.emo)||'🗂';
    var cover=String(d.img||'').trim()||(art&&art.img)||'';
    /* Картинки може не бути в репо — тоді onerror лишає емодзі теми. */
    var pic=cover
      ? '<img src="'+esc(cover)+'" alt="" loading="lazy" onerror="this.parentNode.textContent=\''+esc(emo)+'\'">'
      : esc(emo);
    d._pic=pic; d._sub=sub;
    return '<button class="deck" data-deck="'+esc(d.id)+'" '
      +'style="--c1:'+sk.c1+';--c1b:'+sk.c1b+';--c2:'+sk.c2+';--c3:'+sk.c3+'">'
      +'<span class="ic">'+pic+'</span>'
      +'<span class="dx"><span class="dt">'+esc(title)+'</span>'
      +'<span class="ds">'+esc(sub)+'</span></span>'
      +'<span class="wm">'+esc(emo)+'</span>'
      +'<span class="go">›</span></button>';
  }).join('');
}
/* Клас слова: порожньо → 1, щоб старі записи без поля не випадали. */
function wGrade(w){ var n=Number(w&&w.grade); return isFinite(n)&&n>=0 ? n : 1; }
function gradeLabel(g){ return g===0 ? 'Дошкільнятко' : (g+' клас'); }
/* Чіпи «Усі класи / 1 клас / 4 клас». Один клас у темі — рядок ховаємо:
   вибирати нема з чого. */
function renderGradePick(gs){
  var box=$('gradePick'); if(!box) return;
  if(!gs || gs.length<2){ box.hidden=true; box.innerHTML=''; return; }
  box.hidden=false;
  box.innerHTML='<span class="gp-lab">Слова якого класу?</span><div class="gp-row">'
    +'<button class="gchip'+(gradeSel==null?' on':'')+'" data-g="all">Усі класи</button>'
    +gs.map(function(g){
        return '<button class="gchip'+(gradeSel===g?' on':'')+'" data-g="'+g+'">'+esc(gradeLabel(g))+'</button>';
      }).join('')
    +'</div>';
}
/* WORDS = зріз ALLWORDS за обраним класом. Порожній зріз неможливий:
   чіпи будуються з класів, які в темі справді є. */
function applyGrade(){
  WORDS = (gradeSel==null) ? ALLWORDS.slice()
                           : ALLWORDS.filter(function(w){ return wGrade(w)===gradeSel; });
  if(!WORDS.length){ gradeSel=null; WORDS=ALLWORDS.slice(); }
  studyPos=0; flipped=false;
  $('modeLead').textContent='Слів у наборі: '+WORDS.length
    +' · '+(gradeSel==null ? 'усі класи' : gradeLabel(gradeSel));
  $('gradePick').querySelectorAll('.gchip').forEach(function(b){
    var v=b.getAttribute('data-g');
    b.classList.toggle('on', (v==='all') ? gradeSel==null : Number(v)===gradeSel);
  });
}
async function openDeck(id){
  deck=DECKS.find(function(d){return String(d.id)===String(id);}); if(!deck) return;
  ALLWORDS=[]; WORDS=[];
  /* Беремо всю тему, а не лише клас набору: інакше слова, дописані для
     іншого класу, не мали б де з'явитись, доки для них не створять набір. */
  try{ ALLWORDS=await window.SK.listActiveVocab(deck.topic); }catch(e){ ALLWORDS=[]; }
  if(!ALLWORDS.length){ alert('У цьому наборі ще немає слів. Додай їх в адмінці.'); return; }
  var gs=[]; ALLWORDS.forEach(function(w){ var g=wGrade(w); if(gs.indexOf(g)<0) gs.push(g); });
  gs.sort(function(a,b){ return a-b; });
  var own=Number(deck.grade); if(!isFinite(own)) own=1;
  var hg=(HERO && HERO.grade!=null) ? Number(HERO.grade) : NaN;
  /* Стартуємо зі свого класу Героя, інакше — з класу набору: «четвертий»
     не підмішується до «першого» сам собою. Немає ні того, ні того —
     показуємо всі слова теми. */
  gradeSel = (isFinite(hg) && gs.indexOf(hg)>=0) ? hg
           : (gs.indexOf(own)>=0 ? own : null);
  renderGradePick(gs);
  var mh=$('modeHead'), sk=deck._skin;
  if(mh){
    if(sk){
      mh.hidden=false;
      mh.setAttribute('style','--c1:'+sk.c1+';--c1b:'+sk.c1b+';--c2:'+sk.c2+';--c3:'+sk.c3);
      mh.innerHTML='<span class="ic">'+(deck._pic||'🗂')+'</span>'
        +'<span class="dx"><span class="dt">'+esc(deck.title||deck.topic||deck.id)+'</span>'
        +'<span class="ds">'+esc(deck._sub||'')+'</span></span>';
    }else{ mh.hidden=true; mh.innerHTML=''; }
  }
  /* назва набору вже стоїть у кольоровій шапці — у топбарі не дублюємо */
  $('modeTitle').textContent=(mh && !mh.hidden) ? 'Як тренуємось?' : (deck.title||deck.topic||deck.id);
  applyGrade();
  var sv=num(deck.test&&deck.test.statValue);
  var rc=((deck.trial&&deck.trial.rewards)||[]).length, tc=num(deck.trial&&deck.trial.coins);
  if(deck._auto){
    /* Тема без набору: нагороди задаються в адмінці, тож поки їх немає —
       краще сказати прямо, ніж малювати «+0 мани». */
    $('tagTest').textContent='🔮 без нагороди — набір ще не налаштований';
    $('tagTrial').textContent='🎁 без нагороди — набір ще не налаштований';
  }else{
    $('tagTest').textContent='🔮 +'+sv+' мани';
    $('tagTrial').textContent='🎁 '+(rc?('предмет ('+rc+')'):'')+(tc?(' + '+tc+' 💰'):(rc?'':'💰'));
  }
  show('sMode');
}

/* ============ ВИВЧЕННЯ (флеш-картки) ============ */
function renderStudy(){
  var w=WORDS[studyPos]; if(!w)return;
  var src=wImg(w);
  var pic=src?'<img src="'+esc(src)+'" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'emoji\',textContent:\'🔤\'}))">':'<div class="emoji">🔤</div>';
  var phr=(w.phrases||[]).slice(0,2).map(function(p){return esc(p.en)+(p.uk?(' — '+esc(p.uk)):'');}).join('<br>');
  if(!flipped){
    $('fcard').innerHTML='<div class="fpic">'+pic+'</div>'
      +'<div class="fwrow"><div class="fword">'+esc(w.word)+'</div>'
      +'<button class="speak" id="fspeak">🔊</button></div>'
      +(w.ipa?'<div class="fipa">'+esc(w.ipa)+'</div>':'')
      +'<div class="fhint">торкнись картки → переклад</div>';
  }else{
    $('fcard').innerHTML='<div class="fpic">'+pic+'</div>'
      +'<div class="fuk">'+esc(w.uk)+'</div>'
      +(phr?'<div class="fphr">'+phr+'</div>':'')
      +'<div class="fhint">торкнись → назад</div>';
  }
  var sp=$('fspeak'); if(sp) sp.onclick=function(ev){ev.stopPropagation();play(w);};
  var pct=Math.round((studyPos+1)/WORDS.length*100);
  $('studyBar').style.width=pct+'%'; $('studyPt').textContent=(studyPos+1)+' / '+WORDS.length;
  if(!flipped) play(w);
}

/* ============ ГЕНЕРАЦІЯ ПИТАНЬ ============ */
function buildQuestions(){
  var ws=shuffle(WORDS), qs=[];
  ws.forEach(function(w,i){
    if(mode==='test'){
      var types=[]; types.push('enuk');
      if(wImg(w)) types.push('picword');
      types.push('listen');
      qs.push({type:types[i%types.length], w:w});
    }else{
      var hasPhrase=(w.phrases||[]).some(function(p){return p.en && p.en.toLowerCase().indexOf(String(w.word).toLowerCase())>=0;});
      qs.push({type:(hasPhrase && i%2===1)?'buildgap':'build', w:w});
    }
  });
  return qs;
}

/* ============ ПЕРЕВІРКА ============ */
function startPlay(){
  QS=buildQuestions(); pos=0; attempts=1;
  show('sPlay'); renderQ();
}
function setBar(){ var pct=Math.round(pos/QS.length*100); $('playBar').style.width=pct+'%'; $('playPt').textContent=pos+' / '+QS.length+(attempts>1?(' · спроба '+attempts):''); }
function optWords(w,n){ return sample(WORDS,n,w); }

function renderQ(){
  setBar();
  $('fb').textContent=''; $('fb').className='fb';
  var q=QS[pos]; if(!q){ finish(); return; }
  var w=q.w, P=$('prompt'), A=$('answer');
  $('playSpeak').onclick=function(){play(w);};

  if(q.type==='enuk'){
    P.innerHTML='<div class="qtxt">Обери переклад</div><div class="qword">'+esc(w.word)+'</div>'+(w.ipa?'<div class="qtxt">'+esc(w.ipa)+'</div>':'');
    var opts=shuffle([w].concat(optWords(w,3)));
    A.innerHTML='<div class="opts">'+opts.map(function(o){return '<button class="opt" data-uk="'+esc(o.uk)+'">'+esc(o.uk)+'</button>';}).join('')+'</div>';
    A.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ pick(b, b.getAttribute('data-uk')===w.uk); }; });
    play(w);
  }
  else if(q.type==='picword'){
    var src=wImg(w);
    P.innerHTML='<div class="qtxt">Що це англійською?</div><div class="qpic"><img src="'+esc(src)+'" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'emoji\',textContent:\'🔤\'}))"></div>';
    var opts2=shuffle([w].concat(optWords(w,3)));
    A.innerHTML='<div class="opts">'+opts2.map(function(o){return '<button class="opt" data-en="'+esc(o.word)+'">'+esc(o.word)+'</button>';}).join('')+'</div>';
    A.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ pick(b, b.getAttribute('data-en')===w.word); }; });
  }
  else if(q.type==='listen'){
    P.innerHTML='<div class="qtxt">Послухай і обери слово</div><div class="qpic"><div class="emoji">🔊</div></div>';
    var opts3=shuffle([w].concat(optWords(w,3)));
    A.innerHTML='<div class="opts">'+opts3.map(function(o){return '<button class="opt" data-en="'+esc(o.word)+'">'+esc(o.word)+'</button>';}).join('')+'</div>';
    A.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ pick(b, b.getAttribute('data-en')===w.word); }; });
    play(w);
  }
  else { // build / buildgap
    var src2=wImg(w);
    var head;
    if(q.type==='buildgap'){
      var ph=(w.phrases||[]).filter(function(p){return p.en && p.en.toLowerCase().indexOf(String(w.word).toLowerCase())>=0;})[0];
      var masked=ph? ph.en.replace(new RegExp(w.word,'i'),'___') : '___';
      head='<div class="qtxt">Збери пропущене слово</div><div class="qgap">'+esc(masked).replace('___','<b>___</b>')+'</div>'+(ph&&ph.uk?'<div class="qtxt">'+esc(ph.uk)+'</div>':'');
    }else{
      head='<div class="qtxt">Збери слово з літер</div>'
        +(src2?'<div class="qpic"><img src="'+esc(src2)+'" alt="" onerror="this.remove()"></div>':'')
        +'<div class="quk">'+esc(w.uk)+'</div>';
    }
    P.innerHTML=head;
    renderBuild(w, A);
    play(w);
  }
}

function pick(btn, ok){
  $('answer').querySelectorAll('.opt').forEach(function(b){b.style.pointerEvents='none';});
  if(ok){ btn.classList.add('ok'); good(); }
  else{ btn.classList.add('no'); bad(); }
}

/* збери слово з літер */
function renderBuild(w, A){
  var target=String(w.word);
  var letters=target.split('');
  var slotsHtml=letters.map(function(_,i){return '<div class="slot" data-i="'+i+'"></div>';}).join('');
  var keys=shuffle(letters.map(function(ch,i){return {ch:ch,k:i};}));
  var keysHtml=keys.map(function(o){return '<button class="key" data-k="'+o.k+'">'+esc(o.ch.toUpperCase())+'</button>';}).join('');
  var big=letters.length>9?' long':'';          // довге слово — компактні клітинки
  A.innerHTML='<div class="slots'+big+'">'+slotsHtml+'</div><div class="keys'+big+'">'+keysHtml+'</div>'
    +'<div class="tools"><button class="tool" id="bBack">⌫ Стерти</button><button class="tool" id="bHear">🔊 Ще раз</button></div>';
  var filled=[]; // {slotEl, keyEl, ch}
  var slots=A.querySelectorAll('.slot'), keyEls=A.querySelectorAll('.key');
  keyEls.forEach(function(kb){
    kb.onclick=function(){
      if(kb.disabled) return;
      var idx=filled.length; if(idx>=slots.length) return;
      var s=slots[idx]; s.textContent=kb.textContent; s.classList.add('filled');
      kb.disabled=true; filled.push({s:s,kb:kb,ch:kb.textContent.toLowerCase()});
      if(filled.length===slots.length) checkBuild();
    };
  });
  $('bBack').onclick=function(){ var f=filled.pop(); if(f){ f.s.textContent=''; f.s.classList.remove('filled','wrong'); f.kb.disabled=false; } };
  $('bHear').onclick=function(){ play(w); };
  function checkBuild(){
    var got=filled.map(function(f){return f.ch;}).join('');
    if(got===target.toLowerCase()){ good(); }
    else{ slots.forEach(function(s){s.classList.add('wrong');}); bad(); }
  }
}

function good(){
  beep(true);
  $('fb').textContent='✅ Правильно!'; $('fb').className='fb good';
  pos++;
  setTimeout(function(){ if(pos>=QS.length) finish(); else renderQ(); }, 650);
}
function bad(){
  beep(false);
  $('fb').textContent='❌ Не так. Починаємо спочатку!'; $('fb').className='fb bad';
  setTimeout(function(){ pos=0; attempts++; renderQ(); }, 1100);
}

/* ============ ФІНІШ ============ */
function finish(){ if(mode==='test') finishTest(); else finishTrial(); }

function finishTest(){
  var gain0=num(deck.test&&deck.test.statValue);
  var replay=false; try{ replay=localStorage.getItem('sk_en_test_'+deck.id)==='1'; }catch(e){}
  var gain=replay?0:gain0;
  var rows='<div class="rh">Нагорода — характеристика</div>'
    +'<div class="rrow"><div class="ri"><span>🔮</span></div><div class="rn"><b>Мана</b>'
    +(replay?'<small>повтор — без нарахування</small>':'<small>англійська мова</small>')+'</div>'
    +'<div class="rv">+'+gain+'</div></div>';
  showDone('🎯','Тест пройдено!', rows);
  if(HERO_SESSION){
    window.SK.getHero().then(function(h){
      h=h||{}; var patch={};
      if(gain>0){ var cur=(h.mana!=null)?num(h.mana):0; patch.mana=cur+gain; }
      return window.SK.saveHeroStats(patch);
    }).then(function(){ if(window.SK.pushLocal) window.SK.pushLocal().catch(function(){}); try{localStorage.setItem('sk_en_test_'+deck.id,'1');}catch(e){} setSave(true); })
      .catch(function(){ setSave(false); });
  }
}

function finishTrial(){
  var replay=false; try{ replay=localStorage.getItem('sk_en_trial_'+deck.id)==='1'; }catch(e){}
  var coins0=num(deck.trial&&deck.trial.coins);
  var coins=replay?Math.floor(coins0/2):coins0;
  var wonId=null, wonCoins=0;
  if(!replay){
    var rewards=(deck.trial&&deck.trial.rewards)||[];
    var roll=Math.random()*100, acc=0;
    for(var i=0;i<rewards.length;i++){ acc+=num(rewards[i].chance); if(roll<acc){ wonId=rewards[i].item; wonCoins=num(rewards[i].coins); break; } }
  }
  coins+=wonCoins;
  // будуємо таблицю (предмет підвантажимо асинхронно)
  var rows='<div class="rh">Нагорода — здобич</div>'
    +'<div id="rewItem"></div>'
    +'<div class="rrow"><div class="ri"><span>💰</span></div><div class="rn"><b>Монети</b>'
    +(replay?'<small>повтор — половина</small>':'<small>за випробування</small>')+'</div><div class="rv gold">+'+coins+'</div></div>';
  showDone('🏆','Випробування пройдено!', rows);

  function grantAll(base, inst){
    if(!HERO_SESSION){ setSave('guest'); return; }
    var chain=Promise.resolve();
    if(coins>0) chain=chain.then(function(){return window.SK.addCoins(coins);});
    if(inst) chain=chain.then(function(){return window.SK.addToInventory(inst);});
    chain.then(function(){ if(window.SK.pushLocal) window.SK.pushLocal().catch(function(){}); try{localStorage.setItem('sk_en_trial_'+deck.id,'1');}catch(e){} setSave(true); })
      .catch(function(){ setSave(false); });
  }

  if(wonId){
    window.SK.getItem(wonId).then(function(base){
      var inst=null, name=wonId, src='', stat='';
      if(base){
        name=base.name||wonId; src=itImg(base);
        if(base.stat && base.valueMin!=null) stat=base.stat+' '+base.valueMin+(base.valueMax!=null&&base.valueMax!==base.valueMin?('–'+base.valueMax):'');
        try{ if(window.SKIT&&window.SKIT.makeInstance) inst=window.SKIT.makeInstance(base,{identified:true}); }catch(e){}
      }
      $('rewItem').innerHTML='<div class="rrow"><div class="ri">'+(src?'<img src="'+esc(src)+'" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:\'🎁\'}))">':'<span>🎁</span>')+'</div>'
        +'<div class="rn"><b>'+esc(name)+'</b>'+(stat?'<small>'+esc(stat)+'</small>':'<small>новий предмет</small>')+'</div><div class="rv">＋</div></div>';
      grantAll(base, inst);
    }).catch(function(){ $('rewItem').innerHTML=''; grantAll(null,null); });
  }else{
    $('rewItem').innerHTML= replay? '' : '<div class="rrow"><div class="ri"><span>🍀</span></div><div class="rn"><b>Цього разу без предмета</b><small>але монети твої</small></div><div class="rv">—</div></div>';
    grantAll(null,null);
  }
}

function showDone(star,title,rows){
  show('sDone');
  $('done').innerHTML='<div class="star">⭐</div><h2>'+esc(title)+'</h2>'
    +'<div class="rtable">'+rows+'</div>'
    +'<div class="save-note" id="saveNote">'+(HERO_SESSION?'💾 Зберігаємо…':'ℹ️ Увійди Героєм, щоб зберегти нагороду')+'</div>'
    +'<div class="done-btns">'
    +'<button class="big-btn green sm" id="againBtn">↻ Пройти ще раз</button>'
    +'<button class="big-btn ghost sm" id="otherBtn">🔀 Інший набір</button>'
    +'<button class="big-btn ghost sm" id="heroBtn">🦁 До Героя</button>'
    +'</div>';
  $('againBtn').onclick=function(){ startPlay(); };
  $('otherBtn').onclick=function(){ show('sDeck'); };
  $('heroBtn').onclick=function(){ location.href='hero.html'; };

function setSave(state){
  var n=$('saveNote'); if(!n)return;
  if(state===true){ n.textContent='✅ Збережено!'; n.style.color='#0f6b38'; }
  else if(state==='guest'){ n.textContent='ℹ️ Увійди Героєм, щоб зберегти нагороду'; }
  else{ n.textContent='⚠️ Не вдалося зберегти. Спробуй ще раз пізніше.'; n.style.color='#a32432'; }
}

/* ============ ПОДІЇ ============ */

  $('deckList').addEventListener('click',function(e){ var b=e.target.closest('[data-deck]'); if(b) openDeck(b.getAttribute('data-deck')); });
  $('deckBack').onclick=function(){ var bb=document.getElementById('heroBackBtn'); if(bb) bb.click(); else location.href='tests.html'; };
  $('gradePick').addEventListener('click',function(e){

  $('cardTrial').onclick=function(){ mode='trial'; startPlay(); };

}

/* ============ СТАРТ ============ */
/* Тема без набору не має зникати з екрана: слова вже додані в адмінці, а
   набір із нагородами могли ще не створити. Показуємо таку тему карткою —
   вивчати й тренуватись можна одразу, тільки без нагород. */
function autoDecks(words, haveTopics){
  var by={};
  (words||[]).forEach(function(w){
    var t=String(w.topic||'').trim(); if(!t) return;
    var k=t.toLowerCase();
    if(haveTopics[k]) return;                       // набір на цю тему вже є
    var g=Number(w.grade); if(!isFinite(g)||g<0) g=1;
    var b=by[k] || (by[k]={topic:t, grade:g});
    if(g<b.grade) b.grade=g;
  });
  return Object.keys(by).sort().map(function(k){
    var b=by[k];
    return { id:'auto:'+b.topic, title:b.topic, topic:b.topic, grade:b.grade, order:9000,
             active:true, test:{statValue:0}, trial:{coins:0,rewards:[]}, _auto:true };
  });
}
function boot(){
  var grade=(HERO&&HERO.grade!=null)?Number(HERO.grade):null;
  /* Набори беремо ВСІХ класів, а клас Героя лишається лише для порядку:
     раніше набір, доданий для іншого класу, не було видно взагалі — хоч
     усередині набору клас і так перемикається. */
  Promise.all([
    window.SK.listActiveVocabDecks(),
    window.SK.listActiveVocab().catch(function(){ return []; })
  ]).then(function(res){
    var decks=(res[0]||[]).slice(), words=res[1]||[];
    var have={}; decks.forEach(function(d){ have[String(d.topic||'').trim().toLowerCase()]=1; });
    DECKS=decks.concat(autoDecks(words, have));
    if(grade!=null) DECKS.sort(function(a,b){
      var ga=Number(a.grade)||1, gb=Number(b.grade)||1;
      return (ga===grade?0:1)-(gb===grade?0:1)
          || (Number(a.order)||0)-(Number(b.order)||0)
          || ga-gb
          || String(a.title||a.id).localeCompare(String(b.title||b.id),'uk');
    });
    renderDecks();
  }).catch(function(e){ console.error('[slovnyk] набори не прочитались:', e); DECKS=[]; renderDecks(e||true); });
}
(function whenSK(){
  var tries=0;
  (function tick(){
    if(window.SK && window.SK.ready){
      window.SK.ready.then(function(){
        wire();
        HERO_SESSION=!!(window.SK.isHeroSession && window.SK.isHeroSession());
        var after=function(){ boot(); };
        if(HERO_SESSION && window.SK.getHero){
          if(window.SK.pullLocal){ try{ window.SK.pullLocal(); }catch(e){} }
          window.SK.getHero().then(function(h){ HERO=h||null; after(); }).catch(after);
        }else{ after(); }
      });
      return;
    }
    if(tries++<120) setTimeout(tick,50); else $('deckList').innerHTML='<div class="msg">Не вдалося підключитися до бази.</div>';
  })();
})();
