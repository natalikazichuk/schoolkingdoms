<body>
<!-- Вміст малює SKADMIN.header() наприкінці файлу. -->
<header class="topbar"></header>
<div id="wrap">
  <div class="wrap-in" id="root">
    <div class="gate"><div class="spinner"></div><p class="sub" style="margin:0">Перевіряємо доступ…</p></div>
  </div>
</div>

<script type="module" src="firebase-config.js"></script>
<script>
/* ============================================================
   АРЕНА · ХАРАКТЕРИСТИКИ (admin-only, лише перегляд). Дві вкладки:
   1) «Герой» — базові характеристики з heroes/{id}: старт (defaultHero
      у firebase-config.js) і МАКСИМУМ зараз = старт + усе, що дають
      активні тести й тренажери з колекції tests.
   2) «Предмети» — що дають речі з каталогу items: скільки предметів,
      діапазони, і МАКСИМУМ, який можна зібрати в 12 слотах екіпіровки.
   Ключі зводимо через SKIT.canon(): «Маг. Резист» і «Магічний захист»
   — це одне й те саме magicResist, як і на арені.
   ============================================================ */
(function(){
'use strict';
var root=document.getElementById('root');
var esc=SKADMIN.esc;
var TAB='hero';
try{ if(location.hash==='#items') TAB='items'; else if(location.hash==='#mech') TAB='mech'; else if(location.hash==='#plan') TAB='plan'; else if(location.hash==='#skmech') TAB='skmech'; }catch(e){}
var ITEMS=[],TESTS=[],ITEMS_ERR=null,TESTS_ERR=null;

/* Стартові значення — копія defaultHero() з firebase-config.js. */
var HERO_START={health:50,mana:20,agility:50,accuracy:50,
  strength:2,defense:1,intelligence:1,wisdom:1,luck:1,memory:1,charisma:1};
/* Прогрес Героя (не бойові характеристики, але теж у heroes/{id}). */
var HERO_PROGRESS=[
  {key:'level',label:'Рівень',emoji:'🏅',start:1,note:'Рівень Героя'},
  {key:'xp',label:'Досвід (XP)',emoji:'⭐',start:0,note:'Досвід'},
  {key:'coins',label:'Монети',emoji:'🪙',start:0,note:'Нагороди тренажерів'}
];
/* Що бій на арені зараз справді читає (arena.html: maxForce/dmgOf/critRoll/dodgeRoll). */
/* що робить атрибут на арені — з правил бою (SKARENA.attrInfo). Атрибут, якого
   там немає (новий на речах), автоматично «не використовується на арені». */
function arenaInfo(key,pct,cons){return (window.SKARENA&&SKARENA.attrInfo)?SKARENA.attrInfo(key,pct,cons):{used:false,text:null};}
var NOT_USED='<span class="tag no">не використовується на арені на даний момент</span>';

/* Канонічний ключ → назва українською (як на арені, STAT_UK у arena.html). */
var CANON_UK={armor:'Броня',magicResist:'Магічна стійкість',agility:'Спритність',magicDamage:'Магічний урон',
  damage:'Фізичний урон',health:"Здоров'я",mana:'Мана',accuracy:'Точність',critDamage:'Шанс крит. урону',
  block:'Шанс блоку',stun:'Оглушення',healthRegen:"Відновлення здоров'я",extraAttack:'Додаткова атака',
  beltSlots:'Комірки пояса',fear:'Страх',barrier:"Бар'єр",antidote:'Антидот'};

/* 12 слотів екіпіровки (як EQUIP в arena.html). Руки — окремо: дві
   одноручні речі (Зброя або Щити) або одна дворучна на обидві. */
var SLOTS=[
  {cat:'Шоломи',label:'Шолом',n:1},{cat:'Обладунки',label:'Обладунки',n:1},
  {cat:'Рукавиці',label:'Рукавиці',n:1},{cat:'Наручі',label:'Наручі',n:1},
  {cat:'Пояси',label:'Пояс',n:1},{cat:'Штани',label:'Штани',n:1},
  {cat:'Взуття',label:'Взуття',n:1},{cat:'Амулет',label:'Амулет',n:1},
  {cat:'Кільце',label:'Кільце',n:2}
];

function heroStats(){
  var list=(window.SKCUR&&SKCUR.STATS)?SKCUR.STATS:[];
  return list.map(function(s){return {key:s.key,label:s.label,emoji:s.emoji,active:!!s.active,
    note:s.note||'',start:HERO_START[s.key]};});
}
function heroKeySet(){var o={};heroStats().forEach(function(s){if(s.active)o[s.key]=1;});return o;}
function label(key){return CANON_UK[key]||key;}
function known(key){var m=SKIT.STAT_MAP;for(var k in m)if(m[k]===key)return true;return false;}
function fmtRange(a,b){if(a==null&&b==null)return '—';if(a==null||a===b)return String(b);if(b==null)return String(a);return a+'–'+b;}
function n0(v){v=Number(v);return isNaN(v)?0:v;}

/* ══ ГЕРОЙ: максимум із тестів ══════════════════════════════════
   Скільки одиниць дає запис (так само, як test.html і sk-rewards.js):
   • тест «за кожну правильну» — statValue × кількість питань;
   • тест «фіксовано» — statValue за тест, а в тесті з рівнями — за КОЖЕН
     рівень (finishLevel у test.html нараховує на кожному рівні);
   • запис без питань (тренажер) — statValue один раз (SKREWARD.grantStat). */
/* Скільки питань дитина РЕАЛЬНО бачить за прохід — точно як test.html:
   • рівень із пулом questions[] і count < пулу → показує count (випадкова
     вибірка), інакше весь пул; рівень без пулу (генератор) → count або 5;
   • плаский тест із генератором → count || questions.length || 10,
     без генератора → усі questions.
   Раніше тут множили на весь пул, і тест «24 приклади, показувати 12»
   рахувався вдвічі більшим, а генераторні тести — як тренажер (раз). */
function hasGen(t){return !!(t.generator&&(t.generator.type||t.generator.op));}
function levelCount(L){
  L=L||{};var pool=Array.isArray(L.questions)?L.questions.length:0,c=parseInt(L.count,10);
  if(pool)return (!isNaN(c)&&c>0&&c<pool)?c:pool;
  return isNaN(c)?5:c;
}
function isLevels(t){return t.format==='levels'||(Array.isArray(t.levels)&&t.levels.length>0);}
function playedQ(t){
  if(isLevels(t))return (t.levels||[]).reduce(function(s,L){return s+levelCount(L);},0);
  if(hasGen(t))return n0(t.count)||(t.questions||[]).length||10;
  return (t.questions||[]).length;
}
function testGain(t){
  var v=Math.max(0,Math.floor(n0(t.statValue)));if(!v)return 0;
  var q=playedQ(t);
  if(!q)return v;                                  // тренажер / запис без питань
  if(t.statMode==='perCorrect')return v*q;         // за кожну правильну
  return isLevels(t)?v*(t.levels||[]).length:v;    // фіксовано: за тест або за кожен рівень
}
function testHow(t){
  var v=Math.floor(n0(t.statValue)),q=playedQ(t),lv=isLevels(t)?(t.levels||[]).length:0;
  if(!q)return v+' (тренажер, раз)';
  if(t.statMode==='perCorrect')return v+' × '+q+' правильних'+(lv?' ('+lv+' рів.)':'');
  return lv?v+' × '+lv+' рівнів':v+' за тест';
}
function testSums(){
  var by={};
  (TESTS||[]).forEach(function(t){
    if(!t||t.active===false||!t.stat)return;
    var k=(window.SKCUR&&SKCUR.statKeyFrom)?SKCUR.statKeyFrom(t.stat):t.stat;if(!k)return;
    var g=testGain(t);if(!g)return;
    var r=by[k]||(by[k]={sum:0,n:0,list:[]});r.sum+=g;r.n++;r.list.push({t:t,g:g});
  });
  Object.keys(by).forEach(function(k){by[k].list.sort(function(a,b){return b.g-a.g;});});
  return by;
}
function heroMax(key,sums){var s=sums[key];return n0(HERO_START[key])+(s?s.sum:0);}

/* ══ ПРЕДМЕТИ: зведення по каталогу ══════════════════════════ */
function collect(items){
  var map={},flags={};
  function slot(key,raw){
    if(!map[key])map[key]={key:key,names:{},items:[],asMain:0,asAdd:0,flatMin:null,flatMax:null,pctMin:null,pctMax:null,cats:{}};
    map[key].names[raw]=1;return map[key];
  }
  function range(r,lo,hi,pct){
    if(pct){r.pctMin=r.pctMin==null?lo:Math.min(r.pctMin,lo);r.pctMax=r.pctMax==null?hi:Math.max(r.pctMax,hi);}
    else{r.flatMin=r.flatMin==null?lo:Math.min(r.flatMin,lo);r.flatMax=r.flatMax==null?hi:Math.max(r.flatMax,hi);}
  }
  (items||[]).forEach(function(it){
    var on=it.active!==false;
    if(it.stat){
      var r=slot(SKIT.canon(it.stat),it.stat);r.asMain++;r.cats[it.category||'—']=1;
      var lo=it.valueMin!=null?Number(it.valueMin):Number(it.valueMax),hi=it.valueMax!=null?Number(it.valueMax):lo;
      if(!isNaN(lo))range(r,lo,isNaN(hi)?lo:hi,false);
      r.items.push({id:it.id,name:it.name,how:'основна',val:fmtRange(it.valueMin,it.valueMax),on:on});
    }
    (it.addStats||[]).forEach(function(e){
      if(SKIT.isFlagEntry(e)){(flags[e.stat]=flags[e.stat]||[]).push(it);return;}
      var r2=slot(SKIT.canon(e.stat),e.stat);r2.asAdd++;r2.cats[it.category||'—']=1;
      var v=e.value!=null?Number(e.value):null;
      if(v!=null&&!isNaN(v))range(r2,v,v,!!e.pct);
      r2.items.push({id:it.id,name:it.name,how:'додаткова',val:(v!=null?'+'+v+(e.pct?'%':''):'—'),on:on});
    });
  });
  var out=Object.keys(map).map(function(k){return map[k];});
  out.sort(function(a,b){return (b.asMain+b.asAdd)-(a.asMain+a.asAdd)||label(a.key).localeCompare(label(b.key),'uk');});
  return {stats:out,flags:flags};
}

/* ══ ПРЕДМЕТИ: максимум у 12 слотах ══════════════════════════
   Для кожної характеристики окремо: у кожному слоті — річ, що дає її
   найбільше. Сталі числа й відсотки рахуються незалежно (найкращий набір
   на «+N» і найкращий на «+N%» можуть бути різними речами). Кільця можуть
   повторювати ту саму річ — у героя може бути два її екземпляри.
   Руки — за правилами бою (sk-arena-rules.js): права — зброя, ліва — щит
   (друга зброя лише з BATTLE.dualWield); дворучна займає обидві руки.
   Лише активні предмети (вимкнені дитина отримати не може).
   bonus — коефіцієнт речі (1 — база, 1.2 — усі речі з бонусом +20%). */
function isTwoHanded(it){return (it.addStats||[]).some(function(e){return SKIT.isFlagEntry(e)&&e.stat==='Дворучний';});}
function giveOf(it,key,pct,bonus){
  var eff=SKIT.effective(it,{bonus:bonus});var v=0;
  if(!pct&&eff.stat&&eff.valueMax!=null&&SKIT.canon(eff.stat)===key)v+=n0(eff.valueMax);
  eff.addStats.forEach(function(e){if(e.flag||e.value==null)return;if(!!e.pct===pct&&SKIT.canon(e.stat)===key)v+=n0(e.value);});
  return v;
}
function bestSet(items,key,pct,bonus){
  var act=(items||[]).filter(function(it){return it.active!==false&&!it.consumable;});
  var picks=[],total=0;
  function best(list){var b=null,bv=0;list.forEach(function(it){var v=giveOf(it,key,pct,bonus);if(v>bv){bv=v;b=it;}});return b?{it:b,v:bv}:null;}
  SLOTS.forEach(function(s){
    var b=best(act.filter(function(it){return it.category===s.cat;}));
    if(!b)return;
    for(var i=0;i<s.n;i++){picks.push({slot:s.label+(s.n>1?' '+(i+1):''),it:b.it,v:b.v});total+=b.v;}
  });
  var dual=!!(window.SKARENA&&SKARENA.BATTLE.dualWield);
  var weap=act.filter(function(it){return it.category==='Зброя';});
  var one=best(weap.filter(function(it){return !isTwoHanded(it);}));
  var left=best(act.filter(function(it){return it.category==='Щити'||(dual&&it.category==='Зброя'&&!isTwoHanded(it));}));
  var two=best(weap.filter(isTwoHanded));
  var oneSum=(one?one.v:0)+(left?left.v:0),twoSum=two?two.v:0;
  if(twoSum>oneSum&&two){picks.push({slot:'Обидві руки (дворучна)',it:two.it,v:two.v});total+=two.v;}
  else{if(one)picks.push({slot:'Права рука',it:one.it,v:one.v});if(left)picks.push({slot:'Ліва рука',it:left.it,v:left.v});total+=oneSum;}
  return {total:total,picks:picks};
}

/* ══ ПЕРЕВІРКА АТРИБУТА ══════════════════════════════════════
   Чи справді атрибут діє в бою: вдягаємо на тестового Героя одну річ із
   цим атрибутом (+10 або +10%) і порівнюємо бойовий профіль (SKARENA.fighter)
   з профілем без речі. Що змінилось — те й робить атрибут. Нічого — «поки не задіяно».
   Для «Урон» / «Магічний урон» додатково — як головна характеристика зброї в руці. */
var PROFILE_UK={hp:'витривалість',accuracy:'точність',agility:'спритність',armor:'броня',magicResist:'маг. захист',
  wMin:'урон зброї від',wMax:'урон зброї до',magMin:'маг. урон зброї від',magMax:'маг. урон зброї до',
  dmgFlat:'урон удару (фізичного)',magFlat:'урон удару (магічного)',dmgPct:'% урону (фізичного)',magPct:'% урону (магічного)',critPct:'шанс криту, %',extra:'ударів за хід'};
var TEST_STATS={health:50,accuracy:50,agility:50,mana:20};
function rawNameFor(key){
  var m=(window.SKIT&&SKIT.STAT_MAP)||{};for(var k in m)if(m[k]===key)return k;return key;
}
function liveCheck(key,pct,raw){
  if(!window.SKARENA||!SKARENA.fighter||!window.SKIT)return null;
  var name=raw||rawNameFor(key);
  /* для % — спершу річ із +10 того ж атрибута (кільце): відсоток множить суму Героя й речей,
     тож без неї «Броня %» на Герої з бронею 0 нічого б не показала */
  var basis=pct?[{base:{id:'BASIS',category:'Кільце',name:'база',addStats:[{stat:name,value:10,pct:false}]},inst:{slot:'ring1',bonus:1}}]:[];
  function diff(eq){
    var a=SKARENA.fighter(TEST_STATS,basis,SKIT),b=SKARENA.fighter(TEST_STATS,basis.concat(eq),SKIT),out=[];
    Object.keys(b).forEach(function(f){var d=Math.round((b[f]-(a[f]||0))*100)/100;if(d)out.push((PROFILE_UK[f]||f)+' '+(d>0?'+':'')+d);});
    return out;
  }
  var r=diff([{base:{id:'TEST',category:'Амулет',name:'тест',addStats:[{stat:name,value:10,pct:!!pct}]},inst:{slot:'amulet',bonus:1}}]);
  if(!pct&&(key==='damage'||key==='magicDamage')){
    var w=diff([{base:{id:'TESTW',category:'Зброя',name:'тест',stat:name,valueMin:5,valueMax:10,addStats:[]},inst:{slot:'weaponR',bonus:1}}]);
    if(w.length)r.push('у зброї 5–10 → '+w.join(', '));
  }
  return r;
}
function checkCell(key,pct,raw,cons){
  var info=arenaInfo(key,pct,cons);
  if(!info.used)return NOT_USED;
  var txt='<span class="tag yes">діє на арені</span> <span class="key">'+esc(info.text||'')+'</span>';
  if(cons)return txt+'<br><span class="key">разова річ — у бою з пояса (див. «Разові речі» нижче)</span>';
  var r=liveCheck(key,pct,raw);
  if(r&&r.length)txt+='<br><span class="key">перевірка: +10'+(pct?'% (поверх +10 з речі)':'')+' → '+esc(r.join('; '))+'</span>';
  return txt;
}

/* усі атрибути, що є на речах: ключ + звичайне/%; плюс бойові з SKARENA.COMBAT_STATS (база 0) */
function itemAttrs(){
  var map={},order=[];
  function add(key,pct,raw,cons){var id=key+(pct?'%':'');if(!map[id]){map[id]={key:key,pct:!!pct,raw:raw,n:0,nItem:0};order.push(id);}
    map[id].n++;if(!cons)map[id].nItem++;if(!map[id].raw)map[id].raw=raw;}
  ((window.SKARENA&&SKARENA.COMBAT_STATS)||[]).forEach(function(c){add(c.key,false,null);map[c.key].n--;map[c.key].nItem--;});
  (ITEMS||[]).forEach(function(it){
    var c=!!it.consumable;
    if(it.stat)add(SKIT.canon(it.stat),false,it.stat,c);
    (it.addStats||[]).forEach(function(e){if(SKIT.isFlagEntry(e))return;add(SKIT.canon(e.stat),!!e.pct,e.stat,c);});
  });
  /* лише на зіллях / свитках — атрибут працює як разовий ефект з пояса */
  order.forEach(function(id){var a=map[id];a.cons=a.n>0&&a.nItem<=0;});
  return order.map(function(id){return map[id];});
}

/* ══ ПЛАН: вміння арени, теми й питання (sk-skills.js + arenaPlan/{id}) ══
   Дизайн-дані — у sk-skills.js. У базі (arenaPlan) лише робоче: статус,
   коментар, кроки теми й змінені тексти вміння (text — перекриває стандартні). */
var PLAN={},PLAN_LOADED=false,PLAN_LOADING=false,PLAN_ERR=null;
var PF={cls:'all',st:'all',q:'',notes:false};
var POPEN={},PDRAFT={};
var ST_KEYS=['todo','doing','done'];
var ST_UK={skill:{todo:'Не почато',doing:'В роботі',done:'Готово'},
  topic:{todo:'Не почато',doing:'В роботі',done:'Готово'},
  q:{todo:'Відкрите',doing:'Обговорюємо',done:'Вирішено'}};
var TY_UK={A:'Активне',P:'Пасивне',U:'Ультимейт'};

function loadPlan(){
  if(PLAN_LOADING)return;PLAN_LOADING=true;
  var p=(window.SK&&SK.listArenaPlan)?SK.listArenaPlan():Promise.reject(new Error('no-api'));
  p.then(function(l){PLAN={};(l||[]).forEach(function(d){PLAN[d.id]=d;});PLAN_ERR=null;},
         function(e){PLAN={};PLAN_ERR=(e&&(e.code||e.message))||String(e);})
   .then(function(){PLAN_LOADED=true;PLAN_LOADING=false;if(TAB==='plan'||TAB==='skmech')render();});
}
function pdoc(id){return PLAN[id]||{};}
function pstat(id){var s=pdoc(id).status;return ST_KEYS.indexOf(s)>=0?s:'todo';}
function ptext(sk,f){var t=pdoc(sk.id).text;return (t&&t[f]!=null)?t[f]:sk[f];}
function pedited(sk){var t=pdoc(sk.id).text;return !!(t&&(t.desc!=null||t.formula!=null||t.kid!=null));}
function pwhen(d){
  var t=d&&d.updatedAt;if(!t)return '';
  var dt=t.toDate?t.toDate():(t instanceof Date?t:null);if(!dt)return '';
  return dt.toLocaleDateString('uk-UA')+' '+dt.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})+(d.updatedBy?' · '+d.updatedBy:'');
}
function pval(fid,def){return PDRAFT.hasOwnProperty(fid)?PDRAFT[fid]:(def==null?'':def);}
function stBtn(id,kind){var s=pstat(id);
  return '<button type="button" class="stbtn st-'+s+'" data-act="cycle" data-id="'+esc(id)+'" data-kind="'+kind+'" title="Змінити статус">'+ST_UK[kind][s]+'</button>';}

function planCounts(){
  var c={todo:0,doing:0,done:0},all=SKSKILLS.SKILLS.concat(SKSKILLS.TOPICS);
  all.forEach(function(x){c[pstat(x.id)]++;});c.total=all.length;return c;
}
function skillMatch(sk){
  if(PF.cls!=='all'&&sk.cls!==PF.cls)return false;
  if(PF.st!=='all'&&pstat(sk.id)!==PF.st)return false;
  if(PF.notes&&!(pdoc(sk.id).comment||pedited(sk)))return false;
  if(PF.q){var q=PF.q.toLowerCase();
    if((sk.name+' '+ptext(sk,'desc')+' '+ptext(sk,'kid')).toLowerCase().indexOf(q)<0)return false;}
  return true;
}
function detForm(id,fields,commentLabel){
  var d=pdoc(id);
  return '<div class="pl-form">'+fields.map(function(f){
      var fid='pf-'+f.k+'-'+id;
      return '<label for="'+esc(fid)+'">'+f.l+'</label><textarea id="'+esc(fid)+'" data-fid="'+esc(fid)+'" rows="'+(f.r||2)+'">'+esc(pval(fid,f.v))+'</textarea>';
    }).join('')
    +'<label for="pf-comment-'+esc(id)+'">'+commentLabel+'</label><textarea id="pf-comment-'+esc(id)+'" data-fid="pf-comment-'+esc(id)+'" rows="2" placeholder="Що змінити, уточнити, з чого почати…">'+esc(pval('pf-comment-'+id,d.comment))+'</textarea>'
    +'<div class="pl-acts"><button type="button" class="btn-save" data-act="save" data-id="'+esc(id)+'">💾 Зберегти</button>'
    +(fields.length?'<button type="button" class="btn-ghost" data-act="reset" data-id="'+esc(id)+'" title="Повернути тексти з sk-skills.js">↺ Стандартні тексти</button>':'')
    +'<span class="pl-msg" id="pm-'+esc(id)+'">'+esc(pwhen(d))+'</span></div></div>';
}
function skillRows(cls){
  var list=SKSKILLS.forClass(cls).filter(skillMatch);
  if(!list.length)return '';
  var c=SKSKILLS.CLASSES[cls];
  var rows=list.map(function(sk){
    var d=pdoc(sk.id),open=!!POPEN[sk.id];
    var badges=(sk.shared?'<span class="tag">спільне</span>':'')+(pedited(sk)?'<span class="tag item">✎ змінено</span>':'')+(d.comment?'<span class="tag pct">💬</span>':'');
    var r='<tr class="pl-row" id="pr-'+esc(sk.id)+'"><td class="pl-lv">'+(sk.lv===1?'<span class="pl-start">'+sk.start+'%</span>':sk.lv)+'</td>'
      +'<td><span class="nm">'+esc(sk.name)+'</span> <span class="pl-badges">'+badges+'</span><div class="pl-kid">'+esc(ptext(sk,'kid'))+'</div></td>'
      +'<td><span class="tag ty-'+sk.type+'">'+TY_UK[sk.type]+'</span></td>'
      +'<td class="pl-cost">'+esc(sk.cost||'—')+'</td>'
      +'<td>'+stBtn(sk.id,'skill')+'</td>'
      +'<td><button type="button" class="btn-ghost" data-act="open" data-id="'+esc(sk.id)+'" aria-expanded="'+open+'">'+(open?'▾ Згорнути':'▸ Деталі')+'</button></td></tr>';
    if(open)r+='<tr class="pl-det"><td colspan="6"><div class="pl-src">Звідки: '+esc(sk.src==='★'?'★ власна ідея':sk.src)+' · ключ <span class="key">'+esc(sk.id)+'</span></div>'
      +detForm(sk.id,[{k:'desc',l:'Опис (для адміна)',v:ptext(sk,'desc')},{k:'formula',l:'Формула: як працює (м — майстерність 0…1, K — концентрація)',v:ptext(sk,'formula')},{k:'kid',l:'Підказка для дітей (без чисел)',v:ptext(sk,'kid')}],'Коментар / завдання')+'</td></tr>';
    return r;
  }).join('');
  return '<section class="sec pl-cls"><h2>'+c.icon+' '+esc(c.name)+'</h2><p class="hint">'+esc(c.about)+' Концентрація: «'+esc(c.conc)+'». Число в першій колонці — рівень; на 1 рівні — стартова майстерність.</p>'
    +'<div class="tblwrap"><table class="st pl-tbl"><thead><tr><th>Рів.</th><th>Вміння</th><th>Тип</th><th>'+(c.res==='мана'?'Мана / перезар.':'Перезарядка')+'</th><th>Статус</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
function topicsHTML(){
  if(PF.cls!=='all')return '';
  var cards=SKSKILLS.TOPICS.filter(function(t){return PF.st==='all'||pstat(t.id)===PF.st;}).map(function(t){
    var d=pdoc(t.id),steps=d.steps||[],done=0;
    var li=t.steps.map(function(s,i){var on=!!steps[i];if(on)done++;var cid='ps-'+t.id+'-'+i;
      return '<li><input type="checkbox" id="'+esc(cid)+'" data-act="step" data-id="'+esc(t.id)+'" data-i="'+i+'"'+(on?' checked':'')+'><label for="'+esc(cid)+'">'+esc(s)+'</label></li>';}).join('');
    var open=!!POPEN[t.id];
    return '<div class="pl-topic" id="pr-'+esc(t.id)+'"><div class="pl-th"><b>'+esc(t.title)+'</b>'+stBtn(t.id,'topic')+'</div>'
      +'<p class="hint">'+esc(t.about)+'</p><div class="pl-prog"><span style="width:'+Math.round(done/t.steps.length*100)+'%"></span></div>'
      +'<ul class="pl-steps">'+li+'</ul>'
      +(d.comment&&!open?'<p class="pl-note">💬 '+esc(d.comment)+'</p>':'')
      +'<button type="button" class="btn-ghost" data-act="open" data-id="'+esc(t.id)+'" aria-expanded="'+open+'">'+(open?'▾ Згорнути':'💬 Коментар')+'</button>'
      +(open?detForm(t.id,[],'Коментар / завдання'):'')+'</div>';
  }).join('');
  return cards?'<section class="sec"><h2>🧩 Теми впровадження</h2><p class="hint">Кожна тема — маленький план. Відмічай кроки, пиши коментар-завдання, і я беру тему в роботу.</p><div class="pl-topics">'+cards+'</div></section>':'';
}
function questionsHTML(){
  if(PF.cls!=='all')return '';
  var groups={};SKSKILLS.QUESTIONS.forEach(function(q){(groups[q.group]=groups[q.group]||[]).push(q);});
  var html=Object.keys(groups).map(function(g){
    return '<h3 class="pl-qg">'+esc(g)+'</h3>'+groups[g].map(function(q){
      var d=pdoc(q.id),open=!!POPEN[q.id];
      return '<div class="pl-q" id="pr-'+esc(q.id)+'"><span class="pl-qn">'+q.n+'</span><div class="pl-qt">'+esc(q.text)
        +(d.comment&&!open?'<div class="pl-note">💬 '+esc(d.comment)+'</div>':'')+(open?detForm(q.id,[],'Відповідь / рішення'):'')+'</div>'
        +'<div class="pl-qa">'+stBtn(q.id,'q')+'<button type="button" class="btn-ghost" data-act="open" data-id="'+esc(q.id)+'" aria-expanded="'+open+'">'+(open?'▾':'💬')+'</button></div></div>';
    }).join('');
  }).join('');
  return '<section class="sec"><h2>❓ Питання, що чекають рішення</h2><p class="hint">Відповідь пиши в коментар — я прочитаю її звідси.</p>'+html+'</section>';
}
function planListHTML(){
  var cls=PF.cls==='all'?Object.keys(SKSKILLS.CLASSES):[PF.cls];
  var sk=cls.map(skillRows).join('');
  return topicsHTML()+(sk||'<section class="sec"><p class="hint" style="margin:0">Жодне вміння не підходить під фільтр.</p></section>')+questionsHTML();
}
function planHTML(){
  if(!window.SKSKILLS)return '<section class="sec"><p class="hint">Не завантажився sk-skills.js.</p></section>';
  if(!PLAN_LOADED){loadPlan();return '<div class="empty">Завантаження плану…</div>';}
  var c=planCounts();
  var err=PLAN_ERR?'<section class="sec pl-err"><h2>⚠ План не читається з бази</h2><p class="hint">Помилка: '+esc(PLAN_ERR)+'. Найімовірніше, в консолі Firebase ще не опубліковані правила з колекцією <span class="key">arenaPlan</span>. Опублікуй firestore.rules повним файлом. До того видно стандартні тексти, але зберегти зміни не вийде.</p></section>':'';
  function chip(v,l){return '<button type="button" class="tab'+(PF.cls===v?' on':'')+'" data-act="fcls" data-v="'+v+'">'+l+'</button>';}
  var cls=chip('all','Усі класи')+Object.keys(SKSKILLS.CLASSES).map(function(k){var x=SKSKILLS.CLASSES[k];return chip(k,x.icon+' '+x.name);}).join('');
  return err
    +'<section class="sec"><h2>📋 План арени</h2><p class="hint">Вміння 4 класів, теми впровадження й питання. Статус змінюється кліком, коментарі й тексти — у «Деталях». Усе зберігається в базі (arenaPlan).</p>'
    +'<div class="pl-sum"><div><b>'+c.done+'</b> готово</div><div><b>'+c.doing+'</b> в роботі</div><div><b>'+c.todo+'</b> не почато</div><div class="pl-bar"><span class="d" style="width:'+(c.done/c.total*100)+'%"></span><span class="w" style="width:'+(c.doing/c.total*100)+'%"></span></div></div>'
    +'<div class="tabs pl-f">'+cls+'</div>'
    +'<div class="pl-f2"><label for="pfSt">Статус</label><select id="pfSt" data-act="fst"><option value="all">усі</option>'+ST_KEYS.map(function(k){return '<option value="'+k+'"'+(PF.st===k?' selected':'')+'>'+ST_UK.skill[k]+'</option>';}).join('')+'</select>'
    +'<input type="search" id="pfQ" placeholder="Пошук вміння…" value="'+esc(PF.q)+'" data-act="fq">'
    +'<label class="pl-chk"><input type="checkbox" id="pfNotes" data-act="fnotes"'+(PF.notes?' checked':'')+'> лише з коментарем або змінами</label></div></section>'
    +'<div id="plList">'+planListHTML()+'</div>';
}
function planRefreshList(){if(TAB==='skmech'){render();return;}var el=document.getElementById('plList');if(el)el.innerHTML=planListHTML();}
function planSave(id,patch,msgEl){
  if(msgEl)msgEl.textContent='Зберігаю…';
  return SK.saveArenaPlan(id,patch).then(function(){
    var d=PLAN[id]=PLAN[id]||{id:id};
    Object.keys(patch).forEach(function(k){if(k==='text'&&patch.text){d.text=Object.assign({},d.text||{},patch.text);}else d[k]=patch[k];});
    d.updatedAt=new Date();d.updatedBy=(SK.getCurrentUser&&SK.getCurrentUser()&&SK.getCurrentUser().email)||d.updatedBy;
    return true;
  },function(e){
    var m='Не збережено: '+((e&&(e.code||e.message))||e);
    if(msgEl)msgEl.textContent=m;else window.SKADMIN&&SKADMIN.toast?SKADMIN.toast(m):console.warn(m);
    return false;
  });
}
var planBound=false;
function bindPlan(){
  if(planBound)return;planBound=true;
  root.addEventListener('input',function(e){
    var t=e.target;if(TAB!=='plan'&&TAB!=='skmech')return;
    if(t.dataset&&t.dataset.fid){PDRAFT[t.dataset.fid]=t.value;return;}
    if(TAB!=='plan')return;
    if(t.id==='pfQ'){PF.q=t.value.trim();planRefreshList();}
  });
  root.addEventListener('change',function(e){
    var t=e.target;if(TAB!=='plan')return;
    if(t.id==='pfSt'){PF.st=t.value;planRefreshList();}
    else if(t.id==='pfNotes'){PF.notes=t.checked;planRefreshList();}
    else if(t.dataset&&t.dataset.act==='step'){
      var id=t.dataset.id,i=+t.dataset.i,tp=null;SKSKILLS.TOPICS.forEach(function(x){if(x.id===id)tp=x;});
      var steps=(pdoc(id).steps||[]).slice();while(steps.length<tp.steps.length)steps.push(false);steps[i]=t.checked;
      planSave(id,{steps:steps}).then(function(ok){if(!ok)t.checked=!t.checked;planRefreshList();});
    }
  });
  root.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b||(TAB!=='plan'&&TAB!=='skmech')||b.tagName==='INPUT'||b.tagName==='SELECT')return;
    var act=b.dataset.act,id=b.dataset.id;
    if(act==='fcls'){PF.cls=b.dataset.v;render();return;}
    if(act==='open'){POPEN[id]=!POPEN[id];planRefreshList();
      var box=document.getElementById('pr-'+id);if(box&&POPEN[id]){var ta=box.querySelector('textarea')||(box.nextElementSibling&&box.nextElementSibling.querySelector('textarea'));if(ta)ta.focus({preventScroll:true});}return;}
    if(act==='cycle'){
      var s=pstat(id),n=ST_KEYS[(ST_KEYS.indexOf(s)+1)%ST_KEYS.length],kind=b.dataset.kind;
      b.disabled=true;
      planSave(id,{status:n}).then(function(ok){b.disabled=false;if(ok){b.className='stbtn st-'+n;b.textContent=ST_UK[kind][n];
        var top=document.querySelector('.pl-sum');if(top){var c=planCounts(),bs=top.querySelectorAll('b');bs[0].textContent=c.done;bs[1].textContent=c.doing;bs[2].textContent=c.todo;
          var sp=top.querySelectorAll('.pl-bar span');sp[0].style.width=(c.done/c.total*100)+'%';sp[1].style.width=(c.doing/c.total*100)+'%';}}});
      return;
    }
    if(act==='save'||act==='reset'){
      var msg=document.getElementById('pm-'+id),sk=SKSKILLS.byId(id),patch={};
      var cf='pf-comment-'+id,cel=document.getElementById(cf);
      patch.comment=cel?cel.value.trim():(pdoc(id).comment||'');
      if(sk){
        if(act==='reset'){patch.text=null;['desc','formula','kid'].forEach(function(f){delete PDRAFT['pf-'+f+'-'+id];});}
        else{var tx={},diff=false;['desc','formula','kid'].forEach(function(f){var el=document.getElementById('pf-'+f+'-'+id);var v=el?el.value.trim():ptext(sk,f);
            if(v!==sk[f]){tx[f]=v;diff=true;}else tx[f]=null;});
          patch.text=diff?tx:null;}
      }
      b.disabled=true;
      planSave(id,patch,msg).then(function(ok){b.disabled=false;if(!ok)return;
        if(patch.text===null&&PLAN[id])PLAN[id].text=null;
        Object.keys(PDRAFT).forEach(function(k){if(k.slice(-id.length-1)==='-'+id)delete PDRAFT[k];});
        planRefreshList();var m=document.getElementById('pm-'+id);if(m)m.textContent='✓ Збережено · '+pwhen(pdoc(id));});
    }
  });
}

/* ══ МЕХАНІКА ВМІНЬ: що дає майстерність 25…100% (sk-skills.js → UNIVERSAL) ══
   Стандартні рядки — у sk-skills.js (mech). Змінені рядки й коментар —
   у arenaPlan/mech.<id> (та сама колекція й правило, що й «План»). */
var SKM_WORK={},SKM_DIRTY={};
function skmDocId(sk){return 'mech.'+sk.id;}
function skmRows(sk){
  if(SKM_WORK[sk.id])return SKM_WORK[sk.id];
  var d=pdoc(skmDocId(sk)),src=(d.rows&&d.rows.length)?d.rows.map(function(r){return [r.k,r.v];}):sk.mech;
  return (SKM_WORK[sk.id]=src.map(function(r){return [r[0],r[1]];}));
}
function skmEdited(sk){var d=pdoc(skmDocId(sk));return !!(d.rows&&d.rows.length);}
function skmCard(sk){
  var id=skmDocId(sk),d=pdoc(id),rows=skmRows(sk),open=!!POPEN[id];
  var tr=rows.map(function(r,i){
    var fk='skm-k-'+sk.id+'-'+i,fv='skm-v-'+sk.id+'-'+i;
    return '<tr><td><input type="text" id="'+esc(fk)+'" data-skm="'+esc(sk.id)+'" data-i="'+i+'" data-f="0" value="'+esc(r[0])+'" aria-label="Параметр"></td>'
      +'<td><textarea id="'+esc(fv)+'" data-skm="'+esc(sk.id)+'" data-i="'+i+'" data-f="1" rows="1" aria-label="Значення">'+esc(r[1])+'</textarea></td>'
      +'<td><button type="button" class="btn-ghost" data-skact="del" data-sk="'+esc(sk.id)+'" data-i="'+i+'" title="Прибрати рядок">🗑</button></td></tr>';
  }).join('');
  return '<div class="skm-card" id="skm-'+esc(sk.id)+'">'
    +'<div class="skm-h"><span class="skm-ic">'+sk.icon+'</span><div><b>'+esc(sk.name)+'</b>'
    +' <span class="tag ty-'+sk.type+'">'+TY_UK[sk.type]+'</span>'+(sk.cost?' <span class="tag">'+esc(sk.cost)+'</span>':'')
    +(skmEdited(sk)?' <span class="tag item">✎ змінено</span>':'')+(d.comment?' <span class="tag pct">💬</span>':'')
    +'<div class="pl-kid">🧒 '+esc(sk.kid)+'</div></div></div>'
    +'<div class="tblwrap"><table class="st skm-tbl"><thead><tr><th>Параметр</th><th>Значення / як працює</th><th></th></tr></thead><tbody>'+tr+'</tbody></table></div>'
    +'<div class="pl-acts"><button type="button" class="btn-ghost" data-skact="add" data-sk="'+esc(sk.id)+'">＋ рядок</button>'
    +'<button type="button" class="btn-save" data-skact="save" data-sk="'+esc(sk.id)+'">💾 Зберегти</button>'
    +'<button type="button" class="btn-ghost" data-skact="reset" data-sk="'+esc(sk.id)+'" title="Повернути рядки з sk-skills.js">↺ Стандартні</button>'
    +'<button type="button" class="btn-ghost" data-act="open" data-id="'+esc(id)+'" aria-expanded="'+open+'">💬 Коментар</button>'
    +'<span class="pl-msg" id="skmm-'+esc(sk.id)+'">'+(SKM_DIRTY[sk.id]?'● не збережено':esc(pwhen(d)))+'</span></div>'
    +(d.comment&&!open?'<p class="pl-note">💬 '+esc(d.comment)+'</p>':'')
    +(open?detForm(id,[],'Коментар / завдання'):'')
    +'</div>';
}
function skmHTML(){
  if(!window.SKSKILLS||!SKSKILLS.UNIVERSAL)return '<section class="sec"><p class="hint">Не завантажився sk-skills.js.</p></section>';
  if(!PLAN_LOADED){loadPlan();return '<div class="empty">Завантаження…</div>';}
  var err=PLAN_ERR?'<section class="sec pl-err"><h2>⚠ Не читається з бази</h2><p class="hint">Помилка: '+esc(PLAN_ERR)+'. Опублікуй firestore.rules (колекція <span class="key">arenaPlan</span>) у консолі Firebase. До того видно стандартні рядки, але зберегти зміни не вийде.</p></section>':'';
  var pts=[1,2,3,4,5,7,9].map(function(l){return l+' рів. → '+SKSKILLS.pointsForLevel(l);}).join(' · ');
  var lv={1:'Рівень 1 · перший бій',2:'Рівень 2 · магія й оборона',3:'Рівень 3 · майстерність (і вибір класу)'};
  var body=[1,2,3].map(function(l){
    var cards=SKSKILLS.UNIVERSAL.filter(function(s){return s.lv===l;}).map(skmCard).join('');
    return '<section class="sec"><h2>'+esc(lv[l])+'</h2><div class="skm-grid">'+cards+'</div></section>';
  }).join('');
  return err+'<section class="sec"><h2>🧠 Механіка вмінь</h2><p class="hint">Що дає майстерність кожного вміння — для балансу. «м» = майстерність / 100. Рядки можна змінити, додати чи прибрати; «💾 Зберегти» пише в базу, «↺ Стандартні» повертає рядки з sk-skills.js.</p>'
    +'<ul class="exl"><li>Вміння <b>вивчають за очко</b>: після вивчення — <b>'+SKSKILLS.LEARN_START+'%</b>, далі росте в бою (і від невдалих спроб).</li>'
    +'<li>Очки за рівні арени: по 1 на рівнях 1–4, далі по 1 кожні два. Разом: '+esc(pts)+'. Плюс очки за позначені тести.</li>'
    +'<li>Клас обирається на <b>'+SKSKILLS.CLASS_LEVEL+' рівні</b>.</li></ul></section>'+body;
}
var skmBound=false;
function bindSkm(){
  if(skmBound)return;skmBound=true;
  root.addEventListener('input',function(e){
    var t=e.target;if(TAB!=='skmech'||!t.dataset||!t.dataset.skm)return;
    var sk=null;SKSKILLS.UNIVERSAL.forEach(function(x){if(x.id===t.dataset.skm)sk=x;});if(!sk)return;
    skmRows(sk)[+t.dataset.i][+t.dataset.f]=t.value;SKM_DIRTY[sk.id]=true;
    var m=document.getElementById('skmm-'+sk.id);if(m)m.textContent='● не збережено';
  });
  root.addEventListener('click',function(e){
    var b=e.target.closest('[data-skact]');if(!b||TAB!=='skmech')return;
    var sk=null;SKSKILLS.UNIVERSAL.forEach(function(x){if(x.id===b.dataset.sk)sk=x;});if(!sk)return;
    var act=b.dataset.skact,rows=skmRows(sk),card=function(){var el=document.getElementById('skm-'+sk.id);if(el)el.outerHTML=skmCard(sk);};
    if(act==='add'){rows.push(['','']);SKM_DIRTY[sk.id]=true;card();var n=document.getElementById('skm-k-'+sk.id+'-'+(rows.length-1));if(n)n.focus();return;}
    if(act==='del'){rows.splice(+b.dataset.i,1);SKM_DIRTY[sk.id]=true;card();return;}
    var id=skmDocId(sk),msg=document.getElementById('skmm-'+sk.id),patch;
    if(act==='save'){
      var clean=rows.map(function(r){return {k:String(r[0]||'').trim(),v:String(r[1]||'').trim()};}).filter(function(r){return r.k||r.v;});
      patch={rows:clean};
    } else if(act==='reset'){patch={rows:null};}
    else return;
    b.disabled=true;
    planSave(id,patch,msg).then(function(ok){
      b.disabled=false;if(!ok)return;
      if(PLAN[id]&&patch.rows===null)PLAN[id].rows=null;
      delete SKM_WORK[sk.id];delete SKM_DIRTY[sk.id];card();
      var m=document.getElementById('skmm-'+sk.id);if(m)m.textContent='✓ Збережено · '+pwhen(pdoc(id));
    });
  });
}

function render(){
  root.innerHTML='<h1>⚔️ Арена · характеристики</h1>'
    +'<p class="sub">Які характеристики є в Героя і що до них можна додати предметами.</p>'
    +tabsHTML()+(TAB==='items'?itemsHTML():TAB==='mech'?mechHTML():TAB==='plan'?planHTML():TAB==='skmech'?skmHTML():heroHTML());
  root.querySelectorAll('.tab[data-tab]').forEach(function(b){b.onclick=function(){
    TAB=b.getAttribute('data-tab');try{history.replaceState(null,'','#'+TAB);}catch(e){}render();};});
  bindPlan();bindSkm();
}

function load(){
  root.innerHTML='<div class="empty">Завантаження…</div>';
  PLAN_LOADED=false;
  function why(e){return (e&&(e.code||e.message))||String(e);}
  var pI=window.SK.listItems().then(function(l){ITEMS=l||[];ITEMS_ERR=null;},function(e){ITEMS=[];ITEMS_ERR=why(e);});
  var pT=(window.SK.listTests?window.SK.listTests():Promise.resolve([])).then(function(l){TESTS=l||[];TESTS_ERR=null;},function(e){TESTS=[];TESTS_ERR=why(e);});
  Promise.all([pI,pT]).then(render);
}

SKADMIN.header({
  name:'Арена',
  sub:'School Kingdom · характеристики',
  nav:[ { href:'admin.html', label:'🏠 Головна (Адмінка)' },
        { href:'admin-items.html', label:'🎒 Items' },
        { id:'btnReload', label:'🔄 Оновити' } ]
});
SKADMIN.guard({
  denyMsg:'Увійди адміністратором, щоб переглядати характеристики.',
  onOk:function(){
    var rl=document.getElementById('btnReload');if(rl)rl.onclick=load;
    load();
  }
});
})();
