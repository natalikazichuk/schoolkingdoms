<style>
  *{-webkit-tap-highlight-color:transparent}
  body{line-height:1.5}
  #wrap{padding:0 0 80px;max-width:1280px}
  .wrap-in{max-width:1280px;margin:0 auto;padding:16px 16px 0}
  #root>h1{color:var(--ink);font-size:1.5rem}
  #root>.sub{color:var(--muted);font-weight:600;font-size:.92rem;margin:6px 0 18px}

  .sec{background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:16px 16px 12px;box-shadow:var(--shadow);margin:0 0 18px}
  .sec h2{color:var(--ink);font-size:1.15rem;margin:0 0 4px}
  .sec .hint{color:var(--muted);font-weight:600;font-size:.86rem;margin:0 0 12px}

  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.st{width:100%;border-collapse:collapse;font-size:.9rem;color:var(--ink)}
  table.st th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.03em;
    color:var(--muted);font-weight:800;padding:6px 8px;border-bottom:2px solid var(--border);white-space:nowrap}
  table.st td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
  table.st tr.off td{opacity:.55}
  td.num{font-weight:800;white-space:nowrap;min-width:110px}
  td.num details.its ul{white-space:normal;font-weight:600;min-width:220px}
  td.num .key{white-space:normal}
  .nm{font-weight:800;white-space:nowrap}
  .key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.76rem;color:var(--muted)}

  .tag{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;
    border:1px solid var(--border);background:#f4f1e8;color:var(--muted);white-space:nowrap;margin:1px 2px 1px 0}
  .tag.yes{background:#e8f6ee;color:#1f7a4d;border-color:#bde2ce}
  .tag.no{background:#f4f1e8;color:var(--muted)}
  .tag.item{background:#f3edfc;color:#6b3fa0;border-color:#d9c9ef}
  .tag.warn{background:#fdecec;color:#a8322f;border-color:#efc2c0}
  .tag.pct{background:#eaf1fb;color:#2f5ea8;border-color:#c2d4ef}

  details.its summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:.84rem}
  details.its ul{margin:6px 0 2px;padding-left:18px;font-size:.82rem;color:var(--ink)}
  details.its li{margin:1px 0}

  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);font-weight:600;margin:10px 0 0}
  .flags{margin:12px 0 0;font-size:.86rem;color:var(--ink)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .tab{font-family:inherit;font-weight:800;font-size:.9rem;cursor:pointer;background:var(--card);border:2px solid var(--border);
    color:var(--ink);padding:8px 16px;border-radius:999px}
  .tab:hover{border-color:var(--gold-deep)}
  .tab.on{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:var(--gold-ink);border-color:var(--gold-deep)}
  .max{font-weight:900;font-size:1.02rem;color:#1f7a4d}
  .max.pctc{color:#2f5ea8}
  td.cats{min-width:140px;max-width:220px}
</style>

<body>
<!-- Вміст малює SKADMIN.header() наприкінці файлу. -->
<header class="topbar"></header>
<div id="wrap">
  <div class="wrap-in" id="root">
    <div class="gate"><div class="spinner"></div><p class="sub" style="margin:0">Перевіряємо доступ…</p></div>
  </div>
</div>

<script type="module" src="firebase-config.js"></script>
<script>
/* ============================================================
   АРЕНА · ХАРАКТЕРИСТИКИ (admin-only, лише перегляд). Дві вкладки:
   1) «Герой» — базові характеристики з heroes/{id}: старт (defaultHero
      у firebase-config.js) і МАКСИМУМ зараз = старт + усе, що дають
      активні тести й тренажери з колекції tests.
   2) «Предмети» — що дають речі з каталогу items: скільки предметів,
      діапазони, і МАКСИМУМ, який можна зібрати в 12 слотах екіпіровки.
   Ключі зводимо через SKIT.canon(): «Маг. Резист» і «Магічний захист»
   — це одне й те саме magicResist, як і на арені.
   ============================================================ */
(function(){
'use strict';
var root=document.getElementById('root');
var esc=SKADMIN.esc;
var TAB='hero';
try{ if(location.hash==='#items') TAB='items'; }catch(e){}
var ITEMS=[],TESTS=[],ITEMS_ERR=null,TESTS_ERR=null;

/* Стартові значення — копія defaultHero() з firebase-config.js. */
var HERO_START={health:50,mana:20,agility:50,accuracy:50,
  strength:2,defense:1,intelligence:1,wisdom:1,luck:1,memory:1,charisma:1};
/* Прогрес Героя (не бойові характеристики, але теж у heroes/{id}). */
var HERO_PROGRESS=[
  {key:'level',label:'Рівень',emoji:'🏅',start:1,note:'Рівень Героя'},
  {key:'xp',label:'Досвід (XP)',emoji:'⭐',start:0,note:'Досвід'},
  {key:'coins',label:'Монети',emoji:'🪙',start:0,note:'Нагороди тренажерів'}
];
/* Що бій на арені зараз справді читає (arena.html: maxForce/dmgOf/critRoll/dodgeRoll). */
var ARENA_USES={health:"бойове здоров'я",accuracy:'урон і шанс криту',agility:'шанс ухилитися'};

/* Канонічний ключ → назва українською (як на арені, STAT_UK у arena.html). */
var CANON_UK={armor:'Броня',magicResist:'Магічна стійкість',agility:'Спритність',magicDamage:'Магічний урон',
  damage:'Фізичний урон',health:"Здоров'я",mana:'Мана',accuracy:'Точність',critDamage:'Шанс крит. урону',
  block:'Шанс блоку',stun:'Оглушення',healthRegen:"Відновлення здоров'я",extraAttack:'Додаткова атака',
  beltSlots:'Комірки пояса'};

/* 12 слотів екіпіровки (як EQUIP в arena.html). Руки — окремо: дві
   одноручні речі (Зброя або Щити) або одна дворучна на обидві. */
var SLOTS=[
  {cat:'Шоломи',label:'Шолом',n:1},{cat:'Обладунки',label:'Обладунки',n:1},
  {cat:'Рукавиці',label:'Рукавиці',n:1},{cat:'Наручі',label:'Наручі',n:1},
  {cat:'Пояси',label:'Пояс',n:1},{cat:'Штани',label:'Штани',n:1},
  {cat:'Взуття',label:'Взуття',n:1},{cat:'Амулет',label:'Амулет',n:1},
  {cat:'Кільце',label:'Кільце',n:2}
];
var HAND_CATS=['Зброя','Щити'];

function heroStats(){
  var list=(window.SKCUR&&SKCUR.STATS)?SKCUR.STATS:[];
  return list.map(function(s){return {key:s.key,label:s.label,emoji:s.emoji,active:!!s.active,
    note:s.note||'',start:HERO_START[s.key]};});
}
function heroKeySet(){var o={};heroStats().forEach(function(s){if(s.active)o[s.key]=1;});return o;}
function label(key){return CANON_UK[key]||key;}
function known(key){var m=SKIT.STAT_MAP;for(var k in m)if(m[k]===key)return true;return false;}
function fmtRange(a,b){if(a==null&&b==null)return '—';if(a==null||a===b)return String(b);if(b==null)return String(a);return a+'–'+b;}
function n0(v){v=Number(v);return isNaN(v)?0:v;}

/* ══ ГЕРОЙ: максимум із тестів ══════════════════════════════════
   Скільки одиниць дає запис (так само, як test.html і sk-rewards.js):
   • тест «за кожну правильну» — statValue × кількість питань;
   • тест «фіксовано» — statValue за тест, а в тесті з рівнями — за КОЖЕН
     рівень (finishLevel у test.html нараховує на кожному рівні);
   • запис без питань (тренажер) — statValue один раз (SKREWARD.grantStat). */
function countQ(t){
  var lv=Array.isArray(t.levels)&&t.levels.length;
  return lv?t.levels.reduce(function(s,L){return s+((L&&L.questions)||[]).length;},0):(t.questions||[]).length;
}
function testGain(t){
  var v=Math.max(0,Math.floor(n0(t.statValue)));if(!v)return 0;
  var lv=(Array.isArray(t.levels)&&t.levels.length)?t.levels.length:0,q=countQ(t);
  if(!q)return v;                                  // тренажер / запис без питань
  if(t.statMode==='perCorrect')return v*q;
  return lv?v*lv:v;
}
function testSums(){
  var by={};
  (TESTS||[]).forEach(function(t){
    if(!t||t.active===false||!t.stat)return;
    var k=(window.SKCUR&&SKCUR.statKeyFrom)?SKCUR.statKeyFrom(t.stat):t.stat;if(!k)return;
    var g=testGain(t);if(!g)return;
    var r=by[k]||(by[k]={sum:0,n:0});r.sum+=g;r.n++;
  });
  return by;
}
function heroMax(key,sums){var s=sums[key];return n0(HERO_START[key])+(s?s.sum:0);}

/* ══ ПРЕДМЕТИ: зведення по каталогу ══════════════════════════ */
function collect(items){
  var map={},flags={};
  function slot(key,raw){
    if(!map[key])map[key]={key:key,names:{},items:[],asMain:0,asAdd:0,flatMin:null,flatMax:null,pctMin:null,pctMax:null,cats:{}};
    map[key].names[raw]=1;return map[key];
  }
  function range(r,lo,hi,pct){
    if(pct){r.pctMin=r.pctMin==null?lo:Math.min(r.pctMin,lo);r.pctMax=r.pctMax==null?hi:Math.max(r.pctMax,hi);}
    else{r.flatMin=r.flatMin==null?lo:Math.min(r.flatMin,lo);r.flatMax=r.flatMax==null?hi:Math.max(r.flatMax,hi);}
  }
  (items||[]).forEach(function(it){
    var on=it.active!==false;
    if(it.stat){
      var r=slot(SKIT.canon(it.stat),it.stat);r.asMain++;r.cats[it.category||'—']=1;
      var lo=it.valueMin!=null?Number(it.valueMin):Number(it.valueMax),hi=it.valueMax!=null?Number(it.valueMax):lo;
      if(!isNaN(lo))range(r,lo,isNaN(hi)?lo:hi,false);
      r.items.push({id:it.id,name:it.name,how:'основна',val:fmtRange(it.valueMin,it.valueMax),on:on});
    }
    (it.addStats||[]).forEach(function(e){
      if(SKIT.isFlagEntry(e)){(flags[e.stat]=flags[e.stat]||[]).push(it);return;}
      var r2=slot(SKIT.canon(e.stat),e.stat);r2.asAdd++;r2.cats[it.category||'—']=1;
      var v=e.value!=null?Number(e.value):null;
      if(v!=null&&!isNaN(v))range(r2,v,v,!!e.pct);
      r2.items.push({id:it.id,name:it.name,how:'додаткова',val:(v!=null?'+'+v+(e.pct?'%':''):'—'),on:on});
    });
  });
  var out=Object.keys(map).map(function(k){return map[k];});
  out.sort(function(a,b){return (b.asMain+b.asAdd)-(a.asMain+a.asAdd)||label(a.key).localeCompare(label(b.key),'uk');});
  return {stats:out,flags:flags};
}

/* ══ ПРЕДМЕТИ: максимум у 12 слотах ══════════════════════════
   Для кожної характеристики окремо: у кожному слоті — річ, що дає її
   найбільше. Сталі числа й відсотки рахуються незалежно (найкращий набір
   на «+N» і найкращий на «+N%» можуть бути різними речами). Кільця й руки
   можуть повторювати ту саму річ — у героя може бути два її екземпляри.
   Лише активні предмети (вимкнені дитина отримати не може).
   bonus — коефіцієнт речі (1 — база, 1.2 — усі речі з бонусом +20%). */
function isTwoHanded(it){return (it.addStats||[]).some(function(e){return SKIT.isFlagEntry(e)&&e.stat==='Дворучний';});}
function giveOf(it,key,pct,bonus){
  var eff=SKIT.effective(it,{bonus:bonus});var v=0;
  if(!pct&&eff.stat&&eff.valueMax!=null&&SKIT.canon(eff.stat)===key)v+=n0(eff.valueMax);
  eff.addStats.forEach(function(e){if(e.flag||e.value==null)return;if(!!e.pct===pct&&SKIT.canon(e.stat)===key)v+=n0(e.value);});
  return v;
}
function bestSet(items,key,pct,bonus){
  var act=(items||[]).filter(function(it){return it.active!==false&&!it.consumable;});
  var picks=[],total=0;
  function best(list){var b=null,bv=0;list.forEach(function(it){var v=giveOf(it,key,pct,bonus);if(v>bv){bv=v;b=it;}});return b?{it:b,v:bv}:null;}
  SLOTS.forEach(function(s){
    var b=best(act.filter(function(it){return it.category===s.cat;}));
    if(!b)return;
    for(var i=0;i<s.n;i++){picks.push({slot:s.label+(s.n>1?' '+(i+1):''),it:b.it,v:b.v});total+=b.v;}
  });
  var hands=act.filter(function(it){return HAND_CATS.indexOf(it.category)>=0;});
  var one=best(hands.filter(function(it){return !isTwoHanded(it);}));
  var two=best(hands.filter(isTwoHanded));
  var oneSum=one?one.v*2:0,twoSum=two?two.v:0;
  if(twoSum>oneSum&&two){picks.push({slot:'Обидві руки',it:two.it,v:two.v});total+=two.v;}
  else if(one){picks.push({slot:'Права рука',it:one.it,v:one.v},{slot:'Ліва рука',it:one.it,v:one.v});total+=oneSum;}
  return {total:total,picks:picks};
}

/* ══ малювання ══ */
function tabsHTML(){
  function b(id,ttl){return '<button class="tab'+(TAB===id?' on':'')+'" data-tab="'+id+'">'+ttl+'</button>';}
  return '<div class="tabs">'+b('hero','🦸 Базові характеристики Героя')+b('items','🎒 Характеристики речей')+'</div>';
}

function heroHTML(){
  var sums=testSums();
  var rows=heroStats().map(function(s){
    var arena=ARENA_USES[s.key],ts=sums[s.key];
    var max=s.start!=null?heroMax(s.key,sums):null;
    return '<tr class="'+(s.active?'':'off')+'">'
      +'<td><span class="nm">'+s.emoji+' '+esc(s.label)+'</span><br><span class="key">'+esc(s.key)+'</span></td>'
      +'<td class="num">'+(s.start!=null?s.start:'—')+'</td>'
      +'<td class="num max">'+(max!=null?max:'—')+(ts?'<br><span class="key">+'+ts.sum+' з '+ts.n+' записів</span>':'')+'</td>'
      +'<td>'+(s.active?'<span class="tag yes">росте</span>':'<span class="tag no">у базі, не росте</span>')+'</td>'
      +'<td>'+esc(s.note||'—')+'</td>'
      +'<td>'+(arena?'<span class="tag yes">так</span> '+esc(arena):'<span class="tag no">ні</span>')+'</td>'
      +'</tr>';
  }).join('');
  var prog=HERO_PROGRESS.map(function(p){
    return '<tr><td><span class="nm">'+p.emoji+' '+esc(p.label)+'</span><br><span class="key">'+esc(p.key)+'</span></td>'
      +'<td class="num">'+p.start+'</td><td class="num">—</td><td><span class="tag">прогрес</span></td><td>'+esc(p.note)+'</td><td><span class="tag no">ні</span></td></tr>';
  }).join('');
  var nAct=(TESTS||[]).filter(function(t){return t&&t.active!==false;}).length;
  return '<section class="sec"><h2>🦸 Базові характеристики Героя</h2>'
    +'<p class="hint">Те, що зберігається в самого Героя (heroes/{id}). <b>Максимум зараз</b> = старт + усе, що дають активні тести й тренажери ('+nAct+' записів): «за кожну правильну» — значення × кількість питань, тест із рівнями — за кожен рівень. Без предметів.</p>'
    +(TESTS_ERR?'<p class="hint" style="color:#a8322f">Не вдалося прочитати тести: '+esc(TESTS_ERR)+' — максимум показано без них.</p>':'')
    +'<div class="tblwrap"><table class="st"><thead><tr><th>Характеристика</th><th>Старт</th><th>Максимум зараз</th><th>Стан</th><th>Звідки росте</th><th>Діє в бою зараз</th></tr></thead>'
    +'<tbody>'+rows+prog+'</tbody></table></div></section>';
}

function setHTML(set){
  if(!set.picks.length)return '';
  return '<details class="its"><summary>набір</summary><ul>'+set.picks.map(function(p){
    return '<li>'+esc(p.slot)+': '+esc(p.it.name||p.it.id)+' <span class="iid">+'+p.v+'</span></li>';}).join('')+'</ul></details>';
}

function itemsHTML(){
  if(ITEMS_ERR)return '<section class="sec"><h2>🎒 Характеристики речей</h2><div class="empty">Не вдалося прочитати каталог: '+esc(ITEMS_ERR)+'</div></section>';
  var data=collect(ITEMS),hk=heroKeySet(),sums=testSums();
  var rows=data.stats.map(function(r){
    var cats=Object.keys(r.cats).map(function(c){return '<span class="tag">'+esc(c)+'</span>';}).join('');
    var flat=r.flatMin!=null?'<span class="tag">'+fmtRange(r.flatMin,r.flatMax)+'</span>':'';
    var pct=r.pctMin!=null?'<span class="tag pct">'+fmtRange(r.pctMin,r.pctMax)+'%</span>':'';
    var raw=Object.keys(r.names).filter(function(n){return n!==label(r.key);});
    var src=r.items.map(function(i){return '<li>'+esc(i.name||i.id)+' <span class="iid">'+esc(i.id)+' · '+i.how+' · '+esc(i.val)+(i.on?'':' · вимкнений')+'</span></li>';}).join('');
    var mf=bestSet(ITEMS,r.key,false,1),mp=bestSet(ITEMS,r.key,true,1);
    var mf20=bestSet(ITEMS,r.key,false,1.2),mp20=bestSet(ITEMS,r.key,true,1.2);
    var maxCell='';
    if(mf.total)maxCell+='<div class="max">+'+mf.total+'</div>'+setHTML(mf);
    if(mp.total)maxCell+='<div class="max pctc">+'+mp.total+'%</div>'+setHTML(mp);
    if(!maxCell)maxCell='—';
    else maxCell+='<span class="key">з бонусом +20%: '+[mf20.total?'+'+mf20.total:'',mp20.total?'+'+mp20.total+'%':''].filter(Boolean).join(' · ')+'</span>';
    var withHero='—';
    if(hk[r.key]){var hm=heroMax(r.key,sums);withHero='<span class="max">'+Math.floor((hm+mf.total)*(1+mp.total/100))+'</span><br><span class="key">('+hm+' + '+mf.total+')'+(mp.total?' × '+(100+mp.total)+'%':'')+'</span>';}
    return '<tr>'
      +'<td><span class="nm">'+esc(label(r.key))+'</span><br><span class="key">'+esc(r.key)+'</span>'
      +(raw.length?'<br><span class="key">в адмінці: '+esc(raw.join(', '))+'</span>':'')
      +(known(r.key)?'':'<br><span class="tag warn">арена не знає цієї характеристики</span>')+'</td>'
      +'<td>'+(hk[r.key]?'<span class="tag yes">є в Героя</span>':'<span class="tag item">лише з предметів</span>')+'</td>'
      +'<td class="num">'+(r.asMain+r.asAdd)+'<br><span class="key">осн. '+r.asMain+' · дод. '+r.asAdd+'</span>'
      +'<details class="its"><summary>які саме</summary><ul>'+src+'</ul></details></td>'
      +'<td>'+(flat||pct?flat+pct:'—')+'</td>'
      +'<td class="num">'+maxCell+'</td>'
      +'<td class="num">'+withHero+'</td>'
      +'<td class="cats">'+cats+'</td>'
      +'</tr>';
  }).join('');
  var fl=Object.keys(data.flags).map(function(f){return '<span class="tag">'+esc(f)+' · '+data.flags[f].length+'</span>';}).join(' ');
  return '<section class="sec"><h2>🎒 Характеристики речей</h2>'
    +'<p class="hint">Зведення по всьому каталогу ('+ITEMS.length+' предметів). <b>Максимум з предметів</b> — найкраща річ у кожному з 12 слотів (шолом, обладунки, рукавиці, наручі, пояс, штани, взуття, амулет, 2 кільця, 2 руки — або одна дворучна річ); сталі числа й відсотки рахуються окремо, лише активні предмети, значення без бонусу речі. <b>Разом з Героєм</b> = (максимум Героя + сталі з предметів) × відсотки з предметів.</p>'
    +(rows?'<div class="tblwrap"><table class="st"><thead><tr><th>Характеристика</th><th>Герой</th><th>Предметів</th><th>Значення</th><th>Максимум з предметів</th><th>Разом з Героєм</th><th>Категорії</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
          :'<div class="empty">У каталозі ще немає предметів.</div>')
    +(fl?'<div class="flags"><b>Позначки (не характеристики):</b> '+fl+'</div>':'')
    +'<div class="legend"><span><span class="tag yes">є в Героя</span> предмет підсилює те, що Герой уже має</span><span><span class="tag item">лише з предметів</span> Герой отримує це тільки через речі</span><span><span class="tag pct">%</span> відсоткова навичка</span></div>'
    +'</section>';
}

function render(){
  root.innerHTML='<h1>⚔️ Арена · характеристики</h1>'
    +'<p class="sub">Які характеристики є в Героя і що до них можна додати предметами.</p>'
    +tabsHTML()+(TAB==='items'?itemsHTML():heroHTML());
  root.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){
    TAB=b.getAttribute('data-tab');try{history.replaceState(null,'',TAB==='items'?'#items':'#hero');}catch(e){}render();};});
}

function load(){
  root.innerHTML='<div class="empty">Завантаження…</div>';
  function why(e){return (e&&(e.code||e.message))||String(e);}
  var pI=window.SK.listItems().then(function(l){ITEMS=l||[];ITEMS_ERR=null;},function(e){ITEMS=[];ITEMS_ERR=why(e);});
  var pT=(window.SK.listTests?window.SK.listTests():Promise.resolve([])).then(function(l){TESTS=l||[];TESTS_ERR=null;},function(e){TESTS=[];TESTS_ERR=why(e);});
  Promise.all([pI,pT]).then(render);
}

SKADMIN.header({
  name:'Арена',
  sub:'School Kingdom · характеристики',
  nav:[ { href:'admin.html', label:'🏠 Головна (Адмінка)' },
        { href:'admin-items.html', label:'🎒 Items' },
        { id:'btnReload', label:'🔄 Оновити' } ]
});
SKADMIN.guard({
  denyMsg:'Увійди адміністратором, щоб переглядати характеристики.',
  onOk:function(){
    var rl=document.getElementById('btnReload');if(rl)rl.onclick=load;
    load();
  }
});
})();
</script>
